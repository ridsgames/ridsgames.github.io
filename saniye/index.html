<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Saniye | Ridsgames</title>
<meta name="description" content="Saniye: hedef süreyi seç, kronometre gizlenince içinden say ve tam zamanında durdur. Tek başına rekor kovala ya da arkadaşlarınla aynı telefonda yarış.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 42%, rgba(6, 9, 15, .05) 0%, rgba(6, 9, 15, .62) 100%), url("../kizma-birader/masa.webp") center / cover, #1a0f08;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı: bilgi şeridi, kronometre, sonuç, düğme */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.hud {
  flex: none; width: 100%; max-width: 440px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; padding: 8px 14px 9px;
  border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px);
}
#hudMain { font-size: 18px; font-weight: 800; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hudMain i { font-style: normal; color: #475569; font-size: 20px; margin-right: 3px; }
#hudMain i.on { color: #f43f5e; text-shadow: 0 0 8px rgba(244, 63, 94, .45); }
#hudSide { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #cbd5e1; font-variant-numeric: tabular-nums; }
#hudSide b { color: #fff; font-weight: 800; }
.mult { padding: 2px 8px; border-radius: 999px; background: rgba(251, 191, 36, .16); border: 1px solid rgba(251, 191, 36, .55); color: #fde68a; font-weight: 800; }
.mult.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { scale: .5; } 100% { scale: 1; } }
#hudInfo { grid-column: 1 / -1; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#watchWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
canvas#watch { display: block; touch-action: manipulation; cursor: pointer; }
.verdict { flex: none; min-height: 54px; max-width: 440px; text-align: center; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
#vMain { font-size: 24px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
#vSub { font-size: 14.5px; color: #e2e8f0; margin-top: 3px; font-variant-numeric: tabular-nums; }
.go {
  flex: none; width: 100%; max-width: 360px; height: 62px; border-radius: 18px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 20px; font-weight: 800; box-shadow: 0 6px 18px rgba(6, 182, 212, .4); touch-action: manipulation; transition: filter .15s, transform .08s;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 14px;
}
.go.stop { background: linear-gradient(135deg, #dc2626, #f43f5e); border-color: #fda4af; box-shadow: 0 6px 18px rgba(244, 63, 94, .45); }
.go.wait { filter: grayscale(.5) brightness(.75); cursor: default; }
.go:active:not(.wait) { transform: translateY(2px) scale(.99); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 64px 16px 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); margin-top: 8px; }
.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.stepper { display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 8px; }
.stepper button { height: 54px; border-radius: 14px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 28px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.stepper button:disabled { opacity: .35; cursor: default; }
.tval { text-align: center; line-height: 1; }
.tval output { display: block; font-size: 42px; font-weight: 800; letter-spacing: .02em; color: #fff; font-variant-numeric: tabular-nums; }
.tval small { display: block; margin-top: 5px; font-size: 11.5px; font-weight: 600; color: var(--dim); letter-spacing: .04em; }
.players { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: 1fr 40px; gap: 6px; }
.prow input {
  height: 42px; min-width: 0; border-radius: 10px; border: 1px solid rgba(148, 163, 184, .25); background: rgba(2, 6, 23, .7); color: #fff; padding: 0 12px;
  font: inherit; font-size: 16px; user-select: text; -webkit-user-select: text;
}
.prow input:focus { outline: none; border-color: var(--cyan); }
.prow button { border: 1px solid rgba(148, 163, 184, .25); border-radius: 10px; background: rgba(2, 6, 23, .7); color: #94a3b8; font-size: 15px; }
.prow button:disabled { visibility: hidden; }
.add { height: 40px; border-radius: 10px; border: 1px dashed rgba(34, 211, 238, .5); background: none; color: #67e8f9; font-size: 14px; font-weight: 700; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.score { text-align: center; font-size: 44px; font-weight: 800; line-height: 1; margin: 2px 0 14px; color: #fde68a; font-variant-numeric: tabular-nums; }
.score small { font-size: 15px; font-weight: 700; color: var(--dim); margin-left: 6px; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank.r4 li { grid-template-columns: 22px minmax(0, 1fr) auto auto; }
.rank.st li { grid-template-columns: 1fr auto; }
.rank li .n { color: var(--dim); font-weight: 800; }
.rank li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li .s { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.rank li .b { font-weight: 800; font-variant-numeric: tabular-nums; }
.rank li.hd { background: none; padding-top: 0; padding-bottom: 0; font-size: 11.5px; color: var(--dim); }
.rank li.first { background: rgba(6, 182, 212, .16); border: 1px solid rgba(34, 211, 238, .5); }
.toast {
  position: fixed; left: 50%; top: 64px; z-index: 15; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-height: 600px) { main { gap: 6px; padding-top: 6px; } .go { height: 54px; } #vMain { font-size: 21px; } .verdict { min-height: 48px; } }
@media (prefers-reduced-motion: reduce) { .mult.pop { animation: none; } }
</style>
<!-- Ziyaret sayacı (GoatCounter): çerez kullanmaz; ?lang= gibi ekler aynı sayfa sayılır -->
<script>window.goatcounter = { path: (p) => p.split('?')[0] || '/' };</script>
<script data-goatcounter="https://ridsgames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<!-- Etkin süre, yeni ziyaret ve hata kaydı (ortak) -->
<script src="../assets/olcum.js" data-page="saniye" data-name="Saniye"></script>
</head>
<body>
<header class="top">
  <div class="in">
    <a id="homeLink" class="logo" href="../" aria-label="Ridsgames ana sayfa">
      <img src="../assets/logo.webp" alt="Ridsgames" width="112" height="52">
      <span class="gname" id="gameName">Saniye</span>
    </a>
    <div class="tools">
      <button id="menuBtn" class="pill" type="button" aria-label="Yeni oyun"><span class="ico">☰</span><span class="lbl" id="menuLbl">Yeni oyun</span></button>
      <button id="soundBtn" class="pill" type="button" aria-label="Ses"><span class="ico" id="soundIco">🔊</span></button>
      <button id="rulesBtn" class="pill" type="button" aria-label="Kurallar"><span class="ico">?</span><span class="lbl" id="rulesLbl">Kurallar</span></button>
      <button id="fsBtn" class="pill" type="button" aria-label="Tam ekran"><span class="ico">⛶</span></button>
      <button id="langBtn" class="pill lang" type="button" aria-label="Dil / Language">TR | EN</button>
    </div>
  </div>
</header>

<main>
  <div class="hud" id="hud" hidden>
    <div id="hudMain"></div>
    <div id="hudSide"></div>
    <div id="hudInfo"></div>
  </div>
  <div id="watchWrap"><canvas id="watch" role="img" aria-label="Kronometre"></canvas></div>
  <div class="verdict" aria-live="polite"><div id="vMain"></div><div id="vSub"></div></div>
  <button class="go" id="go" type="button">Başlat</button>
</main>

<footer>© 2026 Ridsgames. <span id="rights">Tüm hakları saklıdır.</span></footer>
<div class="toast" id="toast" role="status"></div>
<canvas id="confetti" hidden></canvas>

<!-- Kurulum -->
<div class="ov" id="setupOv">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Saniye</h2>
    <p class="sub" id="setupSub"></p>
    <div class="seg two" id="modeSeg"><button type="button" data-m="tek"></button><button type="button" data-m="grup"></button></div>
    <div class="sec">
      <div class="lbl" id="targetLbl"></div>
      <div class="stepper">
        <button type="button" id="tMinus" aria-label="−1">−</button>
        <div class="tval"><output id="tVal">10:00</output><small id="tCap"></small></div>
        <button type="button" id="tPlus" aria-label="+1">+</button>
      </div>
      <div class="seg five" id="presetSeg"><button type="button" data-t="5">05:00</button><button type="button" data-t="10">10:00</button><button type="button" data-t="15">15:00</button><button type="button" data-t="30">30:00</button><button type="button" data-t="60">60:00</button></div>
    </div>
    <div class="sec">
      <div class="lbl" id="hideLbl"></div>
      <div class="seg four" id="hideSeg"><button type="button" data-h="bas"></button><button type="button" data-h="3"></button><button type="button" data-h="yari"></button><button type="button" data-h="hic"></button></div>
      <div class="note" id="hideNote"></div>
    </div>
    <div id="groupBox">
      <div class="sec">
        <div class="lbl" id="playersLbl"></div>
        <div class="players" id="players"></div>
        <button class="add" id="addBtn" type="button" style="width:100%;margin-top:6px"></button>
      </div>
      <div class="sec">
        <div class="lbl" id="roundsLbl"></div>
        <div class="seg" id="roundSeg"><button type="button" data-r="3"></button><button type="button" data-r="5"></button><button type="button" data-r="10"></button></div>
      </div>
    </div>
    <div class="btns">
      <button class="big" id="startBtn" type="button">Başla</button>
      <button class="big alt" id="backBtn" type="button" hidden>Oyuna dön</button>
    </div>
  </div>
</div>

<!-- Kurallar -->
<div class="ov" id="rulesOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle">Nasıl oynanır?</h2>
    <p class="sub" id="rulesSub"></p>
    <ul class="rules" id="rulesList"></ul>
    <div class="btns"><button class="big" id="rulesOk" type="button">Tamam</button></div>
  </div>
</div>

<!-- Tur arası (arkadaşlarla) -->
<div class="ov" id="roundOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="roundTitle">
    <h2 id="roundTitle"></h2>
    <p class="sub" id="roundSub"></p>
    <ol class="rank r4" id="roundList"></ol>
    <div class="btns"><button class="big" id="roundNext" type="button"></button></div>
  </div>
</div>

<!-- Oyun sonu -->
<div class="ov" id="winOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="trophy" id="winIco">🏆</div>
    <h2 id="winTitle"></h2>
    <p class="sub" id="winSub"></p>
    <div class="score" id="winScore" hidden></div>
    <ol class="rank" id="rankList"></ol>
    <div class="btns">
      <button class="big" id="againBtn" type="button">Tekrar oyna</button>
      <button class="big alt" id="toMenuBtn" type="button">Ayarları değiştir</button>
    </div>
  </div>
</div>

<script>
// ---------- Dil ----------
const STR = {
  tr: {

// ---------- Kurallar (saf mantık) ----------
// RULES-BEGIN
// Süre biçimi saniye:salise ("10:00", "07:42"); 99 saniyeyi aşan süreler üç haneli saniye gösterir
const fmt = (ms) => { const cs = Math.floor(Math.max(0, ms) / 10); return String(Math.floor(cs / 100)).padStart(2, '0') + ':' + String(cs % 100).padStart(2, '0'); };
const HIDES = ['bas', '3', 'yari', 'hic'];
// Gizlenme anı (ms): baştan, 3. saniye (kısa hedefte yarı), yarı, hiç
const hideAtMs = (tg, h) => (h === 'bas' ? 0 : h === '3' ? Math.min(3000, tg * 500) : h === 'yari' ? tg * 500 : Infinity);
const blindS = (tg, h) => (h === 'hic' ? 0 : tg - hideAtMs(tg, h) / 1000);
// Tolerans birimi (ms): körlemesine sayılan süre uzadıkça genişler; f zorluk çarpanı (tek kişide her 5 denemede %10 daralır, en çok yarıya)
const unitMs = (tg, h, f = 1) => (50 + 24 * blindS(tg, h)) * f;
const levelF = (n) => Math.max(0.5, Math.pow(0.9, Math.floor(n / 5)));
const ZONES = [
  { k: 'perfect', r: 0.2, pts: 100, col: '#fbbf24' },
  { k: 'great', r: 0.5, pts: 50, col: '#34d399' },
  { k: 'good', r: 1, pts: 20, col: '#22d3ee' },
  { k: 'ok', r: 2, pts: 5, col: '#fb923c' },
  { k: 'miss', r: Infinity, pts: 0, col: '#f87171' }
];
const judge = (errMs, u) => ZONES.find((z) => Math.abs(errMs) <= z.r * u + 1e-6);
// Tek kişi: çarpan ve can güncellemesi; puan = taban puan × güncel çarpan
function scoreSolo(st, z) {
  let mult = st.mult, lives = st.lives;
  if (z.k === 'perfect') mult = Math.min(16, mult * 2);
  else if (z.k === 'great') mult = Math.min(16, mult + 1);
  else if (z.k === 'ok' || z.k === 'miss') mult = 1;
  if (z.k === 'miss') lives--;

}
// RULES-END

function newGame() {

  timerF = null;
  G = {
    mode: s.mode, target: s.target, hide: s.hide, hideAt: hideAtMs(s.target, s.hide), rounds: s.rounds,
    players: s.mode === 'grup' ? s.players.map((n, i) => ({ name: n.trim() || T().playerN(i + 1), total: 0, crowns: 0, errs: [] })) : [],
    round: 1, idx: 0, lives: 3, score: 0, mult: 1, n: 0, perfect: 0, maxMult: 1, errSum: 0, best: best[`${s.target}-${s.hide}`] || 0
  };

}
function act(ts) {
  if (!G || ts - lastAct < 150) return; // aynı dokunuşun ikinci olayı ya da iki parmak
  if (phase === 'ready') { lastAct = ts; start(ts); }
  else if (phase === 'run') { if (ts - t0 < 200) return; lastAct = ts; finish(ts - t0); }
  else if (phase === 'result') { if (clock() - resultAt < 450) return; lastAct = ts; next(ts); }
}
function start(ts) {
  phase = 'run'; t0 = ts; lastSec = 0; res = null;
  hiddenNow = G.hideAt <= 0; hidT = ts;
  Sfx.start(); buzz(10); render();
}
function finish(ms) {
  const cs = Math.floor(Math.max(0, ms) / 10), err = cs * 10 - G.target * 1000, u = unit(), z = judge(err, u);
  res = { cs, err, z, u, wasHidden: hiddenNow, hideMs: Math.min(G.hideAt, cs * 10), pts: 0, life: false, multUp: false };
  if (G.mode === 'tek') {
    const r = scoreSolo(G, z);
    res.multUp = r.mult > G.mult; res.life = r.lives < G.lives; res.pts = r.pts;
    G.mult = r.mult; G.lives = r.lives; G.score += r.pts; G.n++; G.errSum += Math.abs(err);

}
function showResult() {

}
function next(ts) {

}

  $('roundList').innerHTML = `<li class="hd"><span></span><span></span><span>${t.thisRound}</span><span>${t.total}</span></li>` +
    order.map((p, k) => `<li class="${k ? '' : 'first'}"><span class="n">${rankNo(order, k)}</span><span class="nm">${esc(p.name)}${tops.includes(p) ? ' 👑' : ''}</span><span class="s">${signed(p.errs[r])}</span><span class="b">${fmt(p.total)}</span></li>`).join('');

}
const signed = (e) => (e === 0 ? '00:00' : (e > 0 ? '+' : '−') + fmt(Math.abs(e)));

// ---------- Ses ----------
const Sfx = (() => {
  let ac = null;
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function knock(delay, vol = 0.25, freq = 2000) { // kısa, süzülmüş gürültü: mekanik tık
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + delay, len = 0.04, buf = c.createBuffer(1, c.sampleRate * len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 2.2; g.gain.value = vol;
    s.buffer = buf; s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  return {
    unlock: ctx,
    tick(k) { knock(0, 0.3, k % 2 ? 3300 : 4100); },
    start() { knock(0, 0.35, 1700); tone(1250, 1400, 0.06, 0.06, 'triangle'); },
    stop() { knock(0, 0.4, 1400); tone(950, 760, 0.07, 0.07, 'triangle'); },
    hide() { tone(720, 240, 0.35, 0.05, 'sine'); },
    sweep() { tone(260, 1100, 0.75, 0.035, 'triangle'); },
    click() { knock(0, 0.2, 2400); },
    perfect() { [784, 988, 1175, 1568, 2093].forEach((f, k) => tone(f, f * 1.01, 0.3, 0.1, 'triangle', k * 0.08)); tone(3136, 3100, 0.9, 0.03, 'sine', 0.42); },
    great() { [659, 880, 1047].forEach((f, k) => tone(f, f * 1.01, 0.22, 0.1, 'triangle', k * 0.09)); },
    good() { [587, 784].forEach((f, k) => tone(f, f * 1.01, 0.2, 0.09, 'triangle', k * 0.1)); },
    ok() { tone(440, 445, 0.22, 0.08, 'triangle'); },
    miss() { tone(300, 180, 0.18, 0.1, 'triangle'); tone(220, 130, 0.25, 0.1, 'triangle', 0.14); },
    over() { [523, 440, 349, 262].forEach((f, k) => tone(f, f * 0.99, 0.28, 0.1, 'triangle', k * 0.16)); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, k) => tone(f, f * 1.01, 0.22, 0.12, 'triangle', k * 0.12)); }
  };
})();
const buzz = (p) => { try { if (soundOn && navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

// ---------- Konfeti ----------
function confetti() {
  if (REDUCED) return;
  const c = $('confetti'), x = c.getContext('2d'); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ['#fbbf24', '#34d399', '#22d3ee', '#fb923c', '#f43f5e', '#fff'];
  const ps = Array.from({ length: 130 }, (_, i) => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.6, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3.5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, col: cols[i % cols.length] }));
  const t0 = performance.now();
  (function f(now) {
    x.clearRect(0, 0, c.width, c.height);
    for (const q of ps) { q.x += q.vx; q.y += q.vy; q.r += q.vr; x.save(); x.translate(q.x, q.y); x.rotate(q.r); x.fillStyle = q.col; x.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); x.restore(); }
    if (now - t0 < 3500) requestAnimationFrame(f); else c.hidden = true;
  })(t0);
}

$('roundNext').addEventListener('click', () => { G.round++; G.idx = 0; res = null; phase = 'ready'; closeAll(); Sfx.click(); render(); });
$('menuBtn').addEventListener('click', openSetup);
$('rulesBtn').addEventListener('click', () => { cancelRun(false); $('rulesOv').hidden = false; sayac('kurallar', 'kurallar açıldı'); });
$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; });
$('rulesOv').addEventListener('click', (e) => { if (e.target.id === 'rulesOv') $('rulesOv').hidden = true; });
$('againBtn').addEventListener('click', () => { Sfx.unlock(); newGame(); });
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; applySound(); try { localStorage.setItem(KEY + 'sound', soundOn ? '1' : '0'); } catch (e) {} if (soundOn) Sfx.unlock(); });
// Tam ekran: desteklemeyen tarayıcıda (iPhone Safari) düğme gizlenir
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
// Sekmeden çıkınca süren deneme sayılmaz
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelRun(true); });
addEventListener('resize', () => layout());
document.addEventListener('fullscreenchange', () => layout()); document.addEventListener('webkitfullscreenchange', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('watchWrap'));
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('800 20px Inter'), document.fonts.load('700 20px Inter')]).then(() => { fontsOk++; dirty = true; }).catch(() => {});

// Test kancası (oyun akışını değiştirmez). advanceTime: oyun saatini 16 ms adımlarla ileri sarar; advanceTime(0) saati dondurur
function advanceTime(ms) {
  if (manualT === null) manualT = performance.now();
  for (let left = ms; left > 0; left -= 16) { manualT += Math.min(16, left); update(manualT); }
  dirty = true; draw(clock());
  return phase;
}
window.__rids = {
  get phase() { return phase; }, get G() { return G; }, get res() { return res; },
  act, now: clock, advanceTime, finish, unit, judge, fmt, hideAtMs, blindS, unitMs, levelF, scoreSolo, layoutNow: layout, drawNow: () => draw(clock())
};

layout(); applyLang(); applySound(); openSetup(); requestAnimationFrame(frame);
</script>
</body>
