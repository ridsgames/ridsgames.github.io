    lvLbl: 'Level', lvNote: { kolay: '10 lives, 2 hints. The gallows is built as you go.', orta: '8 lives, 1 hint.', zor: '6 lives, no hints. The gallows is ready; the first miss draws the head.' },
    hint: '💡 Hint', hintCost: 'A hint costs one life', noHint: 'No hints left', lastLife: 'No hints on your last life',
    streak: 'Streak', best: 'Best', lives: (n) => `${n} lives left`,

    wHint: 'Hint (optional), e.g. an animal', wOk: 'Hide the word and start', wCancel: 'Cancel',
    wErrLen: 'Type at least 2 letters', wErrChar: (c) => `“${c}” can't be used`, show: 'Show',
    guessFor: (n) => `Guessing: ${n}`, custom: 'Your friend\'s word',
    rulesSub: 'Guess the letters of the hidden word one by one.',
    ruleList: [
      ['🔤', 'Pick a letter on the keyboard. If it is in the word it <b>opens everywhere</b> and the key turns green.'],

      ['⌨️', 'On a computer you can type letters too. <b>Enter</b> moves to the next word.']
    ] }
};
const T = () => STR[lang];
const LIVES = { kolay: 10, orta: 8, zor: 6 }, HINTS = { kolay: 2, orta: 1, zor: 0 };
const ABC = { tr: 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ', en: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' };
const ROWS = { tr: ['ERTYUIOPĞÜ', 'ASDFGHJKLŞİ', 'ZCVBNMÖÇ'], en: ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'] };
const up = (s, lg) => s.toLocaleUpperCase(lg === 'tr' ? 'tr-TR' : 'en-US');
const CATS = Object.keys(WORDS.tr);
const isLetter = (c, lg) => ABC[lg].includes(c);

let setup = Object.assign({ mode: 'tek', cat: 'karisik', level: 'orta', n1: '', n2: '' }, store.get('setup', {}));
if (!STR.tr.modes[setup.mode]) setup.mode = 'tek';
if (setup.cat !== 'karisik' && !WORDS.tr[setup.cat]) setup.cat = 'karisik';
if (!LIVES[setup.level]) setup.level = 'orta';
let stats = Object.assign({ won: 0, lost: 0, best: 0 }, store.get('stats', {}));
let G = null, lastShown = new Set();
const pname = (i) => (G && G.names[i]) || T()['p' + (i + 1)];
function save() { if (G) store.set('game', G); }

function pickWord(catSel, lg, recent) {
  const cats = catSel === 'karisik' ? CATS : [catSel];
  const pool = [];
  for (const c of cats) for (const w of WORDS[lg][c][2].split(' ')) pool.push([c, w]);
  let cand = pool.filter(([, w]) => !recent.includes(w));
  if (!cand.length) cand = pool;
  return cand[rnd(cand.length)];
}
function beginWord(word, cat, hint) {
  Object.assign(G, { word, cat, hint: hint || '', guessed: [], misses: 0, hintsLeft: HINTS[G.level], state: 'play', lang: G.lang });
  lastShown = new Set(); shownLetters = new Set();
  sayac('basladi', 'kelime başladı');
  if (bitenVar) { bitenVar = false; sayac('tekrar', 'bitirdikten sonra yeni kelime'); }
  sayac(G.mode === 'iki' ? `mod/iki-${G.level}` : `mod/tek-${G.catSel}-${G.level}`, `mod: ${G.mode === 'iki' ? 'iki kişi' : 'tek başına, ' + G.catSel}, ${G.level}`);
  save(); render();
}
function nextSolo() {
  G.lang = lang;
  const [c, w] = pickWord(G.catSel, lang, G.recent);
  G.recent = [...G.recent.slice(-60), w];
  beginWord(up(w, lang), c, '');
}
function newGame() {
  closeAll();
  const s = setup;
  G = { mode: s.mode, catSel: s.cat, level: s.level, lang, recent: [], names: [s.n1.trim(), s.n2.trim()], pts: [0, 0], setter: 0, streak: 0, word: '', guessed: [], misses: 0, state: 'wait' };
  if (G.mode === 'tek') nextSolo(); else { render(); askWord(); }
}
function startFromSetup() { setup.n1 = $('n1').value.slice(0, 14); setup.n2 = $('n2').value.slice(0, 14); store.set('setup', setup); newGame(); }
function again() { newGame(); }
function nextWord() {
  if (!G || G.state === 'play') return;
  Sfx.click();
  if (G.mode === 'tek') nextSolo();
  else { G.setter = 1 - G.setter; G.state = 'wait'; save(); render(); askWord(); }
}

// ---------- Tahmin ----------
const letters = () => [...G.word].filter((c) => c !== ' ');
const solved = () => letters().every((c) => G.guessed.includes(c));
function guess(ch) {
  if (!G || G.state !== 'play' || !isLetter(ch, G.lang) || G.guessed.includes(ch)) return;
  G.guessed.push(ch);
  if (G.word.includes(ch)) {
    Sfx.good(); buzz(10);
    if (solved()) return end(true);
  } else {
    G.misses++; Sfx.bad(); buzz([20, 30, 20]);
    if (G.misses >= LIVES[G.level]) return end(false);
  }
  save(); render();
}
function useHint() {
  if (!G || G.state !== 'play') return;
  const t = T(), lives = LIVES[G.level];
  if (G.hintsLeft <= 0) { toast(t.noHint, '#f87171'); return; }
  if (lives - G.misses <= 1) { toast(t.lastLife, '#f87171'); return; }
  const hidden = [...new Set(letters().filter((c) => !G.guessed.includes(c)))];
  if (hidden.length <= 1) return;
  G.hintsLeft--; G.misses++;
  G.guessed.push(hidden[rnd(hidden.length)]);
  Sfx.tone(880, 1320, 0.2, 0.08, 'triangle'); toast(t.hintCost, '#facc15');
  if (solved()) return end(true);
  save(); render();
}
function end(won) {
  G.state = won ? 'won' : 'lost';
  bitenVar = true; sayac('bitti', 'kelime bitti');
  if (G.mode === 'tek') {
    sayac(`sonuc/${won ? 'kazandi' : 'kaybetti'}-${G.level}`, `${won ? 'bildi' : 'asıldı'} (${G.level})`);
    if (won) { G.streak++; stats.won++; stats.best = Math.max(stats.best, G.streak); } else { G.streak = 0; stats.lost++; }
    store.set('stats', stats);
  } else G.pts[won ? 1 - G.setter : G.setter]++;
  if (won) Sfx.win(); else Sfx.lose();
  save(); render();
  setTimeout(() => { const b = $('nextBtn'); if (b && !$('res').hidden) b.focus({ preventScroll: true }); }, 50);
}

// ---------- İki kişi: kelime girişi ----------
function askWord() {
  const t = T(), w = pname(G.setter), g = pname(1 - G.setter);
  $('wTitle').textContent = t.wTitle(w); $('wSub').textContent = t.wSub(g);
  $('wordIn').value = ''; $('hintIn').value = ''; $('wNote').textContent = ''; $('wordIn').classList.add('hide');
  $('hintIn').placeholder = t.wHint; $('wOk').textContent = t.wOk; $('wCancel').textContent = t.wCancel; $('eyeBtn').setAttribute('aria-label', t.show);
  closeAll(); $('wordOv').hidden = false; setTimeout(() => $('wordIn').focus(), 60);
}
function submitWord() {
  const t = T(), lg = lang;
  const w = up($('wordIn').value, lg).replace(/\s+/g, ' ').trim();
  const bad = [...w].find((c) => c !== ' ' && !isLetter(c, lg));
  if (bad) { $('wNote').textContent = t.wErrChar(bad); Sfx.bad(); return; }
  if (w.replace(/ /g, '').length < 2) { $('wNote').textContent = t.wErrLen; Sfx.bad(); return; }
  $('wordOv').hidden = true; G.lang = lg;
  beginWord(w, 'ozel', $('hintIn').value.trim().slice(0, 30));
}

// ---------- Çizim ----------
function renderFig() {
  const parts = document.querySelectorAll('#fig .pt'), lives = LIVES[G.level], pre = 10 - lives, shown = G.state === 'wait' ? pre : pre + G.misses;
  parts.forEach((p, i) => {
    const on = i < shown, k = i < pre ? 'pre' : 'on';
    p.classList.toggle('pre', on && k === 'pre'); p.classList.toggle('on', on && k === 'on');
    if (on && k === 'on' && !lastShown.has(i) && REDUCED) p.style.animation = 'none';
    if (on) lastShown.add(i);
  });
  $('fig').classList.toggle('lost', G.state === 'lost'); $('fig').classList.toggle('won', G.state === 'won');
  $('faceLost').classList.toggle('on', G.state === 'lost'); $('faceWon').classList.toggle('on', G.state === 'won' && shown > 4);
}
let shownLetters = new Set();
function renderWord() {
  const el = $('word');
  if (G.state === 'wait' || !G.word) { el.innerHTML = ''; return; }
  const words = G.word.split(' '), longest = Math.max(...words.map((w) => w.length));
  const W = el.clientWidth || 300;
  const sz = clamp(Math.floor((W - 8 - (longest - 1) * 4) / longest), 18, 44);
  el.style.setProperty('--sz', sz + 'px');
  let k = 0;
  el.innerHTML = words.map((w) => `<span class="w">${[...w].map((c) => {
    const i = k++, open = G.guessed.includes(c), miss = !open && G.state === 'lost';
    const cls = (open || miss) ? `${!shownLetters.has(i) ? 'show' : ''}${miss ? ' miss' : ''}` : '';
    if (open || miss) shownLetters.add(i);
    return `<i class="${cls}">${open || miss ? c : ''}</i>`;
  }).join('')}</span>`).join('');
}
function renderKb() {
  const t = T(), lg = G.lang || lang, play = G.state === 'play';
  const rows = ROWS[lg].map((r) => `<div class="r">${[...r].map((c) => {
    const used = G.guessed.includes(c), cls = used ? (G.word.includes(c) ? 'ok' : 'no') : '';
    return `<button type="button" data-c="${c}" class="${cls}" ${used || !play ? 'disabled' : ''}>${c}</button>`;
  }).join('')}</div>`).join('');
  const hb = HINTS[G.level] ? `<div class="tools2"><button type="button" id="hintBtn" ${!play || G.hintsLeft <= 0 || LIVES[G.level] - G.misses <= 1 ? 'disabled' : ''}>${t.hint} · ${G.hintsLeft}</button></div>` : '';
  $('kb').innerHTML = rows + hb;
}
function render() {
  if (!G) return;
  const t = T(), lives = LIVES[G.level], left = lives - G.misses;
  const cw = G.cat === 'ozel' ? null : WORDS[G.lang || lang][G.cat];
  $('catEm').textContent = G.cat === 'ozel' ? '✍️' : cw ? cw[1] : '';
  $('catName').textContent = G.cat === 'ozel' ? (G.hint ? `${t.custom}: ${G.hint}` : t.custom) + ` · ${t.guessFor(pname(1 - G.setter))}` : cw ? cw[0] : '';
  $('lives').innerHTML = Array.from({ length: lives }, (_, i) => `<i class="${i < left ? '' : 'off'}">❤️</i>`).join('');
  $('lives').setAttribute('aria-label', t.lives(left));
  $('score2').innerHTML = G.mode === 'tek' ? `${t.streak} <b>${G.streak}</b> · ${t.best} <b>${stats.best}</b>` : `${esc(pname(0))} <b>${G.pts[0]}</b> – <b>${G.pts[1]}</b> ${esc(pname(1))}`;
  renderFig();
  renderWord(); renderKb();
  const over = G.state === 'won' || G.state === 'lost';
  $('kb').hidden = over || G.state === 'wait'; $('res').hidden = !over;
  if (over) {
    $('resTitle').textContent = G.state === 'won' ? t.won : t.lost; $('resTitle').className = G.state === 'won' ? 'ok' : 'no';
    $('resSub').textContent = G.mode === 'tek' ? (G.state === 'won' ? (G.streak > 1 ? t.streakNow(G.streak) : t.wordWas(G.word)) : t.wordWas(G.word))
      : `${t.pointTo(pname(G.state === 'won' ? 1 - G.setter : G.setter))} · ${t.wordWas(G.word)}`;
    $('nextBtn').textContent = G.mode === 'tek' ? t.next : t.nextTurn(pname(1 - G.setter));
  }
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderSetup() {
  const t = T(), s = setup;
  segPress('modeSeg', 'm', s.mode); segPress('lvSeg', 'l', s.level);
  $('modeNote').textContent = t.modeNote[s.mode]; $('lvNote').textContent = t.lvNote[s.level];
  $('catSec').hidden = s.mode !== 'tek'; $('namesSec').hidden = s.mode !== 'iki';
  $('catSeg').innerHTML = [['karisik', t.mix, '🎲'], ...CATS.map((c) => [c, WORDS[lang][c][0], WORDS[lang][c][1]])]
    .map(([k, n, e]) => `<button type="button" data-c="${k}" aria-pressed="${s.cat === k}"><span>${e}</span><span>${n}</span></button>`).join('');
}
function openSetup() {
  renderSetup(); closeAll(); $('setupOv').hidden = false;
  $('n1').value = setup.n1; $('n2').value = setup.n2;
  $('backBtn').hidden = !G || G.state === 'wait'; $('startBtn').focus({ preventScroll: true });
}
function gameLang() {
  const t = T();
  $('modeLbl').textContent = t.modeLbl; $('catLbl').textContent = t.catLbl; $('lvLbl').textContent = t.lvLbl; $('namesLbl').textContent = t.namesLbl;
  $('n1').placeholder = t.p1; $('n2').placeholder = t.p2;
  document.querySelectorAll('#modeSeg button').forEach((b) => { b.querySelector('small').textContent = t.modes[b.dataset.m]; });
  document.querySelectorAll('#lvSeg button').forEach((b) => { b.textContent = t.lv[b.dataset.l]; });
  renderSetup(); render();
}

$('modeSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-m]'); if (b) { setup.mode = b.dataset.m; renderSetup(); } });
$('lvSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-l]'); if (b) { setup.level = b.dataset.l; renderSetup(); } });
$('catSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-c]'); if (b) { setup.cat = b.dataset.c; renderSetup(); } });
$('kb').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return; Sfx.unlock();
  if (b.id === 'hintBtn') useHint(); else if (b.dataset.c) guess(b.dataset.c);
});
$('nextBtn').addEventListener('click', nextWord);
$('wOk').addEventListener('click', submitWord);
$('wCancel').addEventListener('click', () => { $('wordOv').hidden = true; if (G && G.state === 'wait') { G = null; store.del('game'); } openSetup(); });
$('eyeBtn').addEventListener('click', () => { $('wordIn').classList.toggle('hide'); $('wordIn').focus(); });
$('wordIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('hintIn').focus(); } });
$('hintIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitWord(); } });
addEventListener('keydown', (e) => {
  if (anyOpen() || e.ctrlKey || e.metaKey || e.altKey || !G) return;
  if (e.key === 'Enter' && G.state !== 'play' && G.state !== 'wait') { e.preventDefault(); nextWord(); return; }
  if (e.key.length !== 1) return;
  const c = up(e.key, G.lang);
  if (isLetter(c, G.lang)) { e.preventDefault(); Sfx.unlock(); guess(c); }
});
addEventListener('resize', () => { if (G) renderWord(); });

function boot() {
  const s = store.get('game', null);
  if (s && s.level && LIVES[s.level] && Array.isArray(s.guessed) && (s.state !== 'play' || s.word) && s.state !== 'wait') {
    G = s; G.lang = ABC[G.lang] ? G.lang : 'tr'; if (!Array.isArray(G.recent)) G.recent = []; if (!Array.isArray(G.pts)) G.pts = [0, 0]; if (!Array.isArray(G.names)) G.names = ['', ''];
    lastShown = new Set(Array.from({ length: 10 }, (_, i) => i)); shownLetters = new Set(Array.from({ length: 40 }, (_, i) => i));
    render();
  } else openSetup();
}
window.__adam = { state: () => G, guess, useHint, nextWord, WORDS };


// ---------- Ortak bağlantılar ----------
function applyLang() {
  const t = T();
  document.documentElement.lang = lang; document.title = t.title;
  $('homeLink').href = '../?lang=' + lang; $('homeLink').setAttribute('aria-label', t.homeLabel);
  $('gameName').textContent = t.game; $('menuLbl').textContent = t.newGame; $('rulesLbl').textContent = t.rules;
  $('menuBtn').setAttribute('aria-label', t.newGame); $('rulesBtn').setAttribute('aria-label', t.rules); $('soundBtn').setAttribute('aria-label', t.sound); $('fsBtn').setAttribute('aria-label', t.fs); $('langBtn').setAttribute('aria-label', t.langLabel);
  const c = COMMON[lang];
  $('setBtn').setAttribute('aria-label', c.settings); $('scoreBtn').setAttribute('aria-label', c.scoreT); $('scoreLbl').textContent = c.scoreT; $('scoreTitle').textContent = c.scoreT; $('scoreOk').textContent = t.ok; $('setClose').textContent = t.back;
  $('setOv').querySelector('.sheet').setAttribute('aria-label', c.settings); applySound(); $('setupTitle').textContent = t.game; $('setupSub').textContent = t.setupSub;
  $('startBtn').textContent = t.start; $('backBtn').textContent = t.back;
  $('rulesTitle').textContent = t.rulesTitle; $('rulesSub').textContent = t.rulesSub; $('rulesOk').textContent = t.ok;
  $('rulesList').innerHTML = t.ruleList.map(([i, s]) => `<li><span>${i}</span><span>${s}</span></li>`).join('');
  $('againBtn').textContent = t.again; $('viewBtn').textContent = t.view; $('toMenuBtn').textContent = t.toMenu;
  $('langBtn').innerHTML = lang === 'tr' ? '<span style="color:#fff">TR</span>&nbsp;|&nbsp;EN' : 'TR&nbsp;|&nbsp;<span style="color:#fff">EN</span>';

}
function applySound() { $('soundIco').textContent = soundOn ? '🔊' : '🔇'; $('soundBtn').setAttribute('aria-pressed', soundOn); $('soundLbl').textContent = COMMON[lang][soundOn ? 'soundOn' : 'soundOff']; }
const hasScore = typeof scoreHtml === 'function';
function openScore() { closeAll(); $('scoreBody').innerHTML = hasScore ? scoreHtml() : ''; $('scoreOv').hidden = false; $('scoreOk').focus({ preventScroll: true }); }
function syncFs() { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); document.documentElement.classList.toggle('isFs', on); $('fsBtn').setAttribute('aria-pressed', on); }
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('setOv').hidden || !$('scoreOv').hidden) { $('setOv').hidden = $('scoreOv').hidden = true; }
  else if (!$('rulesOv').hidden) $('rulesOv').hidden = true;
  else if (!$('setupOv').hidden && G) closeAll();
  else if (!$('winOv').hidden) closeAll();
});
$('startBtn').addEventListener('click', () => { Sfx.unlock(); startFromSetup(); });
$('backBtn').addEventListener('click', closeAll);
$('menuBtn').addEventListener('click', () => { $('setOv').hidden = true; openSetup(); });
$('setBtn').addEventListener('click', () => { Sfx.unlock(); const was = !$('setOv').hidden; closeAll(); $('setOv').hidden = was; });
$('setClose').addEventListener('click', () => { $('setOv').hidden = true; });
$('setOv').addEventListener('click', (e) => { if (e.target.id === 'setOv') $('setOv').hidden = true; });
$('scoreBtn').hidden = $('scoreMi').hidden = !hasScore;
$('scoreBtn').addEventListener('click', () => { if (!$('scoreOv').hidden) { $('scoreOv').hidden = true; return; } openScore(); });
$('scoreMi').addEventListener('click', openScore);
$('scoreOk').addEventListener('click', () => { $('scoreOv').hidden = true; });
$('scoreOv').addEventListener('click', (e) => { if (e.target.id === 'scoreOv') $('scoreOv').hidden = true; });
document.addEventListener('fullscreenchange', syncFs); document.addEventListener('webkitfullscreenchange', syncFs);
$('rulesBtn').addEventListener('click', () => { $('setOv').hidden = true; $('rulesOv').hidden = false; $('rulesTitle').focus(); sayac('kurallar', 'kurallar açıldı'); });
$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; });
$('rulesOv').addEventListener('click', (e) => { if (e.target.id === 'rulesOv') $('rulesOv').hidden = true; });
$('againBtn').addEventListener('click', () => { Sfx.unlock(); again(); });
$('viewBtn').addEventListener('click', closeAll);
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; applySound(); store.set('sound', soundOn ? 1 : 0); if (soundOn) Sfx.unlock(); });
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
applySound(); applyLang(); boot();
</script>

<script id="fitSetupJs">
(() => {
  const ov = document.getElementById('setupOv'); const c = ov && ov.querySelector(':scope > .card, :scope > .card2'); if (!c) return;
  const over = () => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1;
  let busy = false, q = 0;
  const fit = () => {
    if (ov.hidden || busy) return; busy = true;
    c.classList.remove('fz1', 'fz2', 'fz3', 'fzc', 'fzn'); c.style.removeProperty('--fcols');
    if (over()) {
      const land = innerWidth > innerHeight && innerWidth >= 560;
      const cols = (n) => () => { c.classList.add('fzc'); c.style.setProperty('--fcols', n); };
      const nw = () => c.classList.add('fzn'), steps = [() => c.classList.add('fz1')];
      if (land) steps.push(cols(2), cols(3), () => c.classList.add('fz2'), nw);
      else steps.push(() => c.classList.add('fz2'));
      if (land && innerWidth >= 760) steps.push(cols(4));
      if (!land && innerWidth >= 340) steps.push(cols(2), nw);
      steps.push(() => c.classList.add('fz3'));
      if (land && innerWidth >= 640 && innerWidth < 760) steps.push(cols(4));
      for (const s of steps) { s(); if (!over()) break; }
    }
    busy = false;
  };
  const later = () => { cancelAnimationFrame(q); q = requestAnimationFrame(fit); };
  new MutationObserver(later).observe(ov, { attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true, characterData: true });
  addEventListener('resize', later); addEventListener('orientationchange', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
  later();
})();
</script>

<script id="rgRepJs">
(() => {
  const MAIL = 'destek@ridsgames.com', H = document.documentElement, errs = window.__rgErr || [];
  const T = {
    tr: { b: 'Sorun bildir', h: 'Sorun bildir', p: 'Ne oldu? Kısaca yazın. Gönder deyince e-posta uygulamanız hazır bir mesajla açılır, siz göndermeden hiçbir şey bize ulaşmaz.', ph: 'Örnek: Kartı oynadığımda oyun takıldı.', inf: 'Mesaja eklenecek bilgiler', send: 'E-posta ile gönder', copy: 'Kopyala', close: 'Kapat', copied: 'Kopyalandı. ' + MAIL + ' adresine gönderebilirsiniz.', nocopy: 'Kopyalanamadı. Metni seçip kopyalayın ve ' + MAIL + ' adresine gönderin.', subj: 'Sorun bildirimi', game: 'Oyun', page: 'Sayfa', lang: 'Dil', scr: 'Ekran', br: 'Tarayıcı', time: 'Zaman', err: 'Son hatalar', none: 'yok', desc: 'Açıklama' },
    en: { b: 'Report a problem', h: 'Report a problem', p: 'What happened? Write a few words. Send opens your email app with a ready message; nothing reaches us unless you send it.', ph: 'Example: the game froze when I played a card.', inf: 'Details added to the message', send: 'Send by email', copy: 'Copy', close: 'Close', copied: 'Copied. You can send it to ' + MAIL + '.', nocopy: 'Could not copy. Select the text, copy it and send it to ' + MAIL + '.', subj: 'Problem report', game: 'Game', page: 'Page', lang: 'Language', scr: 'Screen', br: 'Browser', time: 'Time', err: 'Recent errors', none: 'none', desc: 'Description' }
  };
  const t = () => T[(H.lang || 'tr').startsWith('en') ? 'en' : 'tr'];
  const gname = () => { const g = document.getElementById('gameName') || document.querySelector('#homeLink .gname'); return ((g && g.textContent) || document.title || '').replace(/\s*[|·–-]\s*Ridsgames.*$/i, '').trim(); };
  const info = () => { const l = t(), so = screen.orientation && screen.orientation.type;
    return [`${l.game}: ${gname()}`, `${l.page}: ${location.pathname}`, `${l.lang}: ${H.lang || '-'}`,
      `${l.scr}: ${innerWidth}x${innerHeight} @${Math.round((devicePixelRatio || 1) * 100) / 100}x${so ? ' ' + so : ''}${matchMedia('(pointer: coarse)').matches ? ' touch' : ''}`,
      `${l.br}: ${navigator.userAgent}`, `${l.time}: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
      `${l.err}: ${errs.length ? '' : l.none}`, ...errs.slice(-3).reverse().map((e) => `- ${e.t} ${e.m} @ ${e.src}`)].join('\n'); };
  let ov = null;
  const body = () => { const l = t(), d = ov.querySelector('textarea').value.trim(); return `${l.desc}:\n${d || '-'}\n\n---\n${info()}`; };
  const build = () => {
    ov = document.createElement('div'); ov.id = 'rgRep'; ov.hidden = true;
    ov.innerHTML = '<div class="rc" role="dialog" aria-modal="true" aria-labelledby="rgRepH"><h2 id="rgRepH"></h2><p class="pp"></p><textarea maxlength="1200"></textarea><details><summary></summary><pre></pre></details><div class="ok" role="status"></div><div class="rb"><button type="button" class="go"></button><button type="button" class="cp"></button><button type="button" class="cl"></button></div></div>';
    document.body.appendChild(ov);
    const q = (s) => ov.querySelector(s), close = () => { ov.hidden = true; };
    q('.cl').onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ['keydown', 'keyup', 'keypress'].forEach((k) => ov.addEventListener(k, (e) => { e.stopPropagation(); if (k === 'keydown' && e.key === 'Escape') close(); }));
    ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'contextmenu'].forEach((k) => ov.addEventListener(k, (e) => e.stopPropagation(), { passive: true }));
    q('.go').onclick = () => { const l = t(); let b = body(); if (b.length > 1400) b = b.slice(0, 1400) + '…';
      location.href = `mailto:${MAIL}?subject=${encodeURIComponent(`${l.subj}: ${gname()}`)}&body=${encodeURIComponent(b)}`; };
    q('.cp').onclick = () => { const l = t(), b = `${l.subj}: ${gname()}\n\n${body()}`, ok = q('.ok');
      const fb = () => { const a = document.createElement('textarea'); a.value = b; a.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; ov.appendChild(a); a.select(); let r = false; try { r = document.execCommand('copy'); } catch (_) {} a.remove(); ok.textContent = r ? l.copied : l.nocopy; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b).then(() => { ok.textContent = l.copied; }, fb); else fb(); };
  };
  const open = () => { if (!ov) build(); const l = t(), q = (s) => ov.querySelector(s);
    q('h2').textContent = l.h; q('.pp').textContent = l.p; q('textarea').placeholder = l.ph; q('summary').textContent = l.inf; q('pre').textContent = info();
    q('.go').textContent = l.send; q('.cp').textContent = l.copy; q('.cl').textContent = l.close; q('.ok').textContent = '';
    ov.hidden = false; setTimeout(() => q('textarea').focus({ preventScroll: true }), 30); };
  // Menüye satır ekle: Kurallar düğmesinin görünüşünü kopyalar
  const ICO = '✉';
  let btn = null;
  const label = () => { if (!btn) return; const l = t(); btn.setAttribute('aria-label', l.b); btn.title = l.b; const s = btn.querySelector('.rgRepL'); if (s) s.textContent = l.b; };
  const mount = () => {
    const rules = document.getElementById('rulesBtn'), lang = document.getElementById('langBtn');
    btn = document.createElement('button'); btn.type = 'button'; btn.id = 'rgRepBtn';
    if (rules && lang && rules.parentNode === lang.parentNode) {
      btn.className = rules.className; const sp = [...rules.children].filter((x) => x.tagName === 'SPAN');
      const a = document.createElement('span'); a.textContent = ICO; if (sp[0]) a.className = sp[0].className; btn.appendChild(a);
      if (sp[1]) { const b = document.createElement('span'); b.className = (sp[1].className + ' rgRepL').trim(); btn.appendChild(b); }
      lang.parentNode.insertBefore(btn, lang);
    } else {
      const host = document.getElementById('btn-reset-from-settings'), menu = document.getElementById('menu');
      const s = document.createElement('span'); s.className = 'rgRepL'; btn.append(ICO + ' ', s);
      if (host) { btn.className = host.className; host.parentNode.insertBefore(btn, host); }
      else if (menu) { btn.style.cssText = 'background:none;border:0;box-shadow:none;color:inherit;opacity:.75;font-size:13px;text-decoration:underline;margin-top:10px;min-height:0;padding:4px'; menu.appendChild(btn); }
      else { btn = null; return; }
    }
    btn.addEventListener('click', () => setTimeout(open, 0));
    label(); new MutationObserver(label).observe(H, { attributes: true, attributeFilter: ['lang'] });
  };
  window.rgReport = () => open();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
