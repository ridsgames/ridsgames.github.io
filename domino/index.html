<head>

<meta name="description" content="Domino: 28 taşlık klasik domino. Taşları uçlara eşleştir, elini ilk bitir. Bir, iki ya da üç bilgisayar rakibe karşı oyna.">

<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --glow: rgba(251, 191, 36, 0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--glow) 28%, transparent) 0%, transparent 62%), radial-gradient(ellipse at 50% 100%, #111a2c 0%, var(--bg) 70%), var(--bg);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk yok: sağ üstte ayarlar (ve varsa skor), sağ altta tam ekran. Oyun alanı ekranın tamamı. */
.top { display: contents; }
.fab { position: fixed; z-index: 26; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  background: rgba(2, 6, 23, .62); border: 1px solid rgba(148, 163, 184, .32); color: #e2e8f0; box-shadow: 0 3px 10px rgba(0, 0, 0, .4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background .15s, transform .1s; }
.fab:hover { background: rgba(15, 23, 42, .9); color: #fff; } .fab:active { transform: scale(.94); }
.fab.set { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); }
.fab.score { top: max(6px, env(safe-area-inset-top)); right: calc(max(6px, env(safe-area-inset-right)) + 46px); }
.fab.fs { bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); width: 36px; height: 36px; opacity: .8; }
.fab.fs .fsOut, .isFs .fab.fs .fsIn { display: none; } .isFs .fab.fs .fsOut { display: inline; }
.sheet { max-width: 340px; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
.sheet .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
.sheet .logo img { display: block; height: 40px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12.5px; color: rgba(34, 211, 238, .9); padding: 2px 10px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.mlist { display: grid; gap: 8px; }
.mi { height: 48px; border-radius: 13px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 16px; font-weight: 700; color: #e2e8f0; text-align: left;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .3); }
.mi:hover { border-color: var(--cyan); color: #fff; }
.mi .ico { width: 22px; text-align: center; font-size: 18px; }
.mi.lang { justify-content: center; font-size: 15px; font-weight: 800; color: #67e8f9; letter-spacing: .04em; }
.sheet .btns { margin-top: 0; }
.scoreBody { display: grid; gap: 8px; margin: 6px 0 2px; }
.scoreBody table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 15px; }
.scoreBody th { font-size: 12px; font-weight: 700; color: var(--dim); text-align: right; padding: 0 10px; }
.scoreBody th:first-child, .scoreBody td:first-child { text-align: left; }
.scoreBody td { padding: 10px; background: rgba(2, 6, 23, .55); text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: #e2e8f0; }
.scoreBody td:first-child { border-radius: 10px 0 0 10px; color: #fff; } .scoreBody td:last-child { border-radius: 0 10px 10px 0; color: #fde68a; font-weight: 800; }
.scoreBody tr.me td { background: rgba(8, 145, 178, .22); }
.scoreBody .sn { font-size: 13px; color: var(--dim); text-align: center; margin: 0; }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 27; display: flex; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg.tall button { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.seg.tall small { font-size: 11px; font-weight: 600; opacity: .75; white-space: nowrap; }
.seg.tall .em { font-size: 19px; }
.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.custom { display: grid; gap: 6px; margin-top: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px 44px; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
.mrow button { height: 44px; border-radius: 12px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 24px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.mrow button:disabled { opacity: .35; cursor: default; }
.mrow output { text-align: center; font-size: 24px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.score { text-align: center; font-size: 44px; font-weight: 800; line-height: 1; margin: 2px 0 14px; color: #fde68a; font-variant-numeric: tabular-nums; }
.score.lost { color: #fca5a5; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .b { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); z-index: 28; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
main { flex: 1; min-height: 0; width: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.panel { border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
/* Yatay telefon: pencereler iki sütun */
@media (orientation: landscape) and (max-height: 500px) {
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  #setupOv .card { max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; align-content: start; padding: 14px 18px 0; }
  #setupOv h2, #setupOv .sub, #setupOv .btns, #setupOv .wide { grid-column: 1 / -1; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 4px; }
  #setupOv .sec { margin-top: 8px; padding-top: 8px; }
  #setupOv .btns { position: sticky; bottom: 0; z-index: 1; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 8px -18px 0; padding: 10px 18px 14px; background: linear-gradient(180deg, rgba(11, 18, 32, 0), #0b1220 30%); }
  #winOv .card { max-width: 560px; padding: 14px 18px 16px; }
  #winOv .trophy { font-size: 38px; } #winOv .score { font-size: 34px; margin-bottom: 8px; } #winOv .sub { margin-bottom: 8px; }
  #winOv .rank { grid-template-columns: 1fr 1fr; }
  #winOv .btns { grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 10px; }
}

/* Telefon ve dokunmatik: kenar boşlukları dar */
@media (max-width: 700px), (pointer: coarse) and (max-height: 1100px) {
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
}

/* Sağ üstteki ayarlar düğmesinin altına denk gelen üst satırlar yer açar */
main > :is(.hud, .opps, .bar, .info, .pls):first-child, .scr > .head:first-child, main > .side:first-child > .ballbar:first-child { margin-right: 46px; }


/* ---------- Oyuna özel ---------- */
:root { --glow: rgba(16, 185, 129, .28); }
main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: stretch; }
.hud { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px; }
.op { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1.5px solid transparent; background: rgba(2, 6, 23, .45); font-size: 13px; color: #cbd5e1; min-width: 0; }
.op.on { border-color: #34d399; background: rgba(16, 185, 129, .15); }
.op .nm { font-weight: 700; max-width: 92px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op .tc { color: #cbd5e1; font-weight: 600; font-size: 12px; white-space: nowrap; }
.op .sc { font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; margin-left: 2px; padding: 1px 7px; border-radius: 999px; background: rgba(52, 211, 153, .18); color: #a7f3d0; }
.op.pass .tc { color: #f87171; }
.op.bone { background: transparent; color: #94a3b8; }
#table { position: relative; min-height: 0; border-radius: 18px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, rgba(52, 211, 153, .16), transparent 70%), linear-gradient(160deg, #0f4c3a, #0a3228); box-shadow: inset 0 0 0 2px rgba(52, 211, 153, .25), inset 0 0 40px rgba(0, 0, 0, .4); }
#chain { position: absolute; inset: 0; }
.dm { position: absolute; display: flex; border-radius: calc(var(--s) * .14); background: linear-gradient(160deg, #fffdf6, #ece6d6); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12), 0 2px 5px rgba(0, 0, 0, .45); transition: left .3s, top .3s, width .3s, height .3s; }
.dm.h { width: calc(var(--s) * 2); height: var(--s); flex-direction: row; }
.dm.v { width: var(--s); height: calc(var(--s) * 2); flex-direction: column; }
.dm .hf { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 14%; }
.dm .hf i { width: 70%; height: 70%; place-self: center; border-radius: 50%; background: #1e293b; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .5); }
.dm.h > .ln { width: 1.5px; margin: 14% 0; background: rgba(30, 41, 59, .35); }
.dm.v > .ln { height: 1.5px; margin: 0 14%; background: rgba(30, 41, 59, .35); }
.dm.new { animation: pop .3s ease-out; }
.dm.last { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12), 0 0 0 2px #fbbf24, 0 2px 8px rgba(0, 0, 0, .45); }
@keyframes pop { from { transform: scale(1.5); opacity: .2; } }
.endp { position: absolute; width: calc(var(--s) * 1.1); height: calc(var(--s) * 1.1); margin: calc(var(--s) * -.55) 0 0 calc(var(--s) * -.55); border-radius: 50%; border: 3px solid #fbbf24; background: rgba(251, 191, 36, .25); z-index: 5; animation: pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(.85); } to { transform: scale(1.1); } }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(209, 250, 229, .45); font-weight: 700; font-size: 14px; text-align: center; padding: 20px; pointer-events: none; }
.status { text-align: center; font-size: 15px; font-weight: 700; color: #e2e8f0; min-height: 1.4em; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.status button { height: 34px; padding: 0 14px; border-radius: 999px; border: 0; font-weight: 800; font-size: 14px; color: #052e16; background: linear-gradient(180deg, #34d399, #10b981); }
.status button.alt { background: rgba(15, 23, 42, .85); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, .35); }
#hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 8px 6px; min-height: 64px; }
#hand .dm { position: relative; cursor: pointer; transition: transform .15s, opacity .2s; border: 0; padding: 0; }
#hand .dm.ok { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12), 0 0 0 2px rgba(52, 211, 153, .85), 0 4px 10px rgba(0, 0, 0, .4); }
#hand .dm.no { opacity: .5; }
#hand .dm.sel { transform: translateY(-8px); box-shadow: 0 0 0 3px #fbbf24, 0 10px 18px rgba(0, 0, 0, .5); }
#hand .dm.drawn { animation: drawn .35s ease-out; }
@keyframes drawn { from { transform: translateY(-30px) scale(.6); opacity: 0; } }
.res { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(2, 6, 23, .55); z-index: 6; padding: 12px; }
.res .box { max-width: 360px; width: 100%; padding: 14px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
.res h3 { margin: 0; font-size: 19px; color: #fff; }
.res .rl { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: #cbd5e1; padding: 4px 2px; border-bottom: 1px dashed rgba(148, 163, 184, .2); }
.res .rl b { color: #fff; } .res .rl .g { color: #4ade80; font-weight: 800; }
.res button { height: 42px; border-radius: 999px; border: 0; font-weight: 800; font-size: 15px; color: #052e16; background: linear-gradient(180deg, #34d399, #10b981); margin-top: 4px; }
@media (orientation: landscape) {
  main { grid-template-columns: minmax(0, 1fr) clamp(220px, 30vw, 340px); grid-template-rows: auto auto minmax(0, 1fr); max-width: 1200px; }
  #table { grid-column: 1; grid-row: 1 / -1; }
  .hud { grid-column: 2; grid-row: 1; }
  .status { grid-column: 2; grid-row: 2; }
  #hand { grid-column: 2; grid-row: 3; align-content: flex-start; overflow: auto; }
}
@media (prefers-reduced-motion: reduce) { .endp { animation: none; } }

</style>

const STR = {

    winT: 'Kazandın!', loseT: (n) => `${n} kazandı`, winS: (s, t) => `${t} puana ilk sen ulaştın.`, loseS: (n, t) => `${t} puana ilk ${n} ulaştı.`,
    rounds: 'Oynanan el',
    rulesSub: '28 taşlık klasik domino. Taşını zincirin iki ucundan birine, sayıları eşleştirerek koy.',

      ['🁫', 'Herkese taş dağıtılır (iki kişide 7, daha kalabalıkta 5). Kalanlar <b>pazar</b>a gider.'],
      ['▶️', 'İlk eli en büyük <b>çift</b> taşı olan açar. Sonraki elleri önceki eli kazanan, istediği taşla açar.'],

      ['🏁', 'Elini ilk bitiren, rakiplerin elinde kalan taşların toplam sayısı kadar puan alır. Kimse oynayamazsa oyun kilitlenir; elinde en az sayı kalan puanı alır.'],
      ['🏆', 'Seçtiğin hedef puana ilk ulaşan oyunu kazanır.']
    ] },
  en: { ...COMMON.en, title: 'Dominoes | Ridsgames', game: 'Dominoes',

    varLbl: "When you can't play", vars: { cek: 'Draw', blok: 'Pass' }, varNote: { cek: 'A player who cannot play draws from the boneyard until they can.', blok: 'No boneyard: a player who cannot play passes.' },
    tgtLbl: 'Play to', ptsT: 'Score', you: 'You', cpuNames: ['Alex', 'Maya', 'Leo'], bone: 'Boneyard', target: (n) => `Target ${n}`,
    yourTurn: 'Your turn: tap the tile to play', mustFirst: (t) => `Open with ${t}`, pickEnd: 'Which end? Pick one of the glowing ends',

    thinking: (n) => `${n} is thinking…`, drew: (n, k) => `${n} drew ${k} tile${k > 1 ? 's' : ''}`, passed: (n) => `${n} passed`, played: (n) => `${n} played`,

    resDom: (n) => `${n} went out!`, resBlock: 'The game is blocked', resTie: 'Blocked with a tie: nobody scores',
    tl: (n) => `${n} tile${n === 1 ? '' : 's'}`, pips: 'Left in hand', gain: (n) => `+${n}`, nextRound: 'Next round', seeEnd: 'Results',
    winT: 'You win!', loseT: (n) => `${n} wins`, winS: (s, t) => `You reached ${t} points first.`, loseS: (n, t) => `${n} reached ${t} points first.`,
    rounds: 'Rounds played',
    rulesSub: 'Classic double-six dominoes. Place a tile on either end of the line by matching numbers.',
    ruleList: [
      ['🁫', 'Each player gets tiles (7 with two players, 5 with more). The rest form the <b>boneyard</b>.'],
      ['▶️', 'The player with the highest <b>double</b> opens the first round. Later rounds are opened by the previous winner with any tile.'],
      ['🔗', 'On your turn place a tile so that its number matches the <b>left or right end</b> of the line.'],
      ['🛒', 'If you cannot play, you <b>draw</b> from the boneyard or <b>pass</b>, depending on the setup.'],

      ['🏆', 'The first to reach the target score wins.']
    ] }
};
const T = () => STR[lang];
const TILES = []; for (let a = 0; a <= 6; a++) for (let b = a; b <= 6; b++) TILES.push([a, b]);
const PIPS = { h: [[], [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 3, 6, 2, 5, 8]], v: [[], [4], [2, 6], [2, 4, 6], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 1, 2, 6, 7, 8]] };
const pip = (t) => TILES[t][0] + TILES[t][1];
const tname = (t) => `${TILES[t][0]}|${TILES[t][1]}`;
let setup = Object.assign({ opp: 1, level: 'orta', variant: 'cek', target: 100 }, store.get('setup', {}));
if (!COMMON.tr.lv[setup.level]) setup.level = 'orta';
if (!STR.tr.vars[setup.variant]) setup.variant = 'cek';
let G = null, busy = false, epoch = 0, sel = -1, drawnId = -1, newId = -1;

const pname = (i) => i === 0 ? T().you : T().cpuNames[i - 1];
const cur = () => G.players[G.turn];
const isCpu = () => G && G.phase === 'play' && G.turn !== 0;
function ends(t) {
  const [a, b] = TILES[t];
  if (!G.chain.length) return ['R'];
  const o = []; if (a === G.L || b === G.L) o.push('L'); if ((a === G.R || b === G.R)) o.push('R');
  if (o.length === 2 && G.L === G.R) return ['R'];
  return o;
}
const legal = (pi) => { const out = []; for (const t of G.players[pi].hand) { if (G.must >= 0 && t !== G.must) continue; for (const e of ends(t)) out.push({ t, e }); } return out; };
const save = () => { if (G) store.set('game', G); };

// ---------- Dağıtım ----------
function deal(starter) {
  const n = G.players.length, k = n === 2 ? 7 : 5, deck = shuffle([...Array(28).keys()]);
  G.players.forEach((p) => { p.hand = deck.splice(0, k).sort((x, y) => x - y); p.no = []; });
  G.bone = G.variant === 'cek' ? deck : [];
  Object.assign(G, { chain: [], L: -1, R: -1, passes: 0, must: -1, last: -1, note: null, phase: 'play', res: null });
  if (starter < 0) {
    let best = -1, who = 0, tile = -1;
    G.players.forEach((p, pi) => p.hand.forEach((t) => { const [a, b] = TILES[t]; const v = a === b ? 100 + a : a + b; if (v > best) { best = v; who = pi; tile = t; } }));
    starter = who; G.must = tile;
  }
  G.turn = starter; G.starter = starter; G.round++;

}
function newGame() {
  closeAll();
  const n = setup.opp + 1;
  G = { level: setup.level, variant: setup.variant, target: setup.target, players: Array.from({ length: n }, (_, i) => ({ hand: [], score: 0, no: [] })), round: 0 };
  sayac('basladi', 'oyun başladı');
  if (bitenVar) { bitenVar = false; sayac('tekrar', 'bitirdikten sonra yeni oyun'); }
  sayac(`mod/${n}k-${G.variant}-${G.level}`, `mod: ${n} kişi, ${G.variant}, ${G.level}`);
  deal(-1); save(); render(); layout();
  if (isCpu()) cpuTurn();
}
function startFromSetup() { store.set('setup', setup); newGame(); }
function again() { newGame(); }

// ---------- Hamleler ----------
function play(pi, t, e) {
  const p = G.players[pi], [a, b] = TILES[t];
  p.hand.splice(p.hand.indexOf(t), 1);
  if (!G.chain.length) { G.chain.push({ t, l: a, r: b }); G.L = a; G.R = b; }
  else if (e === 'L') { const o = b === G.L ? a : b; G.chain.unshift({ t, l: o, r: G.L }); G.L = o; }
  else { const o = a === G.R ? b : a; G.chain.push({ t, l: G.R, r: o }); G.R = o; }
  p.no = p.no.filter((v) => v !== a && v !== b);
  G.last = t; G.passes = 0; G.must = -1; newId = t; sel = -1;
  Sfx.tone(520 - pip(t) * 18, 300, 0.08, 0.1, 'triangle', 0.12); buzz(10);
  if (!p.hand.length) return endRound(pi);
  advance();
}
function draw(pi) {
  if (!G.bone.length) return false;
  const t = G.bone.pop(), h = G.players[pi].hand; h.push(t); h.sort((x, y) => x - y);
  if (pi === 0) drawnId = t;
  Sfx.tone(700, 600, 0.05, 0.04, 'sine', 0.06);
  return true;
}
function pass(pi) {
  const p = G.players[pi];
  if (G.chain.length) for (const v of [G.L, G.R]) if (!p.no.includes(v)) p.no.push(v);
  G.passes++; G.note = { k: 'pass', p: pi };
  if (G.passes >= G.players.length) return endRound(-1);
  advance();
}
function advance() {
  G.turn = (G.turn + 1) % G.players.length;
  save(); render();
  if (isCpu()) cpuTurn();
}
function endRound(w) {
  const pips = G.players.map((p) => p.hand.reduce((s, t) => s + pip(t), 0));
  let why = 'dom', gain = 0;
  if (w < 0) {
    why = 'block'; const mn = Math.min(...pips), ws = pips.map((v, i) => v === mn ? i : -1).filter((i) => i >= 0);
    if (ws.length === 1) w = ws[0]; else why = 'tie';
  }
  if (w >= 0) { gain = pips.reduce((s, v, i) => i === w ? s : s + v, 0); G.players[w].score += gain; }
  G.res = { w, why, gain, pips };
  G.phase = G.players.some((p) => p.score >= G.target) ? 'end' : 'res';
  save(); render();
  setTimeout(() => { if (w === 0) Sfx.good(); else if (w > 0) Sfx.bad(); else Sfx.click(); }, 200);
}
function nextRound() {
  if (!G || G.phase !== 'res') return;
  const w = G.res.w; deal(w >= 0 ? w : (G.starter + 1) % G.players.length);
  newId = -1; save(); render(); layout();
  if (isCpu()) cpuTurn();
}
function finish() {
  if (!G || G.phase !== 'end') return;
  G.phase = 'over'; save(); render();
  bitenVar = true; sayac('bitti', 'oyun bitti');
  const t = T(), order = G.players.map((p, i) => i).sort((a, b) => G.players[b].score - G.players[a].score), w = order[0];
  sayac(`sonuc/${w === 0 ? 'insan' : 'bilgisayar'}-${G.level}`, `sonuç (${G.level})`);
  w === 0 ? Sfx.win() : Sfx.lose();
  showEnd({ ico: w === 0 ? '🏆' : '🁫', title: w === 0 ? t.winT : t.loseT(pname(w)), sub: w === 0 ? t.winS(0, G.target) : t.loseS(pname(w), G.target), lost: w !== 0,
    stats: [...order.map((i, k) => [`${k + 1}. ${pname(i)}`, G.players[i].score]), [t.rounds, G.round]] });
}

// ---------- Bilgisayar ----------
function cpuChoose(pi) {
  const ms = legal(pi); if (!ms.length) return null;
  const lv = G.level, p = G.players[pi];
  if (lv === 'kolay') return ms[rnd(ms.length)];
  let best = -Infinity, pick = [];
  const nx = G.players[(pi + 1) % G.players.length];
  for (const m of ms) {
    const [a, b] = TILES[m.t]; let v = pip(m.t) + (a === b ? 3 : 0);
    if (lv === 'zor') {
      let L = G.L, R = G.R;
      if (!G.chain.length) { L = a; R = b; } else if (m.e === 'L') L = b === G.L ? a : b; else R = a === G.R ? b : a;
      const rest = p.hand.filter((x) => x !== m.t);
      v += 2.5 * rest.filter((x) => { const [c, d] = TILES[x]; return c === L || d === L || c === R || d === R; }).length;
      if (nx.no.includes(L)) v += 5; if (nx.no.includes(R)) v += 5;
      if (G.players.length === 2 && nx.hand.length <= 2) v += (nx.no.includes(L) && nx.no.includes(R)) ? 15 : 0;
    }
    v += Math.random() * 0.5;
    if (v > best) { best = v; pick = [m]; }
  }
  return pick[0];
}
function cpuTurn() {
  busy = true; render();
  const ep = epoch, pi = G.turn;
  let drew = 0;
  const step = () => {
    if (ep !== epoch || !G || G.phase !== 'play' || G.turn !== pi) return;
    const m = cpuChoose(pi);
    if (m) { busy = false; if (drew) G.note = { k: 'drew', p: pi, n: drew }; else G.note = { k: 'play', p: pi }; play(pi, m.t, m.e); return; }
    if (G.variant === 'cek' && G.bone.length) { draw(pi); drew++; G.note = { k: 'drew', p: pi, n: drew }; render(); setTimeout(step, REDUCED ? 80 : 260); return; }
    busy = false; pass(pi);
  };
  setTimeout(step, REDUCED ? 200 : 750);
}

// ---------- İnsan ----------
function tapHand(t) {
  if (!G || G.phase !== 'play' || G.turn !== 0 || busy) return;
  Sfx.unlock();
  const tt = T();
  if (G.must >= 0 && t !== G.must) { toast(tt.notFirst(tname(G.must)), '#f87171'); Sfx.bad(); return; }
  const es = ends(t);
  if (!es.length) { toast(tt.cant, '#f87171'); Sfx.bad(); return; }
  if (sel === t) { sel = -1; render(); return; }
  if (es.length === 1) { G.note = null; play(0, t, es[0]); return; }
  sel = t; Sfx.tap(); render();
}
function pickEnd(e) { if (sel < 0) return; const t = sel; G.note = null; play(0, t, e); }
function humanDraw() { if (G.turn !== 0 || busy || legal(0).length) return; if (draw(0)) { save(); render(); } }
function humanPass() { if (G.turn !== 0 || busy || legal(0).length || (G.variant === 'cek' && G.bone.length)) return; Sfx.click(); pass(0); }

// ---------- Çizim ----------
const half = (v, o) => `<div class="hf">${PIPS[o][v].map((k) => `<i style="grid-area:${(k / 3 | 0) + 1}/${k % 3 + 1}"></i>`).join('')}</div>`;
const tileHtml = (x, y, o) => `${half(x, o)}<div class="ln"></div>${half(y, o)}`;
let geo = null;
function layout() {
  if (!G) return;
  const tb = $('table'), pad = 10, W = tb.clientWidth - pad * 2, H = tb.clientHeight - pad * 2; if (W <= 0 || H <= 0) return;
  const items = G.chain.map((c) => c.l === c.r);
  let s = 10, rows = [], gap = 2, rg = 4;
  for (let cand = Math.min(60, Math.floor(H / 2)); cand >= 10; cand--) {
    const gp = Math.max(2, Math.round(cand * 0.08)), rgp = Math.round(cand * 0.35);
    const rs = [[]]; let x = 0;
    items.forEach((d, i) => { const w = d ? cand : cand * 2; if (x > 0 && x + gp + w > W) { rs.push([]); x = 0; } x += (x > 0 ? gp : 0) + w; rs[rs.length - 1].push(i); });
    const th = rs.length * cand * 2 + (rs.length - 1) * rgp;
    if (th <= H || cand === 10) { s = cand; rows = rs; gap = gp; rg = rgp; break; }
  }
  const rw = rows.map((r) => r.reduce((a, i) => a + (items[i] ? s : 2 * s), 0) + gap * Math.max(0, r.length - 1));
  const bw = Math.max(...rw, 0), th = rows.length * s * 2 + (rows.length - 1) * rg;
  const left0 = pad + (W - bw) / 2, top0 = pad + Math.max(0, (H - th) / 2);
  const pos = [];
  rows.forEach((r, ri) => {
    const yc = top0 + ri * (2 * s + rg) + s, ltr = ri % 2 === 0;
    let x = ltr ? left0 : left0 + bw;
    for (const i of r) {
      const w = items[i] ? s : 2 * s;
      if (!ltr) x -= w;
      pos[i] = { x, y: items[i] ? yc - s : yc - s / 2, w, d: items[i], ltr };
      x = ltr ? x + w + gap : x - gap;
    }
  });
  geo = { s, pos };
  $('table').style.setProperty('--s', s + 'px');
  renderChain();
}
function renderChain() {
  if (!geo || !G) return;
  const { s, pos } = geo;
  let h = '';
  G.chain.forEach((c, i) => {
    const p = pos[i]; if (!p) return;
    const [x, y] = p.ltr ? [c.l, c.r] : [c.r, c.l];
    h += `<div class="dm ${p.d ? 'v' : 'h'}${c.t === newId && !REDUCED ? ' new' : ''}${c.t === G.last ? ' last' : ''}" style="left:${p.x}px;top:${p.y}px">${tileHtml(x, y, p.d ? 'v' : 'h')}</div>`;
  });
  if (sel >= 0 && G.chain.length) {
    const n = G.chain.length, a = pos[0], b = pos[n - 1];
    const lx = a.d ? a.x + s / 2 : (a.ltr ? a.x + s / 2 : a.x + a.w - s / 2), ly = a.y + (a.d ? s : s / 2);
    const rx = b.d ? b.x + s / 2 : (b.ltr ? b.x + b.w - s / 2 : b.x + s / 2), ry = b.y + (b.d ? s : s / 2);
    h += `<button type="button" class="endp" data-e="L" aria-label="L" style="left:${lx}px;top:${ly}px"></button><button type="button" class="endp" data-e="R" aria-label="R" style="left:${rx}px;top:${ry}px"></button>`;
  }
  $('chain').innerHTML = h;
  newId = -1;
  $('empty').textContent = G.chain.length ? '' : T().emptyT;
}
function renderHand() {
  const hand = G.players[0].hand, box = $('hand'), n = Math.max(hand.length, 1);
  const W = box.clientWidth - 14, land = matchMedia('(orientation: landscape)').matches;
  // dikeyde el, ekranın yaklaşık üçte birine kadar büyüyebilir; yatayda yan sütunu doldurur
  const H = land ? box.clientHeight - 16 : Math.max(90, $('main').clientHeight * 0.3);
  let sh = 18;
  for (let c = land ? 72 : 64; c >= 18; c--) { const g = Math.max(6, Math.round(c * 0.14)), per = Math.max(1, Math.floor((W + g) / (c + g))), rows = Math.ceil(n / per); if (rows * (2 * c + g) <= H) { sh = c; box.style.gap = g + 'px'; break; } }
  const my = G.phase === 'play' && G.turn === 0 && !busy;
  const ok = new Set(my ? legal(0).map((m) => m.t) : []);
  box.style.setProperty('--s', sh + 'px');
  box.innerHTML = hand.map((t) => `<button type="button" class="dm v${my ? (ok.has(t) ? ' ok' : ' no') : ''}${t === sel ? ' sel' : ''}${t === drawnId && !REDUCED ? ' drawn' : ''}" data-t="${t}" aria-label="${tname(t)}">${tileHtml(TILES[t][0], TILES[t][1], 'v')}</button>`).join('');
  drawnId = -1;
}
function renderHud() {
  const t = T();
  let h = G.players.map((p, i) => `<span class="op${G.phase === 'play' && G.turn === i ? ' on' : ''}${G.note && G.note.k === 'pass' && G.note.p === i ? ' pass' : ''}"><span class="nm">${esc(pname(i))}</span><span class="tc">${esc(t.tl(p.hand.length))}</span><span class="sc" title="${esc(t.ptsT)}">${p.score}</span></span>`).join('');
  if (G.variant === 'cek') h += `<span class="op bone">${esc(t.bone)} <b>${G.bone.length}</b></span>`;
  h += `<span class="op bone">${esc(t.target(G.target))}</span>`;
  $('hud').innerHTML = h;
}
function renderStatus() {
  const t = T(); let s = '', btn = '';
  if (G.phase === 'play') {
    if (G.turn === 0 && !busy) {
      const lg = legal(0).length;
      if (sel >= 0) s = t.pickEnd;
      else if (G.must >= 0) s = t.mustFirst(tname(G.must));
      else if (lg) s = (G.note && G.note.p ? noteTx(G.note) + ' · ' : '') + t.yourTurn;
      else if (G.variant === 'cek' && G.bone.length) { s = t.noMoveDraw; btn = `<button type="button" id="drawBtn">${esc(t.drawBtn)}</button>`; }
      else { s = t.noMove; btn = `<button type="button" class="alt" id="passBtn">${esc(t.passBtn)}</button>`; }
    } else s = G.note && G.note.k === 'drew' && G.note.p === G.turn ? noteTx(G.note) : t.thinking(pname(G.turn));
  }
  $('status').innerHTML = `<span>${esc(s)}</span>${btn}`;
}
const noteTx = (n) => { const t = T(); return n.k === 'drew' ? t.drew(pname(n.p), n.n) : n.k === 'pass' ? t.passed(pname(n.p)) : t.played(pname(n.p)); };
function renderRes() {
  const t = T(), R = G.res, show = G.phase === 'res' || G.phase === 'end';
  $('res').hidden = !show; if (!show) return;
  const title = R.why === 'dom' ? t.resDom(pname(R.w)) : R.why === 'tie' ? t.resTie : t.resBlock;
  $('resBox').innerHTML = `<h3>${esc(title)}</h3>${G.players.map((p, i) => `<div class="rl"><span>${esc(pname(i))} · ${esc(t.pips)} ${R.pips[i]}</span><span>${i === R.w ? `<span class="g">${t.gain(R.gain)}</span> ` : ''}<b>${p.score}</b></span></div>`).join('')}<button type="button" id="resBtn">${esc(G.phase === 'end' ? t.seeEnd : t.nextRound)}</button>`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render() { if (!G) return; renderHud(); renderStatus(); renderHand(); renderRes(); layout(); }
function renderSetup() {
  const t = T();
  segPress('oppSeg', 'o', String(setup.opp)); segPress('lvSeg', 'l', setup.level); segPress('varSeg', 'v', setup.variant); segPress('tgtSeg', 't', String(setup.target));
  $('oppNote').textContent = t.oppNote[setup.opp]; $('lvNote').textContent = t.lvNote[setup.level]; $('varNote').textContent = t.varNote[setup.variant];
}
function openSetup() { renderSetup(); closeAll(); $('setupOv').hidden = false; $('backBtn').hidden = !G; $('startBtn').focus({ preventScroll: true }); }
function gameLang() {
  const t = T();
  ['oppLbl', 'lvLbl', 'varLbl', 'tgtLbl'].forEach((k) => { $(k).textContent = t[k]; });
  document.querySelectorAll('#lvSeg button').forEach((b) => { b.textContent = t.lv[b.dataset.l]; });
  document.querySelectorAll('#varSeg button').forEach((b) => { b.textContent = t.vars[b.dataset.v]; });
  renderSetup(); render();
}
const segH = (id, attr, fn) => $(id).addEventListener('click', (e) => { const b = e.target.closest(`button[data-${attr}]`); if (b) { fn(b.dataset[attr]); renderSetup(); } });
segH('oppSeg', 'o', (v) => { setup.opp = +v; });
segH('lvSeg', 'l', (v) => { setup.level = v; });
segH('varSeg', 'v', (v) => { setup.variant = v; });
segH('tgtSeg', 't', (v) => { setup.target = +v; });
$('hand').addEventListener('click', (e) => { const b = e.target.closest('.dm'); if (b) tapHand(+b.dataset.t); });
$('chain').addEventListener('click', (e) => { const b = e.target.closest('.endp'); if (b) pickEnd(b.dataset.e); });
$('status').addEventListener('click', (e) => { if (e.target.id === 'drawBtn') { Sfx.unlock(); humanDraw(); } else if (e.target.id === 'passBtn') { Sfx.unlock(); humanPass(); } });
$('res').addEventListener('click', (e) => { if (e.target.id === 'resBtn') { Sfx.click(); if (G.phase === 'end') finish(); else nextRound(); } });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && sel >= 0 && !anyOpen()) { sel = -1; render(); } });
addEventListener('resize', () => { layout(); render(); });
if (window.ResizeObserver) { new ResizeObserver(() => layout()).observe($('table')); new ResizeObserver(() => G && renderHand()).observe($('hand')); }

function boot() {
  const s = store.get('game', null);
  if (s && Array.isArray(s.players) && Array.isArray(s.chain) && s.phase) {
    G = s; render(); layout();
    if (isCpu()) cpuTurn();
  } else openSetup();
}
window.__domino = { state: () => ({ G, busy, sel }), tapHand, pickEnd, humanDraw, humanPass, legal, layout };


// ---------- Ortak bağlantılar ----------
function applyLang() {
  const t = T();
  document.documentElement.lang = lang; document.title = t.title;
  $('homeLink').href = '../?lang=' + lang; $('homeLink').setAttribute('aria-label', t.homeLabel);
  $('gameName').textContent = t.game; $('menuLbl').textContent = t.newGame; $('rulesLbl').textContent = t.rules;
  $('menuBtn').setAttribute('aria-label', t.newGame); $('rulesBtn').setAttribute('aria-label', t.rules); $('soundBtn').setAttribute('aria-label', t.sound); $('fsBtn').setAttribute('aria-label', t.fs); $('langBtn').setAttribute('aria-label', t.langLabel);
  const c = COMMON[lang];
  $('setBtn').setAttribute('aria-label', c.settings); $('scoreBtn').setAttribute('aria-label', c.scoreT); $('scoreLbl').textContent = c.scoreT; $('scoreTitle').textContent = c.scoreT; $('scoreOk').textContent = t.ok; $('setClose').textContent = t.back;
  $('setOv').querySelector('.sheet').setAttribute('aria-label', c.settings); applySound(); $('setupTitle').textContent = t.game; $('setupSub').textContent = t.setupSub;
  $('startBtn').textContent = t.start; $('backBtn').textContent = t.back;
  $('rulesTitle').textContent = t.rulesTitle; $('rulesSub').textContent = t.rulesSub; $('rulesOk').textContent = t.ok;
  $('rulesList').innerHTML = t.ruleList.map(([i, s]) => `<li><span>${i}</span><span>${s}</span></li>`).join('');
  $('againBtn').textContent = t.again; $('viewBtn').textContent = t.view; $('toMenuBtn').textContent = t.toMenu;
  $('langBtn').innerHTML = lang === 'tr' ? '<span style="color:#fff">TR</span>&nbsp;|&nbsp;EN' : 'TR&nbsp;|&nbsp;<span style="color:#fff">EN</span>';
  gameLang();
}
function applySound() { $('soundIco').textContent = soundOn ? '🔊' : '🔇'; $('soundBtn').setAttribute('aria-pressed', soundOn); $('soundLbl').textContent = COMMON[lang][soundOn ? 'soundOn' : 'soundOff']; }
const hasScore = typeof scoreHtml === 'function';
function openScore() { closeAll(); $('scoreBody').innerHTML = hasScore ? scoreHtml() : ''; $('scoreOv').hidden = false; $('scoreOk').focus({ preventScroll: true }); }
function syncFs() { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); document.documentElement.classList.toggle('isFs', on); $('fsBtn').setAttribute('aria-pressed', on); }
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('setOv').hidden || !$('scoreOv').hidden) { $('setOv').hidden = $('scoreOv').hidden = true; }
  else if (!$('rulesOv').hidden) $('rulesOv').hidden = true;
  else if (!$('setupOv').hidden && G) closeAll();
  else if (!$('winOv').hidden) closeAll();
});
$('startBtn').addEventListener('click', () => { Sfx.unlock(); startFromSetup(); });
$('backBtn').addEventListener('click', closeAll);
$('menuBtn').addEventListener('click', () => { $('setOv').hidden = true; openSetup(); });
$('setBtn').addEventListener('click', () => { Sfx.unlock(); const was = !$('setOv').hidden; closeAll(); $('setOv').hidden = was; });
$('setClose').addEventListener('click', () => { $('setOv').hidden = true; });
$('setOv').addEventListener('click', (e) => { if (e.target.id === 'setOv') $('setOv').hidden = true; });
$('scoreBtn').hidden = $('scoreMi').hidden = !hasScore;
$('scoreBtn').addEventListener('click', () => { if (!$('scoreOv').hidden) { $('scoreOv').hidden = true; return; } openScore(); });
$('scoreMi').addEventListener('click', openScore);
$('scoreOk').addEventListener('click', () => { $('scoreOv').hidden = true; });
$('scoreOv').addEventListener('click', (e) => { if (e.target.id === 'scoreOv') $('scoreOv').hidden = true; });
document.addEventListener('fullscreenchange', syncFs); document.addEventListener('webkitfullscreenchange', syncFs);
$('rulesBtn').addEventListener('click', () => { $('setOv').hidden = true; $('rulesOv').hidden = false; $('rulesTitle').focus(); sayac('kurallar', 'kurallar açıldı'); });
$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; });
$('rulesOv').addEventListener('click', (e) => { if (e.target.id === 'rulesOv') $('rulesOv').hidden = true; });
$('againBtn').addEventListener('click', () => { Sfx.unlock(); again(); });
$('viewBtn').addEventListener('click', closeAll);
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; applySound(); store.set('sound', soundOn ? 1 : 0); if (soundOn) Sfx.unlock(); });
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
applySound(); applyLang(); boot();
</script>
