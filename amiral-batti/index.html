/* ---------- Oyuna özel ---------- */
:root { --glow: rgba(14, 165, 233, .3); }
main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.hud { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px; width: 100%; max-width: 720px; justify-self: center; min-height: 44px; text-align: center; }

.bd { position: relative; width: calc(var(--cs, 30px) * 10); height: calc(var(--cs, 30px) * 10); border-radius: 10px; overflow: hidden; touch-action: none;
  background: radial-gradient(ellipse at 30% 20%, rgba(56, 189, 248, .18), transparent 60%), linear-gradient(160deg, #0c4a6e, #082f49);
  box-shadow: inset 0 0 0 2px rgba(56, 189, 248, .35), 0 14px 32px rgba(0, 0, 0, .45); }
.bd .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); }
.bd .cell { position: relative; border: 0; padding: 0; margin: 0; background: transparent; box-shadow: inset -1px -1px 0 rgba(125, 211, 252, .13); display: grid; place-items: center; }
#bdE .cell.open { cursor: crosshair; }
#bdE.live .cell.open:hover { background: rgba(250, 204, 21, .14); }
#bdE.live { box-shadow: inset 0 0 0 2px #f59e0b, 0 0 0 3px rgba(245, 158, 11, .25), 0 14px 32px rgba(0, 0, 0, .45); }
.cell.miss::after { content: ''; width: 26%; height: 26%; border-radius: 50%; background: rgba(226, 232, 240, .75); }
.cell.auto::after { content: ''; width: 18%; height: 18%; border-radius: 50%; background: rgba(148, 163, 184, .35); }
.cell.hit::after { content: ''; position: relative; z-index: 3; width: 56%; height: 56%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fde68a, #f97316 45%, #dc2626 75%); box-shadow: 0 0 10px rgba(249, 115, 22, .8); }

.cell.new::after { animation: boom .35s ease-out; }
.cell.miss.new::after { animation: splash .4s ease-out; }
.cell.aim { background: rgba(250, 204, 21, .25); }
@keyframes boom { from { transform: scale(2.2); opacity: .2; } }
@keyframes splash { from { transform: scale(3); opacity: 0; } }

    <div id="scoreBody" class="scoreBody"></div>
    <div class="btns"><button class="big" id="scoreOk" type="button">Tamam</button></div>
  </div>
</div>

<!-- Yeni oyun -->

  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Amiral Battı</h2>
    <p class="sub" id="setupSub"></p>

      <div class="note" id="exNote"></div>

    <div class="btns">

      <button class="big alt" id="backBtn" type="button">Oyuna dön</button>

</div>

<!-- Kurallar -->
<div class="ov" id="rulesOv" hidden>

    <ul class="rules" id="rulesList"></ul>
    <div class="btns"><button class="big" id="rulesOk" type="button">Tamam</button></div>

</div>

  $('winIco').textContent = o.ico; $('winTitle').textContent = o.title; $('winSub').textContent = o.sub || '';
  $('winScore').textContent = o.score || ''; $('winScore').hidden = !o.score; $('winScore').classList.toggle('lost', !!o.lost);
  $('statList').innerHTML = (o.stats || []).map(([a, b]) => `<li><span>${a}</span><span class="b">${b}</span></li>`).join('');

// ---------- Oyun ----------
const STR = {
  tr: { ...COMMON.tr, title: 'Amiral Battı | Ridsgames', game: 'Amiral Battı',
    setupSub: 'Gemilerini yerleştir, rakibin sularına ateş et, filosunu ilk sen batır.',

    exLbl: 'İsabet edince', ex: { 1: 'Tekrar atar', 0: 'Sıra geçer' }, exNote: { 1: 'Bir gemiyi vuran oyuncu bir kez daha ateş eder.', 0: 'Her atıştan sonra sıra rakibe geçer.' },
    ships: ['Uçak gemisi', 'Zırhlı', 'Kruvazör', 'Denizaltı', 'Muhrip'],

    fire: 'Sıra sende: rakip sularda bir kareye ateş et', cpuFire: 'Bilgisayar ateş ediyor…',
    miss: 'Iska', hit: (n) => `İsabet: ${n}!`, sunk: (n) => `${n} battı!`, cpuMiss: 'Bilgisayar ıskaladı', cpuHit: (n) => `Bilgisayar vurdu: ${n}!`, cpuSunk: (n) => `Bilgisayar ${n} batırdı!`,
    again1: ' Bir kez daha at.', badPlace: 'Buraya sığmıyor: gemiler birbirine değemez', badRot: 'Bu gemi burada döndürülemez',
    winT: 'Kazandın!', winS: 'Rakip filonun tamamını batırdın.', loseT: 'Filon battı', loseS: 'Bilgisayar tüm gemilerini buldu.',
    stShots: 'Atış', stAcc: 'İsabet oranı', stLeft: 'Ayakta kalan gemin', stCpu: 'Bilgisayarın atışı',
    rulesSub: 'İki filo, iki deniz. Rakibin gemilerini o seninkileri bulmadan batır.',
    ruleList: [
      ['🚢', 'Her iki tarafın da beş gemisi var: <b>uçak gemisi (5)</b>, <b>zırhlı (4)</b>, <b>kruvazör (3)</b>, <b>denizaltı (3)</b> ve <b>muhrip (2)</b>.'],
      ['🧭', 'Başlamadan önce gemilerini <b>sürükleyerek</b> yerleştir, döndürmek için üzerine <b>dokun</b>. Gemiler yan yana ya da köşe köşe değemez.'],
      ['🎯', 'Sıran gelince rakip sularda bir kareye ateş et. <b>Beyaz nokta</b> ıska, <b>ateş</b> isabet demektir. İsabette rakip <b>hangi gemiyi vurduğunu</b> söyler.'],
      ['💥', 'Bir geminin bütün kareleri vurulunca gemi <b>batar</b> ve çevresindeki kareler boş olarak işaretlenir.'],
      ['🔁', 'Ayarlarda açıksa isabet ettiren oyuncu <b>bir kez daha</b> ateş eder.'],
      ['🏆', 'Rakibin bütün gemilerini ilk batıran kazanır.']
    ] },
  en: { ...COMMON.en, title: 'Battleship | Ridsgames', game: 'Battleship',
    setupSub: 'Place your fleet, fire into enemy waters and sink their ships first.',
    lvLbl: 'Computer', lvNote: { kolay: 'Mostly fires at random.', orta: 'Searches around the ships it hits.', zor: 'Uses probabilities to fire at the most likely square.' },
    exLbl: 'After a hit', ex: { 1: 'Fire again', 0: 'Turn passes' }, exNote: { 1: 'A player who hits a ship fires once more.', 0: 'The turn passes after every shot.' },
    ships: ['Carrier', 'Battleship', 'Cruiser', 'Submarine', 'Destroyer'],
    capE: 'Enemy waters', capM: 'Your fleet', yourTurn: 'Your turn',
    placeT: 'Place your fleet', place: 'Drag ships to move them, tap to rotate', shuffle: '🔀 Shuffle', go: 'Start battle ⚓', newGame: 'New game',
    fire: 'Your turn: fire at a square in enemy waters', cpuFire: 'The computer is firing…',
    miss: 'Miss', hit: (n) => `Hit: ${n}!`, sunk: (n) => `${n} sunk!`, cpuMiss: 'The computer missed', cpuHit: (n) => `The computer hit your ${n.toLowerCase()}!`, cpuSunk: (n) => `The computer sank your ${n.toLowerCase()}!`,
    again1: ' Fire again.', badPlace: "It doesn't fit: ships may not touch", badRot: "This ship can't rotate here",
    winT: 'You win!', winS: 'You sank the whole enemy fleet.', loseT: 'Your fleet is sunk', loseS: 'The computer found all your ships.',
    stShots: 'Shots', stAcc: 'Accuracy', stLeft: 'Ships still afloat', stCpu: "Computer's shots",
    rulesSub: 'Two fleets, two seas. Sink the enemy ships before they find yours.',
    ruleList: [
      ['🚢', 'Each side has five ships: <b>carrier (5)</b>, <b>battleship (4)</b>, <b>cruiser (3)</b>, <b>submarine (3)</b> and <b>destroyer (2)</b>.'],
      ['🧭', 'Before the battle, <b>drag</b> your ships into place and <b>tap</b> one to rotate it. Ships may not touch, not even at the corners.'],
      ['🎯', 'On your turn fire at a square in enemy waters. A <b>white dot</b> is a miss, <b>fire</b> is a hit. On a hit you are told <b>which ship</b> you hit.'],
      ['💥', 'When every square of a ship is hit it <b>sinks</b>, and the squares around it are marked empty.'],
      ['🔁', 'If enabled in setup, a player who scores a hit <b>fires again</b>.'],
      ['🏆', 'The first to sink every enemy ship wins.']
    ] }
};
const T = () => STR[lang];
const N = 10, LENS = [5, 4, 3, 3, 2];
let setup = Object.assign({ level: 'orta', extra: 1 }, store.get('setup', {}));
if (!COMMON.tr.lv[setup.level]) setup.level = 'orta';
setup.extra = setup.extra ? 1 : 0;
let G = null, busy = false, epoch = 0, drag = null, newCells = { E: -1, M: -1 };

// ---------- Filo ----------
const cellsOf = (s) => Array.from({ length: s.n }, (_, k) => (s.r + (s.v ? k : 0)) * N + s.c + (s.v ? 0 : k));
function fits(ships, s, skip) {
  if (s.r < 0 || s.c < 0 || (s.v ? s.r + s.n : s.c + s.n) > N || (s.v ? s.c : s.r) >= N) return false;
  const mine = cellsOf(s);
  for (let j = 0; j < ships.length; j++) {
    if (j === skip) continue;
    for (const a of cellsOf(ships[j])) {
      const ar = Math.floor(a / N), ac = a % N;
      for (const b of mine) if (Math.abs(Math.floor(b / N) - ar) <= 1 && Math.abs(b % N - ac) <= 1) return false;
    }
  }
  return true;
}
function randomFleet() {
  for (;;) {
    const ships = []; let ok = true;
    for (const n of LENS) {
      let placed = false;
      for (let t = 0; t < 300 && !placed; t++) {
        const s = { n, v: Math.random() < 0.5, r: rnd(N), c: rnd(N), hits: 0 };
        if (fits(ships, s, -1)) { ships.push(s); placed = true; }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) return ships;
  }
}
const shipAt = (ships, i) => ships.findIndex((s) => cellsOf(s).includes(i));
const sunk = (s) => s.hits >= s.n;

// ---------- Atış ----------
function shoot(side, i) {
  // side 'E': ben rakibe; 'M': bilgisayar bana
  const shots = side === 'E' ? G.shotsE : G.shotsM, ships = side === 'E' ? G.cpu : G.me;
  if (shots[i]) return null;
  const k = shipAt(ships, i);
  if (k < 0) { shots[i] = 1; return { res: 'miss' }; }
  shots[i] = 2; ships[k].hits++;
  if (sunk(ships[k])) {
    for (const a of cellsOf(ships[k])) {
      const ar = Math.floor(a / N), ac = a % N;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const r = ar + dr, c = ac + dc; if (r < 0 || c < 0 || r >= N || c >= N) continue;
        if (!shots[r * N + c]) shots[r * N + c] = 3;
      }
    }
    return { res: 'sunk', k };
  }
  return { res: 'hit', k };
}
const allSunk = (ships) => ships.every(sunk);

// ---------- Yapay zekâ ----------
function openHits() {
  const out = [];
  for (let i = 0; i < N * N; i++) if (G.shotsM[i] === 2) { const k = shipAt(G.me, i); if (!sunk(G.me[k])) out.push(i); }
  return out;
}
const unknown = () => { const u = []; for (let i = 0; i < N * N; i++) if (!G.shotsM[i]) u.push(i); return u; };
const nb4 = (i) => { const r = Math.floor(i / N), c = i % N, o = []; if (r > 0) o.push(i - N); if (r < N - 1) o.push(i + N); if (c > 0) o.push(i - 1); if (c < N - 1) o.push(i + 1); return o; };
function targetCells(hits) {
  const sh = G.shotsM;
  if (hits.length >= 2) {
    const rows = new Set(hits.map((i) => Math.floor(i / N))), cols = new Set(hits.map((i) => i % N));
    const line = [];
    if (rows.size === 1) { const r = [...rows][0], cs = hits.map((i) => i % N); const lo = Math.min(...cs) - 1, hi = Math.max(...cs) + 1; if (lo >= 0) line.push(r * N + lo); if (hi < N) line.push(r * N + hi); }
    else if (cols.size === 1) { const c = [...cols][0], rs = hits.map((i) => Math.floor(i / N)); const lo = Math.min(...rs) - 1, hi = Math.max(...rs) + 1; if (lo >= 0) line.push(lo * N + c); if (hi < N) line.push(hi * N + c); }
    const l2 = line.filter((i) => !sh[i]); if (l2.length) return l2;
  }
  const s = new Set(); hits.forEach((h) => nb4(h).forEach((j) => { if (!sh[j]) s.add(j); }));
  return [...s];
}
function density(hits) {
  const sh = G.shotsM, d = new Float64Array(N * N), left = G.me.filter((s) => !sunk(s)).map((s) => s.n), hs = new Set(hits);
  for (const n of left) for (let v = 0; v < 2; v++) for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (v ? r + n > N : c + n > N) continue;
    let ok = true, cover = 0;
    for (let k = 0; k < n; k++) { const i = (r + (v ? k : 0)) * N + c + (v ? 0 : k); const x = sh[i]; if (x === 1 || x === 3 || (x === 2 && !hs.has(i))) { ok = false; break; } if (x === 2) cover++; }
    if (!ok) continue;
    if (hits.length && !cover) continue;
    const w = hits.length ? Math.pow(20, cover) : 1;
    for (let k = 0; k < n; k++) { const i = (r + (v ? k : 0)) * N + c + (v ? 0 : k); if (!sh[i]) d[i] += w; }
  }

}
function cpuPick() {
  const lv = G.level, hits = openHits(), un = unknown();
  if (lv === 'kolay') {
    if (hits.length && Math.random() < 0.55) { const t = targetCells(hits); if (t.length) return t[rnd(t.length)]; }
    return un[rnd(un.length)];
  }
  if (lv === 'orta') {
    if (hits.length) { const t = targetCells(hits); if (t.length) return t[rnd(t.length)]; }
    const par = un.filter((i) => (Math.floor(i / N) + i % N) % 2 === G.parity);
    const pool = par.length ? par : un; return pool[rnd(pool.length)];
  }
  const d = density(hits); let best = -1, pick = [];
  for (const i of un) { if (d[i] > best + 1e-9) { best = d[i]; pick = [i]; } else if (Math.abs(d[i] - best) < 1e-9) pick.push(i); }
  return pick.length ? pick[rnd(pick.length)] : un[rnd(un.length)];
}

// ---------- Akış ----------
function save() { if (G) store.set('game', G); }
function newGame() {
  closeAll();
  G = { level: setup.level, extra: setup.extra, phase: 'place', me: randomFleet(), cpu: randomFleet(), shotsE: Array(N * N).fill(0), shotsM: Array(N * N).fill(0), turn: 1, parity: rnd(2), st: { s: 0, h: 0, cs: 0, ch: 0 }, msg: null };
  epoch++; busy = false; drag = null; save(); layout(); render();
}
function startFromSetup() { store.set('setup', setup); newGame(); }
function again() { newGame(); }
function startBattle() {
  if (!G || G.phase !== 'place') return;
  G.phase = 'battle'; G.turn = 1; G.msg = null;
  sayac('basladi', 'oyun başladı');
  if (bitenVar) { bitenVar = false; sayac('tekrar', 'bitirdikten sonra yeni oyun'); }
  sayac(`mod/${G.level}-${G.extra ? 'tekrar' : 'sira'}`, `mod: ${G.level}, isabette ${G.extra ? 'tekrar atar' : 'sıra geçer'}`);
  Sfx.good(); save(); layout(); render();
}
function myShot(i) {
  if (!G || G.phase !== 'battle' || G.turn !== 1 || busy) return;
  Sfx.unlock();
  const r = shoot('E', i); if (!r) return;
  G.st.s++; if (r.res !== 'miss') G.st.h++;
  newCells.E = i; fx(r.res); const t = T();
  G.msg = { k: r.res, t: r.res === 'miss' ? t.miss : (r.res === 'hit' ? t.hit : t.sunk)(t.ships[r.k]), x: r.res !== 'miss' && G.extra };
  if (allSunk(G.cpu)) return finish(true);
  if (r.res === 'miss' || !G.extra) G.turn = 2;
  save(); render();
  if (G.turn === 2) cpuTurn();
}
function cpuTurn() {
  busy = true; render();
  const ep = epoch;
  setTimeout(() => {
    if (ep !== epoch || !G || G.phase !== 'battle') return;
    const i = cpuPick(), r = shoot('M', i);
    G.st.cs++; if (r.res !== 'miss') G.st.ch++;
    newCells.M = i; fx(r.res, true); const t = T();
    G.msg = { k: r.res, cpu: 1, t: r.res === 'miss' ? t.cpuMiss : (r.res === 'hit' ? t.cpuHit : t.cpuSunk)(t.ships[r.k]) };
    if (allSunk(G.me)) { busy = false; return finish(false); }
    if (r.res === 'miss' || !G.extra) { G.turn = 1; busy = false; save(); render(); }
    else { save(); render(); cpuTurn(); }
  }, REDUCED ? 250 : (G.msg && G.msg.cpu ? 700 : 650));
}
function fx(res, cpu) {
  if (res === 'miss') Sfx.tone(cpu ? 220 : 260, 140, 0.1, 0.05, 'sine', 0.18);
  else if (res === 'hit') { Sfx.tone(cpu ? 140 : 180, 90, 0.16, 0.12, 'sawtooth', 0.22); buzz(cpu ? 40 : 20); }
  else { Sfx.tone(110, 60, 0.2, 0.15, 'sawtooth', 0.5); buzz([30, 40, 60]); }
}
function finish(won) {
  G.phase = 'over'; G.won = won; save(); render();
  bitenVar = true; sayac('bitti', 'oyun bitti');
  sayac(`sonuc/${won ? 'insan' : 'bilgisayar'}-${G.level}`, `sonuç (${G.level})`);
  const t = T(), ep = epoch;
  setTimeout(() => {
    if (ep !== epoch) return;

<script id="fitSetupJs">
(() => {
  const ov = document.getElementById('setupOv'); const c = ov && ov.querySelector(':scope > .card, :scope > .card2'); if (!c) return;
  const over = () => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1;
  let busy = false, q = 0;
  const fit = () => {
    if (ov.hidden || busy) return; busy = true;
    c.classList.remove('fz1', 'fz2', 'fz3', 'fzc', 'fzn'); c.style.removeProperty('--fcols');
    if (over()) {
      const land = innerWidth > innerHeight && innerWidth >= 560;
      const cols = (n) => () => { c.classList.add('fzc'); c.style.setProperty('--fcols', n); };
      const nw = () => c.classList.add('fzn'), steps = [() => c.classList.add('fz1')];
      if (land) steps.push(cols(2), cols(3), () => c.classList.add('fz2'), nw);
      else steps.push(() => c.classList.add('fz2'));
      if (land && innerWidth >= 760) steps.push(cols(4));
      if (!land && innerWidth >= 340) steps.push(cols(2), nw);
      steps.push(() => c.classList.add('fz3'));
      if (land && innerWidth >= 640 && innerWidth < 760) steps.push(cols(4));
      for (const s of steps) { s(); if (!over()) break; }
    }
    busy = false;
  };
  const later = () => { cancelAnimationFrame(q); q = requestAnimationFrame(fit); };
  new MutationObserver(later).observe(ov, { attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true, characterData: true });
  addEventListener('resize', later); addEventListener('orientationchange', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
  later();
})();

  html.rgSet #topHeader > div { max-width: 560px; gap: 10px; padding: 14px 18px; } html.rgSet #topHeader #homeLink { flex-direction: row; } html.rgSet #topHeader #homeLink + div { grid-template-columns: 1fr 1fr; } html.rgSet #topHeader #modeSelect { grid-column: 1 / -1; height: 40px; } html.rgSet #topHeader #homeLink + div > button { height: 42px; } html.rgSet #topHeader .rgClose { height: 40px; } }
</style>
<script id="rgRepJs">
(() => {
  const MAIL = 'destek@ridsgames.com', H = document.documentElement, errs = window.__rgErr || [];
  const T = {
    tr: { b: 'Sorun bildir', h: 'Sorun bildir', p: 'Ne oldu? Kısaca yazın. Gönder deyince e-posta uygulamanız hazır bir mesajla açılır, siz göndermeden hiçbir şey bize ulaşmaz.', ph: 'Örnek: Kartı oynadığımda oyun takıldı.', inf: 'Mesaja eklenecek bilgiler', send: 'E-posta ile gönder', copy: 'Kopyala', close: 'Kapat', copied: 'Kopyalandı. ' + MAIL + ' adresine gönderebilirsiniz.', nocopy: 'Kopyalanamadı. Metni seçip kopyalayın ve ' + MAIL + ' adresine gönderin.', subj: 'Sorun bildirimi', game: 'Oyun', page: 'Sayfa', lang: 'Dil', scr: 'Ekran', br: 'Tarayıcı', time: 'Zaman', err: 'Son hatalar', none: 'yok', desc: 'Açıklama' },
    en: { b: 'Report a problem', h: 'Report a problem', p: 'What happened? Write a few words. Send opens your email app with a ready message; nothing reaches us unless you send it.', ph: 'Example: the game froze when I played a card.', inf: 'Details added to the message', send: 'Send by email', copy: 'Copy', close: 'Close', copied: 'Copied. You can send it to ' + MAIL + '.', nocopy: 'Could not copy. Select the text, copy it and send it to ' + MAIL + '.', subj: 'Problem report', game: 'Game', page: 'Page', lang: 'Language', scr: 'Screen', br: 'Browser', time: 'Time', err: 'Recent errors', none: 'none', desc: 'Description' }
  };
  const t = () => T[(H.lang || 'tr').startsWith('en') ? 'en' : 'tr'];
  const gname = () => { const g = document.getElementById('gameName') || document.querySelector('#homeLink .gname'); return ((g && g.textContent) || document.title || '').replace(/\s*[|·–-]\s*Ridsgames.*$/i, '').trim(); };
  const info = () => { const l = t(), so = screen.orientation && screen.orientation.type;
    return [`${l.game}: ${gname()}`, `${l.page}: ${location.pathname}`, `${l.lang}: ${H.lang || '-'}`,
      `${l.scr}: ${innerWidth}x${innerHeight} @${Math.round((devicePixelRatio || 1) * 100) / 100}x${so ? ' ' + so : ''}${matchMedia('(pointer: coarse)').matches ? ' touch' : ''}`,
      `${l.br}: ${navigator.userAgent}`, `${l.time}: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
      `${l.err}: ${errs.length ? '' : l.none}`, ...errs.slice(-3).reverse().map((e) => `- ${e.t} ${e.m} @ ${e.src}`)].join('\n'); };
  let ov = null;
  const body = () => { const l = t(), d = ov.querySelector('textarea').value.trim(); return `${l.desc}:\n${d || '-'}\n\n---\n${info()}`; };
  const build = () => {
    ov = document.createElement('div'); ov.id = 'rgRep'; ov.hidden = true;
    ov.innerHTML = '<div class="rc" role="dialog" aria-modal="true" aria-labelledby="rgRepH"><h2 id="rgRepH"></h2><p class="pp"></p><textarea maxlength="1200"></textarea><details><summary></summary><pre></pre></details><div class="ok" role="status"></div><div class="rb"><button type="button" class="go"></button><button type="button" class="cp"></button><button type="button" class="cl"></button></div></div>';
    document.body.appendChild(ov);
    const q = (s) => ov.querySelector(s), close = () => { ov.hidden = true; };
    q('.cl').onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ['keydown', 'keyup', 'keypress'].forEach((k) => ov.addEventListener(k, (e) => { e.stopPropagation(); if (k === 'keydown' && e.key === 'Escape') close(); }));
    ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'contextmenu'].forEach((k) => ov.addEventListener(k, (e) => e.stopPropagation(), { passive: true }));
    q('.go').onclick = () => { const l = t(); let b = body(); if (b.length > 1400) b = b.slice(0, 1400) + '…';
      location.href = `mailto:${MAIL}?subject=${encodeURIComponent(`${l.subj}: ${gname()}`)}&body=${encodeURIComponent(b)}`; };
    q('.cp').onclick = () => { const l = t(), b = `${l.subj}: ${gname()}\n\n${body()}`, ok = q('.ok');
      const fb = () => { const a = document.createElement('textarea'); a.value = b; a.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; ov.appendChild(a); a.select(); let r = false; try { r = document.execCommand('copy'); } catch (_) {} a.remove(); ok.textContent = r ? l.copied : l.nocopy; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b).then(() => { ok.textContent = l.copied; }, fb); else fb(); };
  };
  const open = () => { if (!ov) build(); const l = t(), q = (s) => ov.querySelector(s);
    q('h2').textContent = l.h; q('.pp').textContent = l.p; q('textarea').placeholder = l.ph; q('summary').textContent = l.inf; q('pre').textContent = info();
    q('.go').textContent = l.send; q('.cp').textContent = l.copy; q('.cl').textContent = l.close; q('.ok').textContent = '';
    ov.hidden = false; setTimeout(() => q('textarea').focus({ preventScroll: true }), 30); };
  // Menüye satır ekle: Kurallar düğmesinin görünüşünü kopyalar
  const ICO = '✉';
  let btn = null;
  const label = () => { if (!btn) return; const l = t(); btn.setAttribute('aria-label', l.b); btn.title = l.b; const s = btn.querySelector('.rgRepL'); if (s) s.textContent = l.b; };
  const mount = () => {
    const rules = document.getElementById('rulesBtn'), lang = document.getElementById('langBtn');
    btn = document.createElement('button'); btn.type = 'button'; btn.id = 'rgRepBtn';
    if (rules && lang && rules.parentNode === lang.parentNode) {
      btn.className = rules.className; const sp = [...rules.children].filter((x) => x.tagName === 'SPAN');
      const a = document.createElement('span'); a.textContent = ICO; if (sp[0]) a.className = sp[0].className; btn.appendChild(a);
      if (sp[1]) { const b = document.createElement('span'); b.className = (sp[1].className + ' rgRepL').trim(); btn.appendChild(b); }
      lang.parentNode.insertBefore(btn, lang);
    } else {
      const host = document.getElementById('btn-reset-from-settings'), menu = document.getElementById('menu');
      const s = document.createElement('span'); s.className = 'rgRepL'; btn.append(ICO + ' ', s);
      if (host) { btn.className = host.className; host.parentNode.insertBefore(btn, host); }
      else if (menu) { btn.style.cssText = 'background:none;border:0;box-shadow:none;color:inherit;opacity:.75;font-size:13px;text-decoration:underline;margin-top:10px;min-height:0;padding:4px'; menu.appendChild(btn); }
      else { btn = null; return; }
    }
    btn.addEventListener('click', () => setTimeout(open, 0));
    label(); new MutationObserver(label).observe(H, { attributes: true, attributeFilter: ['lang'] });
  };
  window.rgReport = () => open();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
