<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mayın Tarlası | Ridsgames</title>
<meta name="description" content="Mayın Tarlası: mayınlara basmadan bütün kareleri aç. Sayılar çevredeki mayınları gösterir; bayrak dik, radarla güvenli kare bul, rekor süreni kovala.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --glow: rgba(251, 191, 36, 0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--glow) 28%, transparent) 0%, transparent 62%), radial-gradient(ellipse at 50% 100%, #111a2c 0%, var(--bg) 70%), var(--bg);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı: sayaçlar, saha, alt düğmeler */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.hud {
  flex: none; width: 100%; max-width: 520px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px 10px; padding: 8px 12px 8px;
  border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px);
}
.cnt { display: flex; align-items: center; gap: 7px; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .04em; color: #fecaca; }
.cnt.r { justify-content: flex-end; color: #bae6fd; }
.cnt .i { font-size: 19px; letter-spacing: 0; }
.cnt output { min-width: 3ch; padding: 1px 8px; border-radius: 8px; background: rgba(0, 0, 0, .45); box-shadow: inset 0 1px 4px rgba(0, 0, 0, .6); text-align: center; text-shadow: 0 0 8px currentColor; }
#face {
  width: 50px; height: 50px; border-radius: 14px; font-size: 28px; line-height: 1; display: grid; place-items: center; padding: 0;
  background: linear-gradient(180deg, #1e293b, #0f172a); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 4px 12px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .08);
  transition: transform .08s;
}
#face:active { transform: translateY(2px) scale(.96); }
#hudInfo { grid-column: 1 / -1; text-align: center; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#boardWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
canvas#board { display: block; touch-action: none; cursor: pointer; border-radius: 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, .55), 0 0 36px color-mix(in srgb, var(--glow) 35%, transparent); }
.ctrl { flex: none; width: 100%; max-width: 520px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.ctrl .seg { height: 52px; }
.ctrl .seg button { height: 44px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
#radarBtn {
  height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(52, 211, 153, .55); background: linear-gradient(180deg, rgba(6, 78, 59, .85), rgba(2, 44, 34, .95));
  color: #d1fae5; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0, 0, 0, .35);
}
#radarBtn b { min-width: 22px; height: 22px; border-radius: 999px; display: inline-grid; place-items: center; background: #34d399; color: #022c22; font-size: 13px; font-weight: 800; }
#radarBtn:disabled { filter: grayscale(.8) brightness(.7); cursor: default; }
#radarBtn:active:not(:disabled) { transform: translateY(1px); }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 64px 16px 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg.tall button { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.seg.tall small { font-size: 11px; font-weight: 600; opacity: .75; white-space: nowrap; }
.seg.tall .em { font-size: 19px; }
.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.custom { display: grid; gap: 6px; margin-top: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px 44px; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
.mrow button { height: 44px; border-radius: 12px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 24px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.mrow button:disabled { opacity: .35; cursor: default; }
.mrow output { text-align: center; font-size: 24px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.score { text-align: center; font-size: 44px; font-weight: 800; line-height: 1; margin: 2px 0 14px; color: #fde68a; font-variant-numeric: tabular-nums; }
.score.lost { color: #fca5a5; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .b { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; top: 64px; z-index: 15; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-height: 640px) and (orientation: portrait) { main { gap: 6px; padding-top: 6px; padding-bottom: 8px; } #face { width: 44px; height: 44px; font-size: 24px; } .cnt { font-size: 21px; } .ctrl .seg, #radarBtn { height: 46px; } .ctrl .seg button { height: 38px; } }
@media (max-width: 360px) { .ctrl .seg button .t, #radarBtn .t { display: none; } }

/* Yatay ekran: saha solda tam yükseklikte, sayaçlar ve düğmeler sağ sütunda (düğmeler başparmak hizasında, altta) */
@media (orientation: landscape) {
  main { width: 100%; max-width: 72rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) clamp(190px, 24vw, 270px); grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px 14px; }
  .hud { grid-column: 2; grid-row: 1; max-width: none; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); padding: 10px; }
  .cnt { flex-direction: column; gap: 2px; font-size: 21px; }
  .cnt.r { justify-content: center; }
  #hudInfo { white-space: normal; line-height: 1.4; }
  #boardWrap { grid-column: 1; grid-row: 1 / -1; height: 100%; }
  .ctrl { grid-column: 2; grid-row: 3; max-width: none; grid-template-columns: 1fr; }
}
/* Yatay telefon: üst çubuk soldaki dikey menü paneli olur; pencereler menü panelini örtmez; alt bilgi gizli */
@media (orientation: landscape) and (max-height: 500px) {
  body { display: grid; grid-template-columns: clamp(120px, 17vw, 160px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .top { grid-column: 1; grid-row: 1; border-bottom: 0; border-right: 1px solid rgba(30, 41, 59, .8); overflow-y: auto; }
  .top .in { height: auto; min-height: 100%; max-width: none; flex-direction: column; justify-content: center; padding: 14px 8px; gap: 16px; }
  .logo { flex-direction: column; gap: 6px; }
  .gname { display: inline; font-size: 11px; white-space: nowrap; }
  .tools { flex-wrap: wrap; justify-content: center; gap: 8px; }
  .pill { white-space: nowrap; }
  main { grid-column: 2; grid-row: 1; grid-template-columns: minmax(0, 1fr) clamp(170px, 26vw, 230px); gap: 8px 10px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 6px; }
  .hud { padding: 8px; gap: 4px 6px; }
  #face { width: 44px; height: 44px; font-size: 24px; }
  .cnt { font-size: 18px; } .cnt .i { font-size: 15px; }
  #hudInfo { font-size: 11.5px; }
  .ctrl .seg, #radarBtn { height: 46px; } .ctrl .seg button { height: 38px; font-size: 14px; }
  body > .ov { padding: 8px 8px 8px calc(clamp(120px, 17vw, 160px) + 8px); }
  .toast { top: 12px; left: calc(50% + clamp(120px, 17vw, 160px) / 2); }
  footer { display: none; }
  /* Kurulum penceresi iki sütun; Başla düğmesi kaydırınca da altta görünür kalır */
  #setupOv .card { max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; align-content: start; padding: 14px 18px 0; }
  #setupOv h2, #setupOv .sub, #setupOv .btns { grid-column: 1 / -1; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 4px; }
  #setupOv .sec { margin-top: 8px; padding-top: 8px; }
  #setupOv .btns { position: sticky; bottom: 0; z-index: 1; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 8px -18px 0; padding: 10px 18px 14px; background: linear-gradient(180deg, rgba(11, 18, 32, 0), #0b1220 30%); }
  #winOv .card { max-width: 560px; padding: 14px 18px 16px; }
  #winOv .trophy { font-size: 38px; } #winOv .score { font-size: 34px; margin-bottom: 8px; } #winOv .sub { margin-bottom: 8px; }
  #winOv .rank { grid-template-columns: 1fr 1fr; }
  #winOv .btns { grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 10px; }
}
</style>
<!-- Ziyaret sayacı (GoatCounter): çerez kullanmaz; ?lang= gibi ekler aynı sayfa sayılır -->
<script>window.goatcounter = { path: (p) => p.split('?')[0] || '/' };</script>
<script data-goatcounter="https://ridsgames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<!-- Etkin süre, yeni ziyaret ve hata kaydı (ortak) -->
<script src="../assets/olcum.js" data-page="mayin-tarlasi" data-name="Mayın Tarlası"></script>
</head>
<body>
<header class="top">
  <div class="in">
    <a id="homeLink" class="logo" href="../" aria-label="Ridsgames ana sayfa">
      <img src="../assets/logo.webp" alt="Ridsgames" width="112" height="52">
      <span class="gname" id="gameName">Mayın Tarlası</span>
    </a>
    <div class="tools">
      <button id="menuBtn" class="pill" type="button" aria-label="Yeni oyun"><span class="ico">☰</span><span class="lbl" id="menuLbl">Yeni oyun</span></button>
      <button id="soundBtn" class="pill" type="button" aria-label="Ses"><span class="ico" id="soundIco">🔊</span></button>
      <button id="rulesBtn" class="pill" type="button" aria-label="Kurallar"><span class="ico">?</span><span class="lbl" id="rulesLbl">Kurallar</span></button>
      <button id="fsBtn" class="pill" type="button" aria-label="Tam ekran"><span class="ico">⛶</span></button>
      <button id="langBtn" class="pill lang" type="button" aria-label="Dil / Language">TR | EN</button>
    </div>
  </div>
</header>

<main>
  <div class="hud" id="hud">
    <div class="cnt" id="minesBox"><span class="i">💣</span><output id="minesLeft">010</output></div>
    <button id="face" type="button" aria-label="Yeni oyun">😎</button>
    <div class="cnt r" id="timeBox"><span class="i">⏱️</span><output id="timeVal">000</output></div>
    <div id="hudInfo"></div>
  </div>
  <div id="boardWrap"><canvas id="board" role="img" aria-label="Mayın tarlası"></canvas></div>
  <div class="ctrl">
    <div class="seg two" id="modeSeg"><button type="button" data-m="reveal"><span>⛏️</span><span class="t" id="digLbl">Kaz</span></button><button type="button" data-m="flag"><span>🚩</span><span class="t" id="flagLbl">Bayrak</span></button></div>
    <button id="radarBtn" type="button"><span>📡</span><span class="t" id="radarLbl">Radar</span><b id="radarN">3</b></button>
  </div>
</main>

<footer>© 2026 Ridsgames. <span id="rights">Tüm hakları saklıdır.</span></footer>
<div class="toast" id="toast" role="status"></div>

<!-- Yeni oyun -->
<div class="ov" id="setupOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Mayın Tarlası</h2>
    <p class="sub" id="setupSub"></p>
    <div class="sec">
      <div class="lbl" id="lvLbl"></div>
      <div class="seg four tall" id="lvSeg">
        <button type="button" data-l="kolay"><span></span><small>9×9 · 10</small></button>
        <button type="button" data-l="orta"><span></span><small>16×16 · 40</small></button>
        <button type="button" data-l="zor"><span></span><small>22×16 · 75</small></button>
        <button type="button" data-l="ozel"><span></span><small id="ozelSmall"></small></button>
      </div>
      <div class="custom" id="customBox">
        <div class="mrow"><span id="cLLbl"></span><button type="button" data-k="L" data-d="-1" aria-label="−1">−</button><output id="cL"></output><button type="button" data-k="L" data-d="1" aria-label="+1">+</button></div>
        <div class="mrow"><span id="cSLbl"></span><button type="button" data-k="S" data-d="-1" aria-label="−1">−</button><output id="cS"></output><button type="button" data-k="S" data-d="1" aria-label="+1">+</button></div>
        <div class="mrow"><span id="cMLbl"></span><button type="button" data-k="M" data-d="-1" aria-label="−1">−</button><output id="cM"></output><button type="button" data-k="M" data-d="1" aria-label="+1">+</button></div>
      </div>
      <div class="note" id="lvNote"></div>
    </div>
    <div class="sec">
      <div class="lbl" id="themeLbl"></div>
      <div class="seg five tall" id="themeSeg"></div>
    </div>
    <div class="btns">
      <button class="big" id="startBtn" type="button">Başla</button>
      <button class="big alt" id="backBtn" type="button">Oyuna dön</button>
    </div>
  </div>
</div>

<!-- Kurallar -->
<div class="ov" id="rulesOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle">Nasıl oynanır?</h2>
    <p class="sub" id="rulesSub"></p>
    <ul class="rules" id="rulesList"></ul>
    <div class="btns"><button class="big" id="rulesOk" type="button">Tamam</button></div>
  </div>
</div>

<!-- Oyun sonu -->
<div class="ov" id="winOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="trophy" id="winIco">🏆</div>
    <h2 id="winTitle"></h2>
    <p class="sub" id="winSub"></p>
    <div class="score" id="winScore"></div>
    <ol class="rank" id="statList"></ol>
    <div class="btns">
      <button class="big" id="againBtn" type="button">Tekrar oyna</button>
      <button class="big alt" id="viewBtn" type="button">Tahtaya bak</button>
      <button class="big alt" id="toMenuBtn" type="button">Ayarları değiştir</button>
    </div>
  </div>
</div>

<script>
// ---------- Dil ----------
const STR = {
  tr: {
    title: 'Mayın Tarlası | Ridsgames', homeLabel: 'Ridsgames ana sayfa', game: 'Mayın Tarlası', newGame: 'Yeni oyun', rules: 'Kurallar', sound: 'Ses', fs: 'Tam ekran', langLabel: 'Dil değiştir', rights: 'Tüm hakları saklıdır.',
    setupSub: 'Zorluğu ve temayı seç. İlk dokunuşun her zaman güvenli.', lvLbl: 'Zorluk', themeLbl: 'Tema',
    lv: { kolay: 'Kolay', orta: 'Orta', zor: 'Zor', ozel: 'Özel' }, longSide: 'Uzun kenar', shortSide: 'Kısa kenar', minesLbl: 'Mayın',

  if (gameState === 'won' && !REDUCED && now - fireworkAt > 950 && now - tEnd < 12000) {
    fireworkAt = now;
    const fx = pad + Math.random() * cols * tile, fy = pad + Math.random() * rows * tile;
    spawnParticles(fx, fy, th.glowAccent, 16, 0.9); spawnParticles(fx, fy, '#fde047', 14, 0.85);
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.x += d.vx * k; d.y += d.vy * k; d.vy += 0.18 * k; d.rot += d.vRot * k; d.alpha *= Math.pow(0.94, k);
    if (d.alpha <= 0.04) { debris.splice(i, 1); continue; }
    g.save(); g.globalAlpha = d.alpha; g.translate(d.x, d.y); g.rotate(d.rot); g.fillStyle = d.col; g.strokeStyle = d.border; g.lineWidth = 1;
    g.fillRect(-d.size / 2, -d.size / 2, d.size, d.size * 0.75); g.strokeRect(-d.size / 2, -d.size / 2, d.size, d.size * 0.75); g.restore();
  }

  }

    const p = particles[i]; p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.11 * k; p.alpha *= Math.pow(0.935, k);
    if (p.alpha <= 0.04) { particles.splice(i, 1); continue; }

    g.beginPath(); g.arc(p.x, p.y, p.rad, 0, TAU); g.fill(); g.restore();
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i]; f.y -= 1.15 * k; f.alpha *= Math.pow(0.96, k);
    if (f.alpha <= 0.04) { floatTexts.splice(i, 1); continue; }
    g.save(); g.globalAlpha = f.alpha; g.font = `800 ${Math.round(13 * f.scale)}px Inter, system-ui, sans-serif`; g.fillStyle = f.color; g.textAlign = 'center';
    g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 6; g.fillText(f.text, clamp(f.x, 60, cssW - 60), Math.max(16, f.y)); g.restore();
  }
  if (!REDUCED) {
    g.fillStyle = th.ambientColor;
    for (const m of motes) {
      m.x += m.vx * k; m.y += m.vy * k;
      if (m.y < 6) m.y = cssH - 6; if (m.x < 6) m.x = cssW - 6; if (m.x > cssW - 6) m.x = 6;
      g.globalAlpha = m.alpha * 0.55 * (0.6 + 0.4 * Math.sin(now * 0.003 + m.ph)); g.beginPath(); g.arc(m.x, m.y, m.r, 0, TAU); g.fill();
    }

  }
  if (flash > 0.01) { rrect(g, 0, 0, cssW, cssH, 16); g.fillStyle = `rgba(248, 113, 113, ${flash.toFixed(3)})`; g.fill(); flash *= Math.pow(0.86, k); }
  g.restore();
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!board.length) return;
  draw(now); renderHud(now);
}

// ---------- Arayüz ----------
let toastT = null;
function toast(s, color) {
  const el = $('toast'); el.textContent = s; el.style.borderColor = color || 'var(--cyan)'; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1700);
}
function closeAll() { for (const id of ['setupOv', 'rulesOv', 'winOv']) $(id).hidden = true; }
const hudCache = {};
const setText = (id, s) => { if (hudCache[id] !== s) { hudCache[id] = s; $(id).textContent = s; } };
function renderHud(now) {
  if (!G) return;
  setText('minesLeft', pad3(totalMines - flagsPlaced));
  setText('timeVal', pad3(Math.floor(elapsedDs() / 10)));
  setText('face', gameState === 'lost' ? '💥' : gameState === 'won' ? '🏆' : (pressFace || now < faceUntil) ? '😮' : '😎');
}
function render() {
  if (!G) return;
  const t = T(), b = best[G.key];
  let info = t.info(t.lv[G.lvl], cols, rows, totalMines);
  if (b) info += ` · ${t.best} ${fmtTime(b)}`;
  if (gameState === 'ready') info += ` · ${t.firstSafe}`;
  else if (gameState === 'won' || gameState === 'lost') info = `${t.tapFace} · ${info}`;
  setText('hudInfo', info);
  $('radarN').textContent = hints;
  $('radarBtn').disabled = hints <= 0 || gameState === 'won' || gameState === 'lost';
  segPress('modeSeg', 'm', inputMode);
  renderHud(performance.now());
}
const segPress = (id, attr, val) => document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute('aria-pressed', b.dataset[attr] === String(val)));
function renderSetup() {
  const t = T(), s = setup, [L, S, M] = levelDims(s);
  segPress('lvSeg', 'l', s.lvl); segPress('themeSeg', 'th', s.theme);
  $('customBox').hidden = s.lvl !== 'ozel';
  $('ozelSmall').textContent = `${s.L}×${s.S} · ${s.M}`;
  $('cL').textContent = s.L; $('cS').textContent = s.S; $('cM').textContent = s.M;
  const mm = maxMines(s.L, s.S);
  for (const b of document.querySelectorAll('#customBox button')) {
    const k = b.dataset.k, d = +b.dataset.d, v = s[k];
    b.disabled = k === 'L' ? (d < 0 ? v <= Math.max(LIM.L[0], s.S) : v >= LIM.L[1]) : k === 'S' ? (d < 0 ? v <= LIM.S[0] : v >= Math.min(LIM.S[1], s.L)) : (d < 0 ? v <= 5 : v >= mm);
  }
  $('lvNote').textContent = t.lvNote(L, S, M, Math.round(M / (L * S) * 100));
}
function openSetup() { renderSetup(); closeAll(); $('setupOv').hidden = false; $('startBtn').focus({ preventScroll: true }); }
function applyTheme() {
  const th = TH();
  document.documentElement.style.setProperty('--glow', th.ambientColor);
  layerDirty = true;
}
function applyLang() {
  const t = T();
  document.documentElement.lang = lang; document.title = t.title;
  $('homeLink').href = '../?lang=' + lang; $('homeLink').setAttribute('aria-label', t.homeLabel);
  $('gameName').textContent = t.game; $('menuLbl').textContent = t.newGame; $('rulesLbl').textContent = t.rules;
  $('menuBtn').setAttribute('aria-label', t.newGame); $('rulesBtn').setAttribute('aria-label', t.rules); $('soundBtn').setAttribute('aria-label', t.sound); $('fsBtn').setAttribute('aria-label', t.fs); $('langBtn').setAttribute('aria-label', t.langLabel);
  $('face').setAttribute('aria-label', t.newGame);
  $('rights').textContent = t.rights; $('setupTitle').textContent = t.game; $('setupSub').textContent = t.setupSub;
  $('lvLbl').textContent = t.lvLbl; $('themeLbl').textContent = t.themeLbl;
  document.querySelectorAll('#lvSeg button').forEach((b) => { b.firstElementChild.textContent = t.lv[b.dataset.l]; });
  $('cLLbl').textContent = t.longSide; $('cSLbl').textContent = t.shortSide; $('cMLbl').textContent = t.minesLbl;
  $('themeSeg').innerHTML = THEMES.map((th, i) => `<button type="button" data-th="${i}"><span class="em">${th.icon}</span><small>${t.themes[i]}</small></button>`).join('');
  $('startBtn').textContent = t.start; $('backBtn').textContent = t.back;
  $('digLbl').textContent = t.dig; $('flagLbl').textContent = t.flag; $('radarLbl').textContent = t.radar;
  $('rulesTitle').textContent = t.rulesTitle; $('rulesSub').textContent = t.rulesSub; $('rulesOk').textContent = t.ok;
  $('rulesList').innerHTML = t.ruleList.map(([i, s]) => `<li><span>${i}</span><span>${s}</span></li>`).join('');
  $('againBtn').textContent = t.again; $('viewBtn').textContent = t.view; $('toMenuBtn').textContent = t.toMenu;
  cv.setAttribute('aria-label', t.board);

}
function applySound() { $('soundIco').textContent = soundOn ? '🔊' : '🔇'; $('soundBtn').setAttribute('aria-pressed', soundOn); }

// ---------- Dokunma, fare, klavye ----------
// Dokun: seçili mod (kaz ya da bayrak). Basılı tut: öteki mod. Açık sayıya dokun: hızlı açılış. Fare: sağ tık bayrak, orta tık hızlı açılış
function cellAt(e) {
  const rc = cv.getBoundingClientRect(), x = e.clientX - rc.left - pad, y = e.clientY - rc.top - pad;
  const c = Math.floor(x / tile), r = Math.floor(y / tile);
  return inB(r, c) ? { r, c } : null;
}
let press = null;
const cancelPress = () => { if (press) clearTimeout(press.timer); press = null; pressFace = false; };
cv.addEventListener('pointerdown', (e) => {
  Sfx.unlock(); keyboardActive = false;
  const pos = cellAt(e);
  if (e.pointerType === 'mouse' && e.button === 2) { if (pos) act(pos.r, pos.c, 'flag'); return; }
  if (e.pointerType === 'mouse' && e.button === 1) { e.preventDefault(); if (pos && board[pos.r][pos.c].isRevealed) act(pos.r, pos.c, 'reveal'); return; }
  if (e.button > 0) return;
  if (press) { cancelPress(); return; } // ikinci parmak: ikisi de sayılmaz
  if (!pos || gameState === 'won' || gameState === 'lost') return;
  const cell = board[pos.r][pos.c];
  press = { id: e.pointerId, r: pos.r, c: pos.c, x: e.clientX, y: e.clientY, done: false, timer: 0 };
  pressFace = !cell.isRevealed;
  if (!cell.isRevealed) press.timer = setTimeout(() => {
    if (!press) return;
    press.done = true; pressFace = false;
    act(press.r, press.c, inputMode === 'flag' ? 'reveal' : 'flag');
  }, 420);
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') { const pos = cellAt(e); hoverCell = pos; keyboardActive = false; }
  if (press && press.id === e.pointerId && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) cancelPress();
});
cv.addEventListener('pointerup', (e) => {
  if (!press || press.id !== e.pointerId) return;
  const p = press; cancelPress();
  if (!p.done) act(p.r, p.c, inputMode);
});
cv.addEventListener('pointercancel', cancelPress);
cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { hoverCell = null; cancelPress(); } });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
const anyOpen = () => !$('setupOv').hidden || !$('rulesOv').hidden || !$('winOv').hidden;
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!$('rulesOv').hidden) $('rulesOv').hidden = true;
    else if (!$('winOv').hidden || !$('setupOv').hidden) closeAll();
    return;
  }
  if (anyOpen() || e.ctrlKey || e.metaKey || e.altKey) return;
  const a = document.activeElement, onBtn = a && a !== document.body && a.tagName === 'BUTTON';
  const mv = { ArrowUp: [-1, 0], KeyW: [-1, 0], ArrowDown: [1, 0], KeyS: [1, 0], ArrowLeft: [0, -1], KeyA: [0, -1], ArrowRight: [0, 1], KeyD: [0, 1] }[e.code];
  if (mv) {
    e.preventDefault(); if (onBtn) a.blur();
    if (keyboardActive) cursorCell = { r: (cursorCell.r + mv[0] + rows) % rows, c: (cursorCell.c + mv[1] + cols) % cols };
    keyboardActive = true; return;
  }
  if ((e.code === 'Space' || e.code === 'Enter') && !onBtn) { e.preventDefault(); Sfx.unlock(); keyboardActive = true; act(cursorCell.r, cursorCell.c, inputMode); }
  else if (e.code === 'KeyF') { const tg = keyboardActive ? cursorCell : hoverCell; if (tg) { Sfx.unlock(); act(tg.r, tg.c, 'flag'); } }
  else if (e.code === 'KeyR' && !e.repeat) { Sfx.unlock(); Sfx.click(); newGame(); }
});
$('face').addEventListener('click', () => { Sfx.unlock(); Sfx.click(); newGame(); });
$('modeSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-m]'); if (b) { inputMode = b.dataset.m; Sfx.click(); render(); } });
$('radarBtn').addEventListener('click', () => { Sfx.unlock(); useRadar(); });
$('lvSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-l]'); if (b) { setup.lvl = b.dataset.l; renderSetup(); } });
$('themeSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-th]'); if (b) { setup.theme = +b.dataset.th; saveSetup(); applyTheme(); renderSetup(); } });
// Özel saha: dokun bir adım, basılı tut hızlı değişsin
let holdT = null;
function stepBy(k, d) {
  const s = setup;
  if (k === 'L') s.L = clamp(s.L + d, Math.max(LIM.L[0], s.S), LIM.L[1]);
  else if (k === 'S') s.S = clamp(s.S + d, LIM.S[0], Math.min(LIM.S[1], s.L));

  renderSetup();
}
const endHold = () => { clearTimeout(holdT); holdT = null; };
for (const b of document.querySelectorAll('#customBox button')) {
  const k = b.dataset.k, d = +b.dataset.d;
  b.addEventListener('pointerdown', (e) => { if (e.button > 0) return; e.preventDefault(); stepBy(k, d); endHold(); holdT = setTimeout(function rep() { stepBy(k, d); holdT = setTimeout(rep, 70); }, 420); });
  b.addEventListener('click', (e) => { if (e.detail === 0) stepBy(k, d); });

}
addEventListener('pointerup', endHold);
$('startBtn').addEventListener('click', () => { Sfx.unlock(); saveSetup(); newGame(); });
$('backBtn').addEventListener('click', closeAll);

$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; });

$('againBtn').addEventListener('click', () => { Sfx.unlock(); newGame(); });
$('viewBtn').addEventListener('click', closeAll);
$('toMenuBtn').addEventListener('click', openSetup);

// Tam ekran: desteklemeyen tarayıcıda (iPhone Safari) düğme gizlenir
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;

  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
addEventListener('resize', () => layout());

  get state() { return gameState; }, get board() { return board; }, get dims() { return { cols, rows, mines: totalMines, tile }; },
  act, newGame, useRadar, layoutNow: layout
