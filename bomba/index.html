<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dilimin Ucunda | Ridsgames</title>
<meta name="description" content="Dilimin Ucunda: ekrandaki hecenin geçtiği bir kelime söyle, bombayı yanındakine pasla. Patladığında elinde olan can kaybeder. Aynı telefonda 2-8 kişilik kelime oyunu.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 45%, rgba(6, 9, 15, .05) 0%, rgba(6, 9, 15, .66) 100%), url("../kizma-birader/masa.webp") center / cover, #1a0f08;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı: oyuncular, bomba, durum, düğme */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
main.shake { animation: shake .5s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake {
  10%, 90% { transform: translate(-2px, 1px); } 20%, 80% { transform: translate(5px, -3px); }
  30%, 50%, 70% { transform: translate(-9px, 4px); } 40%, 60% { transform: translate(9px, -4px); }
}
.plist { flex: none; width: 100%; max-width: 560px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.pc {
  display: inline-flex; align-items: center; gap: 6px; max-width: 168px; height: 32px; padding: 0 10px; border-radius: 999px;
  background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .22); font-size: 13.5px; font-weight: 700; transition: background .2s, border-color .2s, box-shadow .2s;
}
.pc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc .hp { flex: none; font-size: 11px; letter-spacing: 1px; }
.pc .hp i { font-style: normal; color: #475569; }
.pc .hp i.on { color: #f43f5e; }
.pc .bm { font-size: 14px; line-height: 1; }
.pc.on { border-color: #fb923c; background: rgba(124, 45, 18, .78); box-shadow: 0 0 14px rgba(251, 146, 60, .55); }
.pc.out { opacity: .4; }
.pc.out .nm { text-decoration: line-through; }
#meta { flex: none; font-size: 12.5px; color: #cbd5e1; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); font-variant-numeric: tabular-nums; }
#stage { flex: 1; min-height: 0; width: 100%; position: relative; overflow: hidden; }
canvas#bomb { position: absolute; inset: 0; display: block; }
.verdict { flex: none; min-height: 54px; max-width: 460px; text-align: center; text-shadow: 0 1px 3px rgba(0, 0, 0, .75); }
#vMain { font-size: 24px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#vSub { font-size: 14.5px; color: #e2e8f0; margin-top: 3px; }
.go {
  flex: none; width: 100%; max-width: 380px; height: 62px; border-radius: 18px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 20px; font-weight: 800; box-shadow: 0 6px 18px rgba(6, 182, 212, .4); touch-action: manipulation; transition: filter .15s, transform .08s;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 14px;
}
.go.pass { height: 76px; font-size: 24px; background: linear-gradient(135deg, #ea580c, #f59e0b); border-color: #fdba74; box-shadow: 0 6px 20px rgba(249, 115, 22, .5); }
.go.wait { filter: grayscale(.5) brightness(.75); cursor: default; }
.go:active:not(.wait) { transform: translateY(2px) scale(.99); }
#flash { position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(255, 247, 214, .95), rgba(249, 115, 22, .55) 45%, rgba(220, 38, 38, 0) 80%); }
#flash.on { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 64px 16px 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.mt { margin-top: 8px; }
.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.stepper { display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 8px; }
.stepper button { height: 54px; border-radius: 14px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 28px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.stepper button:disabled { opacity: .35; cursor: default; }
.tval { text-align: center; line-height: 1; }
.tval output { display: block; font-size: 38px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.tval small { display: block; margin-top: 5px; font-size: 11.5px; font-weight: 600; color: var(--dim); letter-spacing: .04em; }
.players { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: 26px 1fr 40px; gap: 6px; align-items: center; }
.prow .no { text-align: center; font-size: 13px; font-weight: 800; color: var(--dim); }
.prow input {
  height: 42px; min-width: 0; border-radius: 10px; border: 1px solid rgba(148, 163, 184, .25); background: rgba(2, 6, 23, .7); color: #fff; padding: 0 12px;
  font: inherit; font-size: 16px; user-select: text; -webkit-user-select: text;
}
.prow input:focus { outline: none; border-color: var(--cyan); }
.prow button { height: 42px; border: 1px solid rgba(148, 163, 184, .25); border-radius: 10px; background: rgba(2, 6, 23, .7); color: #94a3b8; font-size: 15px; }
.prow button:disabled { visibility: hidden; }
.add { height: 40px; border-radius: 10px; border: 1px dashed rgba(34, 211, 238, .5); background: none; color: #67e8f9; font-size: 14px; font-weight: 700; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .n { color: var(--dim); font-weight: 800; }
.rank li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li .s { color: var(--dim); font-size: 13px; }
.rank li .b { font-weight: 700; color: #cbd5e1; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.rank li.first { background: rgba(6, 182, 212, .16); border: 1px solid rgba(34, 211, 238, .5); }
.toast {
  position: fixed; left: 50%; top: 64px; z-index: 15; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-height: 600px) { main { gap: 6px; padding-top: 6px; } .go { height: 54px; } .go.pass { height: 64px; font-size: 21px; } #vMain { font-size: 21px; } .verdict { min-height: 48px; } }
@media (prefers-reduced-motion: reduce) { main.shake { animation: none; } #flash.on { animation-duration: .3s; } }
</style>
<!-- Ziyaret sayacı (GoatCounter): çerez kullanmaz; ?lang= gibi ekler aynı sayfa sayılır -->
<script>window.goatcounter = { path: (p) => p.split('?')[0] || '/' };</script>
<script data-goatcounter="https://ridsgames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<!-- Etkin süre, yeni ziyaret ve hata kaydı (ortak) -->
<script src="../assets/olcum.js" data-page="bomba" data-name="Dilimin Ucunda"></script>
</head>
<body>
<header class="top">
  <div class="in">
    <a id="homeLink" class="logo" href="../" aria-label="Ridsgames ana sayfa">
      <img src="../assets/logo.webp" alt="Ridsgames" width="112" height="52">
      <span class="gname" id="gameName">Dilimin Ucunda</span>
    </a>
    <div class="tools">
      <button id="menuBtn" class="pill" type="button" aria-label="Yeni oyun"><span class="ico">☰</span><span class="lbl" id="menuLbl">Yeni oyun</span></button>
      <button id="soundBtn" class="pill" type="button" aria-label="Ses"><span class="ico" id="soundIco">🔊</span></button>
      <button id="rulesBtn" class="pill" type="button" aria-label="Kurallar"><span class="ico">?</span><span class="lbl" id="rulesLbl">Kurallar</span></button>
      <button id="fsBtn" class="pill" type="button" aria-label="Tam ekran"><span class="ico">⛶</span></button>
      <button id="langBtn" class="pill lang" type="button" aria-label="Dil / Language">TR | EN</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="plist" id="plist" hidden></div>
  <div id="meta"></div>
  <div id="stage"><canvas id="bomb" role="img" aria-label="Bomba"></canvas></div>
  <div class="verdict" aria-live="polite"><div id="vMain"></div><div id="vSub"></div></div>
  <button class="go" id="go" type="button">Başla</button>
</main>

<footer>© 2026 Ridsgames. <span id="rights">Tüm hakları saklıdır.</span></footer>
<div class="toast" id="toast" role="status"></div>
<div id="flash"></div>
<canvas id="confetti" hidden></canvas>

<!-- Kurulum -->
<div class="ov" id="setupOv">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Dilimin Ucunda</h2>
    <p class="sub" id="setupSub"></p>
    <div class="sec">
      <div class="lbl" id="playersLbl"></div>
      <div class="players" id="players"></div>
      <button class="add" id="addBtn" type="button" style="width:100%;margin-top:6px"></button>
      <div class="note" id="seatNote"></div>
    </div>
    <div class="sec">
      <div class="lbl" id="livesLbl"></div>
      <div class="seg" id="livesSeg"><button type="button" data-l="1"></button><button type="button" data-l="2"></button><button type="button" data-l="3"></button></div>
    </div>
    <div class="sec">
      <div class="lbl" id="diffLbl"></div>
      <div class="seg" id="diffSeg"><button type="button" data-d="kolay"></button><button type="button" data-d="orta"></button><button type="button" data-d="zor"></button></div>
      <div class="note" id="diffNote"></div>
    </div>
    <div class="sec">
      <div class="lbl" id="fuseLbl"></div>
      <div class="stepper">
        <button type="button" id="fMinus" aria-label="−5">−</button>
        <div class="tval"><output id="fVal">30 sn</output><small id="fCap"></small></div>
        <button type="button" id="fPlus" aria-label="+5">+</button>
      </div>
      <div class="seg mt" id="presetSeg"><button type="button" data-f="15"></button><button type="button" data-f="30"></button><button type="button" data-f="60"></button></div>
      <div class="note" id="fuseNote"></div>
    </div>
    <div class="sec">
      <div class="lbl" id="changeLbl"></div>
      <div class="seg two" id="changeSeg"><button type="button" data-c="sabit"></button><button type="button" data-c="degisir"></button></div>
      <div class="note" id="changeNote"></div>
    </div>
    <div class="btns">
      <button class="big" id="startBtn" type="button">Başla</button>
      <button class="big alt" id="backBtn" type="button" hidden>Oyuna dön</button>
    </div>
  </div>
</div>

<!-- Kurallar -->
<div class="ov" id="rulesOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle">Nasıl oynanır?</h2>
    <p class="sub" id="rulesSub"></p>
    <ul class="rules" id="rulesList"></ul>
    <div class="btns"><button class="big" id="rulesOk" type="button">Tamam</button></div>
  </div>
</div>

<!-- Oyun sonu -->
<div class="ov" id="winOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="trophy">🏆</div>
    <h2 id="winTitle"></h2>
    <p class="sub" id="winSub"></p>
    <ol class="rank" id="rankList"></ol>
    <div class="btns">
      <button class="big" id="againBtn" type="button">Tekrar oyna</button>
      <button class="big alt" id="toMenuBtn" type="button">Ayarları değiştir</button>
    </div>
  </div>
</div>

// RULES-BEGIN
const FUSE_MIN = 10, FUSE_MAX = 120, FUSE_STEP = 5;
// Ortalama fitil s saniye: bomba s/2 ile 3s/2 arasında rastgele bir anda patlar
const fuseRange = (s) => [Math.round(s * 0.5), Math.round(s * 1.5)];
const pickFuse = (s, r = Math.random) => (s * 0.5 + r() * s) * 1000;
const GRACE = 1200;      // pası alana tanınan en kısa süre (ms)
const PASS_GUARD = 450;  // pastan hemen sonraki dokunuş sayılmaz (telefonu alırken kazara dokunma)
// Bir sonraki tike kalan süre: düzensiz, sona doğru hızlanır (p: geçen süre / fitil)
const tickGap = (p, r = Math.random) => (85 + 600 * Math.pow(1 - clamp(p), 1.5)) * (0.7 + 0.6 * r());
const nextAlive = (ps, i) => { for (let k = 1; k <= ps.length; k++) { const j = (i + k) % ps.length; if (!ps[j].out) return j; } return i; };
const aliveCount = (ps) => ps.filter((p) => !p.out).length;
// Son çıkan hecelerden kaçınarak yeni hece seç
function pickSyl(list, recent, r = Math.random) {
  const last = recent.slice(-Math.min(12, Math.floor(list.length / 2)));
  const pool = list.filter((s) => !last.includes(s));
  const s = pool[Math.floor(r() * pool.length)];
  recent.push(s); if (recent.length > 24) recent.shift();
  return s;
}
// Patlama: bomba elinde olan bir can kaybeder, canı biten elenir (seq: elenme sırası)
function applyBoom(ps, i, seq) { const p = ps[i]; p.lives--; p.booms++; if (p.lives <= 0) { p.out = true; p.outAt = seq; } return p.out; }
// Sıralama: ayakta kalan önce, sonra en geç elenen
const ranking = (ps) => ps.slice().sort((a, b) => (a.out - b.out) || (b.outAt - a.outAt));

function newGame() {
  const s = setup;
  sayac('basladi', 'oyun başladı');
  if (bitenVar) { bitenVar = false; sayac('tekrar', 'bitirdikten sonra yeni oyun'); }
  sayac(`mod/${s.diff}-${s.fuse}-${s.change}-${s.players.length}`, `mod: ${s.players.length} kişi, ${s.diff} heceler, ${s.fuse} sn, hece ${s.change}`);
  timerF = null; Sfx.hiss(false);
  const n = s.players.length, first = Math.floor(Math.random() * n);
  G = {
    lives: s.lives, diff: s.diff, fuse: s.fuse, change: s.change,
    players: s.players.map((nm, i) => ({ name: nm.trim() || T().playerN(i + 1), lives: s.lives, out: false, outAt: 0, passes: 0, booms: 0 })),
    round: 1, holder: first, starter: first, roundStarter: first, syl: null, recent: [], fuseMs: 0, roundPasses: 0, totalPasses: 0, outSeq: 0
  };
  res = null; phase = 'ready'; sparks.length = 0;
  closeAll(); render();
}
function act(ts) {
  if (!G || ts - lastAct < 150) return; // aynı dokunuşun ikinci olayı ya da iki parmak
  if (phase === 'ready') { lastAct = ts; lightFuse(ts); }
  else if (phase === 'run') { if (ts - lastPass < PASS_GUARD) return; lastAct = ts; pass(ts); }
  else if (phase === 'result') { if (clock() - resultAt < 900) return; lastAct = ts; nextRound(); }
}
function lightFuse(ts) {
  phase = 'run'; t0 = ts; lastPass = ts; tickN = 0; tickAt = -1e9; nextTick = ts + 350;
  G.fuseMs = pickFuse(G.fuse); G.roundStarter = G.holder; G.roundPasses = 0;
  G.syl = pickSyl(SYL[lang][G.diff], G.recent); sylAt = ts;
  Sfx.light(); Sfx.hiss(true); buzz(15); render();
}
function pass(ts) {
  G.players[G.holder].passes++; G.roundPasses++; G.totalPasses++;
  G.holder = nextAlive(G.players, G.holder); lastPass = ts;
  if (G.change === 'degisir') { G.syl = pickSyl(SYL[lang][G.diff], G.recent); sylAt = ts; }
  Sfx.pass(); buzz(12); render();
}
function explode(now) {
  phase = 'boom'; boomAt = now; sparks.length = 0;
  Sfx.hiss(false); Sfx.boom(); buzz([280, 90, 380]);
  const i = G.holder, out = applyBoom(G.players, i, G.outSeq + 1);
  if (out) G.outSeq++;
  res = { who: i, out, syl: G.syl, passes: G.roundPasses };
  makeBlast();
  const fl = $('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
  if (!REDUCED) { const m = $('main'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }
  later(showResult, REDUCED ? 400 : 1100);
  render();
}
function showResult() {
  phase = 'result'; resultAt = clock();
  if (res.out) Sfx.out();
  // patlatan sonraki turu başlatır; elendiyse sıradaki
  G.starter = G.players[res.who].out ? nextAlive(G.players, res.who) : res.who;
  if (aliveCount(G.players) <= 1) { phase = 'over'; later(gameOver, 1500); }
  else later(render, 950); // Sonraki tur düğmesi açılsın
  render();
}
function nextRound() {
  G.round++; G.holder = G.starter; G.syl = null; res = null; phase = 'ready';
  Sfx.click(); render();
}
function gameOver() {
  bitenVar = true; sayac('bitti', 'oyun bitti');
  const t = T(), order = ranking(G.players);
  $('winTitle').textContent = t.wins(order[0].name);
  $('winSub').textContent = t.overSub(G.round, G.totalPasses);
  $('rankList').innerHTML = order.map((p, k) => `<li class="${k ? '' : 'first'}"><span class="n">${k + 1}</span><span class="nm">${esc(p.name)}${k ? '' : ' 👑'}</span><span class="b">${t.passWord(p.passes)}</span></li>`).join('');
  render();
  Sfx.win(); buzz([60, 60, 120]); confetti(); $('winOv').hidden = false;
}
function cancelRun(note) {
  if (phase !== 'run') return;
  Sfx.hiss(false); sparks.length = 0;
  phase = 'ready'; G.holder = G.roundStarter; G.syl = null;
  if (note) toast(T().cancelled);
  render();
}

// ---------- Ses ----------
const Sfx = (() => {
  let ac = null, noiseBuf = null, hissSrc = null, hissGain = null;
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  const noise = (c) => {
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return noiseBuf;
  };
  function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function knock(delay, vol = 0.25, freq = 2000) { // kısa, süzülmüş gürültü: mekanik tık
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + delay, len = 0.04, buf = c.createBuffer(1, c.sampleRate * len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 2.2; g.gain.value = vol;
    s.buffer = buf; s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  // Fitilin cızırtısı: döngüdeki gürültü, alçak sesle
  function hiss(on) {
    if (hissSrc) {
      const c = ac, s = hissSrc, g = hissGain; hissSrc = null;
      try { g.gain.setTargetAtTime(0.0001, c.currentTime, 0.03); s.stop(c.currentTime + 0.2); } catch (e) {}
    }
    const c = on && soundOn && ctx(); if (!c) return;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noise(c); s.loop = true; f.type = 'bandpass'; f.frequency.value = 5200; f.Q.value = 0.8;
    g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(0.028, c.currentTime + 0.2);
    s.connect(f).connect(g).connect(c.destination); s.start(); hissSrc = s; hissGain = g;
  }
  return {
    unlock: ctx, hiss,
    tick(k) { knock(0, 0.34, k % 2 ? 2500 : 3400); },
    light() { knock(0, 0.4, 5200); tone(300, 1200, 0.22, 0.04, 'sawtooth'); },
    pass() { tone(520, 980, 0.09, 0.07, 'triangle'); knock(0, 0.18, 1800); },
    boom() {
      const c = soundOn && ctx(); if (!c) return;
      const t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = noise(c); f.type = 'lowpass'; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(80, t + 1.5);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
      s.connect(f).connect(g).connect(c.destination); s.start(t); s.stop(t + 1.8);
      tone(120, 30, 0.8, 0.6, 'sine');
    },
    out() { [392, 330, 262].forEach((f, k) => tone(f, f * 0.98, 0.26, 0.09, 'triangle', k * 0.15)); },
    click() { knock(0, 0.2, 2400); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, k) => tone(f, f * 1.01, 0.22, 0.12, 'triangle', k * 0.12)); }
  };
})();
const buzz = (p) => { try { if (soundOn && navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

// ---------- Konfeti ----------
function confetti() {
  if (REDUCED) return;
  const c = $('confetti'), x = c.getContext('2d'); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ['#fbbf24', '#34d399', '#22d3ee', '#fb923c', '#f43f5e', '#fff'];
  const ps = Array.from({ length: 130 }, (_, i) => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.6, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3.5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, col: cols[i % cols.length] }));
  const t0 = performance.now();
  (function f(now) {
    x.clearRect(0, 0, c.width, c.height);
    for (const q of ps) { q.x += q.vx; q.y += q.vy; q.r += q.vr; x.save(); x.translate(q.x, q.y); x.rotate(q.r); x.fillStyle = q.col; x.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); x.restore(); }
    if (now - t0 < 3500) requestAnimationFrame(f); else c.hidden = true;
  })(t0);
}

const WW = 2.6, HH = 3.36, OX = 1.3, OY = 2.14;

let K = 100, DPR = 1, BX = 0, BY = 0, fontsOk = 0;
const sparks = [];

function layout() {
  const w = $('stage').clientWidth, h = $('stage').clientHeight;
  K = Math.max(30, Math.min(w / WW, h / HH, 150));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  BX = (w / 2 + (OX - WW / 2) * K) * DPR; BY = ((h - HH * K) / 2 + OY * K) * DPR;

$('addBtn').addEventListener('click', () => {
  if (setup.players.length >= 8) return;
  setup.players.push(''); renderPlayers();
  const ins = $('players').querySelectorAll('input'); ins[ins.length - 1].focus();
});
$('startBtn').addEventListener('click', () => {
  Sfx.unlock();
  setup.players = setup.players.map((p) => p.trim().slice(0, 14));
  try { localStorage.setItem(KEY + 'setup', JSON.stringify(setup)); } catch (e) {}
  newGame();
});
$('backBtn').addEventListener('click', () => { closeAll(); dirty = true; });
$('menuBtn').addEventListener('click', openSetup);
$('rulesBtn').addEventListener('click', () => { cancelRun(false); $('rulesOv').hidden = false; sayac('kurallar', 'kurallar açıldı'); });
$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; });
$('rulesOv').addEventListener('click', (e) => { if (e.target.id === 'rulesOv') $('rulesOv').hidden = true; });
$('againBtn').addEventListener('click', () => { Sfx.unlock(); newGame(); });
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; applySound();
  try { localStorage.setItem(KEY + 'sound', soundOn ? '1' : '0'); } catch (e) {}
  if (soundOn) Sfx.unlock();
  Sfx.hiss(soundOn && phase === 'run');
});
// Tam ekran: desteklemeyen tarayıcıda (iPhone Safari) düğme gizlenir
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
// Sekmeden çıkınca süren tur sayılmaz (arka planda zamanlayıcı yavaşlar)
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelRun(true); });
addEventListener('resize', () => layout());
document.addEventListener('fullscreenchange', () => layout()); document.addEventListener('webkitfullscreenchange', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('stage'));
if (document.fonts && document.fonts.load) document.fonts.load('900 40px Inter').then(() => { fontsOk++; dirty = true; }).catch(() => {});

// Test kancası (oyun akışını değiştirmez). advanceTime: oyun saatini 16 ms adımlarla ileri sarar; advanceTime(0) saati dondurur
function advanceTime(ms) {
  if (manualT === null) manualT = performance.now();
  for (let left = ms; left > 0; left -= 16) { const d = Math.min(16, left); manualT += d; update(manualT, d / 1000); }
  lastFrame = clock(); dirty = true; draw(clock());
  return phase;
}
window.__rids = {
  get phase() { return phase; }, get G() { return G; }, get res() { return res; },
  act, now: clock, advanceTime, explode: () => explode(clock()), SYL, pickSyl, pickFuse, fuseRange, tickGap, nextAlive, applyBoom, ranking, layoutNow: layout, drawNow: () => draw(clock())
};

layout(); applyLang(); applySound(); openSetup(); requestAnimationFrame(frame);
</script>
