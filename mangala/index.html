<style>
:root {
  --bg: #0a0e17;
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --turn: #ef4444;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 42%, rgba(6, 9, 15, .05) 0%, rgba(6, 9, 15, .62) 100%), url("../kizma-birader/masa.webp") center / cover, #1a0f08;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; } /* pencerelerin (20) üstünde */
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
/* Tam ekranda logo gizlenir, düğmeler sağda kalır */
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı: ileti, tahta, sıra paneli */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 10px 8px; }
.slot { flex: none; height: 32px; width: 100%; display: flex; align-items: center; justify-content: center; }
.msg {
  max-width: 100%; padding: 6px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 800; color: #fff; text-align: center; line-height: 1.25;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s;
}
.msg.on { opacity: 1; transform: none; }
#boardWrap { flex: 1; min-height: 0; width: 100%; position: relative; }
#board { position: absolute; display: block; touch-action: manipulation; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .55)); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* Sıra paneli: keçeli ahşap tepsi, köşeler bozulmadan esnesin diye dokuz parçalı kenarlık */
.dock {
  flex: none; width: 100%; max-width: 440px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
  border-style: solid; border-width: 20px 17px 24px; border-image: url("../kizma-birader/tepsi.webp") 60 50 72 50 fill / 20px 17px 24px stretch;
  padding: 0 4px 0 8px; background: none;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .5)) drop-shadow(0 0 7px color-mix(in srgb, var(--turn) 60%, transparent));
  transition: filter .3s;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ava { flex: none; display: inline-block; border-radius: 50%; background: url("../kizma-birader/karakterler.webp") 0 0 / 400% 100%; }
.chip { width: 46px; height: 46px; box-shadow: 0 0 0 3px var(--turn), 0 3px 8px rgba(0, 0, 0, .45); transition: box-shadow .3s; }
.chip.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { scale: .4; } 100% { scale: 1; } }
.who .t { min-width: 0; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
#turnName { font-size: 17px; font-weight: 800; line-height: 1.2; color: #fff; }

.skor div { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {

  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.field { display: grid; gap: 8px; padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); font-size: 14px; font-weight: 600; color: #cbd5e1; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }

.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }

.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.final { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 4px 0 6px; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }

.final span.win { background: rgba(6, 182, 212, .16); border: 1px solid rgba(34, 211, 238, .5); }
.final .ava { width: 32px; height: 32px; }

@media (prefers-reduced-motion: reduce) { .chip.pop { animation: none; } .msg { transition: none; } }

<script id="motor">
// ---------- Motor: Mangala kuralları ve bilgisayar (arayüzden bağımsız) ----------
// Tahta 14 hücre: 0-5 birinci oyuncunun kuyuları, 6 onun hazinesi; 7-12 ikinci oyuncunun kuyuları, 13 onun hazinesi.
// Dağıtım sayı artarak ilerler (saatin tersi yönü); rakibin hazinesi atlanır.
const PITS = [[0, 1, 2, 3, 4, 5], [7, 8, 9, 10, 11, 12]], STORE = [6, 13], TOTAL = 48;
const sideOf = (i) => (i >= 0 && i <= 5 ? 0 : i >= 7 && i <= 12 ? 1 : -1);
const oppPit = (i) => 12 - i; // karşıdaki kuyu
const newBoard = () => [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
const legal = (b, p) => PITS[p].filter((i) => b[i] > 0);
const sideSum = (b, p) => { const o = p ? 7 : 0; return b[o] + b[o + 1] + b[o + 2] + b[o + 3] + b[o + 4] + b[o + 5]; };

// Hamleyi tahtaya uygular (b değişir). rec: dağıtım yolu kaydedilsin mi (canlandırma için)
function applyMove(b, p, i, rec) {
  const skip = STORE[1 - p], path = rec ? [] : null;
  let n = b[i], pos = i;
  b[i] = 0;
  if (n > 1) { b[i] = 1; n--; if (rec) path.push(i); } // ilk taş aldığı kuyuya geri konur
  while (n > 0) { // tek taş varsa doğrudan yandaki kuyuya geçer
    pos = (pos + 1) % 14;
    if (pos === skip) continue;
    b[pos]++; n--;
    if (rec) path.push(pos);
  }
  const r = { p, pit: i, last: pos, path, extra: false, cap: null, capN: 0, capFrom: null, over: false, sweepSide: -1, sweepN: 0, sweepTo: -1, next: 1 - p };
  if (pos === STORE[p]) r.extra = true; // hazineye düştü: bir daha oynar
  else if (sideOf(pos) === 1 - p && b[pos] % 2 === 0) { // rakip kuyuyu çift yaptı
    r.cap = 'cift'; r.capN = b[pos]; r.capFrom = [pos];
    b[STORE[p]] += b[pos]; b[pos] = 0;
  } else if (sideOf(pos) === p && b[pos] === 1 && b[oppPit(pos)] > 0) { // boş kuyusuna düştü, karşısı dolu
    const o = oppPit(pos);
    r.cap = 'bos'; r.capN = 1 + b[o]; r.capFrom = [pos, o];
    b[STORE[p]] += 1 + b[o]; b[pos] = 0; b[o] = 0;
  }
  // Bitiş: kuyuları boşalan oyuncu, rakibin kuyularında kalan taşları da alır
  const e0 = sideSum(b, 0) === 0, e1 = sideSum(b, 1) === 0;
  if (e0 || e1) {
    r.over = true;
    const f = e0 ? 0 : 1, other = 1 - f;
    r.sweepTo = f; r.sweepSide = other; r.sweepN = sideSum(b, other);
    for (const k of PITS[other]) { b[STORE[f]] += b[k]; b[k] = 0; }
  }
  if (r.extra && !r.over) r.next = p;
  return r;
}
// Oyun sonu sonucu: 0 ya da 1 kazanan, -1 berabere
const winnerOf = (b) => (b[6] > b[13] ? 0 : b[13] > b[6] ? 1 : -1);

// ---------- Bilgisayar ----------
// Kolay: çoğunlukla rastgele; hazineye düşüren ve taş alan hamleleri biraz daha sık seçer
function easyMove(b, p, rnd = Math.random) {
  const ms = legal(b, p), w = ms.map((i) => {
    const c = b.slice(), r = applyMove(c, p, i);
    return 1 + (r.extra ? 1.2 : 0) + Math.min(r.capN, 8) * 0.2;
  });
  let t = rnd() * w.reduce((s, x) => s + x, 0);
  for (let k = 0; k < ms.length; k++) { t -= w[k]; if (t <= 0) return ms[k]; }
  return ms[ms.length - 1];
}
const randomMove = (b, p, rnd = Math.random) => { const ms = legal(b, p); return ms[Math.floor(rnd() * ms.length)]; };

// Zor: alfa-beta budamalı minimax. Hazineye düşen hamlede sıra aynı oyuncuda kalır.
const AI = { side: 0.25, depth: 8, ms: 300 }; // ağırlık bilgisayara karşı bilgisayar maçlarıyla seçildi
// Değerlendirme: hazine farkı + kendi tarafında bekleyen taşların çeyreği
const evaluate = (b, me) => b[STORE[me]] - b[STORE[1 - me]] + AI.side * (sideSum(b, me) - sideSum(b, 1 - me));
function finalScore(b, me) { const d = b[STORE[me]] - b[STORE[1 - me]]; return d > 0 ? 1000 + d : d < 0 ? -1000 + d : 0; }
function orderMoves(b, p) { // önce bedava hamle, sonra büyük yakalama: budama daha erken başlar
  const out = [];
  for (const i of PITS[p]) {
    if (!b[i]) continue;
    const c = b.slice(), r = applyMove(c, p, i);
    out.push({ i, c, r, k: (r.extra ? 100 : 0) + r.capN * 3 + (c[STORE[p]] - b[STORE[p]]) });
  }
  return out.sort((x, y) => y.k - x.k);
}
function hardMove(b, p, opts = {}) {
  const maxDepth = opts.depth || AI.depth, budget = opts.ms == null ? AI.ms : opts.ms, rnd = opts.rnd || Math.random;
  const clock = typeof performance !== 'undefined' ? performance : Date, t0 = clock.now();
  let nodes = 0, stop = false;
  function ab(bd, q, depth, alpha, beta) {
    if ((++nodes & 1023) === 0 && budget > 0 && clock.now() - t0 > budget) stop = true;
    if (stop) return 0;
    if (depth === 0) return evaluate(bd, p);
    const ms = orderMoves(bd, q);
    if (q === p) {
      let v = -Infinity;
      for (const m of ms) {
        const val = m.r.over ? finalScore(m.c, p) : ab(m.c, m.r.next, depth - 1, alpha, beta);
        if (val > v) v = val;
        if (v > alpha) alpha = v;
        if (alpha >= beta) break;
      }
      return v;
    }
    let v = Infinity;
    for (const m of ms) {
      const val = m.r.over ? finalScore(m.c, p) : ab(m.c, m.r.next, depth - 1, alpha, beta);
      if (val < v) v = val;
      if (v < beta) beta = v;
      if (alpha >= beta) break;
    }
    return v;
  }
  // derinleşerek arama: süre dolarsa son tamamlanan derinliğin en iyi hamlesi kullanılır
  let root = orderMoves(b, p), best = root[0].i, bestDepth = 0;
  for (let d = 1; d <= maxDepth; d++) {
    const scored = [];
    let alpha = -Infinity;
    for (const m of root) {
      // kökte de budama: en iyiye eşit hamleler doğru bulunsun diye pencere çok az aşağıdan açılır
      const v = m.r.over ? finalScore(m.c, p) : ab(m.c, m.r.next, d - 1, alpha - 1e-6, Infinity);
      if (stop) break;
      scored.push({ m, v });
      if (v > alpha) alpha = v;
    }
    if (stop) break;
    const top = Math.max(...scored.map((s) => s.v));
    const eq = scored.filter((s) => s.v >= top - 1e-9); // eşit hamlelerden rastgele biri: oyunlar tekrar etmesin
    best = eq[Math.floor(rnd() * eq.length)].m.i; bestDepth = d;
    root = scored.sort((x, y) => y.v - x.v).map((s) => s.m); // en iyi hamle önce denensin
    if (Math.abs(top) >= 1000) break; // sonuç belli
  }
  if (opts.info) Object.assign(opts.info, { depth: bestDepth, nodes, ms: clock.now() - t0 });
  return best;
}
function cpuMove(b, p, level, opts) { return level === 'hard' ? hardMove(b, p, opts) : level === 'random' ? randomMove(b, p, opts && opts.rnd) : easyMove(b, p, opts && opts.rnd); }
</script>

const STR = {

let tohum = 7;

  c.save(); rr(c, x, y, w, h, r);

}
function drawBg() {

  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H); tohum = 7;

  let d = c.createLinearGradient(0, 0, W, H); d.addColorStop(0, '#8a4f22'); d.addColorStop(1, '#5c3214'); c.fillStyle = d; c.fill();

function makeSprites() { // her renk için bir kez çizilen cam taş
  const r = geo.tasR * dpr, s = Math.ceil(r * 2 + 4);

    const k = document.createElement('canvas'); k.width = k.height = s; const c = k.getContext('2d'), m = s / 2;

}

function place(idx, st) { // taşı hücrede diğerlerinden uzak bir yere koyar (en iyi aday)

}

function fly(st, from, to, o = {}) { // bir taşı bir hücreden diğerine uçurur; vardığında çözülen söz döner

}

$('againBtn').addEventListener('click', () => newGame(G.mode, G.level, setup.first));
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; applySound(); try { localStorage.setItem('rids_mangala_sound', soundOn ? '1' : '0'); } catch (e) {} if (soundOn) Sfx.unlock(); });
// Tam ekran: desteklemeyen tarayıcıda (iPhone Safari) düğme gizlenir
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
const relayout = () => layout();
addEventListener('resize', relayout); document.addEventListener('fullscreenchange', relayout); document.addEventListener('webkitfullscreenchange', relayout);
if (window.ResizeObserver) new ResizeObserver(relayout).observe($('boardWrap'));
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// Deneme kancası: hızlandırma ve durum okuma (oyuncuya görünmez)
window.__mangala = {
  setSpeed: (s) => { speed = s; }, setMaxH: (h) => { maxH = h; layout(); syncDisp(G ? G.b : newBoard()); },
  state: () => ({ G, busy, over: G && G.over, turn: G && G.turn, canPlay: !!canPlay(), epoch }),
  check: () => disp.every((a, i) => a.length === (G ? G.b[i] : 4) || i === (hand && hand.pit)) && flights.length === 0,
  pit: (i) => { const r = cv.getBoundingClientRect(); return [r.left + C[i].x, r.top + C[i].y]; },
  setBoard: (b, turn) => { G = { mode: 'cpu', level: 'easy', b, turn, over: false }; syncDisp(b); updateDock(); },
  disp: () => disp.map((a) => a.length)
};

layout(); applySound();
G = null; syncDisp(newBoard()); applyLang(); openSetup();
requestAnimationFrame(frame);
</script>
</body>
</html>
