<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Batak | Ridsgames</title>
<meta name="description" content="Batak: koz maça, ihaleli, eşli ve gömmeli batak. İhaleyi al, kozu seç, söylediğin kadar el al. 3 bilgisayara karşı, üç zorluk.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --turn: #ef4444;
  --red: #d32f2f;
  --ink: #1b1b1f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 42%, rgba(6, 9, 15, .05) 0%, rgba(6, 9, 15, .62) 100%), url("../kizma-birader/masa.webp") center / cover, #1a0f08;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı: ileti, masa, puan paneli */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 10px 8px; }
.slot { flex: none; height: 32px; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 6; margin-bottom: -32px; } /* masanın üstünde süzülür, yer kaplamaz */
.msg {
  max-width: 100%; padding: 6px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 800; color: #fff; text-align: center; line-height: 1.25;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; pointer-events: none;
}
.msg.on { opacity: 1; transform: none; }
.msg.gold { border-color: #ffd43b; }
#stage { flex: 1; min-height: 0; width: 100%; max-width: 760px; position: relative; z-index: 0; isolation: isolate; overflow: hidden; touch-action: manipulation; }

/* Kartlar: konum JS'ten transform ile, çevirme içteki katmanla */
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); transition-property: transform; transition-timing-function: cubic-bezier(.25, .8, .3, 1); will-change: transform; }
.card .in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform .35s, translate .15s; }
.card.up .in { transform: none; }
.face { position: absolute; inset: 0; border-radius: calc(var(--cw) * .05); backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 2px 6px rgba(0, 0, 0, .45), 0 0 0 .5px rgba(0, 0, 0, .35); overflow: hidden; }
.front { background: #fff; }
.front img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
.back { transform: rotateY(180deg); background: var(--back) center / 100% 100% no-repeat, #fffdf8; }
.card.play { cursor: pointer; }
.card.play:hover .in { translate: 0 calc(var(--ch) * -.1); }
.card.hit .front { box-shadow: 0 0 0 2px #ffd43b, 0 0 14px rgba(255, 212, 59, .8), 0 2px 6px rgba(0, 0, 0, .45); }
.card.hot .in { translate: 0 calc(var(--ch) * -.14); }
.card.flat .face { box-shadow: none; } /* destede yığılan gölgeler kararmasın */

.badge { position: absolute; z-index: 300; min-width: 26px; height: 22px; padding: 0 7px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 12.5px; font-weight: 800; color: #fff; background: rgba(2, 6, 23, .82); border: 1px solid rgba(255, 220, 170, .35); font-variant-numeric: tabular-nums; pointer-events: none; translate: -50% -50%; transition: opacity .2s; }
.badge.zero { opacity: 0; }
.lbl2 { position: absolute; z-index: 300; font-size: 11px; font-weight: 700; color: rgba(255, 235, 200, .8); text-shadow: 0 1px 2px rgba(0, 0, 0, .8); translate: -50% 0; pointer-events: none; white-space: nowrap; }
#pop { position: absolute; z-index: 320; left: 0; top: 0; translate: -50% -50%; pointer-events: none; font-weight: 900; font-size: 44px; color: #ffe066; letter-spacing: .02em; white-space: nowrap;
  text-shadow: 0 3px 0 #8a5a00, 0 0 18px rgba(255, 200, 0, .7), 0 6px 14px rgba(0, 0, 0, .7); opacity: 0; }
#pop.go { animation: popIn 1.3s cubic-bezier(.2, 1.4, .4, 1) forwards; }
@keyframes popIn { 0% { opacity: 0; scale: .3; } 18% { opacity: 1; scale: 1.15; } 30% { scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; scale: 1.05; translate: -50% -90%; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* Puan paneli: keçeli ahşap tepsi */
.dock {
  flex: none; width: 100%; max-width: 440px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
  border-style: solid; border-width: 20px 17px 24px; border-image: url("../kizma-birader/tepsi.webp") 60 50 72 50 fill / 20px 17px 24px stretch;
  padding: 0 4px 0 8px; background: none;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .5)) drop-shadow(0 0 7px color-mix(in srgb, var(--turn) 60%, transparent));
  transition: filter .3s;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ava { flex: none; display: inline-block; border-radius: 50%; background: url("../kizma-birader/karakterler.webp") 0 0 / 400% 100%; }
.chip { width: 46px; height: 46px; box-shadow: 0 0 0 3px var(--turn), 0 3px 8px rgba(0, 0, 0, .45); transition: box-shadow .3s; }
.chip.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { scale: .4; } 100% { scale: 1; } }
.who .t { min-width: 0; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
#turnName { font-size: 17px; font-weight: 800; line-height: 1.2; color: #fff; }
#turnMsg { font-size: 14px; color: #d8f3dc; line-height: 1.3; margin-top: 2px; min-height: 1.3em; }
.skor { display: grid; gap: 6px; padding: 6px 8px; border-radius: 12px; background: rgba(2, 6, 23, .35); }
.skor > div { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
.skor .ava { width: 24px; height: 24px; }
.skor small { font-size: 11.5px; font-weight: 700; color: #ffe066; min-width: 3.2em; }
#hedef { font-size: 11px; font-weight: 700; color: rgba(255, 235, 200, .75); text-align: center; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Yatay telefon: üst çubuk solda dar menü sütunu, masa ortada, sağda ileti ve puan paneli; alt bilgi gizli */
@media (orientation: landscape) and (max-height: 500px) {
  body { display: grid; grid-template-columns: clamp(64px, 9vw, 80px) minmax(0, 1fr) clamp(150px, 25vw, 200px); grid-template-rows: auto minmax(0, 1fr); }
  main { display: contents; }
  .top { grid-column: 1; grid-row: 1 / 3; border-bottom: 0; border-right: 1px solid rgba(30, 41, 59, .8); overflow-y: auto; }
  .top .in { height: auto; max-width: none; flex-direction: column; justify-content: flex-start; padding: 10px 6px; gap: 12px; }
  .logo img { width: 100%; max-width: 56px; height: auto; }
  .gname, .pill .lbl { display: none; }
  .tools { flex-direction: column; gap: 7px; }
  .pill { padding: 0 8px; }
  .pill.lang { font-size: 11px; padding: 0 6px; white-space: nowrap; }
  #stage { grid-column: 2; grid-row: 1 / 3; width: auto; max-width: none; }
  .slot { grid-column: 3; grid-row: 1; width: auto; height: auto; min-height: 40px; margin: 0; padding: 8px 8px 0 0; }
  .msg { font-size: 12.5px; padding: 6px 10px; border-radius: 14px; }
  .dock { grid-column: 3; grid-row: 2; width: auto; max-width: none; margin: 8px 8px 8px 0; grid-template-columns: 1fr; align-content: space-evenly; justify-items: center; gap: 10px; padding: 4px 4px 8px; }
  .who { flex-direction: column; text-align: center; gap: 8px; }
  .chip { width: 50px; height: 50px; }
  body > .ov { padding: 8px 8px 8px calc(clamp(64px, 9vw, 80px) + 8px); }
  footer { display: none; }
  #setupOv .card2 { max-width: 560px; padding: 14px 18px; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 8px; }
  #setupOv .field { grid-template-columns: 130px 1fr; align-items: center; padding: 8px 0; }
  #setupOv .btns { margin-top: 8px; grid-auto-flow: column; grid-auto-columns: 1fr; }
  #handOv .card2 { max-width: 520px; padding: 10px 16px; }
  #handOv h2 { font-size: 19px; }
  #handOv .sub { margin-bottom: 4px; font-size: 12.5px; }
  #handOv table.sum { font-size: 12.5px; }
  #handOv table.sum td, #handOv table.sum th { padding: 2px 6px; }
  #handOv table.sum thead .ava { width: 20px; height: 20px; }
  #handOv tr.tot td, #handOv tr.all td { font-size: 14px; }
  #handOv .btns { margin-top: 8px; }
  #handOv .big { height: 40px; font-size: 15px; }
}
/* Geniş yatay ekran: masa solda büyük, panel sağda */
@media (orientation: landscape) and (min-height: 501px) and (min-width: 900px) {
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); gap: 12px 18px; max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 18px; }
  #stage { grid-column: 1; grid-row: 1 / 3; max-width: none; align-self: stretch; }
  .slot { grid-column: 2; grid-row: 1; height: auto; min-height: 44px; margin: 0; align-items: flex-end; }
  .msg { border-radius: 16px; }
  .dock { grid-column: 2; grid-row: 2; align-self: start; grid-template-columns: 1fr; justify-items: center; gap: 14px; padding: 10px 6px 14px; }
  .who { flex-direction: column; text-align: center; gap: 10px; }
  .chip { width: 64px; height: 64px; }
}

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 64px 16px 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card2 {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card2 h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card2 .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.field { display: grid; gap: 8px; padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); font-size: 14px; font-weight: 600; color: #cbd5e1; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { min-height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button .mini { display: inline-block; width: 15px; height: 21px; border-radius: 2px; vertical-align: middle; margin-right: 7px; background: var(--b) center / 100% 100%; box-shadow: 0 0 0 1px rgba(255, 255, 255, .5); }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.btns { display: grid; gap: 10px; margin-top: 14px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.final { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 4px 0 6px; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.final span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 14px; background: rgba(2, 6, 23, .55); }
.final span.win { background: rgba(6, 182, 212, .16); border: 1px solid rgba(34, 211, 238, .5); }
.final .ava { width: 32px; height: 32px; }
table.sum { width: 100%; border-collapse: collapse; font-size: 14px; color: #cbd5e1; font-variant-numeric: tabular-nums; }
table.sum th, table.sum td { padding: 6px 8px; text-align: right; border-bottom: 1px solid rgba(148, 163, 184, .12); }
table.sum th:first-child, table.sum td:first-child { text-align: left; }
table.sum thead th { color: #fff; }
table.sum thead .ava { width: 26px; height: 26px; vertical-align: middle; }
table.sum tr.tot td { color: #fff; font-weight: 800; font-size: 15px; }
table.sum tr.all td { color: #67e8f9; font-weight: 800; font-size: 16px; border-bottom: 0; }
table.sum td.z { color: #475569; }

/* Batak'a özel */
.card.dim .front img { filter: brightness(.58) saturate(.6); }
.card.sel .in { translate: 0 calc(var(--ch) * -.2); }
.card.sel .front { box-shadow: 0 0 0 2.5px #ffd43b, 0 0 14px rgba(255, 212, 59, .8), 0 2px 6px rgba(0, 0, 0, .45); }
.card.gone { visibility: hidden; }
.card { touch-action: none; }
.card.drag { cursor: grabbing; }
.card.drag .in { translate: none !important; }
.card.drag .face { box-shadow: 0 14px 28px rgba(0, 0, 0, .55), 0 0 0 .5px rgba(0, 0, 0, .35); }
.seat { position: absolute; z-index: 310; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
.seat .ava { width: 38px; height: 38px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .3), 0 3px 8px rgba(0, 0, 0, .5); transition: box-shadow .3s, scale .3s; }
.seat.on .ava { box-shadow: 0 0 0 3px var(--c), 0 0 16px var(--c); scale: 1.14; }
.seat b { font-size: 11px; font-weight: 800; color: #fff; background: rgba(2, 6, 23, .78); padding: 1px 7px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seat b.bid { color: #1a1200; background: #ffd43b; }
.seat b.ok { color: #052e16; background: #4ade80; }
.seat b.team { box-shadow: 0 0 0 1.5px var(--t); }
#seat0 { flex-direction: row; gap: 6px; translate: 0 -50%; }
#seat0 .ava { width: 28px; height: 28px; }
#trumpB { position: absolute; z-index: 305; translate: -50% -50%; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: opacity .2s, scale .2s; }
#trumpB.off { opacity: 0; scale: .5; }
#trumpB i { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 27px; line-height: 1; box-shadow: 0 0 0 2.5px #ffd43b, 0 3px 10px rgba(0, 0, 0, .55); font-family: Georgia, serif; }
#trumpB b { font-size: 10.5px; font-weight: 800; color: #ffe066; background: rgba(2, 6, 23, .8); padding: 1px 6px; border-radius: 7px; }
.pick { position: absolute; z-index: 400; translate: -50% -50%; padding: 10px 12px 12px; border-radius: 16px; background: rgba(2, 6, 23, .94); border: 1px solid rgba(34, 211, 238, .55); box-shadow: 0 12px 30px rgba(0, 0, 0, .6); text-align: center; max-width: calc(100% - 16px); }
.pick .t { font-size: 13.5px; font-weight: 800; margin-bottom: 8px; color: #fff; }
.pick .s { font-size: 12px; color: var(--dim); margin: -4px 0 8px; }
#suitPick .b { display: grid; grid-template-columns: repeat(4, 52px); gap: 8px; justify-content: center; }
#suitPick button { height: 62px; border-radius: 10px; border: 0; background: #fff; font-size: 36px; line-height: 1; box-shadow: 0 3px 8px rgba(0, 0, 0, .45); font-family: Georgia, serif; }
#suitPick button:hover { filter: brightness(.93); }
#bidPick .b { display: grid; grid-template-columns: repeat(5, 46px); gap: 6px; justify-content: center; }
#bidPick .b button, #bidPass, #buryBtn { height: 40px; border-radius: 10px; border: 1px solid rgba(34, 211, 238, .45); background: rgba(15, 23, 42, .95); color: #fff; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
#bidPick .b button:hover:not(:disabled) { border-color: #22d3ee; background: rgba(8, 51, 68, .95); }
#bidPick .b button:disabled { opacity: .28; }
#bidPass { margin-top: 8px; width: 100%; border-color: rgba(255, 212, 59, .7); color: #ffe066; }
#bidPass:disabled { opacity: .3; }
#buryBox { z-index: 330; }
#buryBtn { width: 100%; margin-top: 2px; padding: 0 18px; border-color: #ffd43b; color: #ffe066; }
#buryBtn:disabled { opacity: .35; }
.skor.g4 { grid-template-columns: auto auto; column-gap: 14px; }
.skor > div.full { grid-column: 1 / -1; }
.skor > div.w { color: #ffe066; }
.skor .pair { display: inline-flex; }
.skor .pair .ava + .ava { margin-left: -7px; }
table.sum td.nm { display: flex; align-items: center; gap: 7px; }
table.sum td.nm .ava { width: 22px; height: 22px; }
table.sum td.nm .ava + .ava { margin-left: -12px; }
table.sum tr.win td { color: #ffe066; font-weight: 800; }
table.sum td.neg { color: #f87171; font-weight: 800; }
@keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
.card.no .in { animation: shake .25s 2; }
#modeSeg button { font-size: 13px; padding-left: 2px; padding-right: 2px; }
</style>
<!-- Ziyaret sayacı (GoatCounter): çerez kullanmaz; ?lang= gibi ekler aynı sayfa sayılır -->
<script>window.goatcounter = { path: (p) => p.split('?')[0] || '/' };</script>
<script data-goatcounter="https://ridsgames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

</head>
<body>
<header class="top">
  <div class="in">
    <a id="homeLink" class="logo" href="../" aria-label="Ridsgames ana sayfa">
      <img src="../assets/logo.webp" alt="Ridsgames" width="112" height="52">
      <span class="gname" id="gameName">Batak</span>

<script id="motor">
// ---------- Motor: Batak kuralları ve bilgisayar (arayüzden bağımsız) ----------
// Kart 0-51: renk = id / 13 (0 maça, 1 kupa, 2 karo, 3 sinek), değer = id % 13 + 1 (1 as, 11 vale, 12 kız, 13 papaz); batakta as en büyüğüdür
const suitOf = (c) => (c / 13) | 0, rk = (c) => (c % 13 === 0 ? 14 : (c % 13) + 1);
const idOf = (s, r) => s * 13 + (r === 14 ? 0 : r - 1);
// min: en az ihale, force: herkes pas derse son kalanın almak zorunda olduğu ihale
const MODES = { tekli: { min: 5, force: 5, deal: 13 }, esli: { min: 8, force: 7, deal: 13 }, gommeli: { min: 8, force: 7, deal: 16 }, ihalesiz: { min: 0, force: 0, deal: 13 } };
// Gömmeli üç kişiyle oynanır: üstteki koltuk (2) boş kalır
const seatsOf = (mode) => (mode === 'gommeli' ? [0, 1, 3] : [0, 1, 2, 3]);
function shuffled(rnd = Math.random, a = Array.from({ length: 52 }, (_, i) => i)) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const allyOf = (mode, a, b) => a === b || (mode === 'esli' && a % 2 === b % 2);
// s: { trick: [{ p, c }], trump, broken: koz açıldı mı }
// Renge uymak zorunlu, yükseltebiliyorsan yükseltmek zorunlu; o renk yoksa koz atmak, koz atılmışsa daha büyüğünü atmak zorunlu
function legalCards(hand, s) {
  if (!s.trick.length) {
    if (!s.broken) { const nt = hand.filter((c) => suitOf(c) !== s.trump); if (nt.length) return nt; }
    return hand.slice();
  }
  const cards = s.trick.map((x) => x.c), L = suitOf(cards[0]);
  const follow = hand.filter((c) => suitOf(c) === L), trumped = L !== s.trump && cards.some((c) => suitOf(c) === s.trump);
  if (follow.length) {
    if (trumped) return follow;
    const top = Math.max(...cards.filter((c) => suitOf(c) === L).map(rk)), hi = follow.filter((c) => rk(c) > top);
    return hi.length ? hi : follow;
  }
  const tr = hand.filter((c) => suitOf(c) === s.trump);
  if (tr.length) {
    if (!trumped) return tr;
    const top = Math.max(...cards.filter((c) => suitOf(c) === s.trump).map(rk)), hi = tr.filter((c) => rk(c) > top);
    return hi.length ? hi : tr;
  }
  return hand.slice();
}
// Neden atılamaz (oyuncuya ipucu)
function whyNot(c, hand, s) {
  if (!s.trick.length) return 'lead';
  const L = suitOf(s.trick[0].c);
  if (suitOf(c) !== L && hand.some((x) => suitOf(x) === L)) return 'follow';
  if (suitOf(c) === L || suitOf(c) === s.trump) return 'higher';
  return 'trump';
}
function trickWinner(trick, trump) {
  let b = trick[0];
  for (const x of trick.slice(1)) { const bs = suitOf(b.c), xs = suitOf(x.c); if (xs === bs ? rk(x.c) > rk(b.c) : xs === trump) b = x; }
  return b.p;
}

// ---------- Bilgisayar ----------
// Elin kaç el alacağının tahmini (koz verilmişse ona göre)
function handEval(hand, trump) {
  let t = 0; const tn = hand.filter((c) => suitOf(c) === trump).length;
  for (let s = 0; s < 4; s++) {
    const cs = hand.filter((c) => suitOf(c) === s).map(rk).sort((a, b) => b - a), n = cs.length;
    if (s === trump) {
      t += (cs.includes(14) ? 1 : 0) + (cs.includes(13) ? (n >= 2 ? 0.9 : 0.3) : 0) + (cs.includes(12) ? (n >= 3 ? 0.7 : 0.2) : 0) + (cs.includes(11) && n >= 4 ? 0.4 : 0);
      t += Math.max(0, n - 3) * 0.85;
    } else {
      if (cs[0] === 14) t += 0.95;
      if (cs.includes(13)) t += n >= 2 ? (cs[0] === 14 ? 0.8 : 0.55) : 0.15;
      if (cs.includes(12) && n >= 3 && cs[0] >= 13) t += 0.3;
      if (n >= 6) t -= 0.3; // uzun yan renk kozlanır
      if (tn >= 3 && n <= 1) t += (n === 0 ? 0.9 : 0.5) * Math.min(1, (tn - 2) / 2);
    }
  }
  return Math.max(0, t);
}
function bestTrump(hand) { let b = 0, v = -1; for (let s = 0; s < 4; s++) { const e = handEval(hand, s) + hand.filter((c) => suitOf(c) === s).length * 0.01; if (e > v) { v = e; b = s; } } return [b, v]; }
// st: { hand, mode, me, cur: en yüksek ihale, bidder, forced: pas diyemez, partnerBid }
function cpuBid(st, level, rnd = Math.random) {
  const m = MODES[st.mode], need = st.forced ? m.force : Math.max(m.min, st.cur + 1);
  let est = bestTrump(st.hand)[1];
  if (st.mode === 'esli') est += st.partnerBid > 0 ? 3.3 : 2.9; // ortağın beklenen elleri
  if (st.mode === 'gommeli') est += 0.7; // ortadaki 4 kart ve gömme
  if (st.mode === 'esli' && st.bidder === (st.me + 2) % 4) est -= 1.5; // ortağın ihalesini zorla yükseltme
  est += level === 'easy' ? (rnd() - 0.35) * 2.4 : level === 'mid' ? (rnd() - 0.5) * 1.2 : -0.15;
  const max = Math.min(m.deal, Math.floor(est));
  if (st.forced) return Math.max(need, max);
  return max >= need ? need : 0;
}
function cpuBury(hand, trump) { // gömülecek 4 kart: kısa yan renklerin küçükleri, koz ve as gömülmez
  const len = [0, 1, 2, 3].map((s) => hand.filter((c) => suitOf(c) === s).length);
  const score = (c) => rk(c) + (suitOf(c) === trump ? 100 : 0) + (rk(c) === 14 ? 40 : 0) + (rk(c) === 13 && len[suitOf(c)] >= 2 ? 12 : 0) - (len[suitOf(c)] <= 2 ? 4 : 0) + len[suitOf(c)] * 0.3;
  return hand.slice().sort((a, b) => score(a) - score(b)).slice(0, 4);
}
// st: { hand, trick, trump, broken, me, mode, bidder, played: oynanan kartlar, voids: [oyuncu][renk] yok bilgisi }
function cpuPlay(st, level, rnd = Math.random) {
  const legal = legalCards(st.hand, st);
  if (legal.length === 1) return legal[0];
  if (level === 'easy' && rnd() < 0.45) return legal[Math.floor(rnd() * legal.length)];
  const known = new Set([...st.played, ...st.trick.map((x) => x.c), ...st.hand]);
  const boss = (c) => { const s = suitOf(c); for (let r = rk(c) + 1; r <= 14; r++) if (!known.has(idOf(s, r))) return false; return true; };
  const val = (c) => rk(c) + (suitOf(c) === st.trump ? 20 : 0);
  const low = (a) => a.slice().sort((x, y) => val(x) - val(y))[0];
  const unseenTr = Array.from({ length: 13 }, (_, i) => st.trump * 13 + i).filter((c) => !known.has(c)).length;
  const ally = (p) => allyOf(st.mode, p, st.me);
  const seats = seatsOf(st.mode), n = seats.length, mi = seats.indexOf(st.me);
  const later = []; for (let k = 1; k < n - st.trick.length; k++) later.push(seats[(mi + k) % n]);
  const mayRuff = (s) => level === 'hard' && s !== st.trump && unseenTr > 0 && later.some((p) => !ally(p) && st.voids[p][s]);
  const lenOf = (s) => st.hand.filter((c) => suitOf(c) === s).length;
  if (!st.trick.length) { // ilk kart
    const myTr = lenOf(st.trump), attacker = ally(st.bidder);
    if (attacker && myTr > 0 && unseenTr > 0 && myTr >= unseenTr * (level === 'hard' ? 0.6 : 1)) { // kozları topla
      const tr = legal.filter((c) => suitOf(c) === st.trump);
      if (tr.length) { const b = tr.filter(boss); return b.length ? b.sort((x, y) => rk(y) - rk(x))[0] : low(tr); }
    }
    const bosses = legal.filter((c) => boss(c) && suitOf(c) !== st.trump && !mayRuff(suitOf(c)));
    if (bosses.length) return bosses.sort((x, y) => rk(y) - rk(x))[0];
    const side = legal.filter((c) => suitOf(c) !== st.trump);
    if (side.length) {
      const pool = side.filter((c) => !mayRuff(suitOf(c))), use = pool.length ? pool : side;
      // kozu olan kısa renkten çıkıp koz kesmeye hazırlanır, yoksa uzun rengin küçüğünü açar
      const key = (c) => (myTr > 1 ? lenOf(suitOf(c)) : -lenOf(suitOf(c))) * 3 + rk(c) * 0.2 + (rk(c) >= 12 ? 4 : 0);
      return use.slice().sort((x, y) => key(x) - key(y))[0];
    }
    return low(legal);
  }
  const w = trickWinner(st.trick, st.trump), last = st.trick.length === n - 1;
  const wins = legal.filter((c) => trickWinner([...st.trick, { p: st.me, c }], st.trump) === st.me);
  if (ally(w)) { // ortak alıyor: küçük at
    const wc = st.trick.find((x) => x.p === w).c, safe = last || (boss(wc) && !mayRuff(suitOf(wc))) || suitOf(wc) === st.trump;
    const nonWin = legal.filter((c) => !wins.includes(c));
    if (safe || level === 'easy') return low(nonWin.length ? nonWin : legal);
  }
  if (wins.length) {
    if (last) return low(wins);
    const L = suitOf(st.trick[0].c);
    const sure = wins.filter((c) => (suitOf(c) === st.trump ? boss(c) || !later.some((p) => !ally(p) && st.voids[p][L]) : boss(c) && !mayRuff(L)));
    if (sure.length) return low(sure);
    const tr = wins.filter((c) => suitOf(c) === st.trump && suitOf(c) !== L);
    if (tr.length) return low(tr);
    return level === 'hard' && wins.length < legal.length ? low(legal) : low(wins);
  }
  const side = legal.filter((c) => suitOf(c) !== st.trump);
  const pool = side.length ? side : legal;
  // en kısa yan renkten at (koz kesmeye hazırlık), büyük kartı sakla
  return pool.slice().sort((x, y) => (val(x) + lenOf(suitOf(x)) * 0.6 - (boss(x) ? -8 : 0)) - (val(y) + lenOf(suitOf(y)) * 0.6 - (boss(y) ? -8 : 0)))[0];
}
// Puan: ihaleyi alan (ya da eşi) söylediği kadar alırsa aldığı kadar yazar, alamazsa ihale kadar eksi; diğerleri aldıkları kadar
function handScore(mode, taken, bidder, bid) {
  if (mode === 'esli') {
    const t = [taken[0] + taken[2], taken[1] + taken[3]], bt = bidder % 2;
    return t.map((v, i) => (i === bt ? (v >= bid ? v : -bid) : v));
  }
  return taken.map((v, i) => (mode !== 'ihalesiz' && i === bidder ? (v >= bid ? v : -bid) : v));
}

  const cols = ['#ef4444', '#22d3ee', '#ffd43b', '#ffffff', '#84cc16', '#8b5cf6', '#ff6fb5'];
  const bits = Array.from({ length: 170 }, () => ({
    x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6, vx: (Math.random() - 0.5) * 60, vy: 120 + Math.random() * 160,
    w: 6 + Math.random() * 6, h: 9 + Math.random() * 8, a: Math.random() * 6, va: (Math.random() - 0.5) * 10, col: cols[Math.floor(Math.random() * cols.length)]
  }));
  let last = performance.now(); const end = last + 4200;
  (function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) {
      b.vy = Math.min(b.vy + 220 * dt, 260); b.x += (b.vx + Math.sin(now / 300 + b.a) * 40) * dt; b.y += b.vy * dt; b.a += b.va * dt;
      c.save(); c.translate(b.x, b.y); c.rotate(b.a); c.scale(Math.cos(b.a * 1.7), 1);
      c.fillStyle = b.col; c.globalAlpha = Math.min(1, (end - now) / 600); c.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); c.restore();
    }
    if (now < end) requestAnimationFrame(tick); else { c.clearRect(0, 0, k.width, k.height); k.hidden = true; }
  })(last);
}

// ---------- Pencereler ve dil ----------
function closeAll() {
  for (const id of ['setupOv', 'rulesOv', 'handOv', 'winOv']) $(id).hidden = true;
  for (const id of ['bidPick', 'suitPick', 'buryBox']) $(id).hidden = true;
  bidRes = null; suitRes = null;
}
function renderSetup() {
  const t = T();
  $('setupTitle').textContent = t.game; $('setupSub').textContent = t.modeSub[setup.mode] || t.setupSub; $('modeLbl').textContent = t.modeLbl; $('lvlLbl').textContent = t.lvlLbl; $('lenLbl').textContent = t.lenLbl; $('deckLbl').textContent = t.deckLbl;
  const lab = { easy: t.easy, mid: t.mid, hard: t.hard, 4: t.hands(4), 8: t.hands(8), 12: t.hands(12), ...t.modes, red: `<i class="mini" style="--b:var(--back-red)"></i>${t.red}`, black: `<i class="mini" style="--b:var(--back-black)"></i>${t.black}` };
  const cur = { modeSeg: setup.mode, lvlSeg: setup.level, lenSeg: String(setup.len), deckSeg: setup.deck };
  for (const id in cur) document.querySelectorAll('#' + id + ' button').forEach((b) => { b.innerHTML = lab[b.dataset.v]; b.setAttribute('aria-pressed', b.dataset.v === cur[id]); });
  $('startBtn').textContent = t.start; $('resumeBtn').textContent = t.resume; $('resumeBtn').hidden = !loadSaved();
}
function openSetup() {
  save(); epoch++; busy = true; hotCard = -1;
  closeAll(); renderSetup(); render(0); $('setupOv').hidden = false; $('startBtn').focus();
}
function applyLang() {
  const t = T();
  document.documentElement.lang = lang; document.title = t.title;
  $('homeLink').href = '../?lang=' + lang; $('homeLink').setAttribute('aria-label', t.homeLabel);
  $('gameName').textContent = t.game; $('menuLbl').textContent = t.newGame; $('rulesLbl').textContent = t.rules;
  $('menuBtn').setAttribute('aria-label', t.newGame); $('rulesBtn').setAttribute('aria-label', t.rules); $('soundBtn').setAttribute('aria-label', t.sound); $('fsBtn').setAttribute('aria-label', t.fs); $('langBtn').setAttribute('aria-label', t.langAria);
  $('rights').textContent = t.rights; $('rulesTitle').textContent = t.rulesTitle; $('rulesSub').textContent = t.rulesSub; $('rulesOk').textContent = t.ok;
  $('rulesList').innerHTML = t.ruleList.map(([i, s]) => `<li><span>${i}</span><span>${s}</span></li>`).join('');
  $('againBtn').textContent = t.again2; $('toMenuBtn').textContent = t.toMenu; stage.setAttribute('aria-label', t.stage); $('spT').textContent = t.pickTrump;
  document.querySelectorAll('#suitPick button').forEach((b) => b.setAttribute('aria-label', t.suit[b.dataset.s]));
  $('langBtn').innerHTML = lang === 'tr' ? '<span style="color:#fff">TR</span>&nbsp;|&nbsp;EN' : 'TR&nbsp;|&nbsp;<span style="color:#fff">EN</span>';
  for (let c = 0; c < 52; c++) els[c].setAttribute('aria-label', t.cardName(c));
  renderSetup(); updateDock(G && G.h && busy && G.h.turn === 0 ? '' : null); if (L) ui();
  if (G && G.h && !$('bidPick').hidden) { $('bpT').textContent = t.bidT; $('bpS').textContent = t.bidS(G.h.cur, G.h.bidder); $('bidPass').textContent = t.pass; }
  if (G && G.h && !$('buryBox').hidden) updateBury();
  if (!$('handOv').hidden && G && G.h && G.h.res) showHand();
  if (!$('winOv').hidden && G && G.over) { $('winTitle').textContent = winText(winners()); $('winSub').textContent = t.winSub(G.handNo); }
}
function applySound() { $('soundIco').textContent = soundOn ? '🔊' : '🔇'; $('soundBtn').setAttribute('aria-pressed', soundOn); }

// ---------- Girdi ----------
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('rulesOv').hidden) $('rulesOv').hidden = true; return; }
  if (!$('suitPick').hidden && /^[1-4]$/.test(e.key) && suitRes) { suitRes(+e.key - 1); return; }
  if (!$('bidPick').hidden && bidRes && (e.key === 'p' || e.key === 'P')) { bidRes(0); }
});
$('suitPick').addEventListener('click', (e) => { const b = e.target.closest('button[data-s]'); if (b && suitRes) suitRes(+b.dataset.s); });
$('bpB').addEventListener('click', (e) => { const b = e.target.closest('button[data-b]'); if (b && !b.disabled && bidRes) { Sfx.unlock(); bidRes(+b.dataset.b); } });
$('bidPass').addEventListener('click', () => { if (bidRes) { Sfx.unlock(); bidRes(0); } });
$('buryBtn').addEventListener('click', doBury);
document.querySelectorAll('.seg').forEach((s) => s.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  if (s.id === 'lvlSeg') setup.level = b.dataset.v;
  else if (s.id === 'modeSeg') setup.mode = b.dataset.v;
  else if (s.id === 'deckSeg') { setup.deck = b.dataset.v; applyDeck(); try { localStorage.setItem('rids_batak_setup', JSON.stringify(setup)); } catch (e) {} }
  else setup.len = b.dataset.v;
  renderSetup();
}));
$('startBtn').addEventListener('click', () => { Sfx.unlock(); try { localStorage.setItem('rids_batak_setup', JSON.stringify(setup)); } catch (e) {} newGame(setup.mode, setup.level, +setup.len); });
$('resumeBtn').addEventListener('click', () => { Sfx.unlock(); resume(); });
$('menuBtn').addEventListener('click', openSetup);
$('rulesBtn').addEventListener('click', () => { $('rulesOv').hidden = false; $('rulesTitle').focus(); sayac('kurallar', 'kurallar açıldı'); });
$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; render(); });
$('rulesOv').addEventListener('click', (e) => { if (e.target.id === 'rulesOv') { $('rulesOv').hidden = true; render(); } });
$('nextBtn').addEventListener('click', afterHand);
$('againBtn').addEventListener('click', () => newGame(G.mode, G.level, G.len));
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; applySound(); try { localStorage.setItem('rids_batak_sound', soundOn ? '1' : '0'); } catch (e) {} if (soundOn) Sfx.unlock(); });
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
const relayout = () => layout();
addEventListener('resize', relayout); document.addEventListener('fullscreenchange', relayout); document.addEventListener('webkitfullscreenchange', relayout);
if (window.ResizeObserver) new ResizeObserver(relayout).observe(stage);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// Deneme kancası: hızlandırma ve durum okuma (oyuncuya görünmez)
window.__batak = {
  setSpeed: (s) => { speed = s; },
  state: () => ({ G, busy, canPlay: !!canPlay(), hand: G && G.h ? G.h.hands[0].slice() : [], legal: canPlay() ? legalCards(G.h.hands[0], tbl(G.h)) : [], phase: G && G.h ? G.h.phase : null,
    bidOpen: !$('bidPick').hidden, suitOpen: !$('suitPick').hidden, buryOpen: !$('buryBox').hidden, epoch }),
  card: (c) => { const r = els[c].querySelector('.in').getBoundingClientRect(); return [r.left + r.width * 0.15, r.top + r.height * 0.18]; }, // kartın her zaman görünen sol üst köşesi
  stop: () => { epoch++; closeAll(); busy = false; },
  setHand: (o) => { Object.assign(G.h, o); render(0); updateDock(); }
};

applySound(); applyDeck(); layout(); applyLang(); openSetup();
</script>
</body>
