<style>
:root {
  --bg: #0a0e17;
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --turn: #ef4444;
  --red: #d32f2f;
  --ink: #1b1b1f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 42%, rgba(6, 9, 15, .05) 0%, rgba(6, 9, 15, .62) 100%), url("../kizma-birader/masa.webp") center / cover, #1a0f08;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı: ileti, masa, puan paneli */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 10px 8px; }
.slot { flex: none; height: 32px; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 6; margin-bottom: -32px; } /* masanın üstünde süzülür, yer kaplamaz */
.msg {
  max-width: 100%; padding: 6px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 800; color: #fff; text-align: center; line-height: 1.25;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; pointer-events: none;
}
.msg.on { opacity: 1; transform: none; }
.msg.gold { border-color: #ffd43b; }
#stage { flex: 1; min-height: 0; width: 100%; max-width: 760px; position: relative; z-index: 0; isolation: isolate; overflow: hidden; touch-action: manipulation; }

/* Kartlar: konum JS'ten transform ile, çevirme içteki katmanla */
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); transition-property: transform; transition-timing-function: cubic-bezier(.25, .8, .3, 1); will-change: transform; }
.card .in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform .35s, translate .15s; }
.card.up .in { transform: none; }
.face { position: absolute; inset: 0; border-radius: calc(var(--cw) * .05); backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 2px 6px rgba(0, 0, 0, .45), 0 0 0 .5px rgba(0, 0, 0, .35); overflow: hidden; }
.front { background: #fff; }
.front img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
.back { transform: rotateY(180deg); background: var(--back) center / 100% 100% no-repeat, #fffdf8; }
.card.play { cursor: pointer; }
.card.play:hover .in { translate: 0 calc(var(--ch) * -.1); }
.card.hit .front { box-shadow: 0 0 0 2px #ffd43b, 0 0 14px rgba(255, 212, 59, .8), 0 2px 6px rgba(0, 0, 0, .45); }
.card.hot .in { translate: 0 calc(var(--ch) * -.14); }
.card.flat .face { box-shadow: none; } /* destede yığılan gölgeler kararmasın */

.badge { position: absolute; z-index: 300; min-width: 26px; height: 22px; padding: 0 7px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 12.5px; font-weight: 800; color: #fff; background: rgba(2, 6, 23, .82); border: 1px solid rgba(255, 220, 170, .35); font-variant-numeric: tabular-nums; pointer-events: none; translate: -50% -50%; transition: opacity .2s; }
.badge.zero { opacity: 0; }
.lbl2 { position: absolute; z-index: 300; font-size: 11px; font-weight: 700; color: rgba(255, 235, 200, .8); text-shadow: 0 1px 2px rgba(0, 0, 0, .8); translate: -50% 0; pointer-events: none; white-space: nowrap; }
#pop { position: absolute; z-index: 320; left: 0; top: 0; translate: -50% -50%; pointer-events: none; font-weight: 900; font-size: 44px; color: #ffe066; letter-spacing: .02em; white-space: nowrap;
  text-shadow: 0 3px 0 #8a5a00, 0 0 18px rgba(255, 200, 0, .7), 0 6px 14px rgba(0, 0, 0, .7); opacity: 0; }
#pop.go { animation: popIn 1.3s cubic-bezier(.2, 1.4, .4, 1) forwards; }
@keyframes popIn { 0% { opacity: 0; scale: .3; } 18% { opacity: 1; scale: 1.15; } 30% { scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; scale: 1.05; translate: -50% -90%; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* Puan paneli: keçeli ahşap tepsi */
.dock {

#turnName { font-size: 17px; font-weight: 800; line-height: 1.2; color: #fff; }

.skor > div { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }

#hedef { font-size: 11px; font-weight: 700; color: rgba(255, 235, 200, .75); text-align: center; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Yatay telefon: üst çubuk solda dar menü sütunu, masa ortada, sağda ileti ve puan paneli; alt bilgi gizli */
@media (orientation: landscape) and (max-height: 500px) {

@media (orientation: landscape) and (min-height: 501px) and (min-width: 900px) {
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); gap: 12px 18px; max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 18px; }

}

<script id="motor">
// ---------- Motor: Pişti kuralları ve bilgisayar (arayüzden bağımsız) ----------
// Kart 0-51: renk = id / 13 (0 maça, 1 kupa, 2 karo, 3 sinek), değer = id % 13 + 1 (1 as, 11 vale, 12 kız, 13 papaz)
const suitOf = (c) => (c / 13) | 0, rankOf = (c) => (c % 13) + 1;
const JACK = 11, CLUB2 = 3 * 13 + 1, DIA10 = 2 * 13 + 9;
const cardPts = (c) => (rankOf(c) === JACK || rankOf(c) === 1 ? 1 : 0) + (c === CLUB2 ? 2 : 0) + (c === DIA10 ? 3 : 0);
function shuffled(rnd = Math.random) { const d = Array.from({ length: 52 }, (_, i) => i); for (let i = 51; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; }

// Kart atınca ne olur: { cap: alındı mı, pisti: 0 / 10 / 20 }
function outcome(pile, c) {
  if (!pile.length) return { cap: false, pisti: 0 };
  const top = pile[pile.length - 1], same = rankOf(top) === rankOf(c);
  if (!same && rankOf(c) !== JACK) return { cap: false, pisti: 0 };
  return { cap: true, pisti: pile.length === 1 && same ? (rankOf(c) === JACK ? 20 : 10) : 0 };
}
// El sonu puanları: kart çoğunluğu 3, vale ve as 1, sinek 2'si 2, karo 10'u 3, pişti puanları
function handScore(won, pisti) {
  const r = [0, 1].map((p) => {
    const w = won[p], o = { cards: w.length, most: 0, jacks: 0, aces: 0, club2: 0, dia10: 0, pisti: pisti[p] };
    for (const c of w) { if (rankOf(c) === JACK) o.jacks++; if (rankOf(c) === 1) o.aces++; if (c === CLUB2) o.club2 = 2; if (c === DIA10) o.dia10 = 3; }
    return o;
  });
  if (r[0].cards !== r[1].cards) r[r[0].cards > r[1].cards ? 0 : 1].most = 3;
  for (const o of r) o.total = o.most + o.jacks + o.aces + o.club2 + o.dia10 + o.pisti;
  return r;
}

// ---------- Bilgisayar ----------
// Görülen kartlar dışındakiler bilinmiyor sayılır; rakibin elindekiler bunlardan çekilmiş kabul edilir.
function comb(n, k) { if (k < 0 || k > n) return 0; let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return r; }
const pNone = (U, bad, h) => (h <= 0 ? 1 : U <= 0 ? 1 : comb(U - bad, h) / comb(U, h)); // h kartın hiçbiri "bad" türünden değil
function cpuChoose(st, level, rnd = Math.random) {
  // st: { hand, pile, seen: Set (bu oyuncunun gördüğü kartlar), oppN: rakibin karşılık verebileceği kart sayısı, deckN }
  const { hand, pile } = st;
  if (hand.length === 1) return hand[0];
  if (level === 'easy' && rnd() < 0.4) return hand[Math.floor(rnd() * hand.length)];
  const unseen = []; for (let c = 0; c < 52; c++) if (!st.seen.has(c) && !hand.includes(c)) unseen.push(c);
  const U = unseen.length, cntR = (r) => unseen.filter((c) => rankOf(c) === r).length, uJ = cntR(JACK);
  const pileVal = pile.reduce((s, c) => s + cardPts(c), 0), CARD = 0.12;
  let best = null, bv = -Infinity;
  for (const c of hand) {
    const o = outcome(pile, c);
    let v;
    if (o.cap) {
      v = pileVal + cardPts(c) + CARD * (pile.length + 1) + o.pisti;
      if (rankOf(c) === JACK && !o.pisti && level !== 'easy') v -= (st.deckN > 0 ? (level === 'hard' ? 2.2 : 1.2) : 0.3); // valeyi büyük yığına sakla
    } else if (level === 'easy') {
      v = -cardPts(c) * 0.5;
    } else {
      // rakibin alma olasılığı: aynı değerde ya da vale kartı olması
      const r = rankOf(c), mR = level === 'hard' ? cntR(r) : (r === JACK ? 3 : 3), mJ = level === 'hard' ? uJ : 4;
      const bad = r === JACK ? mR : mR + mJ, h = st.oppN;
      const pCap = 1 - pNone(level === 'hard' ? U : 40, bad, h), pSame = 1 - pNone(level === 'hard' ? U : 40, mR, h);
      const val = pileVal + cardPts(c) + CARD * (pile.length + 1);
      v = -pCap * val - (pile.length === 0 ? pSame * (r === JACK ? 20 : 10) : 0);
      if (r === JACK) v -= 2.5; // valeyi boşa atma
    }
    v += rnd() * (level === 'easy' ? 1.5 : 0.01);
    if (v > bv) { bv = v; best = c; }
  }
  return best;
}
</script>

    ov.hidden = false; setTimeout(() => q('textarea').focus({ preventScroll: true }), 30); };
  // Menüye satır ekle: Kurallar düğmesinin görünüşünü kopyalar
  const ICO = '✉';
  let btn = null;
  const label = () => { if (!btn) return; const l = t(); btn.setAttribute('aria-label', l.b); btn.title = l.b; const s = btn.querySelector('.rgRepL'); if (s) s.textContent = l.b; };
  const mount = () => {
    const rules = document.getElementById('rulesBtn'), lang = document.getElementById('langBtn');
    btn = document.createElement('button'); btn.type = 'button'; btn.id = 'rgRepBtn';
    if (rules && lang && rules.parentNode === lang.parentNode) {
      btn.className = rules.className; const sp = [...rules.children].filter((x) => x.tagName === 'SPAN');
      const a = document.createElement('span'); a.textContent = ICO; if (sp[0]) a.className = sp[0].className; btn.appendChild(a);
      if (sp[1]) { const b = document.createElement('span'); b.className = (sp[1].className + ' rgRepL').trim(); btn.appendChild(b); }
      lang.parentNode.insertBefore(btn, lang);
    } else {
      const host = document.getElementById('btn-reset-from-settings'), menu = document.getElementById('menu');
      const s = document.createElement('span'); s.className = 'rgRepL'; btn.append(ICO + ' ', s);
      if (host) { btn.className = host.className; host.parentNode.insertBefore(btn, host); }
      else if (menu) { btn.style.cssText = 'background:none;border:0;box-shadow:none;color:inherit;opacity:.75;font-size:13px;text-decoration:underline;margin-top:10px;min-height:0;padding:4px'; menu.appendChild(btn); }
      else { btn = null; return; }
    }
    btn.addEventListener('click', () => setTimeout(open, 0));
    label(); new MutationObserver(label).observe(H, { attributes: true, attributeFilter: ['lang'] });
  };
  window.rgReport = () => open();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
