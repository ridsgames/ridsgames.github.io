<style>
:root {
  --bg: #0a0e17;
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --turn: #ef4444;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 42%, rgba(6, 9, 15, .05) 0%, rgba(6, 9, 15, .62) 100%), url("../kizma-birader/masa.webp") center / cover, #1a0f08;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill:disabled { opacity: .4; cursor: default; }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 560px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı: ileti, tahta, sıra paneli */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 10px 8px; }
.slot { flex: none; height: 32px; width: 100%; display: flex; align-items: center; justify-content: center; }
.msg {
  max-width: 100%; padding: 6px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 800; color: #fff; text-align: center; line-height: 1.25;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s;
}
.msg.on { opacity: 1; transform: none; }
.msg.warn { border-color: #ffd43b; }
#boardWrap { flex: 1; min-height: 0; width: 100%; max-height: calc(100vw - 16px); position: relative; } /* dikeyde tahta, ileti ve panel ortada toplanır */
#board { position: absolute; display: block; touch-action: none; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .55)); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* Sıra paneli: keçeli ahşap tepsi */
.dock {
  flex: none; width: 100%; max-width: 440px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
  border-style: solid; border-width: 20px 17px 24px; border-image: url("../kizma-birader/tepsi.webp") 60 50 72 50 fill / 20px 17px 24px stretch;
  padding: 0 4px 0 8px; background: none;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .5)) drop-shadow(0 0 7px color-mix(in srgb, var(--turn) 60%, transparent));
  transition: filter .3s;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ava { flex: none; display: inline-block; border-radius: 50%; background: url("../kizma-birader/karakterler.webp") 0 0 / 400% 100%; }
.chip { position: relative; width: 46px; height: 46px; box-shadow: 0 0 0 3px var(--turn), 0 3px 8px rgba(0, 0, 0, .45); transition: box-shadow .3s; }
.chip.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { scale: .4; } 100% { scale: 1; } }
.who .t { min-width: 0; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
#turnName { font-size: 17px; font-weight: 800; line-height: 1.2; color: #fff; }
#turnMsg { font-size: 14px; color: #d8f3dc; line-height: 1.3; margin-top: 2px; min-height: 1.3em; }
.skor { display: grid; gap: 6px; padding: 6px 8px; border-radius: 12px; background: rgba(2, 6, 23, .35); }
.skor div { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
.skor .ava { width: 24px; height: 24px; }
.tas { flex: none; width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 1px 3px rgba(0, 0, 0, .6), inset 0 -2px 0 rgba(0, 0, 0, .25); }
.tas.w { background: radial-gradient(circle at 35% 30%, #fff, #efe4cf 55%, #c9b896); }
.tas.b { background: radial-gradient(circle at 35% 30%, #6b6b6b, #2b2b2b 55%, #111); border: 1px solid rgba(255, 255, 255, .25); }
.skor .k { font-size: 12px; font-weight: 700; color: #ffe066; margin-left: -3px; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Yatay telefon: üst çubuk solda dar menü sütunu, kare tahta ortada, sağda ileti ve sıra paneli; alt bilgi gizli */
@media (orientation: landscape) and (max-height: 500px) {
  body { display: grid; grid-template-columns: 0 minmax(0, 1fr) clamp(150px, 26vw, 210px); grid-template-rows: auto minmax(0, 1fr); }
  main { display: contents; }
  .top { grid-column: 1; grid-row: 1 / 3; border-bottom: 0; border-right: 1px solid rgba(30, 41, 59, .8); overflow-y: auto; }
  .top .in { height: auto; max-width: none; flex-direction: column; justify-content: flex-start; padding: 10px 6px; gap: 12px; }
  .logo img { width: 100%; max-width: 56px; height: auto; }
  .gname, .pill .lbl { display: none; }
  .tools { flex-direction: column; gap: 7px; }
  .pill { padding: 0 8px; }
  .pill.lang { font-size: 11px; padding: 0 6px; white-space: nowrap; }
  #boardWrap { grid-column: 2; grid-row: 1 / 3; width: auto; max-height: none; margin: 6px 4px; }
  .slot { grid-column: 3; grid-row: 1; width: auto; height: auto; min-height: 40px; padding: 8px 8px 0 0; }
  .msg { font-size: 12.5px; padding: 6px 10px; border-radius: 14px; }
  .dock { grid-column: 3; grid-row: 2; width: auto; max-width: none; margin: 8px 8px 8px 0; grid-template-columns: 1fr; align-content: space-evenly; justify-items: center; gap: 10px; padding: 4px 4px 8px; }
  .who { flex-direction: column; text-align: center; gap: 8px; }
  .chip { width: 54px; height: 54px; }
  .skor { grid-template-columns: 1fr; gap: 8px; }
  body > .ov { padding: 8px; }
  footer { display: none; }
  #setupOv .card { max-width: 560px; padding: 14px 18px; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 8px; }
  #setupOv .field { grid-template-columns: 130px 1fr; align-items: center; padding: 8px 0; }
  #setupOv .btns { margin-top: 8px; grid-auto-flow: column; grid-auto-columns: 1fr; }
}
/* Geniş yatay ekran (tablet, bilgisayar): tahta ortada büyük, panel sağda */
@media (orientation: landscape) and (min-height: 501px) and (min-width: 900px) {
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); gap: 12px 18px; max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 18px; }
  #boardWrap { grid-column: 1; grid-row: 1 / 3; align-self: stretch; justify-self: stretch; max-height: none; }
  .slot { grid-column: 2; grid-row: 1; height: auto; min-height: 44px; align-items: flex-end; }
  .msg { border-radius: 16px; }
  .dock { grid-column: 2; grid-row: 2; align-self: start; grid-template-columns: 1fr; justify-items: center; gap: 14px; padding: 10px 6px 14px; }
  .who { flex-direction: column; text-align: center; gap: 10px; }
  .chip { width: 64px; height: 64px; }
  .skor { grid-template-columns: 1fr 1fr; gap: 12px; }
}

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 64px 16px 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.field { display: grid; gap: 8px; padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); font-size: 14px; font-weight: 600; color: #cbd5e1; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { min-height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.note { margin: 10px 0 0; font-size: 12.5px; color: var(--dim); text-align: center; line-height: 1.4; }
.btns { display: grid; gap: 10px; margin-top: 14px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.final { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 4px 0 6px; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.final span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 14px; background: rgba(2, 6, 23, .55); }
.final span.win { background: rgba(6, 182, 212, .16); border: 1px solid rgba(34, 211, 238, .5); }
.final .ava { width: 32px; height: 32px; }

@media (prefers-reduced-motion: reduce) { .chip.pop { animation: none; } .msg { transition: none; } }
/* Telefonda oyun alanı tüm ekranı kullanır */
@media (max-width: 700px), (pointer: coarse) and (max-height: 1100px) { footer { display: none; } }

/* Tek düğme düzeni: sağ üstte ayarlar, sağ altta tam ekran; üst çubuk ayarlar penceresine dönüştü, oyun alanı ekranın tamamı */
.top { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; margin: 0; overflow: auto;
  background: rgba(2, 6, 23, .72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 0; grid-column: auto; grid-row: auto; }
html.rgSet .top { display: flex; }
.top .in { position: relative; width: 100%; max-width: 340px; height: auto; margin: auto; padding: 18px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 14px;
  border-radius: 20px; background: #0b1220; border: 1px solid rgba(34, 211, 238, .3); box-shadow: 0 20px 50px rgba(0, 0, 0, .6); }
.top .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.top .logo img { height: 40px; width: auto; max-width: none; }
.top .gname { display: inline-block; }
.top .tools { display: grid; gap: 8px; margin: 0; flex-direction: column; }
.top .pill { width: 100%; height: 48px; border-radius: 13px; justify-content: flex-start; gap: 12px; padding: 0 16px; font-size: 16px; font-weight: 700; }
.top .pill .ico { width: 22px; text-align: center; font-size: 18px; }
.top .pill .lbl { display: inline; }
.top .pill.lang { justify-content: center; font-size: 15px; padding: 0 16px; }
.top .rgClose { height: 44px; border-radius: 999px; border: 0; font-weight: 800; font-size: 15px; color: #e2e8f0; background: rgba(30, 41, 59, .9); }
.rgFab { position: fixed; z-index: 30; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: pointer;
  background: rgba(2, 6, 23, .62); border: 1px solid rgba(148, 163, 184, .32); color: #e2e8f0; box-shadow: 0 3px 10px rgba(0, 0, 0, .4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.rgFab:hover { background: rgba(15, 23, 42, .9); color: #fff; }
.rgFab.set { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); }
.rgFab.fs { bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); width: 36px; height: 36px; opacity: .8; }
.rgFab.fs .fsOut, html.isFs .rgFab.fs .fsIn { display: none; } html.isFs .rgFab.fs .fsOut { display: inline; }
footer { display: none; }

/* Satranç: hamle listesi, alınan taşlar, terfi seçimi */
.mlist { grid-column: 1 / -1; min-width: 0; min-height: 26px; overflow-x: auto; white-space: nowrap; padding: 4px 8px; border-radius: 8px; background: rgba(2, 6, 23, .35);
  font-size: 13px; font-weight: 600; color: #d8f3dc; line-height: 18px; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); scrollbar-width: none; }
.mlist::-webkit-scrollbar { display: none; }
.mlist i { font-style: normal; color: #94a3b8; margin: 0 3px 0 6px; } .mlist i:first-child { margin-left: 0; }
.mlist b { color: #ffe066; }
.skor div { min-width: 0; }
.cap, .pro button { font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "Apple Symbols", "DejaVu Sans", serif; }
.cap { min-width: 0; max-width: 34vw; overflow: hidden; white-space: nowrap; font-size: 16px; font-weight: 400; letter-spacing: -2px; line-height: 1; }
.cap.w, .pro.w button { color: #fbf6ea; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 1px 2px rgba(0, 0, 0, .7); }
.cap.b, .pro.b button { color: #1d1b19; text-shadow: 0 0 1px rgba(255, 255, 255, .8), 0 0 1px rgba(255, 255, 255, .8); }
.skor .k { margin-left: 0; }
.pro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.pro button { height: 68px; border-radius: 12px; border: 1px solid rgba(34, 211, 238, .4); background: linear-gradient(135deg, #f0d6aa, #d9b583); font-size: 46px; line-height: 1; padding: 0; }
.pro button:hover { border-color: var(--cyan); filter: brightness(1.06); }
</style>

<script id="fitSetupJs">
(() => {
  const ov = document.getElementById('setupOv'); const c = ov && ov.querySelector(':scope > .card, :scope > .card2'); if (!c) return;
  const over = () => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1;
  let busy = false, q = 0;
  const fit = () => {
    if (ov.hidden || busy) return; busy = true;
    c.classList.remove('fz1', 'fz2', 'fz3', 'fzc', 'fzn'); c.style.removeProperty('--fcols');
    if (over()) {
      const land = innerWidth > innerHeight && innerWidth >= 560;
      const cols = (n) => () => { c.classList.add('fzc'); c.style.setProperty('--fcols', n); };
      const nw = () => c.classList.add('fzn'), steps = [() => c.classList.add('fz1')];
      if (land) steps.push(cols(2), cols(3), () => c.classList.add('fz2'), nw);
      else steps.push(() => c.classList.add('fz2'));
      if (land && innerWidth >= 760) steps.push(cols(4));
      if (!land && innerWidth >= 340) steps.push(cols(2), nw);
      steps.push(() => c.classList.add('fz3'));
      if (land && innerWidth >= 640 && innerWidth < 760) steps.push(cols(4));
      for (const s of steps) { s(); if (!over()) break; }
    }
    busy = false;
  };
  const later = () => { cancelAnimationFrame(q); q = requestAnimationFrame(fit); };
  new MutationObserver(later).observe(ov, { attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true, characterData: true });
  addEventListener('resize', later); addEventListener('orientationchange', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
