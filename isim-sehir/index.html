* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {

.toast {
  position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); z-index: 28; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);

main { flex: 1; min-height: 0; width: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.panel { border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
/* Yatay telefon: pencereler iki sütun */
@media (orientation: landscape) and (max-height: 500px) {
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }

/* Telefon ve dokunmatik: kenar boşlukları dar */

const T = () => STR[lang];
const CATS = ['isim', 'sehir', 'hayvan', 'bitki', 'esya', 'ulke', 'meslek', 'yemek'];
const LETTERS = { tr: [...'ABCÇDEFGHİKLMNOÖPRSŞTUÜVYZ'], en: [...'ABCDEFGHIJKLMNOPRSTUVWYZ'] };
const fold = (s, lg) => {
  let x = lg === 'tr' ? s.toLocaleLowerCase('tr') : s.toLowerCase();
  x = x.replace(/[çğıöşüâîû]/g, (c) => ({ ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u', â: 'a', î: 'i', û: 'u' }[c]));
  return x.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
};
const up = (s, lg) => lg === 'tr' ? s.toLocaleUpperCase('tr') : s.toUpperCase();
const DICT = {};
for (const lg of ['tr', 'en']) {
  DICT[lg] = {};
  for (const c of CATS) {
    const m = {};
    for (const w of (WORDS[lg][c] || '').split('|')) { if (!w) continue; const L = up(w[0], lg); (m[L] = m[L] || { list: [], set: new Set() }).list.push(w); m[L].set.add(fold(w, lg)); }
    DICT[lg][c] = m;
  }
}
let setup = Object.assign({ mode: 'cpu', opp: 1, level: 'orta', pl: 2, names: ['', '', '', ''], rounds: 5, time: 90, cats: ['isim', 'sehir', 'hayvan', 'bitki', 'esya', 'ulke'] }, store.get('setup', {}));
if (!STR.tr.modes[setup.mode]) setup.mode = 'cpu';
if (!COMMON.tr.lv[setup.level]) setup.level = 'orta';
setup.cats = (setup.cats || []).filter((c) => CATS.includes(c)); if (setup.cats.length < 3) setup.cats = CATS.slice(0, 6);
let G = null, timer = null, spinT = null;

// ---------- Puanlama ----------
function judge(word, cat, letter, lg) {
  const w = (word || '').trim();
  if (!w) return 'empty';
  const f = fold(w, lg), d = DICT[lg][cat][letter];
  if (d && d.set.has(f)) return 'ok';
  const first = up(w[0], lg);
  if (first === letter || (lg === 'tr' && letter === 'İ' && first === 'I')) return f.length >= 2 ? 'unk' : 'no';
  return 'no';
}
function accepted(pi, ci) {
  const R = G.rd, st = R.jd[pi][ci], o = R.acc[pi][ci];
  if (st === 'empty') return false;
  if (o !== null && o !== undefined) return o;
  return st === 'ok' || st === 'unk';
}
function scoreRound() {
  const R = G.rd, n = G.players.length, pts = G.players.map(() => G.cats.map(() => 0));
  G.cats.forEach((c, ci) => {
    const groups = {};
    for (let pi = 0; pi < n; pi++) if (accepted(pi, ci)) { const f = fold(R.ans[pi][ci], G.lang); (groups[f] = groups[f] || []).push(pi); }
    const gs = Object.values(groups), lone = n > 1 && gs.length === 1 && gs[0].length === 1;
    for (const g of gs) for (const pi of g) pts[pi][ci] = G.mode === 'tek' ? 10 : lone ? 20 : g.length > 1 ? 5 : 10;
  });
  return pts;
}

// ---------- Akış ----------
const save = () => { if (G) store.set('game', G); };
function newGame() {
  closeAll(); stopTimer();
  const t = T(), players = [];
  if (setup.mode === 'ark') for (let i = 0; i < setup.pl; i++) players.push({ name: (setup.names[i] || '').trim() || t.pn(i), cpu: false });
  else { players.push({ name: '', you: true, cpu: false }); if (setup.mode === 'cpu') for (let i = 0; i < setup.opp; i++) players.push({ name: '', cpu: true, ci: i + 1 }); }
  G = { mode: setup.mode, level: setup.level, rounds: setup.rounds, time: setup.time, cats: setup.cats.slice(), lang, players, tot: players.map(() => 0), round: 0, used: [], phase: 'write', rd: null };
  sayac('basladi', 'oyun başladı');
  if (bitenVar) { bitenVar = false; sayac('tekrar', 'bitirdikten sonra yeni oyun'); }
  sayac(`mod/${G.mode === 'cpu' ? 'cpu-' + G.level : G.mode}-${G.rounds}`, `mod: ${G.mode}${G.mode === 'cpu' ? ', ' + G.level : ''}, ${G.rounds} tur`);
  nextRound();
}
function startFromSetup() {
  if (setup.cats.length < 3) { toast(T().mustCat, '#f87171'); return; }
  for (let i = 0; i < 4; i++) setup.names[i] = $('n' + i).value.slice(0, 12);
  store.set('setup', setup); newGame();
}
function again() { newGame(); }
const pname = (p) => p.you ? T().you : p.cpu ? T().cpuN(p.ci, G.players.length - 1) : p.name;
function nextRound() {
  G.round++;
  const pool = LETTERS[G.lang].filter((l) => !G.used.includes(l));
  const L = pool[rnd(pool.length)]; G.used.push(L);
  const n = G.players.length;
  G.rd = { letter: L, ans: G.players.map(() => G.cats.map(() => '')), jd: null, acc: G.players.map(() => G.cats.map(() => null)), cur: 0, left: G.time, started: false };
  G.phase = G.mode === 'ark' ? 'curtain' : 'write';
  save(); show(true);
}
function beginWrite() { G.phase = 'write'; G.rd.started = true; G.rd.left = G.time; save(); show(true); }
function submit(byTime) {
  if (!G || G.phase !== 'write') return;
  stopTimer(); readForm();
  if (byTime) { toast(T().timeUp, '#f59e0b'); Sfx.bad(); } else Sfx.click();
  const R = G.rd;
  if (G.mode === 'ark' && R.cur < G.players.length - 1) { R.cur++; R.left = G.time; G.phase = 'curtain'; save(); show(true); return; }
  // bilgisayar cevapları
  const pr = { kolay: 0.45, orta: 0.72, zor: 0.92 }[G.level];
  G.players.forEach((p, pi) => {
    if (!p.cpu) return;
    G.cats.forEach((c, ci) => { const d = DICT[G.lang][c][R.letter]; if (d && Math.random() < pr) R.ans[pi][ci] = d.list[rnd(d.list.length)]; });
  });
  R.jd = R.ans.map((row) => row.map((w, ci) => judge(w, G.cats[ci], R.letter, G.lang)));
  G.phase = 'review'; save(); show(true); Sfx.good();
}
function closeRound() {
  const pts = scoreRound();
  pts.forEach((row, pi) => { G.tot[pi] += row.reduce((a, b) => a + b, 0); });
  if (G.round >= G.rounds) return finish();
  nextRound();
}
function finish() {
  G.phase = 'over'; save();
  bitenVar = true; sayac('bitti', 'oyun bitti');
  const t = T(), n = G.players.length;
  const order = G.players.map((p, i) => i).sort((a, b) => G.tot[b] - G.tot[a]);
  const stats = order.map((i, k) => [`${k + 1}. ${pname(G.players[i])}`, G.tot[i]]);
  if (G.mode === 'tek') {
    const max = G.rounds * G.cats.length * 10, key = `best_${G.rounds}_${G.cats.length}`, b = store.get(key, 0), nb = G.tot[0] > b;
    if (nb) store.set(key, G.tot[0]);
    Sfx.win();
    showEnd({ ico: nb ? '🏅' : '📝', title: nb && b ? t.newBest : t.soloT, sub: t.soloS(G.tot[0], max), score: String(G.tot[0]), stats: [[t.bestLbl, Math.max(b, G.tot[0])]] });
    return;
  }
  const top = G.tot[order[0]], winners = order.filter((i) => G.tot[i] === top);
  let title, lost = false, ico = '🏆';
  if (winners.length > 1) { title = t.tie; ico = '🤝'; }
  else if (G.mode === 'cpu') { const w = winners[0] === 0; title = w ? t.youWin : t.youLose; lost = !w; ico = w ? '🏆' : '🤖'; }
  else title = t.endT(pname(G.players[winners[0]]));
  if (G.mode === 'cpu') sayac(`sonuc/${winners.length > 1 && winners.includes(0) ? 'berabere' : winners[0] === 0 ? 'insan' : 'bilgisayar'}-${G.level}`, `sonuç (${G.level})`);
  lost ? Sfx.lose() : Sfx.win();
  showEnd({ ico, title, sub: '', score: G.mode === 'cpu' ? `${G.tot[0]}` : '', lost, stats });
}

// ---------- Zamanlayıcı ----------
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function startTimer() {
  stopTimer(); if (!G.time) return;
  let last = performance.now(), lastBeep = 99;
  timer = setInterval(() => {
    if (!G || G.phase !== 'write') return stopTimer();
    if (anyOpen()) { last = performance.now(); return; }
    const now = performance.now(); G.rd.left = Math.max(0, G.rd.left - (now - last) / 1000); last = now;
    paintTime();
    if (G.rd.left <= 0) submit(true);
    else { const sec = Math.ceil(G.rd.left); if (sec <= 5 && sec !== lastBeep) { lastBeep = sec; Sfx.tone(880, 880, 0.06, 0.05, 'square', 0.06); } }
  }, 250);
}
function paintTime() {
  const R = G.rd, t = G.time;
  $('bar').classList.toggle('off', !t); $('timeTx').textContent = t ? `${Math.ceil(R.left)} ${lang === 'tr' ? 'sn' : 's'}` : '';
  if (t) { $('barI').style.width = (R.left / t * 100).toFixed(1) + '%'; $('bar').classList.toggle('warn', R.left <= 10); }
}

// ---------- Çizim ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function readForm() {
  if (!G || !G.rd) return;
  document.querySelectorAll('#form input').forEach((inp) => { G.rd.ans[G.rd.cur][+inp.dataset.c] = inp.value.slice(0, 30); });
}
function show(fresh) {
  if (!G) return;
  const t = T(), R = G.rd;
  $('scrCurtain').hidden = G.phase !== 'curtain';
  $('scrWrite').hidden = G.phase !== 'write';
  $('scrReview').hidden = !(G.phase === 'review' || G.phase === 'over');
  if (G.phase === 'curtain') {
    $('cuName').textContent = pname(G.players[R.cur]); $('cuTx').textContent = t.cuTx; $('cuBtn').textContent = t.cuGo;
    if (fresh) $('cuBtn').focus({ preventScroll: true });
  }
  if (G.phase === 'write') {
    $('roundTx').textContent = t.round(G.round, G.rounds) + (G.mode === 'ark' ? ' · ' + pname(G.players[R.cur]) : '');
    $('doneBtn').textContent = t.done;
    if (fresh) {
      $('form').innerHTML = G.cats.map((c, ci) => `<div class="fld"><label for="in${ci}">${esc(t.cats[c])}</label><input id="in${ci}" data-c="${ci}" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="${ci === G.cats.length - 1 ? 'done' : 'next'}" maxlength="30" value="${esc(R.ans[R.cur][ci])}" placeholder="${esc(R.letter)}…"><span class="ck"></span></div>`).join('');
      spinLetter(R.letter, $('letter'));
      startTimer();
      setTimeout(() => { const i = $('in0'); if (i && matchMedia('(pointer: fine)').matches) i.focus({ preventScroll: true }); }, 50);
    } else document.querySelectorAll('#form label').forEach((l, ci) => { l.textContent = t.cats[G.cats[ci]]; });
    paintTime();
  }
  if (G.phase === 'review' || G.phase === 'over') renderReview();
}
function spinLetter(L, el) {
  clearInterval(spinT);
  if (REDUCED) { el.textContent = L; return; }
  const pool = LETTERS[G.lang]; let k = 0;
  el.classList.add('spin');
  spinT = setInterval(() => {
    k++; el.textContent = pool[rnd(pool.length)]; Sfx.tone(500 + k * 25, 500 + k * 25, 0.03, 0.03, 'square', 0.03);
    if (k >= 12) { clearInterval(spinT); el.textContent = L; el.classList.remove('spin'); Sfx.good(); }
  }, 70);
}
function renderReview() {
  const t = T(), R = G.rd, pts = scoreRound(), n = G.players.length;
  $('letter2').textContent = R.letter;
  $('roundTx2').textContent = t.round(G.round, G.rounds);
  $('revHint').textContent = t.revHint(G.mode);
  $('nextBtn').textContent = G.round >= G.rounds ? t.finish : t.nextR;
  $('nextBtn').hidden = G.phase === 'over';
  $('cards').innerHTML = G.cats.map((c, ci) => `<div class="catc"><h3>${esc(t.cats[c])}</h3>${G.players.map((p, pi) => {
    const st = R.jd[pi][ci], w = R.ans[pi][ci].trim(), acc = accepted(pi, ci), pt = pts[pi][ci];
    const canTog = st !== 'empty' && st !== 'no' || (st === 'no' && G.mode === 'ark' && w);
    const bd = st === 'empty' ? '' : !acc ? '<span class="bd no">✕</span>' : st === 'ok' ? '<span class="bd ok">✓</span>' : '<span class="bd unk">?</span>';
    return `<button type="button" class="ln${canTog ? ' tog' : ''}${!acc && st !== 'empty' ? ' no' : ''}${st === 'empty' ? ' empty' : ''}" data-p="${pi}" data-c="${ci}" ${canTog ? '' : 'disabled'}><span class="who">${esc(pname(p))}</span><span class="ans">${esc(w || t.empty)}</span>${bd}<span class="pt${pt ? '' : ' z'}">${pt}</span></button>`;
  }).join('')}</div>`).join('');
  const sum = pts.map((row) => row.reduce((a, b) => a + b, 0));

<script id="fitSetupJs">
(() => {
  const ov = document.getElementById('setupOv'); const c = ov && ov.querySelector(':scope > .card, :scope > .card2'); if (!c) return;
  const over = () => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1;
  let busy = false, q = 0;
  const fit = () => {
    if (ov.hidden || busy) return; busy = true;
    c.classList.remove('fz1', 'fz2', 'fz3', 'fzc', 'fzn'); c.style.removeProperty('--fcols');
    if (over()) {
      const land = innerWidth > innerHeight && innerWidth >= 560;
      const cols = (n) => () => { c.classList.add('fzc'); c.style.setProperty('--fcols', n); };
      const nw = () => c.classList.add('fzn'), steps = [() => c.classList.add('fz1')];
      if (land) steps.push(cols(2), cols(3), () => c.classList.add('fz2'), nw);
      else steps.push(() => c.classList.add('fz2'));
      if (land && innerWidth >= 760) steps.push(cols(4));
      if (!land && innerWidth >= 340) steps.push(cols(2), nw);
      steps.push(() => c.classList.add('fz3'));
      if (land && innerWidth >= 640 && innerWidth < 760) steps.push(cols(4));
      for (const s of steps) { s(); if (!over()) break; }
    }
    busy = false;
  };
  const later = () => { cancelAnimationFrame(q); q = requestAnimationFrame(fit); };
  new MutationObserver(later).observe(ov, { attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true, characterData: true });
  addEventListener('resize', later); addEventListener('orientationchange', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
