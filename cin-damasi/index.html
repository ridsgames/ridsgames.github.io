<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Çin Daması | Ridsgames</title>
<meta name="description" content="Çin Daması: yıldız tahtada on taşını zincirleme atlayışlarla karşı köşeye taşı. 2, 3, 4 ya da 6 kişi; bilgisayara karşı ya da aynı cihazda.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --glow: rgba(251, 191, 36, 0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--glow) 28%, transparent) 0%, transparent 62%), radial-gradient(ellipse at 50% 100%, #111a2c 0%, var(--bg) 70%), var(--bg);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk yok: sağ üstte ayarlar (ve varsa skor), sağ altta tam ekran. Oyun alanı ekranın tamamı. */
.top { display: contents; }
.fab { position: fixed; z-index: 26; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  background: rgba(2, 6, 23, .62); border: 1px solid rgba(148, 163, 184, .32); color: #e2e8f0; box-shadow: 0 3px 10px rgba(0, 0, 0, .4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background .15s, transform .1s; }
.fab:hover { background: rgba(15, 23, 42, .9); color: #fff; } .fab:active { transform: scale(.94); }
.fab.set { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); }
.fab.score { top: max(6px, env(safe-area-inset-top)); right: calc(max(6px, env(safe-area-inset-right)) + 46px); }
.fab.fs { bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); width: 36px; height: 36px; opacity: .8; }
.fab.fs .fsOut, .isFs .fab.fs .fsIn { display: none; } .isFs .fab.fs .fsOut { display: inline; }
.sheet { max-width: 340px; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
.sheet .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
.sheet .logo img { display: block; height: 40px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12.5px; color: rgba(34, 211, 238, .9); padding: 2px 10px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.mlist { display: grid; gap: 8px; }
.mi { height: 48px; border-radius: 13px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 16px; font-weight: 700; color: #e2e8f0; text-align: left;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .3); }
.mi:hover { border-color: var(--cyan); color: #fff; }
.mi .ico { width: 22px; text-align: center; font-size: 18px; }
.mi.lang { justify-content: center; font-size: 15px; font-weight: 800; color: #67e8f9; letter-spacing: .04em; }
.sheet .btns { margin-top: 0; }
.scoreBody { display: grid; gap: 8px; margin: 6px 0 2px; }
.scoreBody table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 15px; }
.scoreBody th { font-size: 12px; font-weight: 700; color: var(--dim); text-align: right; padding: 0 10px; }
.scoreBody th:first-child, .scoreBody td:first-child { text-align: left; }
.scoreBody td { padding: 10px; background: rgba(2, 6, 23, .55); text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: #e2e8f0; }
.scoreBody td:first-child { border-radius: 10px 0 0 10px; color: #fff; } .scoreBody td:last-child { border-radius: 0 10px 10px 0; color: #fde68a; font-weight: 800; }
.scoreBody tr.me td { background: rgba(8, 145, 178, .22); }
.scoreBody .sn { font-size: 13px; color: var(--dim); text-align: center; margin: 0; }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 27; display: flex; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg.tall button { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.seg.tall small { font-size: 11px; font-weight: 600; opacity: .75; white-space: nowrap; }
.seg.tall .em { font-size: 19px; }
.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.custom { display: grid; gap: 6px; margin-top: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px 44px; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
.mrow button { height: 44px; border-radius: 12px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 24px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.mrow button:disabled { opacity: .35; cursor: default; }
.mrow output { text-align: center; font-size: 24px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.score { text-align: center; font-size: 44px; font-weight: 800; line-height: 1; margin: 2px 0 14px; color: #fde68a; font-variant-numeric: tabular-nums; }
.score.lost { color: #fca5a5; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .b { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); z-index: 28; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
main { flex: 1; min-height: 0; width: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.panel { border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
/* Yatay telefon: pencereler iki sütun */
@media (orientation: landscape) and (max-height: 500px) {
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  #setupOv .card { max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; align-content: start; padding: 14px 18px 0; }
  #setupOv h2, #setupOv .sub, #setupOv .btns, #setupOv .wide { grid-column: 1 / -1; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 4px; }
  #setupOv .sec { margin-top: 8px; padding-top: 8px; }
  #setupOv .btns { position: sticky; bottom: 0; z-index: 1; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 8px -18px 0; padding: 10px 18px 14px; background: linear-gradient(180deg, rgba(11, 18, 32, 0), #0b1220 30%); }
  #winOv .card { max-width: 560px; padding: 14px 18px 16px; }
  #winOv .trophy { font-size: 38px; } #winOv .score { font-size: 34px; margin-bottom: 8px; } #winOv .sub { margin-bottom: 8px; }
  #winOv .rank { grid-template-columns: 1fr 1fr; }
  #winOv .btns { grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 10px; }
}

/* Telefon ve dokunmatik: kenar boşlukları dar */
@media (max-width: 700px), (pointer: coarse) and (max-height: 1100px) {
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
}

/* Sağ üstteki ayarlar düğmesinin altına denk gelen üst satırlar yer açar */
main > :is(.hud, .opps, .bar, .info, .pls):first-child, .scr > .head:first-child, main > .side:first-child > .ballbar:first-child { margin-right: 46px; }


/* ---------- Oyuna özel ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; align-items: stretch; max-width: 760px; }
.pls { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.pl { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 999px; background: rgba(2, 6, 23, .55); border: 1.5px solid rgba(148, 163, 184, .16); font-size: 13px; font-weight: 700; color: #cbd5e1; white-space: nowrap; }
.pl i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .35); }
.pl small { color: #94a3b8; font-weight: 600; font-variant-numeric: tabular-nums; }
.pl.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, rgba(2, 6, 23, .6)); color: #fff; }
.pl.win { border-color: #fbbf24; }
.bw { min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
.star { width: 100%; height: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.star .hole { fill: #0b1220; stroke: rgba(148, 163, 184, .28); stroke-width: .045; }
.star .tri { opacity: .16; }
.star .dst { fill: #fde68a; opacity: .9; pointer-events: none; animation: dp 1s ease-in-out infinite; }
@keyframes dp { 50% { opacity: .45; } }
.star .pc { transition: transform .13s linear; cursor: pointer; }
.star .pc circle { stroke: rgba(0, 0, 0, .35); stroke-width: .05; }
.star .pc .hl { fill: rgba(255, 255, 255, .45); stroke: none; }
.star .pc.sel circle.b { stroke: #fff; stroke-width: .11; }
.star .pc.hint circle.b { stroke: #fbbf24; stroke-width: .13; }
.star .trail { fill: none; stroke: rgba(253, 230, 138, .55); stroke-width: .09; stroke-dasharray: .18 .14; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.star .lastTo { fill: none; stroke: rgba(253, 230, 138, .7); stroke-width: .07; pointer-events: none; }
.star .hintTo { fill: none; stroke: #fbbf24; stroke-width: .12; pointer-events: none; }
.side { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.status { text-align: center; font-size: 15px; font-weight: 700; color: #e2e8f0; min-height: 1.4em; }
.acts { display: flex; gap: 8px; justify-content: center; }
.acts button { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(148, 163, 184, .3); background: rgba(15, 23, 42, .8); color: #e2e8f0; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.acts button span { font-size: 16px; }
.acts button:disabled { opacity: .4; }
@media (orientation: landscape) {
  main { grid-template-columns: minmax(0, 1fr) clamp(170px, 24vw, 250px); grid-template-rows: minmax(0, 1fr) auto; max-width: 1100px; }
  .bw { grid-column: 1; grid-row: 1 / 3; }
  .pls { grid-column: 2; grid-row: 1; flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; align-items: stretch; }
  .side { grid-column: 2; grid-row: 2; }
  .acts { flex-direction: column; width: 100%; } .acts button { justify-content: center; }
}
@media (orientation: landscape) and (max-height: 500px) {
  main { gap: 6px; } .pl { padding: 3px 8px 3px 6px; font-size: 12px; } .status { font-size: 13px; } .acts button { height: 34px; }
}
@media (orientation: landscape) { .side { padding-bottom: 40px; } }

</style>
<!-- Ziyaret sayacı (GoatCounter): çerez kullanmaz; ?lang= gibi ekler aynı sayfa sayılır -->
<script>window.goatcounter = { path: (p) => p.split('?')[0] || '/' };</script>
<script data-goatcounter="https://ridsgames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<!-- Etkin süre, yeni ziyaret ve hata kaydı (ortak) -->
<script src="../assets/olcum.js" data-page="cin-damasi" data-name="Çin Daması"></script>
</head>
<body>
<header class="top">
  <button id="setBtn" class="fab set" type="button" aria-label="Ayarlar"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
  <button id="scoreBtn" class="fab score" type="button" aria-label="Skor tablosu" hidden><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M4 20h4V10H4zm6 0h4V4h-4zm6 0h4v-7h-4z"/></svg></button>
  <button id="fsBtn" class="fab fs" type="button" aria-label="Tam ekran"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="fsIn" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fsOut" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
</header>
<main id="main">
<div class="pls" id="pls"></div>
<div class="bw" id="bw"><svg id="svg" class="star" role="img"></svg></div>
<div class="side" id="side">
  <div class="status" id="status"></div>
  <div class="acts">
    <button type="button" id="undoBtn"><span>↶</span><small id="tUndo"></small></button>
    <button type="button" id="hintBtn"><span>💡</span><small id="tHint"></small></button>
  </div>
</div>

</main>

<div class="toast" id="toast" role="status"></div>

<!-- Ayarlar -->
<div class="ov" id="setOv" hidden>
  <div class="card sheet" role="dialog" aria-modal="true" aria-label="Ayarlar">
    <a id="homeLink" class="logo" href="../" aria-label="Ridsgames ana sayfa">
      <span class="homeIco" aria-hidden="true" style="display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(8,51,68,.85);border:1.5px solid rgba(34,211,238,.5);color:#67e8f9;box-shadow:0 2px 8px rgba(0,0,0,.35);flex:none"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3.3 2.6 11.6a.8.8 0 0 0 .53 1.4H5v7.2c0 .44.36.8.8.8h4.2v-5.6h4v5.6h4.2c.44 0 .8-.36.8-.8V13h1.87a.8.8 0 0 0 .53-1.4z"/></svg></span>
      <span class="gname" id="gameName">Çin Daması</span>
    </a>
    <div class="mlist">
      <button id="menuBtn" class="mi" type="button"><span class="ico">☰</span><span id="menuLbl">Yeni oyun</span></button>
      <button id="scoreMi" class="mi" type="button" hidden><span class="ico">📊</span><span id="scoreLbl">Skor tablosu</span></button>
      <button id="rulesBtn" class="mi" type="button"><span class="ico">?</span><span id="rulesLbl">Kurallar</span></button>
      <button id="soundBtn" class="mi" type="button"><span class="ico" id="soundIco">🔊</span><span id="soundLbl">Ses</span></button>
      <button id="langBtn" class="mi lang" type="button" aria-label="Dil / Language">TR | EN</button>
    </div>
    <div class="btns"><button class="big alt" id="setClose" type="button">Oyuna dön</button></div>
  </div>
</div>

<!-- Skor tablosu -->
<div class="ov" id="scoreOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="scoreTitle">
    <h2 id="scoreTitle">Skor tablosu</h2>
    <div id="scoreBody" class="scoreBody"></div>
    <div class="btns"><button class="big" id="scoreOk" type="button">Tamam</button></div>
  </div>
</div>

<!-- Yeni oyun -->
<div class="ov" id="setupOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Çin Daması</h2>
    <p class="sub" id="setupSub"></p>
    <div class="sec">
      <div class="lbl" id="plLbl"></div>
      <div class="seg" id="plSeg"><button type="button" data-n="2"></button><button type="button" data-n="3"></button><button type="button" data-n="4"></button><button type="button" data-n="6"></button></div>
    </div>
    <div class="sec">
      <div class="lbl" id="vsLbl"></div>
      <div class="seg two" id="vsSeg"><button type="button" data-v="cpu"></button><button type="button" data-v="iki"></button></div>
    </div>
    <div class="sec" id="lvSec">
      <div class="lbl" id="lvLbl"></div>
      <div class="seg" id="lvSeg"><button type="button" data-l="kolay"></button><button type="button" data-l="orta"></button><button type="button" data-l="zor"></button></div>
    </div>
    <div class="note" id="setNote"></div>

    <div class="btns">
      <button class="big" id="startBtn" type="button">Başla</button>
      <button class="big alt" id="backBtn" type="button">Oyuna dön</button>
    </div>
  </div>
</div>

<!-- Kurallar -->
<div class="ov" id="rulesOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle" tabindex="-1">Nasıl oynanır?</h2>
    <p class="sub" id="rulesSub"></p>
    <ul class="rules" id="rulesList"></ul>
    <div class="btns"><button class="big" id="rulesOk" type="button">Tamam</button></div>
  </div>
</div>

<!-- Oyun sonu -->
<div class="ov" id="winOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="trophy" id="winIco">🏆</div>
    <h2 id="winTitle"></h2>
    <p class="sub" id="winSub"></p>
    <div class="score" id="winScore"></div>
    <ol class="rank" id="statList"></ol>
    <div class="btns">

  G.pos.forEach((ps, p) => ps.forEach((i, k) => {
    const g = PCS[p * 10 + k], c = CELLS[i];
    if (!busy || G.over) g.setAttribute('transform', `translate(${c.px} ${c.py})`);
    g.classList.toggle('sel', sel === i); g.classList.toggle('hint', !!hintMv && hintMv.from === i);
  }));
  LAY.fx.innerHTML = ''; LAY.top.innerHTML = '';
  if (G.last && !hintMv) {
    mk('polyline', { points: G.last.map((i) => `${CELLS[i].px},${CELLS[i].py}`).join(' '), class: 'trail' }, LAY.fx);
  }
  if (sel >= 0) {
    const occ = occOf(G.pos);
    for (const m of movesFrom(occ, sel)) mk('circle', { cx: CELLS[m.to].px, cy: CELLS[m.to].py, r: 0.16, class: 'dst' }, LAY.top);
  }
  if (hintMv) {
    mk('polyline', { points: hintMv.path.map((i) => `${CELLS[i].px},${CELLS[i].py}`).join(' '), class: 'trail' }, LAY.fx);
    mk('circle', { cx: CELLS[hintMv.to].px, cy: CELLS[hintMv.to].py, r: 0.4, class: 'hintTo' }, LAY.top);
  }
  $('pls').innerHTML = G.pos.map((_, p) => `<span class="pl${!G.over && G.turn === p ? ' on' : ''}${G.over && G.winner === p ? ' win' : ''}" style="--c:${COLORS[G.seat[p]]}"><i></i>${pname(p)} <small>${t.inT(homeCount(G.pos, p))}</small></span>`).join('');
  const human = !isCpu(G.turn);
  $('status').textContent = G.over ? '' : busy && isCpu(G.turn) ? t.thinking(pname(G.turn)) : G.vs === 'cpu' ? (sel >= 0 ? t.pickDst : t.yourTurn) : (sel >= 0 ? `${pname(G.turn)}: ${t.pickDst.toLowerCase()}` : t.turnOf(pname(G.turn)));
  $('undoBtn').disabled = G.over || busy || !H.length; $('hintBtn').disabled = G.over || busy || !human;
}

// ---------- Etkileşim ----------
function cellAt(e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM(); if (!m) return -1;
  const q = pt.matrixTransform(m.inverse());
  let best = -1, bd = 0.55;
  CELLS.forEach((c, i) => { const d = Math.hypot(c.px - q.x, c.py - q.y); if (d < bd) { bd = d; best = i; } });
  return best;
}
svg.addEventListener('click', (e) => {
  if (!G || G.over || busy || isCpu(G.turn)) return;
  Sfx.unlock();
  const i = cellAt(e); if (i < 0) return;
  const occ = occOf(G.pos);
  if (occ[i] === G.turn) { sel = sel === i ? -1 : i; hintMv = null; Sfx.click(); render(); return; }
  if (sel >= 0) {
    const m = movesFrom(occ, sel).find((x) => x.to === i);
    if (m) { play(m); return; }
    sel = -1; render();
  } else if (hintMv && i === hintMv.to) { play(hintMv); }
});
$('undoBtn').addEventListener('click', undo);
$('hintBtn').addEventListener('click', hint);

function renderSetup() {
  segPress('plSeg', 'n', String(setup.n)); segPress('vsSeg', 'v', setup.vs); segPress('lvSeg', 'l', setup.level);
  $('lvSec').hidden = setup.vs !== 'cpu'; $('setNote').textContent = T().note[setup.vs];
}
function openSetup() { renderSetup(); closeAll(); $('setupOv').hidden = false; $('backBtn').hidden = !G || G.over; $('startBtn').focus({ preventScroll: true }); }
function gameLang() {
  const t = T();
  $('plLbl').textContent = t.plLbl; $('vsLbl').textContent = t.vsLbl; $('lvLbl').textContent = t.lvLbl;
  document.querySelectorAll('#plSeg button').forEach((b) => { b.textContent = t.plN(+b.dataset.n); });
  document.querySelectorAll('#vsSeg button').forEach((b) => { b.textContent = t.vs[b.dataset.v]; });
  document.querySelectorAll('#lvSeg button').forEach((b) => { b.textContent = t.lv[b.dataset.l]; });
  $('tUndo').textContent = t.undo; $('tHint').textContent = t.hint;
  svg.setAttribute('aria-label', t.game);
  renderSetup(); render();
}
const segH = (id, attr, fn) => $(id).addEventListener('click', (e) => { const b = e.target.closest(`button[data-${attr}]`); if (b) { fn(b.dataset[attr]); renderSetup(); } });
segH('plSeg', 'n', (v) => { setup.n = +v; });
segH('vsSeg', 'v', (v) => { setup.vs = v; });
segH('lvSeg', 'l', (v) => { setup.level = v; });

function boot() {
  const s = store.get('game', null);
  if (s && s.pos && !s.over && SEATS[s.n]) { G = s; drawBoard(); render(); next(); }
  else { drawBoard(); openSetup(); }
}
window.__cin = { state: () => G, busy: () => busy, pickMove, allMoves, movesFrom, occOf, play, CELLS, CC, homeCount, won };


// ---------- Ortak bağlantılar ----------
function applyLang() {
  const t = T();
  document.documentElement.lang = lang; document.title = t.title;
  $('homeLink').href = '../?lang=' + lang; $('homeLink').setAttribute('aria-label', t.homeLabel);
  $('gameName').textContent = t.game; $('menuLbl').textContent = t.newGame; $('rulesLbl').textContent = t.rules;
  $('menuBtn').setAttribute('aria-label', t.newGame); $('rulesBtn').setAttribute('aria-label', t.rules); $('soundBtn').setAttribute('aria-label', t.sound); $('fsBtn').setAttribute('aria-label', t.fs); $('langBtn').setAttribute('aria-label', t.langLabel);
  const c = COMMON[lang];
  $('setBtn').setAttribute('aria-label', c.settings); $('scoreBtn').setAttribute('aria-label', c.scoreT); $('scoreLbl').textContent = c.scoreT; $('scoreTitle').textContent = c.scoreT; $('scoreOk').textContent = t.ok; $('setClose').textContent = t.back;
  $('setOv').querySelector('.sheet').setAttribute('aria-label', c.settings); applySound(); $('setupTitle').textContent = t.game; $('setupSub').textContent = t.setupSub;
  $('startBtn').textContent = t.start; $('backBtn').textContent = t.back;
  $('rulesTitle').textContent = t.rulesTitle; $('rulesSub').textContent = t.rulesSub; $('rulesOk').textContent = t.ok;
  $('rulesList').innerHTML = t.ruleList.map(([i, s]) => `<li><span>${i}</span><span>${s}</span></li>`).join('');
  $('againBtn').textContent = t.again; $('viewBtn').textContent = t.view; $('toMenuBtn').textContent = t.toMenu;
  $('langBtn').innerHTML = lang === 'tr' ? '<span style="color:#fff">TR</span>&nbsp;|&nbsp;EN' : 'TR&nbsp;|&nbsp;<span style="color:#fff">EN</span>';
  gameLang();
}
function applySound() { $('soundIco').textContent = soundOn ? '🔊' : '🔇'; $('soundBtn').setAttribute('aria-pressed', soundOn); $('soundLbl').textContent = COMMON[lang][soundOn ? 'soundOn' : 'soundOff']; }
const hasScore = typeof scoreHtml === 'function';
function openScore() { closeAll(); $('scoreBody').innerHTML = hasScore ? scoreHtml() : ''; $('scoreOv').hidden = false; $('scoreOk').focus({ preventScroll: true }); }
function syncFs() { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); document.documentElement.classList.toggle('isFs', on); $('fsBtn').setAttribute('aria-pressed', on); }
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('setOv').hidden || !$('scoreOv').hidden) { $('setOv').hidden = $('scoreOv').hidden = true; }
  else if (!$('rulesOv').hidden) $('rulesOv').hidden = true;
  else if (!$('setupOv').hidden && G) closeAll();
  else if (!$('winOv').hidden) closeAll();
});
$('startBtn').addEventListener('click', () => { Sfx.unlock(); startFromSetup(); });
$('backBtn').addEventListener('click', closeAll);
$('menuBtn').addEventListener('click', () => { $('setOv').hidden = true; openSetup(); });
$('setBtn').addEventListener('click', () => { Sfx.unlock(); const was = !$('setOv').hidden; closeAll(); $('setOv').hidden = was; });
$('setClose').addEventListener('click', () => { $('setOv').hidden = true; });
$('setOv').addEventListener('click', (e) => { if (e.target.id === 'setOv') $('setOv').hidden = true; });
$('scoreBtn').hidden = $('scoreMi').hidden = !hasScore;
$('scoreBtn').addEventListener('click', () => { if (!$('scoreOv').hidden) { $('scoreOv').hidden = true; return; } openScore(); });
$('scoreMi').addEventListener('click', openScore);
$('scoreOk').addEventListener('click', () => { $('scoreOv').hidden = true; });
$('scoreOv').addEventListener('click', (e) => { if (e.target.id === 'scoreOv') $('scoreOv').hidden = true; });
document.addEventListener('fullscreenchange', syncFs); document.addEventListener('webkitfullscreenchange', syncFs);
$('rulesBtn').addEventListener('click', () => { $('setOv').hidden = true; $('rulesOv').hidden = false; $('rulesTitle').focus(); sayac('kurallar', 'kurallar açıldı'); });
$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; });
$('rulesOv').addEventListener('click', (e) => { if (e.target.id === 'rulesOv') $('rulesOv').hidden = true; });
$('againBtn').addEventListener('click', () => { Sfx.unlock(); again(); });
$('viewBtn').addEventListener('click', closeAll);
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; applySound(); store.set('sound', soundOn ? 1 : 0); if (soundOn) Sfx.unlock(); });
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
applySound(); applyLang(); boot();
</script>

<script id="fitSetupJs">
(() => {
  const ov = document.getElementById('setupOv'); const c = ov && ov.querySelector(':scope > .card, :scope > .card2'); if (!c) return;
  const over = () => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1;
  let busy = false, q = 0;
  const fit = () => {
    if (ov.hidden || busy) return; busy = true;
    c.classList.remove('fz1', 'fz2', 'fz3', 'fzc', 'fzn'); c.style.removeProperty('--fcols');
    if (over()) {
      const land = innerWidth > innerHeight && innerWidth >= 560;
      const cols = (n) => () => { c.classList.add('fzc'); c.style.setProperty('--fcols', n); };
      const nw = () => c.classList.add('fzn'), steps = [() => c.classList.add('fz1')];
      if (land) steps.push(cols(2), cols(3), () => c.classList.add('fz2'), nw);
      else steps.push(() => c.classList.add('fz2'));
      if (land && innerWidth >= 760) steps.push(cols(4));
      if (!land && innerWidth >= 340) steps.push(cols(2), nw);
      steps.push(() => c.classList.add('fz3'));
      if (land && innerWidth >= 640 && innerWidth < 760) steps.push(cols(4));
      for (const s of steps) { s(); if (!over()) break; }
    }
    busy = false;
  };
  const later = () => { cancelAnimationFrame(q); q = requestAnimationFrame(fit); };
  new MutationObserver(later).observe(ov, { attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true, characterData: true });
  addEventListener('resize', later); addEventListener('orientationchange', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
  later();
})();
</script>
