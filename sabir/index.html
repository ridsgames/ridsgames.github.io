<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sabır | Ridsgames</title>
<meta name="description" content="Sabır: klasik Klondike solitaire. Kartları astan papaza diz; 1 ya da 3 kart çekiş, geri al, ipucu ve otomatik bitirme.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --glow: rgba(251, 191, 36, 0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--glow) 28%, transparent) 0%, transparent 62%), radial-gradient(ellipse at 50% 100%, #111a2c 0%, var(--bg) 70%), var(--bg);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 64px 16px 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg.tall button { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.seg.tall small { font-size: 11px; font-weight: 600; opacity: .75; white-space: nowrap; }
.seg.tall .em { font-size: 19px; }
.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.custom { display: grid; gap: 6px; margin-top: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px 44px; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
.mrow button { height: 44px; border-radius: 12px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 24px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.mrow button:disabled { opacity: .35; cursor: default; }
.mrow output { text-align: center; font-size: 24px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.score { text-align: center; font-size: 44px; font-weight: 800; line-height: 1; margin: 2px 0 14px; color: #fde68a; font-variant-numeric: tabular-nums; }
.score.lost { color: #fca5a5; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .b { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; top: 64px; z-index: 15; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
main { flex: 1; min-height: 0; width: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.panel { border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
/* Yatay telefon: üst çubuk soldaki dikey menü paneli olur; pencereler menü panelini örtmez; alt bilgi gizli */
@media (orientation: landscape) and (max-height: 500px) {
  body { display: grid; grid-template-columns: clamp(120px, 17vw, 160px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .top { grid-column: 1; grid-row: 1; border-bottom: 0; border-right: 1px solid rgba(30, 41, 59, .8); overflow-y: auto; }
  .top .in { height: auto; min-height: 100%; max-width: none; flex-direction: column; justify-content: center; padding: 14px 8px; gap: 16px; }
  .logo { flex-direction: column; gap: 6px; }
  .gname { display: inline; font-size: 11px; white-space: nowrap; }
  .tools { flex-wrap: wrap; justify-content: center; gap: 8px; }
  .pill { white-space: nowrap; }
  main { grid-column: 2; grid-row: 1; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 6px; }
  body > .ov { padding: 8px 8px 8px calc(clamp(120px, 17vw, 160px) + 8px); }
  .toast { top: 12px; left: calc(50% + clamp(120px, 17vw, 160px) / 2); }
  footer { display: none; }
  #setupOv .card { max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; align-content: start; padding: 14px 18px 0; }
  #setupOv h2, #setupOv .sub, #setupOv .btns, #setupOv .wide { grid-column: 1 / -1; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 4px; }
  #setupOv .sec { margin-top: 8px; padding-top: 8px; }
  #setupOv .btns { position: sticky; bottom: 0; z-index: 1; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 8px -18px 0; padding: 10px 18px 14px; background: linear-gradient(180deg, rgba(11, 18, 32, 0), #0b1220 30%); }
  #winOv .card { max-width: 560px; padding: 14px 18px 16px; }
  #winOv .trophy { font-size: 38px; } #winOv .score { font-size: 34px; margin-bottom: 8px; } #winOv .sub { margin-bottom: 8px; }
  #winOv .rank { grid-template-columns: 1fr 1fr; }
  #winOv .btns { grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 10px; }
}

/* Telefon ve dokunmatik: oyun alanı ekranın tamamını kullanır */
@media (max-width: 700px), (pointer: coarse) and (max-height: 1100px) {
  footer { display: none; }
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
}
@media (max-width: 520px) { .top .in { height: 44px; padding: 0 8px; } .pill { height: 32px; min-width: 32px; } }


/* Ortak iskambil: SVG yüz ve sırt */
.pc { background: #fff; overflow: hidden; }
.pc > img.pci { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
.pcb { background: var(--pcback) center / 100% 100% no-repeat, #fffdf8 !important; }
.pcHand { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.pcHand .row { display: flex; }
.pcHand .row + .row { margin-top: calc(var(--cw) * var(--rov, -.6)); }
.pcHand .row .pc + .pc { margin-left: calc(var(--cw) * var(--ov, -.44)); }

/* ---------- Oyuna özel ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; align-items: stretch; max-width: 1100px; }
.bar { display: flex; align-items: center; gap: 14px; font-variant-numeric: tabular-nums; min-width: 0; }
.bar .iv { display: flex; flex-direction: column; line-height: 1.1; }
.bar .iv small { font-size: 11px; color: #94a3b8; font-weight: 600; }
.bar .iv b { font-size: 16px; color: #e2e8f0; } .bar #iTime { color: #fde68a; }
.bar .bt { margin-left: auto; display: flex; gap: 6px; }
.bar button { height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(148, 163, 184, .3); background: rgba(15, 23, 42, .8); color: #e2e8f0; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 5px; }
.bar button span { font-size: 16px; line-height: 1; }
.bar button:disabled { opacity: .4; }
.bar #autoBtn { background: linear-gradient(135deg, #059669, #10b981); border-color: transparent; color: #fff; }
.board { position: relative; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; --cw: 50px; }
.slot { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.42); border-radius: calc(var(--cw) * .1); border: 2px dashed rgba(148, 163, 184, .22); display: grid; place-items: center; color: rgba(148, 163, 184, .3); font-size: calc(var(--cw) * .5); transition: transform .18s ease-out; }
.slot.st { border-style: solid; border-color: rgba(103, 232, 249, .3); cursor: pointer; }
.slot.st.re::after { content: '↻'; color: #67e8f9; }
.slot.st.none::after { content: '✕'; font-size: calc(var(--cw) * .32); }
.cd { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.42); border-radius: calc(var(--cw) * .1); background: #fff; border: 1px solid #cbd5e1; box-shadow: 0 1px 3px rgba(0, 0, 0, .45); transition: transform .18s ease-out; cursor: pointer; will-change: transform; }
.cd .r { position: absolute; left: calc(var(--cw) * .07); top: calc(var(--cw) * .045); font-weight: 900; font-size: calc(var(--cw) * .33); line-height: 1; letter-spacing: -.05em; white-space: nowrap; }
.cd .r i { font-style: normal; font-size: calc(var(--cw) * .29); margin-left: 1px; }
.cd b { position: absolute; right: calc(var(--cw) * .08); bottom: calc(var(--cw) * .06); font-size: calc(var(--cw) * .62); line-height: 1; font-weight: 400; }
.cd b.fc { font-size: calc(var(--cw) * .5); font-weight: 900; bottom: calc(var(--cw) * .1); }
.cd.s0, .cd.s3 { color: #0f172a; } .cd.s1, .cd.s2 { color: #dc2626; }
.cd.down { background: repeating-linear-gradient(45deg, #155e75 0 4px, #0e7490 4px 8px); border: 2px solid #cffafe; cursor: default; }
.cd.down.stk { cursor: pointer; }
.cd.down > * { display: none; }
.cd.drag { transition: none; box-shadow: 0 12px 26px rgba(0, 0, 0, .55); }
.cd.hint, .slot.hint { box-shadow: 0 0 0 3px #fbbf24, 0 0 16px rgba(251, 191, 36, .75); }
.cd.shake { animation: shake .28s; }
@keyframes shake { 25% { margin-left: -5px; } 75% { margin-left: 5px; } }
.board.won .cd { animation: glow .9s ease-in-out calc(var(--k, 0) * 18ms) 2; }
@keyframes glow { 50% { filter: brightness(1.25) drop-shadow(0 0 10px #fde68a); } }
@media (orientation: landscape) and (max-height: 500px) {
  main { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); gap: 8px; }
  .bar { grid-column: 2; grid-row: 1; flex-direction: column; align-items: stretch; gap: 8px; }
  .bar .iv { align-items: center; } .bar .bt { margin: auto 0 0; flex-direction: column; }
  .bar button { height: 36px; justify-content: center; padding: 0 10px; }
  .board { grid-column: 1; grid-row: 1; }
}
@media (max-width: 380px) { .bar button small { display: none; } .bar button { padding: 0 11px; } }

/* Ortak iskambil çizimi: köşe dizini sütunlarda okunsun diye büyütülür */
.cd.pc { border: 0; border-radius: calc(var(--cw) * .07); box-shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 0 0 .5px rgba(0, 0, 0, .45); }
.cd.pc .r { left: 0; top: 0; padding: calc(var(--cw) * .05) calc(var(--cw) * .05) calc(var(--cw) * .03) calc(var(--cw) * .06); background: #fff; border-radius: calc(var(--cw) * .07) 0 calc(var(--cw) * .1) 0; font-size: calc(var(--cw) * .32); font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: -.04em; }
.cd.pc .r i { font-size: calc(var(--cw) * .28); }
.cd.down { background: var(--pcback) center / 100% 100% no-repeat, #fffdf8; border: 0; }
.cd.hint { box-shadow: 0 0 0 3px #fbbf24, 0 0 16px rgba(251, 191, 36, .75); }
.cd.drag { box-shadow: 0 12px 26px rgba(0, 0, 0, .55); }
.cd.down > * { display: none !important; }

</style>
<!-- Ziyaret sayacı (GoatCounter): çerez kullanmaz; ?lang= gibi ekler aynı sayfa sayılır -->
<script>window.goatcounter = { path: (p) => p.split('?')[0] || '/' };</script>
<script data-goatcounter="https://ridsgames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

</head>
<body>
<header class="top">
  <div class="in">
    <a id="homeLink" class="logo" href="../" aria-label="Ridsgames ana sayfa">
      <img src="../assets/logo.webp" alt="Ridsgames" width="112" height="52">
      <span class="gname" id="gameName">Sabır</span>
    </a>
    <div class="tools">
      <button id="menuBtn" class="pill" type="button" aria-label="Yeni oyun"><span class="ico">☰</span><span class="lbl" id="menuLbl">Yeni oyun</span></button>
      <button id="soundBtn" class="pill" type="button" aria-label="Ses"><span class="ico" id="soundIco">🔊</span></button>
      <button id="rulesBtn" class="pill" type="button" aria-label="Kurallar"><span class="ico">?</span><span class="lbl" id="rulesLbl">Kurallar</span></button>
      <button id="fsBtn" class="pill" type="button" aria-label="Tam ekran"><span class="ico">⛶</span></button>
      <button id="langBtn" class="pill lang" type="button" aria-label="Dil / Language">TR | EN</button>
    </div>
  </div>
</header>

<main id="main">
<div class="bar" id="bar">
  <span class="iv"><small id="lTime"></small><b id="iTime">0:00</b></span>
  <span class="iv"><small id="lMoves"></small><b id="iMoves">0</b></span>
  <div class="bt">
    <button type="button" id="undoBtn"><span>↶</span><small id="tUndo"></small></button>
    <button type="button" id="hintBtn"><span>💡</span><small id="tHint"></small></button>
    <button type="button" id="autoBtn" hidden><span>⚡</span><small id="tAuto"></small></button>
  </div>
</div>
<div class="board" id="board"></div>

</main>

<footer>© 2026 Ridsgames. <span id="rights">Tüm hakları saklıdır.</span></footer>
<div class="toast" id="toast" role="status"></div>

<!-- Yeni oyun -->
<div class="ov" id="setupOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Sabır</h2>
    <p class="sub" id="setupSub"></p>
    <div class="sec">
      <div class="lbl" id="drawLbl"></div>
      <div class="seg two" id="drawSeg"><button type="button" data-d="1"></button><button type="button" data-d="3"></button></div>
      <div class="note" id="drawNote"></div>
    </div>

    <div class="btns">
      <button class="big" id="startBtn" type="button">Başla</button>
      <button class="big alt" id="backBtn" type="button">Oyuna dön</button>
    </div>
  </div>
</div>

<!-- Kurallar -->
<div class="ov" id="rulesOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle" tabindex="-1">Nasıl oynanır?</h2>
    <p class="sub" id="rulesSub"></p>
    <ul class="rules" id="rulesList"></ul>
    <div class="btns"><button class="big" id="rulesOk" type="button">Tamam</button></div>
  </div>
</div>

<!-- Oyun sonu -->
<div class="ov" id="winOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="trophy" id="winIco">🏆</div>
    <h2 id="winTitle"></h2>
    <p class="sub" id="winSub"></p>
    <div class="score" id="winScore"></div>
    <ol class="rank" id="statList"></ol>
    <div class="btns">
      <button class="big" id="againBtn" type="button">Tekrar oyna</button>
      <button class="big alt" id="viewBtn" type="button">Tahtaya bak</button>
      <button class="big alt" id="toMenuBtn" type="button">Ayarları değiştir</button>
    </div>
  </div>
</div>

<script>
// ---------- Ortak: dil, ses, pencereler, sayaç ----------
const COMMON = {
  tr: { homeLabel: 'Ridsgames ana sayfa', newGame: 'Yeni oyun', rules: 'Kurallar', sound: 'Ses', fs: 'Tam ekran', langLabel: 'Dil değiştir', rights: 'Tüm hakları saklıdır.',
    start: 'Başla', back: 'Oyuna dön', again: 'Tekrar oyna', view: 'Tahtaya bak', toMenu: 'Ayarları değiştir', rulesTitle: 'Nasıl oynanır?', ok: 'Tamam', sec: 'sn',

  showEnd({ ico: '🏆', title: t.winT, sub: rec && prev ? t.newBest : t.winSub,
    stats: [[t.tTime, fmt(G.time)], [t.tMoves, G.moves], [t.tBest, fmt(rec ? G.time : prev)], [t.tMode, t.drawN[G.draw]]] });
}

// ---------- Yerleşim ----------
function computeL() {
  const b = $('board'), W = b.clientWidth, H = b.clientHeight, R = 1.42;
  const g = clamp(Math.round(Math.min(W, H) * 0.012), 3, 12);
  const cwTop = Math.min((W - 6 * g) / 7, (H - g) / (R * 4.4), 112);
  const cwSide = Math.min((W - 9 * g) / 9, (H - 3 * g) / (4 * R), 112);
  const side = cwSide > cwTop * 1.04, cw = Math.max(20, Math.floor(side ? cwSide : cwTop)), ch = Math.round(cw * R);
  const P = { W, H, g, cw, ch, side };
  if (!side) {
    const ox = Math.round((W - (7 * cw + 6 * g)) / 2), cx = (c) => ox + c * (cw + g);
    P.stock = [cx(6), 0]; P.waste = [cx(5), 0]; P.f = (s) => [cx(s), 0]; P.tabX = cx; P.tabTop = ch + Math.max(g, 10); P.wfan = [-cw * 0.3, 0];
  } else {
    const ox = Math.round((W - (9 * cw + 9 * g)) / 2);
    P.stock = [ox, 0]; P.waste = [ox, ch + g]; P.tabX = (c) => ox + (c + 1) * (cw + g) + Math.round(g / 2); P.f = (s) => [ox + 8 * (cw + g) + g, s * (ch + g)]; P.tabTop = 0; P.wfan = [0, ch * 0.24];
  }
  return P;
}
function setCard(id, x, y, z, up, k) {
  const e = els[id]; POS[id] = [x, y];
  e.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`; e.style.zIndex = z; e.style.setProperty('--k', k);
  e.classList.toggle('down', !up); e.classList.remove('stk');
}
function place(e, p) { e.style.transform = `translate(${Math.round(p[0])}px,${Math.round(p[1])}px)`; }
function render() {
  if (!G || !els.length) return;
  const t = T(); L = computeL(); $('board').style.setProperty('--cw', L.cw + 'px');
  place(slots.stock, L.stock);
  slots.stock.classList.toggle('re', !G.stock.length && G.waste.length > 0);
  slots.stock.classList.toggle('none', !G.stock.length && !G.waste.length);
  for (let s = 0; s < 4; s++) place(slots['f' + s], L.f(s));
  for (let c = 0; c < 7; c++) place(slots['t' + c], [L.tabX(c), L.tabTop]);
  let z = 1, k = 0;
  G.stock.forEach((id) => { setCard(id, L.stock[0], L.stock[1], z++, false, 0); els[id].classList.add('stk'); });
  const wn = G.waste.length, fanN = G.draw === 3 ? Math.min(3, wn) : 1;
  G.waste.forEach((id, i) => { const f = Math.max(0, i - (wn - fanN)); setCard(id, L.waste[0] + L.wfan[0] * f, L.waste[1] + L.wfan[1] * f, z++, true, 0); });
  G.found.forEach((p, s) => p.forEach((id) => setCard(id, ...L.f(s), z++, true, k++)));
  G.tab.forEach((col, c) => {
    const nd = col.filter((id) => !G.up[id]).length, nu = col.length - nd;
    let dO = L.cw * 0.22, uO = L.cw * (L.side ? 0.42 : 0.52);
    const avail = L.H - L.tabTop - L.ch - 2;
    if (nd * dO + Math.max(0, nu - 1) * uO > avail) {
      uO = Math.max(L.cw * 0.22, (avail - nd * dO) / Math.max(1, nu - 1));
      if (nd * dO + (nu - 1) * uO > avail) dO = Math.max(3, (avail - (nu - 1) * uO) / Math.max(1, nd));
    }
    let y = L.tabTop;
    col.forEach((id) => { setCard(id, L.tabX(c), y, z++, G.up[id], 0); y += G.up[id] ? uO : dO; });
  });
  $('iTime').textContent = fmt(G.time); $('iMoves').textContent = G.moves;
  $('undoBtn').disabled = !U.length || G.over; $('hintBtn').disabled = G.over;
  $('autoBtn').hidden = !canAuto();
}

// ---------- Etkileşim ----------
const board = $('board');
function buildBoard() {
  const mk = (cls, txt) => { const e = document.createElement('div'); e.className = cls; if (txt) e.textContent = txt; board.appendChild(e); return e; };
  slots.stock = mk('slot st');
  for (let s = 0; s < 4; s++) slots['f' + s] = mk('slot', SUIT[s]);
  for (let c = 0; c < 7; c++) slots['t' + c] = mk('slot');
  for (let id = 0; id < 52; id++) {
    const e = mk(`cd s${suit(id)}`); e.dataset.id = id;
    const r = rank(id); e.classList.add('pc'); e.innerHTML = `${pcImg(suit(id), r)}<span class="r">${RANK[r]}<i>${SUIT[suit(id)]}</i></span>`;
    els.push(e);
  }
}
board.addEventListener('pointerdown', (e) => {
  if (!G || G.over || autoRun || e.button > 0 || drag) return;
  Sfx.unlock(); clearHint();
  const el = e.target.closest('.cd');
  if (!el) { if (e.target.closest('.slot') === slots.stock) stockTap(); return; }
  const id = +el.dataset.id, lc = loc(id);
  if (lc.t === 's') { stockTap(); return; }
  const m = movable(id, lc); if (!m) return;
  e.preventDefault();
  drag = { ...m, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false, pid: e.pointerId };
  try { board.setPointerCapture(e.pointerId); } catch (_) { }
});
board.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(drag.dx, drag.dy) < 7) return;
  if (!drag.moved) { drag.moved = true; drag.ids.forEach((id, k) => { els[id].classList.add('drag'); els[id].style.zIndex = 900 + k; }); }
  drag.ids.forEach((id) => { const [x, y] = POS[id]; els[id].style.transform = `translate(${Math.round(x + drag.dx)}px,${Math.round(y + drag.dy)}px)`; });
});
function endDrag(e, cancel) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  d.ids.forEach((id) => els[id].classList.remove('drag'));
  if (cancel) { render(); return; }
  if (!d.moved) {
    const to = autoTarget(d.ids, d.from);
    if (to) doMove(d.ids, d.from, to);
    else { const e0 = els[d.ids[0]]; e0.classList.remove('shake'); void e0.offsetWidth; e0.classList.add('shake'); buzz(10); render(); }
    return;
  }
  const [x0, y0] = POS[d.ids[0]], cx = x0 + d.dx + L.cw / 2, cy = y0 + d.dy + L.ch / 2;
  let best = null, bd = 1e9;
  const cands = [];
  for (let s = 0; s < 4; s++) { const [fx, fy] = L.f(s); cands.push({ to: { t: 'f', s }, x: fx + L.cw / 2, y: fy + L.ch / 2 }); }
  for (let c = 0; c < 7; c++) { const col = G.tab[c], last = col[col.length - 1]; const y = col.length && !(d.from.t === 'tab' && d.from.c === c) ? POS[last][1] : L.tabTop; cands.push({ to: { t: 'tab', c }, x: L.tabX(c) + L.cw / 2, y: y + L.ch / 2, col: true }); }
  for (const q of cands) {
    if (!legal(d.ids, d.from, q.to)) continue;
    let dist = Math.hypot(q.x - cx, q.y - cy);
    if (q.col && Math.abs(q.x - cx) < L.cw * 0.75 && cy > L.tabTop) dist = Math.min(dist, Math.abs(q.x - cx));
    if (dist < bd) { bd = dist; best = q; }
  }
  if (best && bd < L.cw * 1.4) doMove(d.ids, d.from, best.to); else render();
}
board.addEventListener('pointerup', (e) => endDrag(e, false));
board.addEventListener('pointercancel', (e) => endDrag(e, true));
$('undoBtn').addEventListener('click', undo);
$('hintBtn').addEventListener('click', hint);
$('autoBtn').addEventListener('click', autoFinish);
document.addEventListener('keydown', (e) => {
  if (anyOpen() || !G) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); stockTap(); }
  else if (e.key.toLowerCase() === 'h' && !e.ctrlKey && !e.metaKey) hint();
});
setInterval(() => {
  if (G && G.started && !G.over && !document.hidden) { G.time++; $('iTime').textContent = fmt(G.time); if (G.time % 5 === 0) store.set('game', G); }
}, 1000);
new ResizeObserver(() => render()).observe(board);

function renderSetup() { segPress('drawSeg', 'd', String(setup.draw)); $('drawNote').textContent = T().drawNote[setup.draw]; }
function openSetup() { renderSetup(); closeAll(); $('setupOv').hidden = false; $('backBtn').hidden = !G || G.over; $('startBtn').focus({ preventScroll: true }); }
function gameLang() {
  const t = T();
  $('drawLbl').textContent = t.drawLbl;
  document.querySelectorAll('#drawSeg button').forEach((b) => { b.textContent = t.drawN[b.dataset.d]; });
  $('lTime').textContent = t.lTime; $('lMoves').textContent = t.lMoves;
  $('tUndo').textContent = t.undo; $('tHint').textContent = t.hint; $('tAuto').textContent = t.auto;
  $('undoBtn').title = t.undo; $('hintBtn').title = t.hint;
  renderSetup(); render();
}
$('drawSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-d]'); if (b) { setup.draw = +b.dataset.d; renderSetup(); } });

function boot() {
  buildBoard();
  const s = store.get('game', null);
  if (s && s.tab && !s.over) { G = s; U = store.get('undo', []); render(); }
  else openSetup();
}
window.__sabir = { state: () => G, render, findMoves, autoTarget, doMove, stockTap, undo, canAuto, autoFinish, legal, busy: () => autoRun };


// ---------- Ortak bağlantılar ----------
function applyLang() {
  const t = T();
  document.documentElement.lang = lang; document.title = t.title;
  $('homeLink').href = '../?lang=' + lang; $('homeLink').setAttribute('aria-label', t.homeLabel);
  $('gameName').textContent = t.game; $('menuLbl').textContent = t.newGame; $('rulesLbl').textContent = t.rules;
  $('menuBtn').setAttribute('aria-label', t.newGame); $('rulesBtn').setAttribute('aria-label', t.rules); $('soundBtn').setAttribute('aria-label', t.sound); $('fsBtn').setAttribute('aria-label', t.fs); $('langBtn').setAttribute('aria-label', t.langLabel);
  $('rights').textContent = t.rights; $('setupTitle').textContent = t.game; $('setupSub').textContent = t.setupSub;
  $('startBtn').textContent = t.start; $('backBtn').textContent = t.back;
  $('rulesTitle').textContent = t.rulesTitle; $('rulesSub').textContent = t.rulesSub; $('rulesOk').textContent = t.ok;
  $('rulesList').innerHTML = t.ruleList.map(([i, s]) => `<li><span>${i}</span><span>${s}</span></li>`).join('');
  $('againBtn').textContent = t.again; $('viewBtn').textContent = t.view; $('toMenuBtn').textContent = t.toMenu;
  $('langBtn').innerHTML = lang === 'tr' ? '<span style="color:#fff">TR</span>&nbsp;|&nbsp;EN' : 'TR&nbsp;|&nbsp;<span style="color:#fff">EN</span>';
  gameLang();
}
function applySound() { $('soundIco').textContent = soundOn ? '🔊' : '🔇'; $('soundBtn').setAttribute('aria-pressed', soundOn); }
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('rulesOv').hidden) $('rulesOv').hidden = true;
  else if (!$('setupOv').hidden && G) closeAll();
  else if (!$('winOv').hidden) closeAll();
});
$('startBtn').addEventListener('click', () => { Sfx.unlock(); startFromSetup(); });
$('backBtn').addEventListener('click', closeAll);
$('menuBtn').addEventListener('click', openSetup);
$('rulesBtn').addEventListener('click', () => { $('rulesOv').hidden = false; $('rulesTitle').focus(); sayac('kurallar', 'kurallar açıldı'); });
$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; });
$('rulesOv').addEventListener('click', (e) => { if (e.target.id === 'rulesOv') $('rulesOv').hidden = true; });
$('againBtn').addEventListener('click', () => { Sfx.unlock(); again(); });
$('viewBtn').addEventListener('click', closeAll);
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; applySound(); store.set('sound', soundOn ? 1 : 0); if (soundOn) Sfx.unlock(); });
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
applySound(); applyLang(); boot();
</script>
