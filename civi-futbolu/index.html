<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #16191d; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .r { color: #ff6a5c; } .b { color: #5aa8ff; }
  #wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 2px 6px 6px; }
  canvas { display: block; touch-action: none; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 62px 16px 16px; overflow-y: auto; text-align: center; background: #0b0d10d9; }
  /* Otomatik kenar boşluğu menüyü ortalar; sığmazsa boşluk sıfırlanır, menü üst çubuğun altından başlar ve kaydırılır */

  .ov p { max-width: 330px; font-size: 14px; line-height: 1.5; opacity: .85; }
  h1 { font-size: 40px; }
  button { font: inherit; font-size: 18px; font-weight: 700; min-width: 220px; padding: 12px 24px; border: 0; border-radius: 12px; background: #e9b44c; color: #2b1a05; cursor: pointer; }
  #gol, #aut { position: fixed; left: 0; right: 0; top: 42%; text-align: center; font-size: 72px; font-weight: 900; text-shadow: 0 4px 16px #000; pointer-events: none; }
  #aut { font-size: 52px; }
  /* Para seçimi: büyük para çivilerin arasından zor geçer */
  .para { display: flex; gap: 6px; }
  .para button { min-width: 0; width: 96px; padding: 8px 6px; font-size: 15px; background: #2a3038; color: #e8eef7; }
  .para button small { display: block; font-size: 11px; font-weight: 600; opacity: .7; }
  .para button.on { background: #e9b44c; color: #2b1a05; }
  /* Yatay telefonda menü tek ekrana sığsın */
  @media (max-height: 460px) { .ov { gap: 8px; } h1 { font-size: 28px; } .ov p { max-width: 520px; font-size: 13px; } .ov button { font-size: 16px; padding: 7px 20px; } .ov .para button { font-size: 14px; padding: 4px 6px; } }
  [hidden] { display: none !important; }
  /* Üst çubuk: logo ana sayfaya döner (diğer oyunlardaki gibi), sağda tam ekran düğmesi; tam ekranda logo gizlenir */
  .home-bar { flex: none; width: 100%; position: relative; z-index: 30; background: rgba(2, 6, 23, .85); border-bottom: 1px solid rgba(30, 41, 59, .8); }
  .home-bar .in { max-width: 72rem; height: 52px; margin: 0 auto; padding: 0 12px; display: flex; align-items: center; }
  .home-bar a { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .home-bar img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
  .home-bar .gname { font: 12px Inter, system-ui, sans-serif; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
  @media (max-width: 520px) { .home-bar .in { height: 46px; } .home-bar img { height: 28px; } .home-bar .gname { display: none; } }
  .home-bar button { min-width: 34px; height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(34, 211, 238, .4); background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); color: #e2e8f0; font-size: 16px; font-weight: 600; }
  #menuBtn { margin-left: auto; } #fsBtn { margin-left: 8px; }
  body:has(.ov:not([hidden])) #menuBtn { visibility: hidden; }          /* menü açıkken menü düğmesi gereksiz */
  :root:fullscreen #homeLink { display: none; }
  :root:-webkit-full-screen #homeLink { display: none; }
  /* Yatay telefon: saha yan çevrilir (kaleler sağda ve solda) ve ekranı boydan boya kaplar; skor tabelaları kalelerin
     arkasındaki şeritte durur. Logo, menü ve tam ekran düğmeleri ekranın köşelerine, tabelaların üstüne ve altına iner */
  @media (orientation: landscape) and (max-height: 500px) {
    .home-bar { position: fixed; inset: 0; background: none; border: 0; pointer-events: none; }
    .home-bar .in { height: 100%; max-width: none; padding: 0; }
    .home-bar a, .home-bar button { position: absolute; pointer-events: auto; }
    #homeLink { top: 8px; left: 6px; }
    .home-bar img { height: clamp(20px, 3.4vw, 30px); }
    .home-bar .gname { display: none; }
    #menuBtn { left: 6px; bottom: 8px; margin: 0; }
    #fsBtn { right: 6px; top: 8px; margin: 0; }
    #wrap { padding: 0; }
    .ov { flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; padding: 12px 64px; gap: 8px 10px; }
    .ov > :first-child, .ov > :last-child { margin: 0; }
    .ov h1, .ov p { flex-basis: 100%; }
    .ov .para { flex-basis: 100%; justify-content: center; }
    .ov .para button { width: 96px; }
    .ov p { max-width: 560px; }
    .ov button { min-width: 0; width: 150px; }
  }
</style>

<body>

<script>
// Gerçek ölçüler: 20×32 cm'lik tahta (sokakta yaygın 20×30 sunta), 1 mm = 2 birim. Kırmızı kenar da tahtanın
// boyalı kısmı: para üstünden kayar, merkezi tahtanın dış kenarını geçince düşer
const W = 400, H = 640, L = 16, R = 384, TOP = 46, BOT = 594; // tahta ve yeşil saha sınırları
const GL = 140, GR = 260, GD = 34;   // kale ağzı 6 cm (direkler x), file derinliği 17 mm
// Paralar (2005 serisi 5, 10, 25 kuruş; çap mm): büyüdükçe çivilerin arasından geçmek zorlaşır. Sokakta 5 kuruş
// amatör, 10 kuruş yarı pro, 25 kuruş pro parası sayılırdı. 1 mm 2 birim olduğundan yarıçap birim = çap mm
const COINS = [17, 19.25, 21.5];
let CR = COINS[0];
const NR = 2.5, PR = 4;              // çivi gövdesi yarıçapı: 5 cm'lik tel çivi (2,5 mm), kale direği kalın çivi (4 mm)
const NH = 8, HR = 5, GH = 12;       // eğik bakış: çivi boyu, çivi başı (5 mm), kale direği boyu
// Ayar düğmeleri: oyunun hissi bunlarla değişir
const DECEL = 3000;                  // tahtanın sürtünmesi: boyalı tahtada ~0,15 (0,15 × 9,81 m/s² × 2 birim/mm)
const E_NAIL = 0.55, E_NET = 0.1;    // çividen sekme; fileye çarpan paranın kalan hızı
const FLING = 1.6, MAX_V = 2800, MIN_V = 150; // fırlatma gücü (ekrandaki tahta gerçeğinden ~3 kat küçük); en sert itiş 1,4 m/s
const CARRY = 50;                    // parayı tutup taşıyabileceğin mesafe
const HAK = 3;                       // sırası gelen arka arkaya bu kadar iter
// Bilgisayarın nişan (radyan) ve güç hatası: kolay, orta, zor. Ölçülen gol oranı sıra (3 itiş) başına ~%21, ~%45, ~%75
const AI_ERR = [[1.1, .25], [.5, .13], [.38, .11]];
const DT = 1 / 240, WIN = 5;

// Çiviler, gerçek tahtadaki gibi: iki takımın 11'er oyuncusu (kaleci, 4 defans, 4 orta saha, 2 forvet), 4 köşe bayrağı,
// her kalede iki kalın direk ve filenin arka köşelerinde iki çivi. Mavi'nin dizilişi Kırmızı'nınkinin sahanın ortası
// etrafında yarım dönmüşü (iki taraf eşit); sağ ve sol bilerek simetrik değil, düz koridor kalmasın
const nails = [];
const KIRMIZI = [[200, 560], [68, 495], [152, 495], [243, 495], [334, 495], [62, 375], [140, 375], [225, 375], [318, 375], [158, 210], [262, 210]];
for (const [x, y] of KIRMIZI) nails.push({ x, y, r: NR, h: NH }, { x: W - x, y: H - y, r: NR, h: NH });
for (const x of [L + 6, R - 6]) for (const y of [TOP, BOT]) nails.push({ x, y, r: NR, h: NH, flag: 1 });
for (const [y, d] of [[TOP, -1], [BOT, 1]]) for (const x of [GL, GR]) nails.push({ x, y, r: PR, h: GH, post: d }, { x, y: y + d * GD, r: NR, h: GH });
const NETS = [];                     // file: yanlar ve arka
for (const [y0, y1] of [[TOP, TOP - GD], [BOT, BOT + GD]]) NETS.push([GL, y0, GL, y1], [GR, y0, GR, y1], [GL, y1, GR, y1]);

let hitV = 0;
// Fizik adımı; gol olursa 'top' (kırmızının golü) ya da 'bottom' (mavinin golü), para tahtadan düşerse 'out' döner
function step(c) {
  const s = Math.hypot(c.vx, c.vy);
  if (s) { const k = Math.max(0, s - DECEL * DT) / s; c.vx *= k; c.vy *= k; }
  c.x += c.vx * DT; c.y += c.vy * DT;
  for (const n of nails) {
    const m = CR + n.r, dx = c.x - n.x, dy = c.y - n.y;
    if (dx >= m || dx <= -m || dy >= m || dy <= -m) continue;
    const d = Math.hypot(dx, dy);
    if (d >= m) continue;
    const nx = d ? dx / d : 0, ny = d ? dy / d : 1, vn = c.vx * nx + c.vy * ny;
    c.x = n.x + nx * m; c.y = n.y + ny * m;
    if (vn < 0) { c.vx -= (1 + E_NAIL) * vn * nx; c.vy -= (1 + E_NAIL) * vn * ny; hitV = Math.max(hitV, -vn); }
  }
  if (c.y < TOP + CR || c.y > BOT - CR) for (const [x1, y1, x2, y2] of NETS) { // fileye dışarıdan çarpan para yumuşakça durur
    const ex = x2 - x1, ey = y2 - y1, u = Math.max(0, Math.min(1, ((c.x - x1) * ex + (c.y - y1) * ey) / (ex * ex + ey * ey)));
    const dx = c.x - x1 - u * ex, dy = c.y - y1 - u * ey, d = Math.hypot(dx, dy);
    if (!d || d >= CR) continue;
    const nx = dx / d, ny = dy / d, vn = c.vx * nx + c.vy * ny;
    c.x += nx * (CR - d); c.y += ny * (CR - d);
    if (vn < 0) { c.vx -= (1 + E_NET) * vn * nx; c.vy -= (1 + E_NET) * vn * ny; }
  }
  if (c.x > GL && c.x < GR) {        // kale ağzı: paranın merkezi çizgiyi geçerse gol
    if (c.y < TOP) return 'top';
    if (c.y > BOT) return 'bottom';
  }
  if (c.x < 0 || c.x > W || c.y < 0 || c.y > H) return 'out'; // merkezi kenarı geçen para devrilip düşer
}

// Bilgisayarın arayışı (alt kaleye atar): her yön ve güçte itişi simüle eder, sonucu gol olasılığı cinsinden puanlar.
// Gol 1, kendi kalesine -1. Son hakta para nerede kalırsa Kırmızı oradan oynar: Mavi kalesine yakınsa eksi. Önceki
// haklarda kale önüne yaklaşmak artı. Tahtadan düşen para rakibe geçer. En iyi adayları kendi nişan ve güç hatasıyla
// birkaç kez daha dener, ortalaması en yüksek olanı seçer: hatası büyükse riskli sert vuruş yerine güvenli itişe döner
const AI_SP = [400, 700, 1000, 1400, 1900, 2400, 2800];
function best(p, last, [ea, es] = [0, 0]) {
  const val = (a, sp) => {
    const c = { x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp };
    let g; for (let k = 0; k < 2400 && !g && (c.vx || c.vy); k++) g = step(c);
    if (g === 'bottom') return 1;
    if (g === 'top') return -1;
    const rakip = -.3 * (1 - c.y / H);
    if (g === 'out') return rakip - .1;
    return last ? rakip : .5 * Math.exp(-Math.hypot(c.x - W / 2, BOT - 70 - c.y) / 120);
  };
  const ad = [];
  for (let i = 0; i < 120; i++) for (const sp of AI_SP) { const a = i / 120 * 2 * Math.PI; ad.push({ a, sp, v: val(a, sp) }); }
  ad.sort((x, y) => y.v - x.v);
  const aday = [...ad.filter((x) => x.v === 1).slice(0, 25), ...ad.filter((x) => x.v < 1).slice(0, 25)];
  let b = aday[0], bs = -Infinity;
  for (const x of aday) {
    let t = x.v;
    for (const [da, ds] of [[-.4, 0], [-.2, 0], [.2, 0], [.4, 0], [0, -.3], [0, .3]]) t += val(x.a + da * ea, x.sp * (1 + ds * es));
    if (t > bs) { bs = t; b = x; }
  }
  return b;
}

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), board = document.createElement('canvas'), pins = document.createElement('canvas');
let mode, level = 2, para = 0, score = [0, 0], turn = 0, hak = HAK, outAt = 0, coin, state = 'menu', hold = null, aiTimer, ac, scale = 1, K = 1, coinImg;
// Dil: ?lang=en|tr adresten, yoksa tarayıcı dili (tr dışı her dil İngilizce). Türkçe metinler HTML'de durur.
const LANG = /^tr/i.test(new URLSearchParams(location.search).get('lang') || navigator.language || 'tr') ? 'tr' : 'en';
const I18N_EN = {
  title: 'Nail Football', red: 'Red', blue: 'Blue', cpu: 'Computer', goal: 'GOAL!', menu: 'Menu', fs: 'Full screen',
  help: 'Press on the coin, hold and drag, then flick it. Red shoots at the top goal, Blue at the bottom one. Each turn is 3 pushes in a row, played from where the coin stops. A coin that falls off the board goes to the opponent. First to 5 goals wins.',
  helpSide: 'Press on the coin, hold and drag, then flick it. Red shoots at the right goal, Blue at the left one. Each turn is 3 pushes in a row, played from where the coin stops. A coin that falls off the board goes to the opponent. First to 5 goals wins.',
  kr5: '17 mm', kr5s: 'beginner', kr10: '19 mm', kr10s: 'semi-pro', kr25: '21.5 mm', kr25s: 'pro', out: 'OUT!', throwIn: 'OUT!',
  p2: '2 Players', vsCpu: 'Against the computer:', easy: 'Easy', medium: 'Medium', hard: 'Hard', again: 'Play Again',
  think: 'thinking…', turn: 'Turn', aim: 'press the coin, drag, flick',
  cpuWins: 'Computer wins', youWin: 'You win!', wins: 'wins!'
};
function t(key, trText) { return LANG === 'en' ? I18N_EN[key] : trText; }
if (LANG === 'en') {
  document.documentElement.lang = 'en'; document.title = I18N_EN.title;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = I18N_EN[el.dataset.i18n]; });
  $('menuBtn').setAttribute('aria-label', I18N_EN.menu);
  $('homeLink').setAttribute('aria-label', 'Ridsgames home');
  $('fsBtn').setAttribute('aria-label', I18N_EN.fs);
}
$('homeLink').href = '../?lang=' + LANG;
const names = () => [t('red', 'Kırmızı'), mode === 'ai' ? t('cpu', 'Bilgisayar') : t('blue', 'Mavi')];

// Sayaç: oyun başlatma ve bitirme olayları (GoatCounter yüklenmediyse sessizce geçer)
function sayac(olay, ad) { try { window.goatcounter.count({ path: 'civi-futbolu/' + olay, title: 'Çivi Futbolu: ' + ad, event: true }); } catch {} }
let bitenVar = false;                                                    // bitirdikten sonra açılan yeni oyun "tekrar" sayılır
const LV = ['kolay', 'orta', 'zor'];
function newGame(m) {
  mode = m; score = [0, 0]; clearTimeout(aiTimer); sayac('basladi', 'oyun başladı');
  if (bitenVar) { bitenVar = false; sayac('tekrar', 'bitirdikten sonra yeni oyun'); }
  sayac(m === 'ai' ? 'mod/bilgisayar-' + LV[level] : 'mod/2-oyuncu', m === 'ai' ? 'mod: bilgisayara karşı, ' + LV[level] : 'mod: 2 oyuncu');
  try { ac = ac || new AudioContext(); } catch {}
  CR = COINS[para]; COIN = CR + 6; coinImg = makeCoin();
  $('menu').hidden = $('end').hidden = $('gol').hidden = $('aut').hidden = true;
  kickoff(0);
}
function kickoff(t) { coin = { x: W / 2, y: H / 2, vx: 0, vy: 0 }; turn = t; hak = HAK; aim(); }
function aim() {
  state = 'aim';
  if (mode === 'ai' && turn) aiTimer = setTimeout(aiShoot, hak === HAK ? 700 : 450);
}
// Yatay telefonda saha saat yönünde çeyrek tur döner: mantıksal üst sağa gelir. Fizik ve bilgisayar aynı koordinatlarda kalır
const yatayMq = matchMedia('(orientation: landscape) and (max-height: 500px)');
let yan = false, TR = [1, 0, 0, 1, 0, 0], sb = 36;                     // sb: kale arkasındaki tabela şeridinin derinliği
const HELP_TR = $('menu').querySelector('[data-i18n="help"]').textContent;
function helpText() {
  $('menu').querySelector('[data-i18n="help"]').textContent = yan
    ? t('helpSide', 'Paranın üstüne bas, tutup sürükle ve fırlat. Kırmızı sağdaki, Mavi soldaki kaleye atar. Sırası gelen arka arkaya 3 kez iter, para durduğu yerden oynanır. Tahtadan düşen para rakibe geçer. 5 gol atan kazanır.')
    : t('help', HELP_TR);
}
function shoot(vx, vy) { coin.vx = vx; coin.vy = vy; hak--; state = 'moving'; }
// Tahtadan düşen para rakibe geçer, düştüğü yerin hemen içine kenara dayalı konur (gerçekte yarısı dışarıda bırakılır,
// ekranda yarısı kesilmesin diye içeride). Orada çivi ya da file varsa kenar boyunca en yakın boş yere kayar
function out() {
  const yanKenar = coin.x < 0 || coin.x > W;
  state = 'out'; outAt = performance.now();
  $('aut').textContent = yanKenar ? t('throwIn', 'TAÇ!') : t('out', 'AUT!'); $('aut').hidden = false;
  tik(0.2, 220, 0.3);
  setTimeout(() => {
    $('aut').hidden = true;
    if (state !== 'out') return;
    place(coin, yanKenar); turn = 1 - turn; hak = HAK; aim();
  }, 1100);
}
const free = (x, y) => nails.every(n => Math.hypot(x - n.x, y - n.y) >= CR + n.r) && !((y < TOP || y > BOT) && x > GL - CR && x < GR + CR);
function place(c, boyuna) {
  const x0 = Math.min(W - CR, Math.max(CR, c.x)), y0 = Math.min(H - CR, Math.max(CR, c.y));
  for (let k = 0; k < 400; k++) {
    const o = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 2;
    const x = boyuna ? x0 : Math.min(W - CR, Math.max(CR, x0 + o)), y = boyuna ? Math.min(H - CR, Math.max(CR, y0 + o)) : y0;
    if (free(x, y)) { c.x = x; c.y = y; break; }
  }
  c.vx = c.vy = 0;
}
function goal(side) {
  const s = side === 'top' ? 0 : 1;  // kırmızı yukarı, mavi aşağı atar
  score[s]++; state = 'goal'; golBy = s;
  coin.x = Math.min(GR - CR, Math.max(GL + CR, coin.x)); coin.y = s ? BOT + GD / 2 : TOP - GD / 2; // para filede
  $('gol').className = s ? 'b' : 'r'; $('gol').hidden = false;
  tik(0.25, 520, 0.5);
  setTimeout(() => {
    $('gol').hidden = true;
    if (state !== 'goal') return;
    if (score[s] < WIN) return kickoff(1 - s);
    state = 'over'; sayac('bitti', 'oyun bitti'); bitenVar = true;
    if (mode === 'ai') sayac(`sonuc/${s ? 'bilgisayar' : 'insan'}-${LV[level]}`, `sonuç: ${s ? 'bilgisayar' : 'insan'} kazandı (${LV[level]})`);
    $('endText').textContent = mode === 'ai' ? (s ? t('cpuWins', 'Bilgisayar kazandı') : t('youWin', 'Kazandın!')) : `${names()[s]} ${t('wins', 'kazandı!')}`;
    $('end').hidden = false;

}

// Bilgisayar: en iyi itişi bulur, seviyesine göre nişan ve güç hatası katar
function aiShoot() {
  if (state !== 'aim' || mode !== 'ai' || !turn) return;
  const [ea, es] = AI_ERR[level], b = best(coin, hak === 1, AI_ERR[level]);
  const a = b.a + (Math.random() - .5) * ea, sp = b.sp * (1 + (Math.random() - .5) * es);
  shoot(Math.cos(a) * sp, Math.sin(a) * sp);
}

// Dokunma / fare: paraya bas, tutup sürükle, bırak. Hız = parmağın son ~50 ms'deki hızı: fırlatışın hızlanan sonu ölçülür,
// yavaş başlangıcı ortalamayı düşürmez. Tarayıcının birleştirdiği ara örnekler de alınır
function pos(e) {
  const r = cv.getBoundingClientRect(), sx = (e.clientX - r.left) / scale, sy = (e.clientY - r.top) / scale;
  return yan ? { x: sy, y: H + sb - sx, t: e.timeStamp } : { x: sx, y: sy - sb, t: e.timeStamp };
}
cv.onpointerdown = e => {
  if (state !== 'aim' || (mode === 'ai' && turn) || hold) return;
  const p = pos(e);
  if (Math.hypot(p.x - coin.x, p.y - coin.y) > CR * 2.2) return;
  cv.setPointerCapture(e.pointerId);
  hold = { ax: coin.x, ay: coin.y, ox: p.x - coin.x, oy: p.y - coin.y, pts: [p] };
};
cv.onpointermove = e => {
  if (!hold) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) hold.pts.push(pos(ev));
  const p = hold.pts[hold.pts.length - 1];
  const dx = p.x - hold.ox - hold.ax, dy = p.y - hold.oy - hold.ay;
  if (Math.hypot(dx, dy) > CARRY) return release(p.t);   // para elden çıktı
  const c = { x: hold.ax + dx, y: hold.ay + dy, vx: 0, vy: 0 };
  if (step(c)) return release(p.t);                      // elle kaleye sokulmaz
  coin.x = c.x; coin.y = c.y;
};

  const h = hold, k = h.pts.findIndex(q => now - q.t < 50);              // pencerede tek örnek varsa bir öncekiyle ölçülür
  const pts = k < 0 ? [] : h.pts.slice(Math.max(0, Math.min(k, h.pts.length - 2)));
  hold = null;
  let vx = 0, vy = 0;
  if (pts.length > 1) {
    const a = pts[0], b = pts[pts.length - 1], dt = (b.t - a.t) / 1000;
    if (dt > 0) { vx = (b.x - a.x) / dt * FLING; vy = (b.y - a.y) / dt * FLING; }
  }
  const s = Math.hypot(vx, vy);
  if (s < MIN_V) { coin.x = h.ax; coin.y = h.ay; return; } // yavaş bırakıldı, atış sayılmaz
  if (s > MAX_V) { vx *= MAX_V / s; vy *= MAX_V / s; }
  shoot(vx, vy);
}

function tik(vol, f, d) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(1e-3, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}

// Eğik bakış: yerden h yüksekteki nokta ekranda h yukarı kayar, gölgesi sağ alta düşer (ışık sol üstten).
// Saha yan dönünce de ekrana göre böyle kalsın diye kaydırmalar ekran yönünden sahaya çevrilir: scr(sağa, aşağı)
const scr = (dx, dy) => yan ? [dy, -dx] : [dx, dy];

const GOALS = [[TOP, -1, '#1f6fe5', '#a9cfff'], [BOT, 1, '#e0262b', '#ffaaa5']]; // üstte Mavi'nin, altta Kırmızı'nın kalesi
function goalPath(g, y0, d, f) {      // kalenin ipleri: direklerin ve arka çivilerin başlarından gerilir; f kaleyi ya da gölgesini çizer
  const y1 = y0 + d * GD; g.beginPath();
  for (const [x, y, z, X, Y, Z] of [[GL, y0, 1, GR, y0, 1], [GL, y1, 1, GR, y1, 1], [GL, y0, 1, GL, y1, 1], [GR, y0, 1, GR, y1, 1], [GL, y1, 0, GR, y1, 0]]) {

}

  const y1 = y0 + d * GD, ya = Math.min(y0, y1), ln = (a, b) => { g.moveTo(...a); g.lineTo(...b); };
  g.strokeStyle = net + '99'; g.lineWidth = .7; g.beginPath();           // file: tavan ve arka
  for (let x = GL; x <= GR; x += 6) { ln(up(x, y0, GH), up(x, y1, GH)); ln([x, y1], up(x, y1, GH)); }
  for (let k = 6; k < GD; k += 6) ln(up(GL, ya + k, GH), up(GR, ya + k, GH));
  for (let k = 3; k < GH; k += 3) ln(up(GL, y1, k), up(GR, y1, k));
  g.stroke();
  g.lineCap = g.lineJoin = 'round';
  g.strokeStyle = col; g.lineWidth = 1.5; goalPath(g, y0, d, up); g.stroke();
}

function drawBoard(g, p) {
  g.fillStyle = '#b3201c'; g.fillRect(0, 0, W, H);                      // kırmızı çerçeve
  if (tex.cerceve.naturalWidth) g.drawImage(tex.cerceve, 0, 0, W, H);
  g.fillStyle = '#2a000030'; g.fillRect(0, 0, W, H);                    // dokudaki parlamayı bastır
  g.strokeStyle = '#5a0d0b'; g.lineWidth = 2; g.strokeRect(1, 1, W - 2, H - 2);
  g.save(); g.beginPath();                                               // yeşil boyalı tahta ve kale cepleri
  g.rect(L, TOP, R - L, BOT - TOP); g.rect(GL, TOP - GD, GR - GL, GD); g.rect(GL, BOT, GR - GL, GD);
  g.clip();
  g.fillStyle = '#1f9d4b'; g.fillRect(L, TOP - GD, R - L, BOT - TOP + 2 * GD);
  if (tex.zemin.naturalWidth) g.drawImage(tex.zemin, L, TOP - GD, R - L, BOT - TOP + 2 * GD);
  g.restore();
  g.strokeStyle = '#00000040'; g.lineWidth = 1; g.strokeRect(L, TOP, R - L, BOT - TOP); // boya sınırı: kenar yükseltisi yok
  const cx = W / 2, cy = H / 2, a = Math.asin(.6);                       // beyaz saha çizgileri
  g.strokeStyle = '#ffffffe0'; g.lineWidth = 2; g.beginPath();
  g.rect(L + 6, TOP, R - L - 12, BOT - TOP);
  g.moveTo(L + 6, cy); g.lineTo(R - 6, cy);
  g.moveTo(cx + 50, cy); g.arc(cx, cy, 50, 0, 7);
  for (const [y, d] of [[TOP, 1], [BOT, -1]]) {
    g.rect(85, y, 230, d * 82); g.rect(130, y, 140, d * 30);            // ceza sahası, kale alanı
    const py = y + d * 58, a0 = d > 0 ? a : Math.PI + a, a1 = d > 0 ? Math.PI - a : -a;
    g.moveTo(cx + 40 * Math.cos(a0), py + 40 * Math.sin(a0)); g.arc(cx, py, 40, a0, a1); // ceza yayı
    for (const [x, q] of [[L + 6, d > 0 ? 0 : -Math.PI / 2], [R - 6, d > 0 ? Math.PI / 2 : Math.PI]]) {
      g.moveTo(x + 10 * Math.cos(q), y + 10 * Math.sin(q)); g.arc(x, y, 10, q, q + Math.PI / 2); // korner
    }
  }
  g.stroke();
  g.fillStyle = '#ffffffe0'; g.beginPath(); g.arc(cx, cy, 2.5, 0, 7); g.fill();
  for (const G of GOALS) {                                               // kalenin gölgesi, sonra kale
    const [ox, oy] = shade(0, 0, GH);
    g.fillStyle = '#0000001a'; g.fillRect(GL + ox, Math.min(G[0], G[0] + G[1] * GD) + oy, GR - GL, GD);
    g.strokeStyle = '#00000038'; g.lineWidth = 1.5; goalPath(g, G[0], G[1], shade); g.stroke();
    drawGoal(g, G);

    const h = n.h, hr = n.post ? HR + 1 : HR, w = n.r * 1.1;
    const [sx, sy] = shade(n.x, n.y, h), b = g.createRadialGradient(sx, sy, 0, sx, sy, hr + 1);
    g.strokeStyle = '#0000005a'; g.lineWidth = w;                        // tahtaya düşen gölge
    g.beginPath(); g.moveTo(n.x, n.y); g.lineTo(sx, sy); g.stroke();
    b.addColorStop(0, '#00000066'); b.addColorStop(1, '#0000');
    g.fillStyle = b; g.beginPath(); g.arc(sx, sy, hr + 1, 0, 7); g.fill();
    g.fillStyle = '#00000080'; g.beginPath(); oval(g, n.x, n.y, n.r, n.r * .6); g.fill(); // girdiği delik
    const [tx, ty] = up(n.x, n.y, h), [bx, by] = up(n.x, n.y, h - .8), [lx, ly] = scr(-1, 0), [hx, hy] = scr(-1.2, -.8);
    const s = p.createLinearGradient(n.x + lx * w, n.y + ly * w, n.x - lx * w, n.y - ly * w); // p: paranın üstünde kalan gövde ve baş

    p.strokeStyle = s; p.lineWidth = w; p.beginPath(); p.moveTo(n.x, n.y); p.lineTo(tx, ty); p.stroke();
    if (n.post) {                                                        // direğe sarılı ip

      p.strokeStyle = col; p.lineWidth = w + 1.2; p.beginPath(); p.moveTo(...up(n.x, n.y, 1.5)); p.lineTo(...up(n.x, n.y, h - 2)); p.stroke();
      p.strokeStyle = '#ffffff55'; p.lineWidth = .6; p.beginPath();
      for (let k = 2.5; k < h - 2; k += 1.6) { const [a1, b1] = up(n.x, n.y, k), [o1, o2] = scr(w / 2 + .6, 0); p.moveTo(a1 - o1, b1 - o2 - .5); p.lineTo(a1 + o1, b1 + o2 + .5); }
      p.stroke();
    }
    if (n.flag) {                                                        // köşe bayrağı
      const [fx, fy] = up(n.x, n.y, h - 1.5), [mx, my] = up(n.x, n.y, h - 6.5), [ox, oy] = scr(n.x < W / 2 ? 10 : -10, 0);
      p.fillStyle = '#ffd23f'; p.strokeStyle = '#8a6a00'; p.lineWidth = .5;
      p.beginPath(); p.moveTo(fx, fy); p.lineTo((fx + mx) / 2 + ox, (fy + my) / 2 + oy); p.lineTo(mx, my); p.closePath(); p.fill(); p.stroke();
    }
    p.fillStyle = '#262626'; p.beginPath(); oval(p, bx, by, hr, hr * .6); p.fill();
    const hd = p.createRadialGradient(tx + hx, ty + hy, .2, tx, ty, hr);
    hd.addColorStop(0, '#fdfdfd'); hd.addColorStop(.35, '#b9b9b9'); hd.addColorStop(1, '#4a4a4a');
    p.fillStyle = hd; p.beginPath(); oval(p, tx, ty, hr, hr * .6); p.fill();
  }
}

// Para: kalın kenar, kabarık çerçeve ve kabartma Ridsgames logosu; her boyutlanmada bir kez çizilir
let COIN = CR + 6;                                                       // görselin yarı boyu (gölge payıyla)
function tint(col, w, h) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = Math.ceil(w * K); c.height = Math.ceil(h * K);
  g.drawImage(logo, 0, 0, c.width, c.height); g.globalCompositeOperation = 'source-in';
  g.setTransform(K, 0, 0, K, c.width / 2, c.height / 2); g.fillStyle = col; g.fillRect(-w, -h, 2 * w, 2 * h);
  return c;
}
function makeCoin() {
  const c = document.createElement('canvas'), g = c.getContext('2d'), T = 1.3; // T: paranın kalınlığı
  c.width = c.height = Math.ceil(2 * COIN * K); g.setTransform(K, 0, 0, K, c.width / 2, c.height / 2);
  g.shadowColor = '#0009'; g.shadowBlur = 3 * K; g.shadowOffsetX = 1.5 * K; g.shadowOffsetY = 2.5 * K;
  g.fillStyle = '#6e4f0f'; g.beginPath(); g.arc(0, 0, CR, 0, 7); g.fill(); g.shadowColor = '#0000';
  g.translate(0, -T);
  const face = g.createRadialGradient(-4, -5, 1, 0, 0, CR);
  face.addColorStop(0, '#fff2c2'); face.addColorStop(.55, '#ddb043'); face.addColorStop(1, '#a3761a');
  g.fillStyle = face; g.beginPath(); g.arc(0, 0, CR, 0, 7); g.fill();
  const lit = (a, b) => { const l = g.createLinearGradient(-CR, -CR, CR, CR); l.addColorStop(0, a); l.addColorStop(1, b); return l; };
  g.lineWidth = 2; g.strokeStyle = lit('#fff7d6', '#7a5610'); g.beginPath(); g.arc(0, 0, CR - 1.2, 0, 7); g.stroke();
  g.lineWidth = .6; g.strokeStyle = lit('#7a5610', '#fff3c8'); g.beginPath(); g.arc(0, 0, CR - 2.4, 0, 7); g.stroke();
  if (logo.naturalWidth) {                                               // gölge, ışık, yüz: kabartma
    const w = CR * 1.4, h = w * logo.naturalHeight / logo.naturalWidth;
    for (const [o, col] of [[.5, '#5f430b'], [-.5, '#fff8dc'], [0, face]]) g.drawImage(tint(col, w, h), o - w / 2, o - h / 2, w, h);
  }
  return c;
}

// Skor tabelaları kalelerin arkasında: herkesinki kendi kalesinin arkasında (Kırmızı altta / solda, Mavi üstte / sağda).
// Ekran düzleminde çizilir, saha yan dönse de yazılar dik okunur. Sırası gelenin tabelası nabız gibi parlar, gol atanınki yanıp söner
const TEAM = ['#ff6a5c', '#5aa8ff'];
let golBy = 0;
const rr = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); };
function fit(txt, w, max, wt) {                                          // yazıyı w genişliğine sığdıran punto; yazı tipini de ayarlar
  ctx.font = `${wt} ${max}px system-ui, sans-serif`;
  const m = ctx.measureText(txt).width, f = m > w ? max * w / m : max;
  ctx.font = `${wt} ${f}px system-ui, sans-serif`; return f;
}
function lines(txt, w) {                                                 // kelime kelime satırlara böl
  const out = [''];
  for (const k of txt.split(' ')) { const n = out[out.length - 1] ? out[out.length - 1] + ' ' + k : k; if (out[out.length - 1] && ctx.measureText(n).width > w) out.push(k); else out[out.length - 1] = n; }
  return out;
}
function pips(cx, cy, r, col) {                                         // kalan itme hakları: dolu daire kalan, boş daire kullanılan
  for (let i = 0; i < HAK; i++) {
    ctx.beginPath(); ctx.arc(cx + (i - (HAK - 1) / 2) * r * 2.8, cy, r, 0, 7);
    if (i < hak) { ctx.fillStyle = col; ctx.fill(); } else { ctx.lineWidth = 1.2; ctx.strokeStyle = col + 'aa'; ctx.stroke(); }
  }
}
function drawBoards(now) {
  const D = K / scale, cw = cv.width / D, ch = cv.height / D, d = sb * scale, up = (s) => s.toLocaleUpperCase(LANG);
  ctx.setTransform(D, 0, 0, D, 0, 0); ctx.textBaseline = 'middle';
  for (const i of [0, 1]) {
    const c = TEAM[i], on = state === 'aim' && turn === i, gol = state === 'goal' && golBy === i, cpu = mode === 'ai' && i === 1;
    const oyunda = turn === i && (state === 'aim' || state === 'moving');
    const name = up(names()[i]), sc = String(score[i]), arrow = yan ? (i ? '←' : '→') : i ? '↓' : '↑';
    const label = !on ? '' : cpu ? t('think', 'düşünüyor…') : up(t('turn', 'Sıra')), hint = t('aim', 'paraya bas, sürükle, fırlat');
    let x, y, w, h;                                                      // tabela: şeridin içinde, yatayda köşe düğmelerine yer bırakır
    if (yan) { const m = Math.max(4, d * .08); x = (i ? cw - d : 0) + m; w = d - 2 * m; y = 50; h = ch - 100; }
    else { const m = Math.max(3, d * .1); x = (L + 6) * scale; w = cw - 2 * x; y = (i ? 0 : ch - d) + m; h = d - 2 * m; }
    ctx.save();
    if (on || gol) { ctx.shadowColor = c; ctx.shadowBlur = gol ? 18 : 6 + 5 * Math.sin(now / 200); }
    rr(ctx, x, y, w, h, Math.min(8, w / 5, h / 5));
    const bg = ctx.createLinearGradient(0, y, 0, y + h); bg.addColorStop(0, '#151b24'); bg.addColorStop(1, '#090c11');
    ctx.fillStyle = bg; ctx.fill(); ctx.restore();
    ctx.lineWidth = on || gol ? 2 : 1; ctx.strokeStyle = on || gol ? c : c + '66'; ctx.stroke();
    const led = gol && (now / 140 | 0) % 2 ? '#ffffff' : '#ffd36b';     // skor: sarı led, golde yanıp söner
    if (!yan) {                                                          // dikey: geniş ve basık tabela, ad solda, skor sağda
      const p = Math.min(14, h * .3), two = h >= 46, sf = Math.min(h * (two ? .74 : .8), 46);
      ctx.textAlign = 'right'; ctx.font = `900 ${sf}px system-ui, sans-serif`; ctx.fillStyle = led;
      ctx.fillText(sc, x + w - p, y + h / 2 + sf * .04);
      const pr = Math.min(4.5, h * .1), pw = oyunda ? HAK * pr * 2.8 : 0, scw = ctx.measureText(sc).width;
      if (oyunda) pips(x + w - 2 * p - scw - pw / 2, y + h / 2, pr, c);
      const room = w - 3 * p - scw - pw;
      ctx.textAlign = 'left'; ctx.fillStyle = c;
      fit(name, room * (two ? 1 : .55), Math.min(h * (two ? .34 : .5), 20), 800);
      const nw = ctx.measureText(name).width;
      ctx.fillText(name, x + p, two && label ? y + h * .34 : y + h / 2);
      if (!label) continue;
      const kisa = cpu ? label : `${label} ${arrow}`, uzun = cpu ? label : `${kisa}   ${hint}`;
      ctx.fillStyle = '#e8eef7';
      if (two) {                                                         // alt satır: sıra, yön ve sığarsa nasıl atılacağı
        const fs = Math.min(h * .24, 13);
        ctx.fillText(fit(uzun, room, fs, 700) >= 9 ? uzun : (fit(kisa, room, fs, 700), kisa), x + p, y + h * .72);
      } else {                                                           // basık tabelada adın yanında
        fit(kisa, room - nw - p, Math.min(h * .42, 13), 700); ctx.fillText(kisa, x + 2 * p + nw, y + h / 2);
      }
      continue;
    }
    // yatay: dar ve uzun tabela, ad üstte, skor ortada, sıra altta
    const p = Math.max(4, Math.min(10, w * .1)), iw = w - 2 * p, cx = x + w / 2, sf = Math.min(iw * .95, 60, h * .3);
    ctx.textAlign = 'center'; ctx.font = `900 ${sf}px system-ui, sans-serif`; ctx.fillStyle = led;
    ctx.fillText(sc, cx, y + h / 2);
    ctx.fillStyle = c;
    const top = y + p, bot = y + h / 2 - sf * .65, nf = Math.min(18, iw * .3);
    const dik = names().every(n => fit(up(n), iw, nf, 800) >= 10);      // iki tabela aynı yönde yazsın
    if (dik) { fit(name, iw, nf, 800); ctx.fillText(name, cx, (top + bot) / 2); }
    else {                                                               // ad dik sığmazsa şerit boyunca yazılır
      fit(name, bot - top, Math.min(15, iw * .6), 800);
      ctx.save(); ctx.translate(cx, (top + bot) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(name, 0, 0); ctx.restore();
    }
    let ly = y + h / 2 + sf * .65;
    if (oyunda) { const pr = Math.min(4, iw * .08); pips(cx, ly + pr, pr, c); ly += 2 * pr + 4; }
    if (!label) continue;
    ctx.fillStyle = '#e8eef7';
    if (cpu) {                                                           // dar şeritte "düşünüyor" yerine yanıp sönen noktalar
      const dar = fit(label, iw, 12, 700) < 9;
      if (dar) ctx.font = `900 ${Math.min(iw * .4, 18)}px system-ui, sans-serif`;
      ctx.fillText(dar ? '•'.repeat(1 + (now / 400 | 0) % 3) : label, cx, ly + 12); continue;
    }
    const lf = fit(label, iw, 13, 800); ly += lf; ctx.fillText(label, cx, ly);
    const af = Math.min(iw * .55, 26); ctx.font = `900 ${af}px system-ui, sans-serif`; ctx.fillStyle = c; ly += lf * .5 + af * .6; ctx.fillText(arrow, cx, ly);
    if (iw < 70) continue;                                               // geniş şeritte nasıl atılacağı da yazar
    ctx.font = '600 11px system-ui, sans-serif'; ctx.fillStyle = '#e8eef7b0'; ly += af * .5 + 6;

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(board, 0, 0);
  drawBoards(t);
  ctx.setTransform(...TR);

    if (hold) {

      ctx.beginPath(); ctx.arc(hold.ax, hold.ay, CARRY, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    } else if (state === 'aim') {
      ctx.globalAlpha = .55 + .4 * Math.sin(t / 200); ctx.strokeStyle = turn ? '#5aa8ff' : '#ff6a5c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, CR + 6, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = state === 'out' ? Math.max(0, 1 - (t - outAt) / 300) : 1; // tahtadan düşen para kaybolur
    if (yan) { ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 2); ctx.drawImage(coinImg, -COIN, -COIN, 2 * COIN, 2 * COIN); ctx.restore(); } // para ekranda dik
    else ctx.drawImage(coinImg, x - COIN, y - COIN, 2 * COIN, 2 * COIN);
    ctx.globalAlpha = 1;
    if (y < TOP || y > BOT) drawGoal(ctx, GOALS[y < TOP ? 0 : 1]);      // para filede: file ve borular önde
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(pins, 0, 0);        // çiviler paranın önünde durur
}

function resize() {
  const r = $('wrap').getBoundingClientRect(), cs = getComputedStyle($('wrap'));
  if (yan !== yatayMq.matches) { yan = yatayMq.matches; helpText(); }
  // Saha enine tam sığar; boyuna artan yer kale arkasındaki tabela şeritlerine gider (en az mn, en çok mx birim)
  const aw = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), ah = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const en = yan ? ah : aw, boy = yan ? aw : ah, [mn, mx] = yan ? [60, 130] : [36, 84];
  const s = Math.min(en / W, boy / (H + 2 * mn));
  if (s <= 0) return;                                                    // sayfa henüz boyutsuz (gizli sekme)
  scale = s; sb = Math.min(mx, (boy / s - H) / 2); K = scale * (devicePixelRatio || 1);
  const ew = yan ? H + 2 * sb : W, eh = yan ? W : H + 2 * sb;            // ekrandaki en ve boy
  TR = yan ? [0, K, -K, 0, (H + sb) * K, 0] : [K, 0, 0, K, 0, sb * K];
  cv.style.width = ew * scale + 'px'; cv.style.height = eh * scale + 'px';
  board.width = cv.width = pins.width = Math.round(ew * K); board.height = cv.height = pins.height = Math.round(eh * K);
  const g = board.getContext('2d'), p = pins.getContext('2d'), rad = 10 / scale;
  g.setTransform(...TR); p.setTransform(...TR);
  g.save(); g.shadowColor = '#0009'; g.shadowBlur = 24 * K / scale; g.shadowOffsetY = 6 * K / scale; // tahtanın gölgesi
  rr(g, 0, 0, W, H, rad); g.fill(); g.restore();
  g.save(); rr(g, 0, 0, W, H, rad); g.clip(); drawBoard(g, p); g.restore();
  coinImg = makeCoin();
}
const tex = {}, logo = new Image();                                      // Antigravity'nin ürettiği dokular, para logosu
for (const n of ['zemin', 'cerceve']) { tex[n] = new Image(); tex[n].onload = resize; tex[n].src = n + '.jpg'; }
logo.onload = resize; logo.src = 'para-logo.png';
addEventListener('resize', resize); resize();

let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (state === 'moving') {
    hitV = 0; acc += dt;
    for (; acc >= DT && state === 'moving'; acc -= DT) {
      const g = step(coin);
      if (g === 'out') out();
      else if (g) goal(g);
      else if (!coin.vx && !coin.vy) { if (!hak) { turn = 1 - turn; hak = HAK; } aim(); } // hak bitince sıra rakibe
    }
    if (hitV > 40) tik(Math.min(.3, hitV / 3000), 1700, .05);
  } else acc = 0;
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.querySelectorAll('.para button').forEach((b, i, all) => b.onclick = () => {
  para = i; all.forEach((x) => x.classList.toggle('on', x === b));
});
$('p2').onclick = () => newGame('2p');
document.querySelectorAll('.lv').forEach((b, i) => b.onclick = () => { level = i; newGame('ai'); });
$('again').onclick = () => newGame(mode);
// Tam ekran: desteklemeyen tarayıcıda (iPhone Safari) düğme gizlenir
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').onclick = () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
};
$('toMenu').onclick = $('menuBtn').onclick = () => {
  clearTimeout(aiTimer); hold = null; state = 'menu';
  $('end').hidden = $('aut').hidden = true; $('menu').hidden = false;
};
</script>
