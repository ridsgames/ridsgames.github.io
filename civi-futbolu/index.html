<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Çivi Futbolu</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #16191d; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #hud { position: relative; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 8px 12px 0; font-size: 20px; font-weight: 800; }
  #turn { text-align: center; font-size: 14px; height: 22px; line-height: 22px; }
  .r { color: #ff6a5c; } .b { color: #5aa8ff; }
  #wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 8px 8px; }
  canvas { display: block; touch-action: none; border-radius: 10px; box-shadow: 0 8px 30px #0008; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; background: #0b0d10d9; }
  .ov p { max-width: 330px; font-size: 14px; line-height: 1.5; opacity: .85; }
  h1 { font-size: 40px; }
  button { font: inherit; font-size: 18px; font-weight: 700; min-width: 220px; padding: 12px 24px; border: 0; border-radius: 12px; background: #e9b44c; color: #2b1a05; cursor: pointer; }
  #menuBtn { position: absolute; left: 8px; min-width: 0; padding: 2px 10px; background: none; color: #fff; font-size: 22px; }
  #gol { position: fixed; left: 0; right: 0; top: 42%; text-align: center; font-size: 72px; font-weight: 900; text-shadow: 0 4px 16px #000; pointer-events: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="hud">
  <button id="menuBtn" aria-label="Menü">☰</button>
  <span class="r"><span data-i18n="red">Kırmızı</span> <span id="sA">0</span></span>
  <span>:</span>
  <span class="b"><span id="sB">0</span> <span id="nB">Mavi</span></span>
</div>
<div id="turn"></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="gol" hidden data-i18n="goal">GOL!</div>
<div id="menu" class="ov">
  <h1 data-i18n="title">Çivi Futbolu</h1>
  <p data-i18n="help">Paranın üstüne bas, tutup sürükle ve fırlat. Kırmızı yukarıdaki, Mavi aşağıdaki kaleye atar. Sıra her atışta değişir, 5 gol atan kazanır.</p>
  <button id="p2" data-i18n="p2">2 Oyuncu</button>
  <p data-i18n="vsCpu">Bilgisayara karşı:</p>
  <button class="lv" data-i18n="easy">Kolay</button>
  <button class="lv" data-i18n="medium">Orta</button>
  <button class="lv" data-i18n="hard">Zor</button>
</div>
<div id="end" class="ov" hidden>
  <h1 id="endText"></h1>
  <button id="again" data-i18n="again">Tekrar Oyna</button>
  <button id="toMenu" data-i18n="menu">Menü</button>
</div>
<script>
const W = 400, H = 640, L = 16, R = 384, TOP = 46, BOT = 594; // tahta ve saha sınırları
const GL = 140, GR = 260, GD = 34;   // kale direkleri (x) ve file derinliği
const CR = 13, NR = 2;               // para (1 TL ≈ 26 mm) ve çivi gövdesi yarıçapı
const NH = 7, HR = 3.2, GH = 9;      // eğik bakış: çivi boyu, çivi başı, kale yüksekliği
// Ayar düğmeleri: oyunun hissi bunlarla değişir
const DECEL = 320;                   // tahtanın sürtünmesi
const E_NAIL = 0.55, E_WALL = 0.5;   // çividen / kenardan sekme
const FLING = 0.55, MAX_V = 1100, MIN_V = 80; // fırlatma gücü
const CARRY = 50;                    // parayı tutup taşıyabileceğin mesafe
// Bilgisayarın nişan (radyan) ve güç hatası: kolay, orta, zor. Ölçülen gol oranı atış başına ~%11, ~%26, ~%51
const AI_ERR = [[.9, .6], [.26, .22], [.08, .1]];
const DT = 1 / 240, WIN = 5;

// Çiviler: şaşırtmalı sıralar (4 ve 3 çivi, 48 birim arayla)
const nails = [];
for (let k = -5; k <= 5; k++)
  for (const x of k % 2 ? [110, 200, 290] : [65, 155, 245, 335]) nails.push({ x, y: H / 2 + 48 * k });
for (const y of [TOP, BOT]) nails.push({ x: GL, y, post: 1 }, { x: GR, y, post: 1 });

let hitV = 0;
// Fizik adımı; gol olursa 'top' (kırmızının golü) ya da 'bottom' (mavinin golü) döner
function step(c) {
  const s = Math.hypot(c.vx, c.vy);
  if (s) { const k = Math.max(0, s - DECEL * DT) / s; c.vx *= k; c.vy *= k; }
  c.x += c.vx * DT; c.y += c.vy * DT;
  const m = CR + NR;
  for (const n of nails) {
    const dx = c.x - n.x, dy = c.y - n.y;
    if (dx >= m || dx <= -m || dy >= m || dy <= -m) continue;
    const d = Math.hypot(dx, dy);
    if (d >= m) continue;
    const nx = d ? dx / d : 0, ny = d ? dy / d : 1, vn = c.vx * nx + c.vy * ny;
    c.x = n.x + nx * m; c.y = n.y + ny * m;
    if (vn < 0) { c.vx -= (1 + E_NAIL) * vn * nx; c.vy -= (1 + E_NAIL) * vn * ny; hitV = Math.max(hitV, -vn); }
  }
  if (c.x < L + CR) { c.x = L + CR; if (c.vx < 0) { hitV = Math.max(hitV, -c.vx); c.vx *= -E_WALL; } }
  if (c.x > R - CR) { c.x = R - CR; if (c.vx > 0) { hitV = Math.max(hitV, c.vx); c.vx *= -E_WALL; } }
  if (c.x > GL && c.x < GR) {        // kale ağzı: paranın merkezi çizgiyi geçerse gol
    if (c.y < TOP) return 'top';
    if (c.y > BOT) return 'bottom';
  } else {
    if (c.y < TOP + CR) { c.y = TOP + CR; if (c.vy < 0) { hitV = Math.max(hitV, -c.vy); c.vy *= -E_WALL; } }
    if (c.y > BOT - CR) { c.y = BOT - CR; if (c.vy > 0) { hitV = Math.max(hitV, c.vy); c.vy *= -E_WALL; } }
  }
}

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), board = document.createElement('canvas'), pins = document.createElement('canvas');
let mode, level = 2, score = [0, 0], turn = 0, coin, state = 'menu', hold = null, aiTimer, ac, scale = 1, K = 1, coinImg;
// Dil: ?lang=en|tr adresten, yoksa tarayıcı dili (tr dışı her dil İngilizce). Türkçe metinler HTML'de durur.
const LANG = /^tr/i.test(new URLSearchParams(location.search).get('lang') || navigator.language || 'tr') ? 'tr' : 'en';
const I18N_EN = {
  title: 'Nail Football', red: 'Red', blue: 'Blue', cpu: 'Computer', goal: 'GOAL!', menu: 'Menu',
  help: 'Press on the coin, hold and drag, then flick it. Red shoots at the top goal, Blue at the bottom one. Turns switch after every shot; first to 5 goals wins.',
  p2: '2 Players', vsCpu: 'Against the computer:', easy: 'Easy', medium: 'Medium', hard: 'Hard', again: 'Play Again',
  thinking: 'Computer is thinking…', turn: 'Turn', aim: 'press the coin, drag, flick',
  cpuWins: 'Computer wins', youWin: 'You win!', wins: 'wins!'
};
function t(key, trText) { return LANG === 'en' ? I18N_EN[key] : trText; }
if (LANG === 'en') {
  document.documentElement.lang = 'en'; document.title = I18N_EN.title;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = I18N_EN[el.dataset.i18n]; });
  $('menuBtn').setAttribute('aria-label', I18N_EN.menu);
}
const names = () => [t('red', 'Kırmızı'), mode === 'ai' ? t('cpu', 'Bilgisayar') : t('blue', 'Mavi')];

function newGame(m) {
  mode = m; score = [0, 0]; clearTimeout(aiTimer);
  try { ac = ac || new AudioContext(); } catch {}
  $('menu').hidden = $('end').hidden = $('gol').hidden = true;
  $('nB').textContent = names()[1];
  kickoff(0);
}
function kickoff(t) { coin = { x: W / 2, y: H / 2, vx: 0, vy: 0 }; turn = t; aim(); }
function aim() {
  state = 'aim'; hud();
  if (mode === 'ai' && turn) aiTimer = setTimeout(aiShoot, 700);
}
function hud() {
  $('sA').textContent = score[0]; $('sB').textContent = score[1];
  $('turn').className = turn ? 'b' : 'r';
  $('turn').textContent = state !== 'aim' ? '' : mode === 'ai' && turn ? t('thinking', 'Bilgisayar düşünüyor…')
    : `${t('turn', 'Sıra')}: ${names()[turn]} ${turn ? '↓' : '↑'} — ${t('aim', 'paraya bas, sürükle, fırlat')}`;
}
function shoot(vx, vy) { coin.vx = vx; coin.vy = vy; state = 'moving'; hud(); }
function goal(side) {
  const s = side === 'top' ? 0 : 1;  // kırmızı yukarı, mavi aşağı atar
  score[s]++; state = 'goal'; hud();
  coin.x = Math.min(GR - CR, Math.max(GL + CR, coin.x)); coin.y = s ? BOT + GD / 2 : TOP - GD / 2; // para filede
  $('gol').className = s ? 'b' : 'r'; $('gol').hidden = false;
  tik(0.25, 520, 0.5);
  setTimeout(() => {
    $('gol').hidden = true;
    if (state !== 'goal') return;
    if (score[s] < WIN) return kickoff(1 - s);
    state = 'over';
    $('endText').textContent = mode === 'ai' ? (s ? t('cpuWins', 'Bilgisayar kazandı') : t('youWin', 'Kazandın!')) : `${names()[s]} ${t('wins', 'kazandı!')}`;
    $('end').hidden = false;
  }, 1300);
}

// Bilgisayar: her yön ve güçte atışı simüle eder, gol ya da kırmızı kaleye en yakın duruşu seçer
function aiShoot() {
  if (state !== 'aim' || mode !== 'ai' || !turn) return;
  const run = (a, sp) => {
    const c = { x: coin.x, y: coin.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp };
    let g; for (let k = 0; k < 2400 && !g && (c.vx || c.vy); k++) g = step(c);
    return g === 'bottom' ? 1e4 : g === 'top' ? -1e4 : c.y;
  };
  let best = { sc: -Infinity };
  for (let i = 0; i < 120; i++) for (const sp of [300, 450, 600, 750, 900, 1050]) {
    const a = i / 120 * 2 * Math.PI;
    let sc = run(a, sp);
    if (sc === 1e4) for (const d of [-.03, -.015, .015, .03]) if (run(a + d, sp) === 1e4) sc += 100; // nişan kaysa da gol olanı seç
    if (sc > best.sc) best = { sc, a, sp };
  }
  const [ea, es] = AI_ERR[level], a = best.a + (Math.random() - .5) * ea, sp = best.sp * (1 + (Math.random() - .5) * es);
  shoot(Math.cos(a) * sp, Math.sin(a) * sp);
}

// Dokunma / fare: paraya bas, tutup sürükle, bırak. Hız = parmağın son ~90 ms'deki hızı.
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale, t: e.timeStamp }; }
cv.onpointerdown = e => {
  if (state !== 'aim' || (mode === 'ai' && turn) || hold) return;
  const p = pos(e);
  if (Math.hypot(p.x - coin.x, p.y - coin.y) > CR * 2.2) return;
  cv.setPointerCapture(e.pointerId);
  hold = { ax: coin.x, ay: coin.y, ox: p.x - coin.x, oy: p.y - coin.y, pts: [p] };
};
cv.onpointermove = e => {
  if (!hold) return;
  const p = pos(e); hold.pts.push(p);
  const dx = p.x - hold.ox - hold.ax, dy = p.y - hold.oy - hold.ay;
  if (Math.hypot(dx, dy) > CARRY) return release(p.t);   // para elden çıktı
  const c = { x: hold.ax + dx, y: hold.ay + dy, vx: 0, vy: 0 };
  if (step(c)) return release(p.t);                      // elle kaleye sokulmaz
  coin.x = c.x; coin.y = c.y;
};
cv.onpointerup = cv.onpointercancel = e => hold && release(e.timeStamp);
function release(now) {
  const h = hold, pts = h.pts.filter(q => now - q.t < 90);
  hold = null;
  let vx = 0, vy = 0;
  if (pts.length > 1) {
    const a = pts[0], b = pts[pts.length - 1], dt = (b.t - a.t) / 1000;
    if (dt > 0) { vx = (b.x - a.x) / dt * FLING; vy = (b.y - a.y) / dt * FLING; }
  }
  const s = Math.hypot(vx, vy);
  if (s < MIN_V) { coin.x = h.ax; coin.y = h.ay; return; } // yavaş bırakıldı, atış sayılmaz
  if (s > MAX_V) { vx *= MAX_V / s; vy *= MAX_V / s; }
  shoot(vx, vy);
}

function tik(vol, f, d) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(1e-3, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}

// Eğik bakış: yerden h yüksekteki nokta ekranda h yukarı kayar, gölgesi sağ alta düşer (ışık sol üstten)
const up = (x, y, h) => [x, y - h], shade = (x, y, h) => [x + h * .85, y + h];
const GOALS = [[TOP, -1, '#1f6fe5', '#a9cfff'], [BOT, 1, '#e0262b', '#ffaaa5']]; // üstte Mavi'nin, altta Kırmızı'nın kalesi
function goalPath(g, y0, d, f) {      // kale borularının iskeleti; f kaleyi ya da gölgesini çizer
  const y1 = y0 + d * GD; g.beginPath();
  for (const [x, y, z, X, Y, Z] of [[GL, y0, 0, GL, y0, 1], [GR, y0, 0, GR, y0, 1], [GL, y1, 0, GL, y1, 1], [GR, y1, 0, GR, y1, 1],
    [GL, y0, 1, GR, y0, 1], [GL, y1, 1, GR, y1, 1], [GL, y0, 1, GL, y1, 1], [GR, y0, 1, GR, y1, 1], [GL, y1, 0, GR, y1, 0]]) {
    g.moveTo(...f(x, y, z * GH)); g.lineTo(...f(X, Y, Z * GH));
  }
}
function drawGoal(g, [y0, d, col, net]) {
  const y1 = y0 + d * GD, ya = Math.min(y0, y1) - GH;
  g.strokeStyle = net + '99'; g.lineWidth = .7; g.beginPath();           // file: tavan ve arka
  for (let x = GL; x <= GR; x += 6) { g.moveTo(x, ya); g.lineTo(x, ya + GD); g.moveTo(x, y1); g.lineTo(x, y1 - GH); }
  for (let k = 6; k < GD; k += 6) { g.moveTo(GL, ya + k); g.lineTo(GR, ya + k); }
  for (let k = 3; k < GH; k += 3) { g.moveTo(GL, y1 - k); g.lineTo(GR, y1 - k); }
  g.stroke();
  g.lineCap = g.lineJoin = 'round';
  g.strokeStyle = col; g.lineWidth = 2.6; goalPath(g, y0, d, up); g.stroke();
  g.save(); g.translate(-.5, -.5); g.strokeStyle = '#ffffff70'; g.lineWidth = .8; goalPath(g, y0, d, up); g.stroke(); g.restore();
}

function drawBoard(g, p) {
  g.fillStyle = '#b3201c'; g.fillRect(0, 0, W, H);                      // kırmızı çerçeve
  if (tex.cerceve.naturalWidth) g.drawImage(tex.cerceve, 0, 0, W, H);
  g.fillStyle = '#2a000030'; g.fillRect(0, 0, W, H);                    // dokudaki parlamayı bastır
  g.strokeStyle = '#5a0d0b'; g.lineWidth = 2; g.strokeRect(1, 1, W - 2, H - 2);
  g.save(); g.beginPath();                                               // yeşil boyalı tahta ve kale cepleri
  g.rect(L, TOP, R - L, BOT - TOP); g.rect(GL, TOP - GD, GR - GL, GD); g.rect(GL, BOT, GR - GL, GD);
  g.clip();
  g.fillStyle = '#1f9d4b'; g.fillRect(L, TOP - GD, R - L, BOT - TOP + 2 * GD);
  if (tex.zemin.naturalWidth) g.drawImage(tex.zemin, L, TOP - GD, R - L, BOT - TOP + 2 * GD);
  g.strokeStyle = '#00000059'; g.lineWidth = 6; g.strokeRect(L, TOP, R - L, BOT - TOP); // çerçeve gölgesi
  g.restore();
  const cx = W / 2, cy = H / 2, a = Math.asin(.6);                       // beyaz saha çizgileri
  g.strokeStyle = '#ffffffe0'; g.lineWidth = 2; g.beginPath();
  g.rect(L + 6, TOP, R - L - 12, BOT - TOP);
  g.moveTo(L + 6, cy); g.lineTo(R - 6, cy);
  g.moveTo(cx + 50, cy); g.arc(cx, cy, 50, 0, 7);
  for (const [y, d] of [[TOP, 1], [BOT, -1]]) {
    g.rect(85, y, 230, d * 82); g.rect(130, y, 140, d * 30);            // ceza sahası, kale alanı
    const py = y + d * 58, a0 = d > 0 ? a : Math.PI + a, a1 = d > 0 ? Math.PI - a : -a;
    g.moveTo(cx + 40 * Math.cos(a0), py + 40 * Math.sin(a0)); g.arc(cx, py, 40, a0, a1); // ceza yayı
    for (const [x, q] of [[L + 6, d > 0 ? 0 : -Math.PI / 2], [R - 6, d > 0 ? Math.PI / 2 : Math.PI]]) {
      g.moveTo(x + 10 * Math.cos(q), y + 10 * Math.sin(q)); g.arc(x, y, 10, q, q + Math.PI / 2); // korner
    }
  }
  g.stroke();
  g.fillStyle = '#ffffffe0'; g.beginPath(); g.arc(cx, cy, 2.5, 0, 7); g.fill();
  for (const G of GOALS) {                                               // kalenin gölgesi, sonra kale
    g.fillStyle = '#0000001a'; g.fillRect(GL + GH * .85, Math.min(G[0], G[0] + G[1] * GD) + GH, GR - GL, GD);
    g.strokeStyle = '#00000045'; g.lineWidth = 2.6; goalPath(g, G[0], G[1], shade); g.stroke();
    drawGoal(g, G);
  }
  for (const n of nails) {
    if (n.post) continue;                                                // direkler kaleyle çizildi
    const [sx, sy] = shade(n.x, n.y, NH), b = g.createRadialGradient(sx, sy, 0, sx, sy, HR + 1);
    g.strokeStyle = '#0000005a'; g.lineWidth = 1.6;                      // tahtaya düşen gölge
    g.beginPath(); g.moveTo(n.x, n.y); g.lineTo(sx, sy); g.stroke();
    b.addColorStop(0, '#00000066'); b.addColorStop(1, '#0000');
    g.fillStyle = b; g.beginPath(); g.arc(sx, sy, HR + 1, 0, 7); g.fill();
    g.fillStyle = '#00000080'; g.beginPath(); g.ellipse(n.x, n.y, NR, NR * .6, 0, 0, 7); g.fill(); // girdiği delik
    const ty = n.y - NH, s = p.createLinearGradient(n.x - 1, 0, n.x + 1, 0); // p: paranın üstünde kalan gövde ve baş
    s.addColorStop(0, '#e8e8e8'); s.addColorStop(.5, '#8c8c8c'); s.addColorStop(1, '#2e2e2e');
    p.strokeStyle = s; p.lineWidth = 1.8; p.beginPath(); p.moveTo(n.x, n.y); p.lineTo(n.x, ty); p.stroke();
    p.fillStyle = '#262626'; p.beginPath(); p.ellipse(n.x, ty + .8, HR, HR * .6, 0, 0, 7); p.fill();
    const hd = p.createRadialGradient(n.x - 1.2, ty - .8, .2, n.x, ty, HR);
    hd.addColorStop(0, '#fdfdfd'); hd.addColorStop(.35, '#b9b9b9'); hd.addColorStop(1, '#4a4a4a');
    p.fillStyle = hd; p.beginPath(); p.ellipse(n.x, ty, HR, HR * .6, 0, 0, 7); p.fill();
  }
}

// Para: kalın kenar, kabarık çerçeve ve kabartma Ridsgames logosu; her boyutlanmada bir kez çizilir
const COIN = CR + 6;                                                     // görselin yarı boyu (gölge payıyla)
function tint(col, w, h) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = Math.ceil(w * K); c.height = Math.ceil(h * K);
  g.drawImage(logo, 0, 0, c.width, c.height); g.globalCompositeOperation = 'source-in';
  g.setTransform(K, 0, 0, K, c.width / 2, c.height / 2); g.fillStyle = col; g.fillRect(-w, -h, 2 * w, 2 * h);
  return c;
}
function makeCoin() {
  const c = document.createElement('canvas'), g = c.getContext('2d'), T = 1.3; // T: paranın kalınlığı
  c.width = c.height = Math.ceil(2 * COIN * K); g.setTransform(K, 0, 0, K, c.width / 2, c.height / 2);
  g.shadowColor = '#0009'; g.shadowBlur = 3 * K; g.shadowOffsetX = 1.5 * K; g.shadowOffsetY = 2.5 * K;
  g.fillStyle = '#6e4f0f'; g.beginPath(); g.arc(0, 0, CR, 0, 7); g.fill(); g.shadowColor = '#0000';
  g.translate(0, -T);
  const face = g.createRadialGradient(-4, -5, 1, 0, 0, CR);
  face.addColorStop(0, '#fff2c2'); face.addColorStop(.55, '#ddb043'); face.addColorStop(1, '#a3761a');
  g.fillStyle = face; g.beginPath(); g.arc(0, 0, CR, 0, 7); g.fill();
  const lit = (a, b) => { const l = g.createLinearGradient(-CR, -CR, CR, CR); l.addColorStop(0, a); l.addColorStop(1, b); return l; };
  g.lineWidth = 2; g.strokeStyle = lit('#fff7d6', '#7a5610'); g.beginPath(); g.arc(0, 0, CR - 1.2, 0, 7); g.stroke();
  g.lineWidth = .6; g.strokeStyle = lit('#7a5610', '#fff3c8'); g.beginPath(); g.arc(0, 0, CR - 2.4, 0, 7); g.stroke();
  if (logo.naturalWidth) {                                               // gölge, ışık, yüz: kabartma
    const w = CR * 1.4, h = w * logo.naturalHeight / logo.naturalWidth;
    for (const [o, col] of [[.5, '#5f430b'], [-.5, '#fff8dc'], [0, face]]) g.drawImage(tint(col, w, h), o - w / 2, o - h / 2, w, h);
  }
  return c;
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(board, 0, 0);
  ctx.setTransform(K, 0, 0, K, 0, 0);
  if (coin) {
    const { x, y } = coin;
    if (hold) {
      ctx.setLineDash([4, 5]); ctx.strokeStyle = '#fff8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(hold.ax, hold.ay, CARRY, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    } else if (state === 'aim') {
      ctx.globalAlpha = .55 + .4 * Math.sin(t / 200); ctx.strokeStyle = turn ? '#5aa8ff' : '#ff6a5c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, CR + 6, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.drawImage(coinImg, x - COIN, y - COIN, 2 * COIN, 2 * COIN);
    if (y < TOP || y > BOT) drawGoal(ctx, GOALS[y < TOP ? 0 : 1]);      // para filede: file ve borular önde
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(pins, 0, 0);        // çiviler paranın önünde durur
}

function resize() {
  const r = $('wrap').getBoundingClientRect();
  const s = Math.min((r.width - 16) / W, (r.height - 8) / H);
  if (s <= 0) return;                                                    // sayfa henüz boyutsuz (gizli sekme)
  scale = s; K = scale * (devicePixelRatio || 1);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  board.width = cv.width = pins.width = Math.round(W * K); board.height = cv.height = pins.height = Math.round(H * K);
  const g = board.getContext('2d'), p = pins.getContext('2d');
  g.setTransform(K, 0, 0, K, 0, 0); p.setTransform(K, 0, 0, K, 0, 0); drawBoard(g, p);
  coinImg = makeCoin();
}
const tex = {}, logo = new Image();                                      // Antigravity'nin ürettiği dokular, para logosu
for (const n of ['zemin', 'cerceve']) { tex[n] = new Image(); tex[n].onload = resize; tex[n].src = n + '.jpg'; }
logo.onload = resize; logo.src = 'para-logo.png';
addEventListener('resize', resize); resize();

let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (state === 'moving') {
    hitV = 0; acc += dt;
    for (; acc >= DT && state === 'moving'; acc -= DT) {
      const g = step(coin);
      if (g) goal(g);
      else if (!coin.vx && !coin.vy) { turn = 1 - turn; aim(); }
    }
    if (hitV > 40) tik(Math.min(.3, hitV / 3000), 1700, .05);
  } else acc = 0;
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

$('p2').onclick = () => newGame('2p');
document.querySelectorAll('.lv').forEach((b, i) => b.onclick = () => { level = i; newGame('ai'); });
$('again').onclick = () => newGame(mode);
$('toMenu').onclick = $('menuBtn').onclick = () => {
  clearTimeout(aiTimer); hold = null; state = 'menu';
  $('end').hidden = true; $('menu').hidden = false; hud();
};
</script>
