let savedLang = null;

const rnd = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {

  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },

const sayac = (olay, ad) => { try { window.goatcounter.count({ path: 'tombala/' + olay, title: 'Tombala: ' + ad, event: true }); } catch (e) {} };
let soundOn = store.get('sound', 1) !== 0, bitenVar = false;
const Sfx = (() => {
  let ac = null;
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  return {
    unlock: ctx, tone,
    click() { tone(900, 700, 0.05, 0.05, 'triangle'); },
    tap() { tone(540, 880, 0.07, 0.07); },
    good() { tone(660, 990, 0.12, 0.08, 'triangle'); },
    bad() { tone(220, 110, 0.22, 0.09, 'sawtooth'); },
    win() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, f, 0.4, 0.1, 'triangle', i * 0.065)); },
    lose() { [392, 329.6, 261.6].forEach((f, i) => tone(f, f * 0.98, 0.3, 0.09, 'triangle', i * 0.12)); }
  };
})();
const buzz = (p) => { try { if (soundOn && navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
let toastT = null;
function toast(s, color) {
  const el = $('toast'); el.textContent = s; el.style.borderColor = color || 'var(--cyan)'; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1700);
}
const OVS = ['setOv', 'scoreOv', 'setupOv', 'rulesOv', 'winOv', 'drawnOv'];
function closeAll() { for (const id of OVS) $(id).hidden = true; }
const anyOpen = () => OVS.some((id) => !$(id).hidden);
const segPress = (id, attr, val) => document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute('aria-pressed', b.dataset[attr] === String(val)));
function showEnd(o) { // o: { ico, title, sub, score, lost, stats: [[ad, değer]] }

  $('statList').innerHTML = (o.stats || []).map(([a, b]) => `<li><span>${a}</span><span class="b">${b}</span></li>`).join('');
  $('winOv').hidden = false; $('againBtn').focus({ preventScroll: true });
}


// ---------- Oyun ----------
const STR = {

    setupSub: 'Torbadan sayılar çekilir, kartındaki sayıları kapat. İlk sırayı tamamlayan çinko, bütün kartı kapatan tombala yapar.',

    vcLbl: 'Sayıları sesli oku', vc: { 1: 'Açık', 0: 'Kapalı' },
    you: 'Sen', cpuNames: ['Ahmet', 'Elif', 'Can', 'Zeynep', 'Mert'],
    prize: ['1. Çinko', '2. Çinko', 'Tombala'], open: 'Açık', cardT: (i) => `Kart ${i + 1}`, left: (n) => `${n} kaldı`, leftS: 'kaldı',
    drawBtn: 'Sayı çek', pause: 'Duraklat', resume: 'Devam et', paused: 'Duraklatıldı', count: (n) => `${n} / 90 sayı`, drawn: 'Çekilenler',
    drawnTitle: 'Çekilen sayılar', drawnSub: (n) => n ? `${n} sayı çekildi. Kırmızı olan son çekilen.` : 'Henüz sayı çekilmedi.', close: 'Kapat',
    notYet: 'Bu sayı daha çekilmedi', got: (n, p) => `${n}: ${p}!`, gotMe: (p) => `${p}! Tebrikler`,
    winT: 'Tombala!', loseT: (n) => `${n} tombala yaptı`, tieT: 'Ortak tombala!', subW: (k) => `${k} sayıda bütün kartı kapattın.`, subL: (k) => `${k}. sayıda oyun bitti.`,
    drawnN: 'Çekilen sayı', yourPrizes: 'Senin ödüllerin', total: 'Toplam tombalaların', none: 'yok',
    rulesSub: '1’den 90’a kadar sayılarla oynanan klasik tombala. Her kartta üç sıra, her sırada beş sayı var.',
    ruleList: [
      ['🎱', 'Torbadan sırayla <b>1–90</b> arası sayılar çekilir. Çekilen sayı kartında varsa o kutu kapanır.'],
      ['1️⃣', 'Bir kartında herhangi bir <b>sırayı</b> ilk tamamlayan <b>1. Çinko</b>yu alır.'],
      ['2️⃣', 'Aynı kartta <b>iki sırayı</b> ilk tamamlayan <b>2. Çinko</b>yu alır.'],
      ['🏆', 'Kartındaki <b>15 sayının hepsini</b> ilk kapatan <b>Tombala</b> yapar ve oyun biter.'],

      ['✋', '“Kendim” işaretlemede sayıları kartına dokunarak kapatırsın. Sırayı bir sonraki sayı çekilmeden tamamlamazsan ödülü başkası alabilir.']
    ] },
  en: { ...COMMON.en, title: 'Tombola | Ridsgames', game: 'Tombola',
    setupSub: 'Numbers are drawn from the bag; cover them on your card. Complete a line for a prize, the whole card for Tombola.',
    oppLbl: 'Opponents', ncLbl: 'Cards', nc: { 1: '1 card', 2: '2 cards' },
    spLbl: 'Drawing', sp: { yavas: 'Slow', normal: 'Normal', hizli: 'Fast', elle: 'Manual' },
    spNote: { yavas: 'A number every 4 seconds.', normal: 'A number every 2.5 seconds.', hizli: 'A number every 1.3 seconds.', elle: 'You draw: press “Draw”.' },
    mkLbl: 'Marking', mk: { oto: 'Automatic', elle: 'By hand' }, mkNote: { oto: 'Drawn numbers on your card are covered for you.', elle: 'You cover the numbers yourself. Finish a line before the next draw or you may miss the prize.' },
    vcLbl: 'Read numbers aloud', vc: { 1: 'On', 0: 'Off' },
    you: 'You', cpuNames: ['Alex', 'Maya', 'Leo', 'Zoe', 'Max'],
    prize: ['1st line', '2nd line', 'Tombola'], open: 'Open', cardT: (i) => `Card ${i + 1}`, left: (n) => `${n} left`, leftS: 'left',
    drawBtn: 'Draw', pause: 'Pause', resume: 'Resume', paused: 'Paused', count: (n) => `${n} / 90 drawn`, drawn: 'Drawn',
    drawnTitle: 'Drawn numbers', drawnSub: (n) => n ? `${n} numbers drawn. The red one is the latest.` : 'No numbers drawn yet.', close: 'Close',
    notYet: 'That number has not been drawn', got: (n, p) => `${n}: ${p}!`, gotMe: (p) => `${p}! Well done`,
    winT: 'Tombola!', loseT: (n) => `${n} got Tombola`, tieT: 'Shared Tombola!', subW: (k) => `You covered a full card in ${k} numbers.`, subL: (k) => `The game ended on number ${k}.`,
    drawnN: 'Numbers drawn', yourPrizes: 'Your prizes', total: 'Your Tombolas in total', none: 'none',
    rulesSub: 'Classic tombola with numbers 1 to 90. Each card has three lines of five numbers.',
    ruleList: [
      ['🎱', 'Numbers <b>1–90</b> are drawn from the bag one by one. If a number is on your card, it gets covered.'],

};
const T = () => STR[lang];
const SPD = { yavas: 4000, normal: 2500, hizli: 1300 };
const COLS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6', '#ec4899', '#64748b'];
const colOf = (n) => COLS[Math.min(8, Math.floor(n / 10))];
const HAS_VOICE = 'speechSynthesis' in window;
let setup = Object.assign({ opp: 2, nc: 1, speed: 'normal', mark: 'oto', voice: 1 }, store.get('setup', {}));
if (!STR.tr.sp[setup.speed]) setup.speed = 'normal'; if (!STR.tr.mk[setup.mark]) setup.mark = 'oto';
let G = null, epoch = 0, timer = null, fresh = -1, popBall = false, endT = null;
const pname = (i) => i === 0 ? T().you : T().cpuNames[i - 1];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const save = () => { if (G) store.set('game', G); };

// ---------- Kart ----------
function makeCard() {
  let rows;
  for (;;) {
    rows = [0, 1, 2].map(() => shuffle([...Array(9).keys()]).slice(0, 5));
    const cnt = Array(9).fill(0); rows.forEach((r) => r.forEach((c) => cnt[c]++));
    if (cnt.every((x) => x > 0)) break;
  }
  const g = [0, 1, 2].map(() => Array(9).fill(0));
  for (let c = 0; c < 9; c++) {
    const rs = [0, 1, 2].filter((r) => rows[r].includes(c)), lo = c === 0 ? 1 : c * 10, hi = c === 8 ? 90 : c * 10 + 9;
    const pool = shuffle(Array.from({ length: hi - lo + 1 }, (_, i) => lo + i)).slice(0, rs.length).sort((a, b) => a - b);
    rs.forEach((r, i) => { g[r][c] = pool[i]; });
  }
  return g;
}
const nums = (card) => card.flat().filter((x) => x);
const marksOf = (pi) => pi === 0 && G.mark === 'elle' ? new Set(G.mine) : new Set(G.drawn);
const fullRows = (card, m) => card.filter((r) => r.every((x) => !x || m.has(x))).length;
const levelOf = (pi) => { const m = marksOf(pi); return Math.max(...G.players[pi].map((c) => fullRows(c, m))); };
const leftOf = (pi) => { const m = marksOf(pi); return Math.min(...G.players[pi].map((c) => nums(c).filter((x) => !m.has(x)).length)); };

// ---------- Akış ----------
function newGame() {
  closeAll(); clearTimeout(endT);
  const n = setup.opp + 1;
  G = { opp: setup.opp, nc: setup.nc, speed: setup.speed, mark: setup.mark, players: Array.from({ length: n }, () => Array.from({ length: setup.nc }, makeCard)),
    bag: shuffle(Array.from({ length: 90 }, (_, i) => i + 1)), drawn: [], mine: [], prizes: [0, 1, 2].map(() => ({ h: [], at: -1 })), paused: false, over: false };
  sayac('basladi', 'oyun başladı');
  if (bitenVar) { bitenVar = false; sayac('tekrar', 'bitirdikten sonra yeni oyun'); }
  sayac(`mod/${n}k-${G.nc}kart-${G.speed}-${G.mark}`, `mod: ${n} kişi, ${G.nc} kart, ${G.speed}, ${G.mark}`);
  save(); render(); schedule(900);
}
function startFromSetup() { store.set('setup', setup); newGame(); }
function again() { newGame(); }
function schedule(ms) {
  clearTimeout(timer); const ep = ++epoch;
  if (!G || G.over || G.speed === 'elle') return;
  timer = setTimeout(function tick() {
    if (ep !== epoch || !G || G.over) return;
    if (G.paused || anyOpen() || document.hidden || G.ending) { timer = setTimeout(tick, 300); return; }
    drawOne(); if (!G.over && !G.ending) timer = setTimeout(tick, SPD[G.speed]);
  }, ms == null ? SPD[G.speed] : ms);
}
function drawOne() {
  if (!G || G.over || G.ending || !G.bag.length) return;
  const n = G.bag.pop(); G.drawn.push(n); fresh = n; popBall = true;

<script id="fitSetupJs">
(() => {
  const ov = document.getElementById('setupOv'); const c = ov && ov.querySelector(':scope > .card, :scope > .card2'); if (!c) return;
  const over = () => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1;
  let busy = false, q = 0;
  const fit = () => {
    if (ov.hidden || busy) return; busy = true;

    if (over()) {
      const land = innerWidth > innerHeight && innerWidth >= 560;
      const cols = (n) => () => { c.classList.add('fzc'); c.style.setProperty('--fcols', n); };
      const nw = () => c.classList.add('fzn'), steps = [() => c.classList.add('fz1')];
      if (land) steps.push(cols(2), cols(3), () => c.classList.add('fz2'), nw);
      else steps.push(() => c.classList.add('fz2'));
      if (land && innerWidth >= 760) steps.push(cols(4));
      if (!land && innerWidth >= 340) steps.push(cols(2), nw);
      steps.push(() => c.classList.add('fz3'));
      if (land && innerWidth >= 640 && innerWidth < 760) steps.push(cols(4));
      for (const s of steps) { s(); if (!over()) break; }
    }
    busy = false;
  };
  const later = () => { cancelAnimationFrame(q); q = requestAnimationFrame(fit); };
  new MutationObserver(later).observe(ov, { attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true, characterData: true });
  addEventListener('resize', later); addEventListener('orientationchange', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);

  html.rgSet #topHeader > div { max-width: 560px; gap: 10px; padding: 14px 18px; } html.rgSet #topHeader #homeLink { flex-direction: row; } html.rgSet #topHeader #homeLink + div { grid-template-columns: 1fr 1fr; } html.rgSet #topHeader #modeSelect { grid-column: 1 / -1; height: 40px; } html.rgSet #topHeader #homeLink + div > button { height: 42px; } html.rgSet #topHeader .rgClose { height: 40px; } }
</style>
<script id="rgRepJs">
(() => {
  const MAIL = 'destek@ridsgames.com', H = document.documentElement, errs = window.__rgErr || [];
  const T = {
    tr: { b: 'Sorun bildir', h: 'Sorun bildir', p: 'Ne oldu? Kısaca yazın. Gönder deyince e-posta uygulamanız hazır bir mesajla açılır, siz göndermeden hiçbir şey bize ulaşmaz.', ph: 'Örnek: Kartı oynadığımda oyun takıldı.', inf: 'Mesaja eklenecek bilgiler', send: 'E-posta ile gönder', copy: 'Kopyala', close: 'Kapat', copied: 'Kopyalandı. ' + MAIL + ' adresine gönderebilirsiniz.', nocopy: 'Kopyalanamadı. Metni seçip kopyalayın ve ' + MAIL + ' adresine gönderin.', subj: 'Sorun bildirimi', game: 'Oyun', page: 'Sayfa', lang: 'Dil', scr: 'Ekran', br: 'Tarayıcı', time: 'Zaman', err: 'Son hatalar', none: 'yok', desc: 'Açıklama' },
    en: { b: 'Report a problem', h: 'Report a problem', p: 'What happened? Write a few words. Send opens your email app with a ready message; nothing reaches us unless you send it.', ph: 'Example: the game froze when I played a card.', inf: 'Details added to the message', send: 'Send by email', copy: 'Copy', close: 'Close', copied: 'Copied. You can send it to ' + MAIL + '.', nocopy: 'Could not copy. Select the text, copy it and send it to ' + MAIL + '.', subj: 'Problem report', game: 'Game', page: 'Page', lang: 'Language', scr: 'Screen', br: 'Browser', time: 'Time', err: 'Recent errors', none: 'none', desc: 'Description' }
  };
  const t = () => T[(H.lang || 'tr').startsWith('en') ? 'en' : 'tr'];
  const gname = () => { const g = document.getElementById('gameName') || document.querySelector('#homeLink .gname'); return ((g && g.textContent) || document.title || '').replace(/\s*[|·–-]\s*Ridsgames.*$/i, '').trim(); };
  const info = () => { const l = t(), so = screen.orientation && screen.orientation.type;
    return [`${l.game}: ${gname()}`, `${l.page}: ${location.pathname}`, `${l.lang}: ${H.lang || '-'}`,
      `${l.scr}: ${innerWidth}x${innerHeight} @${Math.round((devicePixelRatio || 1) * 100) / 100}x${so ? ' ' + so : ''}${matchMedia('(pointer: coarse)').matches ? ' touch' : ''}`,
      `${l.br}: ${navigator.userAgent}`, `${l.time}: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
      `${l.err}: ${errs.length ? '' : l.none}`, ...errs.slice(-3).reverse().map((e) => `- ${e.t} ${e.m} @ ${e.src}`)].join('\n'); };
  let ov = null;
  const body = () => { const l = t(), d = ov.querySelector('textarea').value.trim(); return `${l.desc}:\n${d || '-'}\n\n---\n${info()}`; };
  const build = () => {
    ov = document.createElement('div'); ov.id = 'rgRep'; ov.hidden = true;
    ov.innerHTML = '<div class="rc" role="dialog" aria-modal="true" aria-labelledby="rgRepH"><h2 id="rgRepH"></h2><p class="pp"></p><textarea maxlength="1200"></textarea><details><summary></summary><pre></pre></details><div class="ok" role="status"></div><div class="rb"><button type="button" class="go"></button><button type="button" class="cp"></button><button type="button" class="cl"></button></div></div>';
    document.body.appendChild(ov);
    const q = (s) => ov.querySelector(s), close = () => { ov.hidden = true; };
    q('.cl').onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ['keydown', 'keyup', 'keypress'].forEach((k) => ov.addEventListener(k, (e) => { e.stopPropagation(); if (k === 'keydown' && e.key === 'Escape') close(); }));
    ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'contextmenu'].forEach((k) => ov.addEventListener(k, (e) => e.stopPropagation(), { passive: true }));
    q('.go').onclick = () => { const l = t(); let b = body(); if (b.length > 1400) b = b.slice(0, 1400) + '…';
      location.href = `mailto:${MAIL}?subject=${encodeURIComponent(`${l.subj}: ${gname()}`)}&body=${encodeURIComponent(b)}`; };
    q('.cp').onclick = () => { const l = t(), b = `${l.subj}: ${gname()}\n\n${body()}`, ok = q('.ok');
      const fb = () => { const a = document.createElement('textarea'); a.value = b; a.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; ov.appendChild(a); a.select(); let r = false; try { r = document.execCommand('copy'); } catch (_) {} a.remove(); ok.textContent = r ? l.copied : l.nocopy; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b).then(() => { ok.textContent = l.copied; }, fb); else fb(); };
  };
  const open = () => { if (!ov) build(); const l = t(), q = (s) => ov.querySelector(s);
    q('h2').textContent = l.h; q('.pp').textContent = l.p; q('textarea').placeholder = l.ph; q('summary').textContent = l.inf; q('pre').textContent = info();
    q('.go').textContent = l.send; q('.cp').textContent = l.copy; q('.cl').textContent = l.close; q('.ok').textContent = '';
    ov.hidden = false; setTimeout(() => q('textarea').focus({ preventScroll: true }), 30); };
  // Menüye satır ekle: Kurallar düğmesinin görünüşünü kopyalar
  const ICO = '✉';
  let btn = null;
  const label = () => { if (!btn) return; const l = t(); btn.setAttribute('aria-label', l.b); btn.title = l.b; const s = btn.querySelector('.rgRepL'); if (s) s.textContent = l.b; };
  const mount = () => {
    const rules = document.getElementById('rulesBtn'), lang = document.getElementById('langBtn');
    btn = document.createElement('button'); btn.type = 'button'; btn.id = 'rgRepBtn';
    if (rules && lang && rules.parentNode === lang.parentNode) {
      btn.className = rules.className; const sp = [...rules.children].filter((x) => x.tagName === 'SPAN');
      const a = document.createElement('span'); a.textContent = ICO; if (sp[0]) a.className = sp[0].className; btn.appendChild(a);
      if (sp[1]) { const b = document.createElement('span'); b.className = (sp[1].className + ' rgRepL').trim(); btn.appendChild(b); }
      lang.parentNode.insertBefore(btn, lang);
    } else {
      const host = document.getElementById('btn-reset-from-settings'), menu = document.getElementById('menu');
      const s = document.createElement('span'); s.className = 'rgRepL'; btn.append(ICO + ' ', s);
      if (host) { btn.className = host.className; host.parentNode.insertBefore(btn, host); }
      else if (menu) { btn.style.cssText = 'background:none;border:0;box-shadow:none;color:inherit;opacity:.75;font-size:13px;text-decoration:underline;margin-top:10px;min-height:0;padding:4px'; menu.appendChild(btn); }
      else { btn = null; return; }
    }
    btn.addEventListener('click', () => setTimeout(open, 0));
    label(); new MutationObserver(label).observe(H, { attributes: true, attributeFilter: ['lang'] });
  };
  window.rgReport = () => open();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
