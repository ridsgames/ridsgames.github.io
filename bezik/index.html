<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bezik | Ridsgames</title>
<meta name="description" content="Bezik: Türk usulü 96 kâğıtlık bezik. Maça kızı ile karo valesini topla, sayı aç, 3000'e ilk ulaş. Bilgisayara karşı, üç zorluk.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --turn: #ef4444;
  --red: #d32f2f;
  --ink: #1b1b1f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 42%, rgba(6, 9, 15, .05) 0%, rgba(6, 9, 15, .62) 100%), url("../kizma-birader/masa.webp") center / cover, #1a0f08;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı: ileti, masa, puan paneli */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 10px 8px; }
.slot { flex: none; height: 32px; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 6; margin-bottom: -32px; } /* masanın üstünde süzülür, yer kaplamaz */
.msg {
  max-width: 100%; padding: 6px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 800; color: #fff; text-align: center; line-height: 1.25;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; pointer-events: none;
}
.msg.on { opacity: 1; transform: none; }
.msg.gold { border-color: #ffd43b; }
#stage { flex: 1; min-height: 0; width: 100%; max-width: 760px; position: relative; z-index: 0; isolation: isolate; overflow: hidden; touch-action: manipulation; }

/* Kartlar: konum JS'ten transform ile, çevirme içteki katmanla */
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); transition-property: transform; transition-timing-function: cubic-bezier(.25, .8, .3, 1); will-change: transform; }
.card .in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform .35s, translate .15s; }
.card.up .in { transform: none; }
.face { position: absolute; inset: 0; border-radius: calc(var(--cw) * .05); backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 2px 6px rgba(0, 0, 0, .45), 0 0 0 .5px rgba(0, 0, 0, .35); overflow: hidden; }
.front { background: #fff; }
.front img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
.back { transform: rotateY(180deg); background: var(--back) center / 100% 100% no-repeat, #fffdf8; }
.card.play { cursor: pointer; }
.card.play:hover .in { translate: 0 calc(var(--ch) * -.1); }
.card.hit .front { box-shadow: 0 0 0 2px #ffd43b, 0 0 14px rgba(255, 212, 59, .8), 0 2px 6px rgba(0, 0, 0, .45); }
.card.hot .in { translate: 0 calc(var(--ch) * -.14); }
.card.flat .face { box-shadow: none; } /* destede yığılan gölgeler kararmasın */

.badge { position: absolute; z-index: 300; min-width: 26px; height: 22px; padding: 0 7px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 12.5px; font-weight: 800; color: #fff; background: rgba(2, 6, 23, .82); border: 1px solid rgba(255, 220, 170, .35); font-variant-numeric: tabular-nums; pointer-events: none; translate: -50% -50%; transition: opacity .2s; }
.badge.zero { opacity: 0; }
.lbl2 { position: absolute; z-index: 300; font-size: 11px; font-weight: 700; color: rgba(255, 235, 200, .8); text-shadow: 0 1px 2px rgba(0, 0, 0, .8); translate: -50% 0; pointer-events: none; white-space: nowrap; }
#pop { position: absolute; z-index: 320; left: 0; top: 0; translate: -50% -50%; pointer-events: none; font-weight: 900; font-size: 44px; color: #ffe066; letter-spacing: .02em; white-space: nowrap;
  text-shadow: 0 3px 0 #8a5a00, 0 0 18px rgba(255, 200, 0, .7), 0 6px 14px rgba(0, 0, 0, .7); opacity: 0; }
#pop.go { animation: popIn 1.3s cubic-bezier(.2, 1.4, .4, 1) forwards; }
@keyframes popIn { 0% { opacity: 0; scale: .3; } 18% { opacity: 1; scale: 1.15; } 30% { scale: 1; } 80% { opacity: 1; } 100% { opacity: 0; scale: 1.05; translate: -50% -90%; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* Puan paneli: keçeli ahşap tepsi */
.dock {
  flex: none; width: 100%; max-width: 440px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
  border-style: solid; border-width: 20px 17px 24px; border-image: url("../kizma-birader/tepsi.webp") 60 50 72 50 fill / 20px 17px 24px stretch;
  padding: 0 4px 0 8px; background: none;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .5)) drop-shadow(0 0 7px color-mix(in srgb, var(--turn) 60%, transparent));
  transition: filter .3s;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ava { flex: none; display: inline-block; border-radius: 50%; background: url("../kizma-birader/karakterler.webp") 0 0 / 400% 100%; }
.chip { width: 46px; height: 46px; box-shadow: 0 0 0 3px var(--turn), 0 3px 8px rgba(0, 0, 0, .45); transition: box-shadow .3s; }
.chip.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { scale: .4; } 100% { scale: 1; } }
.who .t { min-width: 0; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
#turnName { font-size: 17px; font-weight: 800; line-height: 1.2; color: #fff; }
#turnMsg { font-size: 14px; color: #d8f3dc; line-height: 1.3; margin-top: 2px; min-height: 1.3em; }
.skor { display: grid; gap: 6px; padding: 6px 8px; border-radius: 12px; background: rgba(2, 6, 23, .35); }
.skor > div { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
.skor .ava { width: 24px; height: 24px; }
.skor small { font-size: 11.5px; font-weight: 700; color: #ffe066; min-width: 3.2em; }
#hedef { font-size: 11px; font-weight: 700; color: rgba(255, 235, 200, .75); text-align: center; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Yatay telefon: üst çubuk solda dar menü sütunu, masa ortada, sağda ileti ve puan paneli; alt bilgi gizli */
@media (orientation: landscape) and (max-height: 500px) {
  body { display: grid; grid-template-columns: 0 minmax(0, 1fr) clamp(150px, 25vw, 200px); grid-template-rows: auto minmax(0, 1fr); }
  main { display: contents; }
  .top { grid-column: 1; grid-row: 1 / 3; border-bottom: 0; border-right: 1px solid rgba(30, 41, 59, .8); overflow-y: auto; }
  .top .in { height: auto; max-width: none; flex-direction: column; justify-content: flex-start; padding: 10px 6px; gap: 12px; }
  .logo img { width: 100%; max-width: 56px; height: auto; }
  .gname, .pill .lbl { display: none; }
  .tools { flex-direction: column; gap: 7px; }
  .pill { padding: 0 8px; }
  .pill.lang { font-size: 11px; padding: 0 6px; white-space: nowrap; }
  #stage { grid-column: 2; grid-row: 1 / 3; width: auto; max-width: none; }
  .slot { grid-column: 3; grid-row: 1; width: auto; height: auto; min-height: 40px; margin: 0; padding: 8px 8px 0 0; }
  .msg { font-size: 12.5px; padding: 6px 10px; border-radius: 14px; }
  .dock { grid-column: 3; grid-row: 2; width: auto; max-width: none; margin: 8px 8px 8px 0; grid-template-columns: 1fr; align-content: space-evenly; justify-items: center; gap: 10px; padding: 4px 4px 8px; }
  .who { flex-direction: column; text-align: center; gap: 8px; }
  .chip { width: 50px; height: 50px; }
  body > .ov { padding: 8px; }
  footer { display: none; }
  #setupOv .card2 { max-width: 560px; padding: 14px 18px; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 8px; }
  #setupOv .field { grid-template-columns: 130px 1fr; align-items: center; padding: 8px 0; }
  #setupOv .btns { margin-top: 8px; grid-auto-flow: column; grid-auto-columns: 1fr; }
  #handOv .card2 { max-width: 520px; padding: 10px 16px; }
  #handOv h2 { font-size: 19px; }
  #handOv .sub { margin-bottom: 4px; font-size: 12.5px; }
  #handOv table.sum { font-size: 12.5px; }
  #handOv table.sum td, #handOv table.sum th { padding: 2px 6px; }
  #handOv table.sum thead .ava { width: 20px; height: 20px; }
  #handOv tr.tot td, #handOv tr.all td { font-size: 14px; }
  #handOv .btns { margin-top: 8px; }
  #handOv .big { height: 40px; font-size: 15px; }
}
/* Geniş yatay ekran: masa solda büyük, panel sağda */
@media (orientation: landscape) and (min-height: 501px) and (min-width: 900px) {
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); gap: 12px 18px; max-width: 1200px; width: 100%; margin: 0 auto; padding: 14px 18px; }
  #stage { grid-column: 1; grid-row: 1 / 3; max-width: none; align-self: stretch; }
  .slot { grid-column: 2; grid-row: 1; height: auto; min-height: 44px; margin: 0; align-items: flex-end; }
  .msg { border-radius: 16px; }
  .dock { grid-column: 2; grid-row: 2; align-self: start; grid-template-columns: 1fr; justify-items: center; gap: 14px; padding: 10px 6px 14px; }
  .who { flex-direction: column; text-align: center; gap: 10px; }
  .chip { width: 64px; height: 64px; }
}

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 64px 16px 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card2 {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card2 h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card2 .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.field { display: grid; gap: 8px; padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); font-size: 14px; font-weight: 600; color: #cbd5e1; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { min-height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button .mini { display: inline-block; width: 15px; height: 21px; border-radius: 2px; vertical-align: middle; margin-right: 7px; background: var(--b) center / 100% 100%; box-shadow: 0 0 0 1px rgba(255, 255, 255, .5); }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.btns { display: grid; gap: 10px; margin-top: 14px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.final { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 4px 0 6px; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.final span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 14px; background: rgba(2, 6, 23, .55); }
.final span.win { background: rgba(6, 182, 212, .16); border: 1px solid rgba(34, 211, 238, .5); }
.final .ava { width: 32px; height: 32px; }
table.sum { width: 100%; border-collapse: collapse; font-size: 14px; color: #cbd5e1; font-variant-numeric: tabular-nums; }
table.sum th, table.sum td { padding: 6px 8px; text-align: right; border-bottom: 1px solid rgba(148, 163, 184, .12); }
table.sum th:first-child, table.sum td:first-child { text-align: left; }
table.sum thead th { color: #fff; }
table.sum thead .ava { width: 26px; height: 26px; vertical-align: middle; }
table.sum tr.tot td { color: #fff; font-weight: 800; font-size: 15px; }
table.sum tr.all td { color: #67e8f9; font-weight: 800; font-size: 16px; border-bottom: 0; }
table.sum td.z { color: #475569; }

/* Bezik'e özel */
#declPick { min-width: 240px; }
#declPick .b { display: grid; gap: 6px; }
#declPick .b button, #declPass { width: 100%; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(34, 211, 238, .45); background: rgba(15, 23, 42, .95); color: #fff; font-weight: 800; font-size: 14.5px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
#declPick .b button:hover { border-color: #22d3ee; background: rgba(8, 51, 68, .95); }
#declPick .b button b { color: #ffe066; font-variant-numeric: tabular-nums; }
#declPass { margin-top: 8px; justify-content: center; border-color: rgba(255, 212, 59, .7); color: #ffe066; }
#stockN { z-index: 290; }
.card.dim .front img { filter: brightness(.58) saturate(.6); }
.card.gone { visibility: hidden; }
.card { touch-action: none; }
.card.drag { cursor: grabbing; }
.card.drag .in { translate: none !important; }
.card.drag .face { box-shadow: 0 14px 28px rgba(0, 0, 0, .55), 0 0 0 .5px rgba(0, 0, 0, .35); }
.seat { position: absolute; z-index: 310; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
.seat .ava { width: 38px; height: 38px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .3), 0 3px 8px rgba(0, 0, 0, .5); transition: box-shadow .3s, scale .3s; }
.seat.on .ava { box-shadow: 0 0 0 3px var(--c), 0 0 16px var(--c); scale: 1.14; }
.seat b { font-size: 11px; font-weight: 800; color: #fff; background: rgba(2, 6, 23, .78); padding: 1px 7px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seat b.bid { color: #1a1200; background: #ffd43b; }
.seat b.ok { color: #052e16; background: #4ade80; }
.seat b.team { box-shadow: 0 0 0 1.5px var(--t); }
#seat0 { flex-direction: row; gap: 6px; translate: 0 -50%; }
#seat0 .ava { width: 28px; height: 28px; }
#trumpB { position: absolute; z-index: 305; translate: -50% -50%; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: opacity .2s, scale .2s; }
#trumpB.off { opacity: 0; scale: .5; }
#trumpB i { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 27px; line-height: 1; box-shadow: 0 0 0 2.5px #ffd43b, 0 3px 10px rgba(0, 0, 0, .55); font-family: Georgia, serif; }
#trumpB b { font-size: 10.5px; font-weight: 800; color: #ffe066; background: rgba(2, 6, 23, .8); padding: 1px 6px; border-radius: 7px; }
.pick { position: absolute; z-index: 400; translate: -50% -50%; padding: 10px 12px 12px; border-radius: 16px; background: rgba(2, 6, 23, .94); border: 1px solid rgba(34, 211, 238, .55); box-shadow: 0 12px 30px rgba(0, 0, 0, .6); text-align: center; max-width: calc(100% - 16px); }
.pick .t { font-size: 13.5px; font-weight: 800; margin-bottom: 8px; color: #fff; }
.pick .s { font-size: 12px; color: var(--dim); margin: -4px 0 8px; }
.skor.g4 { grid-template-columns: auto auto; column-gap: 14px; }
.skor > div.full { grid-column: 1 / -1; }
.skor > div.w { color: #ffe066; }
.skor .pair { display: inline-flex; }

@keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
.card.no .in { animation: shake .25s 2; }
/* Telefonda oyun alanı tüm ekranı kullanır */
@media (max-width: 700px), (pointer: coarse) and (max-height: 1100px) { footer { display: none; } }

/* Tek düğme düzeni: sağ üstte ayarlar, sağ altta tam ekran; üst çubuk ayarlar penceresine dönüştü, oyun alanı ekranın tamamı */
.top { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; margin: 0; overflow: auto;
  background: rgba(2, 6, 23, .72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 0; grid-column: auto; grid-row: auto; }

<script id="motor">
// ---------- Motor: Türk usulü bezik kuralları ve bilgisayar (arayüzden bağımsız) ----------
// 96 kâğıt: 9'dan asa 24'lük deste dört kez. Kâğıt 0-95: tür = id % 24, renk = tür / 6 (0 maça, 1 kupa, 2 karo, 3 sinek),
// değer = tür % 6 (0: 9, 1: vale, 2: kız, 3: papaz, 4: 10, 5: as); güç sırası da budur
const suitOf = (c) => ((c % 24) / 6) | 0, rk = (c) => c % 6, ty = (c) => c % 24;
const RJ = 1, RQ = 2, RK = 3, R10 = 4, RA = 5, BQ = 2, BJ = 13; // BQ maça kızı, BJ karo valesi
const FOUR = { 1: [40, 400], 2: [60, 600], 3: [80, 800], 5: [100, 1000] }; // dörtlüler: [karışık, aynı dört koz]
const BEZ = [0, 50, 500, 1500, 3000]; // bezik: tek, çift, üçlü, dörtlü
const isBrisk = (c) => rk(c) >= R10; // as ve 10'lu
const best = (a, f) => a.reduce((b, c) => (f(c) > f(b) ? c : b));
function shuffled(rnd = Math.random, a = Array.from({ length: 96 }, (_, i) => i)) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// b, önce atılan a'yı yener mi: aynı renkte büyük ya da koz; eşit kâğıtta önce atan alır
const beats = (a, b, tr) => (suitOf(b) === suitOf(a) ? rk(b) > rk(a) : tr >= 0 && suitOf(b) === tr);
// h: { stock, hands: kapalı el, table: masaya açılan (yine eldedir), groups: bozulmamış gruplar { k: kq|seri|four|bez, key, cards, val },
//      won, trick: [{ p, c, rp: yeniden yazılan }], rd: turda yazılan, dn: dönük sayı, trump, tseri: koz serisi açıldı mı, end: deste bitti mi,
//      leader, turn, phase: deal|play|decl|draw|done, noDecl, lastW, res, mid }
function newRound(dealer, rnd) {
  const nd = 1 - dealer;
  return { stock: shuffled(rnd), hands: [[], []], table: [[], []], groups: [[], []], won: [[], []], trick: [], rd: [0, 0], dn: [0, 0], trump: -1, tseri: false, end: false,
    leader: nd, turn: nd, phase: 'deal', noDecl: false, lastW: -1, res: null, mid: true };
}
const dealStep = (h, k) => { const p = ((k / 3) | 0) % 2 ? 1 - h.leader : h.leader; h.hands[p].push(h.stock.pop()); return p; }; // üçer üçer, önce dağıtmayana
// Deste bitene kadar her kâğıt atılabilir; sonra renge uymak ve büyütmek, o renk yoksa koz atmak zorunlu
function legalOf(h, p) {
  const all = h.hands[p].concat(h.table[p]);
  if (!h.end || !h.trick.length) return all;
  const a = h.trick[0].c, f = all.filter((c) => suitOf(c) === suitOf(a));
  if (f.length) { const hi = f.filter((c) => rk(c) > rk(a)); return hi.length ? hi : f; }
  const t = all.filter((c) => suitOf(c) === h.trump);
  return t.length ? t : all;
}
// Açılabilecek sayılar (en yükseği başta). Önce masadaki kâğıtlar kullanılır, en az bir kâğıt elden gelmeli.
// Aynı türden bozulmamış grup masadaysa yalnız daha yükseği açılır (tek bezikten çifte, karışık 4 astan aynı 4 asa gibi).
// ponytail: birleşik sayılar (koz papaz-kız + karo vale 100, seri + bezik 300) ve "masada 5 as varken 4 as açılmaz" yok; tek kaynakta geçiyor
function decls(hand, table, groups, tr) {
  const out = [], pool = table.concat(hand), T = (t) => (x) => ty(x) === t;
  const top = (k, key) => Math.max(0, ...groups.filter((g) => g.k === k && g.key === key).map((g) => g.val));
  const pick = (preds) => {
    const used = new Set(), cards = [];
    for (const f of preds) { const c = pool.find((x) => !used.has(x) && f(x)); if (c === undefined) return null; used.add(c); cards.push(c); }
    if (cards.some((c) => hand.includes(c))) return cards;
    for (let i = 0; i < preds.length; i++) { const c = hand.find((x) => !used.has(x) && preds[i](x)); if (c !== undefined) { cards[i] = c; return cards; } }
    return null;
  };
  const add = (k, key, preds, val) => { if (val <= top(k, key)) return false; const cards = pick(preds); if (cards) out.push({ k, key, cards, val }); return !!cards; };
  for (let s = 0; s < 4; s++) {
    const t = tr < 0 || s === tr; // koz yokken açılan papaz-kız ya da seri kozu belirler
    if (!top('seri', s)) add('kq', s, [T(s * 6 + RK), T(s * 6 + RQ)], t ? 40 : 20);
    add('seri', s, [RA, R10, RK, RQ, RJ].map((r) => T(s * 6 + r)), t ? 250 : 150);
  }
  for (const r of [RJ, RQ, RK, RA]) {
    const same = [];
    if (tr >= 0) same.push([tr * 6 + r, FOUR[r][1]]);
    if (r === RA) for (let s = 0; s < 4; s++) if (s !== tr) same.push([s * 6 + RA, 500]);
    if (!same.some(([t, v]) => add('four', r, [T(t), T(t), T(t), T(t)], v))) add('four', r, Array(4).fill((x) => rk(x) === r), FOUR[r][0]);
  }
  const nb = Math.min(pool.filter(T(BQ)).length, pool.filter(T(BJ)).length);
  for (let n = nb; n > 0; n--) if (add('bez', 0, [...Array(n).fill(T(BQ)), ...Array(n).fill(T(BJ))], BEZ[n])) break;
  return out.sort((a, b) => b.val - a.val);
}
const declsOf = (h, p) => decls(h.hands[p], h.table[p], h.groups[p], h.trump);
function declareC(h, p, d) {
  for (const c of d.cards) { const i = h.hands[p].indexOf(c); if (i >= 0) { h.hands[p].splice(i, 1); h.table[p].push(c); } }
  h.groups[p] = h.groups[p].filter((g) => !(g.key === d.key && (g.k === d.k || (d.k === 'seri' && g.k === 'kq')))); // seri, içindeki papaz-kızın yerini alır
  h.groups[p].push({ k: d.k, key: d.key, cards: d.cards.slice(), val: d.val });
  if (h.trump < 0 && (d.k === 'kq' || d.k === 'seri')) h.trump = d.key;
  if (d.k === 'seri' && d.key === h.trump) h.tseri = true;
  h.rd[p] += d.val;
}
// Eli başlatan, bozulmamış grubundaki bir kâğıdın aynısını elden atarsa o grubun sayısı yeniden yazılır (dönükken olmaz)
// ponytail: yeniden yazma kendiliğinden olur ve yalnız eli başlatana; birden çok grup uyarsa en yükseği yazılır ("300 dursun, 500" yok)
const replayVal = (h, p, c) => (h.end || h.dn[p] ? 0 : Math.max(0, ...h.groups[p].filter((g) => g.cards.some((x) => ty(x) === ty(c))).map((g) => g.val)));
const canDecl = (h, p) => !h.end && !h.noDecl && !h.dn[p] && declsOf(h, p).length > 0;
function playC(h, p, c) {
  const ti = h.table[p].indexOf(c); let rp = 0;
  if (ti >= 0) { h.table[p].splice(ti, 1); h.groups[p] = h.groups[p].filter((g) => !g.cards.includes(c)); } // masadan oynanan kâğıt grubunu bozar, sayı kalır
  else { h.hands[p].splice(h.hands[p].indexOf(c), 1); if (!h.trick.length) { rp = replayVal(h, p, c); h.rd[p] += rp; } }
  h.trick.push({ p, c, rp }); h.turn = 1 - p;
  return rp;
}
// Eli yeniden yazan kaptırırsa dönük olur; dönük olan el alınca kurtulur ama o tur sayı açamaz
function resolveC(h) {
  const [a, b] = h.trick, w = beats(a.c, b.c, h.trump) ? b.p : a.p, ev = { w, dn: -1, clr: false };
  h.won[w].push(a.c, b.c); h.trick = []; h.leader = h.turn = w; h.noDecl = false;
  if (!h.end && h.dn[w]) { h.dn[w] = 0; h.noDecl = ev.clr = true; }
  if (a.rp && w !== a.p) { h.dn[a.p] = a.rp; ev.dn = a.p; }
  if (h.end) { if (h.hands[w].length) h.phase = 'play'; else { h.phase = 'done'; h.lastW = w; } }
  else h.phase = canDecl(h, w) ? 'decl' : 'draw';
  return ev;
}
function drawC(h) { // önce eli alan çeker; deste bitince masadakiler ele alınır
  const w = h.leader; h.hands[w].push(h.stock.pop()); h.hands[1 - w].push(h.stock.pop()); h.phase = 'play';
  if (h.stock.length) return false;
  h.end = true;
  for (const p of [0, 1]) { h.hands[p].push(...h.table[p]); h.table[p] = []; h.groups[p] = []; }
  return true;
}
// Tur içinde hedefe ulaşan (dönük değilse) hemen kazanır; yoksa -1
const reached = (G) => [0, 1].filter((p) => !G.h.dn[p] && G.scores[p] + G.h.rd[p] >= G.target).concat(-1)[0];
// Tur sonu: yanan dönük düşülür, son el (koz serisi açıldıysa 250, yalnız koz 40), sonra briskler (her biri 20)
function roundEnd(G) {
  const h = G.h, lb = h.tseri ? 250 : h.trump >= 0 ? 40 : 0;

@media (max-height: 480px) { #rgRep .rc { padding: 12px 14px; } #rgRep h2 { font-size: 17px; } #rgRep p { margin-bottom: 6px; } #rgRep textarea { min-height: 56px; } #rgRep .rb { grid-template-columns: 2fr 1fr 1fr; margin-top: 8px; } #rgRep button.go { grid-column: auto; } #rgRep button { min-height: 38px; } }

@media (orientation: landscape) and (max-height: 520px) { #setOv .sheet { max-width: 560px; gap: 10px; } #setOv .sheet .logo { flex-direction: row; justify-content: center; } #setOv .mlist { grid-template-columns: 1fr 1fr; } #setOv .mi { height: 42px; } }
@media (orientation: landscape) and (max-height: 520px) { html.rgSet .top .in { max-width: 560px; gap: 10px; padding: 14px 18px; } html.rgSet .top .logo { flex-direction: row; justify-content: center; } html.rgSet .top .tools { grid-template-columns: 1fr 1fr; } html.rgSet .top .pill { height: 42px; } html.rgSet .top .rgClose { height: 40px; }
  html.rgSet #topHeader > div { max-width: 560px; gap: 10px; padding: 14px 18px; } html.rgSet #topHeader #homeLink { flex-direction: row; } html.rgSet #topHeader #homeLink + div { grid-template-columns: 1fr 1fr; } html.rgSet #topHeader #modeSelect { grid-column: 1 / -1; height: 40px; } html.rgSet #topHeader #homeLink + div > button { height: 42px; } html.rgSet #topHeader .rgClose { height: 40px; } }
</style>
<script id="rgRepJs">
(() => {
  const MAIL = 'destek@ridsgames.com', H = document.documentElement, errs = window.__rgErr || [];
  const T = {
    tr: { b: 'Sorun bildir', h: 'Sorun bildir', p: 'Ne oldu? Kısaca yazın. Gönder deyince e-posta uygulamanız hazır bir mesajla açılır, siz göndermeden hiçbir şey bize ulaşmaz.', ph: 'Örnek: Kartı oynadığımda oyun takıldı.', inf: 'Mesaja eklenecek bilgiler', send: 'E-posta ile gönder', copy: 'Kopyala', close: 'Kapat', copied: 'Kopyalandı. ' + MAIL + ' adresine gönderebilirsiniz.', nocopy: 'Kopyalanamadı. Metni seçip kopyalayın ve ' + MAIL + ' adresine gönderin.', subj: 'Sorun bildirimi', game: 'Oyun', page: 'Sayfa', lang: 'Dil', scr: 'Ekran', br: 'Tarayıcı', time: 'Zaman', err: 'Son hatalar', none: 'yok', desc: 'Açıklama' },
    en: { b: 'Report a problem', h: 'Report a problem', p: 'What happened? Write a few words. Send opens your email app with a ready message; nothing reaches us unless you send it.', ph: 'Example: the game froze when I played a card.', inf: 'Details added to the message', send: 'Send by email', copy: 'Copy', close: 'Close', copied: 'Copied. You can send it to ' + MAIL + '.', nocopy: 'Could not copy. Select the text, copy it and send it to ' + MAIL + '.', subj: 'Problem report', game: 'Game', page: 'Page', lang: 'Language', scr: 'Screen', br: 'Browser', time: 'Time', err: 'Recent errors', none: 'none', desc: 'Description' }
  };
  const t = () => T[(H.lang || 'tr').startsWith('en') ? 'en' : 'tr'];
  const gname = () => { const g = document.getElementById('gameName') || document.querySelector('#homeLink .gname'); return ((g && g.textContent) || document.title || '').replace(/\s*[|·–-]\s*Ridsgames.*$/i, '').trim(); };
  const info = () => { const l = t(), so = screen.orientation && screen.orientation.type;
    return [`${l.game}: ${gname()}`, `${l.page}: ${location.pathname}`, `${l.lang}: ${H.lang || '-'}`,
      `${l.scr}: ${innerWidth}x${innerHeight} @${Math.round((devicePixelRatio || 1) * 100) / 100}x${so ? ' ' + so : ''}${matchMedia('(pointer: coarse)').matches ? ' touch' : ''}`,
      `${l.br}: ${navigator.userAgent}`, `${l.time}: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
      `${l.err}: ${errs.length ? '' : l.none}`, ...errs.slice(-3).reverse().map((e) => `- ${e.t} ${e.m} @ ${e.src}`)].join('\n'); };
  let ov = null;
  const body = () => { const l = t(), d = ov.querySelector('textarea').value.trim(); return `${l.desc}:\n${d || '-'}\n\n---\n${info()}`; };
  const build = () => {
    ov = document.createElement('div'); ov.id = 'rgRep'; ov.hidden = true;
    ov.innerHTML = '<div class="rc" role="dialog" aria-modal="true" aria-labelledby="rgRepH"><h2 id="rgRepH"></h2><p class="pp"></p><textarea maxlength="1200"></textarea><details><summary></summary><pre></pre></details><div class="ok" role="status"></div><div class="rb"><button type="button" class="go"></button><button type="button" class="cp"></button><button type="button" class="cl"></button></div></div>';
    document.body.appendChild(ov);
    const q = (s) => ov.querySelector(s), close = () => { ov.hidden = true; };
    q('.cl').onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ['keydown', 'keyup', 'keypress'].forEach((k) => ov.addEventListener(k, (e) => { e.stopPropagation(); if (k === 'keydown' && e.key === 'Escape') close(); }));
    ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'contextmenu'].forEach((k) => ov.addEventListener(k, (e) => e.stopPropagation(), { passive: true }));
    q('.go').onclick = () => { const l = t(); let b = body(); if (b.length > 1400) b = b.slice(0, 1400) + '…';
      location.href = `mailto:${MAIL}?subject=${encodeURIComponent(`${l.subj}: ${gname()}`)}&body=${encodeURIComponent(b)}`; };
    q('.cp').onclick = () => { const l = t(), b = `${l.subj}: ${gname()}\n\n${body()}`, ok = q('.ok');
      const fb = () => { const a = document.createElement('textarea'); a.value = b; a.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; ov.appendChild(a); a.select(); let r = false; try { r = document.execCommand('copy'); } catch (_) {} a.remove(); ok.textContent = r ? l.copied : l.nocopy; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b).then(() => { ok.textContent = l.copied; }, fb); else fb(); };
  };
  const open = () => { if (!ov) build(); const l = t(), q = (s) => ov.querySelector(s);
    q('h2').textContent = l.h; q('.pp').textContent = l.p; q('textarea').placeholder = l.ph; q('summary').textContent = l.inf; q('pre').textContent = info();
    q('.go').textContent = l.send; q('.cp').textContent = l.copy; q('.cl').textContent = l.close; q('.ok').textContent = '';
    ov.hidden = false; setTimeout(() => q('textarea').focus({ preventScroll: true }), 30); };
  // Menüye satır ekle: Kurallar düğmesinin görünüşünü kopyalar
  const ICO = '✉';
  let btn = null;
  const label = () => { if (!btn) return; const l = t(); btn.setAttribute('aria-label', l.b); btn.title = l.b; const s = btn.querySelector('.rgRepL'); if (s) s.textContent = l.b; };
  const mount = () => {
    const rules = document.getElementById('rulesBtn'), lang = document.getElementById('langBtn');
    btn = document.createElement('button'); btn.type = 'button'; btn.id = 'rgRepBtn';
    if (rules && lang && rules.parentNode === lang.parentNode) {
      btn.className = rules.className; const sp = [...rules.children].filter((x) => x.tagName === 'SPAN');
      const a = document.createElement('span'); a.textContent = ICO; if (sp[0]) a.className = sp[0].className; btn.appendChild(a);
      if (sp[1]) { const b = document.createElement('span'); b.className = (sp[1].className + ' rgRepL').trim(); btn.appendChild(b); }
      lang.parentNode.insertBefore(btn, lang);
    } else {
      const host = document.getElementById('btn-reset-from-settings'), menu = document.getElementById('menu');
      const s = document.createElement('span'); s.className = 'rgRepL'; btn.append(ICO + ' ', s);
      if (host) { btn.className = host.className; host.parentNode.insertBefore(btn, host); }
      else if (menu) { btn.style.cssText = 'background:none;border:0;box-shadow:none;color:inherit;opacity:.75;font-size:13px;text-decoration:underline;margin-top:10px;min-height:0;padding:4px'; menu.appendChild(btn); }
      else { btn = null; return; }
    }
    btn.addEventListener('click', () => setTimeout(open, 0));
    label(); new MutationObserver(label).observe(H, { attributes: true, attributeFilter: ['lang'] });
  };
  window.rgReport = () => open();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
<script>
// Puan tablosu: düğmeyle açılır, dışına dokununca kapanır
{
  const b = document.getElementById('skBtn'), p = document.getElementById('skorPop');
  const set = (on) => { p.hidden = !on; b.setAttribute('aria-expanded', on); };
  b.addEventListener('click', () => set(p.hidden));
  addEventListener('pointerdown', (e) => { if (!p.hidden && !p.contains(e.target) && !b.contains(e.target)) set(false); }, true);
  const lbl = () => b.setAttribute('aria-label', document.documentElement.lang === 'en' ? 'Scoreboard' : 'Puan tablosu');
  lbl(); new MutationObserver(lbl).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
}
</script>
