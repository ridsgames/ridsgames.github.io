<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<title>Okey | Ridsgames</title>
<meta name="description" content="Okey ve 101 Okey: dört kişilik masada üç bilgisayar rakibe karşı oyna. Taşlarını diz, per aç, elini ilk sen bitir.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --glow: rgba(251, 191, 36, 0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--glow) 28%, transparent) 0%, transparent 62%), radial-gradient(ellipse at 50% 100%, #111a2c 0%, var(--bg) 70%), var(--bg);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 64px 16px 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg.tall button { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.seg.tall small { font-size: 11px; font-weight: 600; opacity: .75; white-space: nowrap; }
.seg.tall .em { font-size: 19px; }
.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.custom { display: grid; gap: 6px; margin-top: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px 44px; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
.mrow button { height: 44px; border-radius: 12px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 24px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.mrow button:disabled { opacity: .35; cursor: default; }
.mrow output { text-align: center; font-size: 24px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.score { text-align: center; font-size: 44px; font-weight: 800; line-height: 1; margin: 2px 0 14px; color: #fde68a; font-variant-numeric: tabular-nums; }
.score.lost { color: #fca5a5; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .b { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; top: 64px; z-index: 15; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
main { flex: 1; min-height: 0; width: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.panel { border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
/* Yatay telefon: üst çubuk soldaki dikey menü paneli olur; pencereler menü panelini örtmez; alt bilgi gizli */
@media (orientation: landscape) and (max-height: 500px) {
  body { display: grid; grid-template-columns: clamp(120px, 17vw, 160px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .top { grid-column: 1; grid-row: 1; border-bottom: 0; border-right: 1px solid rgba(30, 41, 59, .8); overflow-y: auto; }
  .top .in { height: auto; min-height: 100%; max-width: none; flex-direction: column; justify-content: center; padding: 14px 8px; gap: 16px; }
  .logo { flex-direction: column; gap: 6px; }
  .gname { display: inline; font-size: 11px; white-space: nowrap; }
  .tools { flex-wrap: wrap; justify-content: center; gap: 8px; }
  .pill { white-space: nowrap; }
  main { grid-column: 2; grid-row: 1; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 6px; }
  body > .ov { padding: 8px 8px 8px calc(clamp(120px, 17vw, 160px) + 8px); }
  .toast { top: 12px; left: calc(50% + clamp(120px, 17vw, 160px) / 2); }
  footer { display: none; }
  #setupOv .card { max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; align-content: start; padding: 14px 18px 0; }
  #setupOv h2, #setupOv .sub, #setupOv .btns, #setupOv .wide { grid-column: 1 / -1; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 4px; }
  #setupOv .sec { margin-top: 8px; padding-top: 8px; }
  #setupOv .btns { position: sticky; bottom: 0; z-index: 1; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 8px -18px 0; padding: 10px 18px 14px; background: linear-gradient(180deg, rgba(11, 18, 32, 0), #0b1220 30%); }
  #winOv .card { max-width: 560px; padding: 14px 18px 16px; }
  #winOv .trophy { font-size: 38px; } #winOv .score { font-size: 34px; margin-bottom: 8px; } #winOv .sub { margin-bottom: 8px; }
  #winOv .rank { grid-template-columns: 1fr 1fr; }
  #winOv .btns { grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 10px; }
}

/* ---------- Oyuna özel ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto auto auto; gap: 7px; align-items: stretch; --tw: 26px; }
.opps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seat { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: 12px; background: rgba(2, 6, 23, .55); border: 1.5px solid rgba(148, 163, 184, .16); min-width: 0; }
.seat.on { border-color: #34d399; background: rgba(16, 185, 129, .13); }
.seat .nm { font-weight: 800; font-size: 13.5px; color: #fff; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .in { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #94a3b8; font-variant-numeric: tabular-nums; }
.seat .in b { color: #fde68a; font-size: 13px; }
.seat .op { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 6px; background: #22c55e; color: #052e16; }
.table { position: relative; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #166534, #0b3b22 75%); border: 1px solid rgba(52, 211, 153, .25); }
.melds { flex: 1; min-height: 0; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
.melds:empty { display: none; }
.meld { display: flex; gap: 1px; padding: 3px; border-radius: 7px; background: rgba(0, 0, 0, .22); border: 1.5px solid transparent; --tw: 19px; cursor: pointer; }
.meld.p0 { border-color: rgba(52, 211, 153, .55); } .meld.tgt { border-color: #fbbf24; box-shadow: 0 0 0 2px rgba(251, 191, 36, .35); }
.center { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-bottom: 14px; }
.melds:empty + .center { margin: auto 0; }
.pile { width: calc(var(--tw) * 1.5 + 16px); min-height: calc(var(--tw) * 2.1 + 16px); border-radius: 10px; border: 2px dashed rgba(255, 255, 255, .25); display: grid; place-items: center; position: relative; --tw: 30px; padding: 6px; }
.pile .lb { position: absolute; bottom: -2px; left: 50%; transform: translate(-50%, 100%); font-size: 10.5px; color: #a7f3d0; white-space: nowrap; font-weight: 700; }
.pile.take { border-color: #fbbf24; border-style: solid; cursor: pointer; box-shadow: 0 0 0 3px rgba(251, 191, 36, .25); }
.pile.drop { border-color: #34d399; border-style: solid; cursor: pointer; }
.pile.hov { background: rgba(52, 211, 153, .2); }
.deckw { display: flex; align-items: center; gap: 10px; }
.deck { --tw: 30px; width: calc(var(--tw) * 1.12); height: calc(var(--tw) * 1.5); border-radius: 6px; background: repeating-linear-gradient(135deg, #f8fafc 0 4px, #e2e8f0 4px 8px); border: 1px solid #94a3b8; box-shadow: 2px 2px 0 #cbd5e1, 4px 4px 0 #94a3b8, 0 6px 12px rgba(0, 0, 0, .4); display: grid; place-items: center; font-weight: 900; color: #334155; font-size: 14px; }
.deck.take { cursor: pointer; outline: 3px solid #fbbf24; outline-offset: 3px; }
.ind { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: #a7f3d0; font-weight: 700; --tw: 26px; text-align: center; }
.tl { position: relative; flex: none; width: var(--tw); height: calc(var(--tw) * 1.38); border-radius: calc(var(--tw) * .16); background: linear-gradient(180deg, #fffdf5, #f1ead6); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12), 0 2px 3px rgba(0, 0, 0, .35);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(var(--tw) * .12); font-weight: 900; font-size: calc(var(--tw) * .62); line-height: 1; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; touch-action: none; }
.tl::after { content: ''; width: calc(var(--tw) * .22); height: calc(var(--tw) * .22); border-radius: 50%; background: currentColor; margin-top: calc(var(--tw) * .14); opacity: .9; }
.tl.c0 { color: #b45309; } .tl.c1 { color: #1d4ed8; } .tl.c2 { color: #dc2626; } .tl.c3 { color: #111827; }
.tl.fk::after { display: none; } .tl.fk { color: #15803d; font-size: calc(var(--tw) * .7); justify-content: center; padding: 0; }
.tl.jk::before { content: '★'; position: absolute; top: 1px; right: 2px; font-size: calc(var(--tw) * .28); color: #f59e0b; }
.tl.back { background: repeating-linear-gradient(135deg, #f8fafc 0 4px, #e2e8f0 4px 8px); }
.tl.back::after { display: none; }
.stage, .rackw, .status, .table { min-width: 0; }
.stage { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: rgba(251, 191, 36, .08); border: 1px dashed rgba(251, 191, 36, .45); overflow-x: auto; }
.stage .sm { display: flex; gap: 6px; flex: 1; min-width: 0; }
.stage .meld { --tw: 19px; background: rgba(0, 0, 0, .25); }
.stage .tot { flex: none; font-size: 13px; font-weight: 800; color: #fde68a; white-space: nowrap; }
.status { text-align: center; font-size: 14.5px; font-weight: 700; color: #e2e8f0; min-height: 1.4em; }
.rackw { display: flex; justify-content: center; }
.rack { display: grid; grid-template-columns: repeat(13, var(--tw)); grid-auto-rows: calc(var(--tw) * 1.38); gap: 4px 2px; padding: 7px 6px 9px; border-radius: 12px;
  background: linear-gradient(180deg, #92400e, #78350f); box-shadow: inset 0 -5px 0 #451a03, 0 6px 14px rgba(0, 0, 0, .45); }
.slot { position: relative; border-radius: 4px; background: rgba(0, 0, 0, .12); }
.slot.hov { background: rgba(251, 191, 36, .4); }
.rack .tl { cursor: grab; transition: transform .12s; }
.rack .tl.sel { transform: translateY(-5px); box-shadow: 0 0 0 2.5px #fbbf24, 0 6px 10px rgba(0, 0, 0, .45); }
.rack .tl.nw { box-shadow: 0 0 0 2.5px #34d399, 0 2px 3px rgba(0, 0, 0, .35); }
.rack .tl.dragging { opacity: .25; }
.ghost { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -60%) scale(1.12); }
.acts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.acts button { height: 40px; padding: 0 14px; border-radius: 999px; border: 0; font-weight: 800; font-size: 14px; color: #052e16; background: linear-gradient(180deg, #34d399, #10b981); }
.acts button.alt { color: #e2e8f0; background: rgba(15, 23, 42, .8); border: 1px solid rgba(148, 163, 184, .3); }
.acts button.warn { color: #422006; background: linear-gradient(180deg, #fcd34d, #f59e0b); }
.acts button:disabled { opacity: .45; }
.res { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px; background: rgba(2, 6, 23, .55); z-index: 20; }
.res .box { width: min(380px, 100%); max-height: 100%; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.res h3 { margin: 0; font-size: 18px; color: #fff; text-align: center; }
.res .rl { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; font-size: 13.5px; color: #cbd5e1; padding: 4px 2px; border-bottom: 1px dashed rgba(148, 163, 184, .2); }
.res .rl b { color: #fff; text-align: right; min-width: 36px; } .res .rl .d { text-align: right; font-weight: 800; }
.res .d.up { color: #4ade80; } .res .d.dn { color: #f87171; }
.res button { height: 42px; border-radius: 999px; border: 0; font-weight: 800; font-size: 15px; color: #052e16; background: linear-gradient(180deg, #34d399, #10b981); margin-top: 4px; }
.res .hand { display: flex; flex-wrap: wrap; gap: 1px; --tw: 16px; justify-content: center; }
@media (orientation: landscape) {
  main { grid-template-columns: minmax(0, 1fr) clamp(190px, 24vw, 280px); grid-template-rows: auto minmax(0, 1fr) auto auto auto; max-width: 1240px; }
  .table { grid-column: 1; grid-row: 1 / 3; }
  .opps { grid-column: 2; grid-row: 1; grid-template-columns: minmax(0, 1fr); }
  .seat { flex-direction: row; justify-content: space-between; padding: 6px 10px; }
  .acts { grid-column: 2; grid-row: 2 / 4; min-height: 0; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; align-content: start; }
  .acts button { width: 100%; }
  .stage { grid-column: 1; grid-row: 3; } .status { grid-column: 1 / -1; } .rackw { grid-column: 1 / -1; }
}
@media (orientation: landscape) and (max-height: 500px) {
  main { gap: 5px; }
  .seat { padding: 3px 8px; } .seat .nm { font-size: 12.5px; }
  .acts { gap: 4px; } .acts button { height: 30px; font-size: 12.5px; padding: 0 6px; }
  .status { font-size: 13px; min-height: 1.2em; }
  .rack { padding: 4px 5px 6px; gap: 3px 2px; }
  .table { padding: 5px; } .pile { --tw: 24px; } .deck { --tw: 24px; } .ind { --tw: 22px; }
}
@media (min-width: 700px) and (min-height: 700px) {
  .pile, .deck { --tw: 40px; } .ind { --tw: 34px; font-size: 12px; } .deck { font-size: 17px; }
  .meld, .stage .meld { --tw: 26px; } .res .hand { --tw: 22px; }
  .seat .nm { font-size: 15px; } .seat .in { font-size: 13px; }
}

</style>

function tapTile(id) { if (!G || G.phase === 'res' || G.phase === 'end' || G.phase === 'over') return; Sfx.unlock(); if (selSet.has(id)) selSet.delete(id); else { if (!is101()) selSet.clear(); selSet.add(id); } Sfx.tap(); render(); }
function moveSlot(from, to) {
  if (from === to) return; const R = G.rack, id = R[from]; R[from] = -1;
  if (R[to] < 0) { R[to] = id; return; }
  const row = Math.floor(to / 13) * 13;
  let e = -1; for (let q = to + 1; q < row + 13; q++) if (R[q] < 0) { e = q; break; }
  if (e >= 0) { for (let q = e; q > to; q--) R[q] = R[q - 1]; R[to] = id; return; }
  for (let q = to - 1; q >= row; q--) if (R[q] < 0) { e = q; break; }
  if (e >= 0) { for (let q = e; q < to; q++) R[q] = R[q + 1]; R[to] = id; return; }
  R[from] = R[to]; R[to] = id;
}

// ---------- Çizim ----------
function sizeTiles() {
  const main = $('main'), w = Math.min(main.clientWidth, 900) - 16;
  const land = matchMedia('(orientation: landscape)').matches && innerHeight < 560;
  let tw = Math.floor((w - 12 - 24) / 13);
  if (land) tw = Math.min(tw, Math.floor((innerHeight - 265) / 2.76));
  tw = clamp(tw, 20, 50);
  main.style.setProperty('--tw', tw + 'px');
}
function render() {
  if (!G) return;
  const t = T(), my = myTurn();
  sizeTiles();
  // koltuklar: sol(3), üst(2), sağ(1)
  $('opps').innerHTML = [3, 2, 1].map((p) => `<div class="seat${G.turn === p && (G.phase === 'draw' || G.phase === 'play') ? ' on' : ''}"><span class="nm">${esc(pname(p))}</span><span class="in">${esc(t.tiles(G.hand[p].length))}${G.opened[p] ? ` <span class="op">${esc(t.opened)}</span>` : ''} <b>${G.scores[p]}</b></span></div>`).join('');
  // perler
  $('melds').innerHTML = is101() ? G.melds.map((m, i) => `<div class="meld${m.o === 0 ? ' p0' : ''}" data-mi="${i}" title="${esc(pname(m.o))}">${m.ids.map((id) => tileHtml(id)).join('')}</div>`).join('') : '';
  // yığınlar
  const lp = G.piles[3], lt = lp[lp.length - 1], canTake = my && G.phase === 'draw' && lp.length;
  $('leftPile').className = 'pile' + (canTake ? ' take' : '');
  $('leftPile').innerHTML = (lt != null ? tileHtml(lt) : '') + `<span class="lb">${esc(canTake ? t.takeL : pname(3))}</span>`;
  const mp = G.piles[0], mt = mp[mp.length - 1], canDrop = my && G.phase === 'play';
  $('myPile').className = 'pile mine' + (canDrop ? ' drop' : '');
  $('myPile').innerHTML = (mt != null ? tileHtml(mt) : '') + `<span class="lb">${esc(t.myL)}</span>`;
  $('deck').className = 'deck' + (my && G.phase === 'draw' ? ' take' : '');
  $('deck').textContent = G.deck.length;
  $('ind').innerHTML = `${tileHtml(G.ind)}<span>${esc(t.indL)}</span>`;
  // hazırlık
  const st = $('stage');
  st.hidden = !(is101() && G.stage.length);
  if (!st.hidden) { const pairs = G.stage[0].t === 'pair', tot = G.stage.reduce((s, m) => s + m.val, 0);
    st.innerHTML = `<div class="sm">${G.stage.map((m, i) => `<div class="meld" data-si="${i}">${m.ids.map((id) => tileHtml(id)).join('')}</div>`).join('')}</div><span class="tot">${esc(pairs ? t.pairsN(G.stage.length) : t.total(tot))}</span>`; }
  // raf
  $('rack').innerHTML = G.rack.map((id, i) => `<div class="slot" data-s="${i}">${id >= 0 ? tileHtml(id, (selSet.has(id) ? 'sel' : '') + (id === newId ? ' nw' : '')) : ''}</div>`).join('');
  // durum ve düğmeler
  let s = '';
  if (G.phase === 'draw' || G.phase === 'play') {
    if (G.turn !== 0) s = t.thinking(pname(G.turn));
    else if (G.phase === 'draw') s = t.drawMe;
    else if (is101()) s = G.opened[0] ? t.play101 : (G.stage.length ? t.open101 : t.play101);
    else s = G.firstDone[0] || G.hand[0].length < 15 ? t.playMe : t.playFirst;
  }
  if (G.note) s = G.note + (s ? ' · ' + s : '');
  $('status').textContent = s;
  let a = '';
  if (G.phase === 'draw' || G.phase === 'play') {
    a += `<button type="button" class="alt" id="bRun">${esc(t.sortRun)}</button><button type="button" class="alt" id="bPair">${esc(t.sortPair)}</button>`;
    if (my && G.phase === 'play') {
      if (!is101()) { a += `<button type="button" id="bFin"${G.hand[0].length === 15 ? '' : ' disabled'}>${esc(t.finishB)}</button>`; if (canShow(0)) a += `<button type="button" class="warn" id="bShow">${esc(t.showB)}</button>`; }
      else {
        a += `<button type="button" id="bMeld"${selSet.size >= 2 ? '' : ' disabled'}>${esc(t.perB)}</button><button type="button" class="alt" id="bFind">${esc(t.findB)}</button>`;
        if (!G.opened[0] && G.stage.length) a += `<button type="button" class="warn" id="bOpen">${esc(t.openB)}</button><button type="button" class="alt" id="bCancel">${esc(t.cancelB)}</button>`;
        if (G.took >= 0 && G.hand[0].includes(G.took)) a += `<button type="button" class="alt" id="bBack">${esc(t.backB)}</button>`;
      }
    }
  }
  $('acts').innerHTML = a;
  // sonuç
  const show = G.phase === 'res' || G.phase === 'end'; $('res').hidden = !show;
  if (show) {
    const R = G.res; const head = R.w < 0 ? (is101() ? t.deckOut101 : t.deckOut) : R.ok ? t.finishedOk(pname(R.w)) : R.pairs ? t.finishedPairs(pname(R.w)) : t.finished(pname(R.w));
    $('resBox').innerHTML = `<h3>${esc(head)}</h3>${R.wm ? `<div class="hand">${R.wm.map((m) => m.map((id) => tileHtml(id)).join('')).join('<span style="width:6px"></span>')}</div>` : ''}<div class="rl" style="color:#94a3b8;font-size:12px"><span>${esc(t.handN(G.handNo, G.hands))}</span><span>${esc(is101() ? t.penL : '')}</span><span>${esc(t.scoreL)}</span></div>${[0, 1, 2, 3].map((q) => `<div class="rl"><span>${esc(pname(q))}${is101() && !G.opened[q] && q !== R.w ? ` · ${esc(t.notOpenedR)}` : ''}</span><span class="d ${R.deltas[q] === 0 ? '' : (R.deltas[q] > 0) !== is101() ? 'up' : 'dn'}">${R.deltas[q] > 0 ? '+' : ''}${R.deltas[q] || '·'}</span><b>${G.scores[q]}</b></div>`).join('')}<button type="button" id="resB">${esc(G.phase === 'end' ? t.seeEnd : t.nextHand)}</button>`;
  }
  newId = -1;
}
function renderSetup() {
  const t = T();
  segPress('modeSeg', 'm', setup.mode); segPress('lvSeg', 'l', setup.level); segPress('handsSeg', 'h', String(setup.hands));
  $('modeNote').textContent = t.modeNote[setup.mode];
}
function openSetup() { renderSetup(); closeAll(); $('setupOv').hidden = false; $('backBtn').hidden = !G || G.phase === 'over'; $('startBtn').focus({ preventScroll: true }); }
function gameLang() {
  const t = T();
  ['modeLbl', 'lvLbl', 'handsLbl'].forEach((k) => { $(k).textContent = t[k]; });
  document.querySelectorAll('#modeSeg button').forEach((b) => { const [e, n] = t.modes[b.dataset.m]; b.innerHTML = `<span class="em">${e}</span><small>${n}</small>`; });
  document.querySelectorAll('#lvSeg button').forEach((b) => { b.textContent = t.lv[b.dataset.l]; });
  document.querySelectorAll('#handsSeg button').forEach((b) => { b.textContent = t.handsN(+b.dataset.h); });
  renderSetup(); render();
}
const segH = (id, attr, fn) => $(id).addEventListener('click', (e) => { const b = e.target.closest(`button[data-${attr}]`); if (b) { fn(b.dataset[attr]); renderSetup(); } });
segH('modeSeg', 'm', (v) => { setup.mode = v; });
segH('lvSeg', 'l', (v) => { setup.level = v; });
segH('handsSeg', 'h', (v) => { setup.hands = +v; });
$('deck').addEventListener('click', () => { if (!G) return; if (G.phase === 'draw') humanDraw(); else if (G.phase === 'play' && !is101() && selSet.size === 1) humanFinish(); });
$('leftPile').addEventListener('click', humanTake);
$('myPile').addEventListener('click', () => humanDiscard());
$('melds').addEventListener('click', (e) => { const m = e.target.closest('.meld'); if (m) humanAdd(+m.dataset.mi); });
$('stage').addEventListener('click', (e) => { const m = e.target.closest('.meld'); if (m) unstage(+m.dataset.si); });
$('acts').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || !G) return; Sfx.unlock();
  ({ bRun: () => { arrange('run'); selSet.clear(); save(); render(); }, bPair: () => { arrange('pair'); selSet.clear(); save(); render(); }, bFin: () => humanFinish(), bShow: humanShow, bMeld: humanMeld, bFind: humanFind, bOpen: humanOpen, bCancel: cancelStage, bBack: humanPutBack }[b.id] || (() => {}))();
});
$('res').addEventListener('click', (e) => { if (e.target.id === 'resB') { Sfx.click(); G.phase === 'end' ? finish() : nextHand(); } });
// sürükle bırak
$('rack').addEventListener('pointerdown', (e) => {
  const tl = e.target.closest('.tl'); if (!tl || !G) return;
  const slot = +tl.parentElement.dataset.s; drag = { id: +tl.dataset.id, slot, x: e.clientX, y: e.clientY, on: false, el: tl };
  try { tl.setPointerCapture(e.pointerId); } catch (er) {}
});
function dropTarget(x, y) {
  const el = document.elementFromPoint(x, y); if (!el) return null;
  return el.closest('.slot') || el.closest('#myPile') || el.closest('#deck') || el.closest('.meld[data-mi]');
}
addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7) {
    drag.on = true; drag.g = drag.el.cloneNode(true); drag.g.classList.add('ghost'); drag.g.classList.remove('sel'); document.body.appendChild(drag.g); drag.el.classList.add('dragging');
    drag.g.style.setProperty('--tw', getComputedStyle($('main')).getPropertyValue('--tw'));
  }
  if (!drag.on) return;
  drag.g.style.left = e.clientX + 'px'; drag.g.style.top = e.clientY + 'px';
  document.querySelectorAll('.hov').forEach((x) => x.classList.remove('hov'));
  const tg = dropTarget(e.clientX, e.clientY); if (tg) tg.classList.add('hov');
});
function endDrag(e) {
  if (!drag) return; const d = drag; drag = null;
  document.querySelectorAll('.hov').forEach((x) => x.classList.remove('hov'));
  if (!d.on) { tapTile(d.id); return; }
  d.g.remove(); d.el.classList.remove('dragging');
  const tg = e && dropTarget(e.clientX, e.clientY);
  if (tg && tg.classList.contains('slot')) { moveSlot(d.slot, +tg.dataset.s); save(); render(); }
  else if (tg && tg.id === 'myPile') humanDiscard(d.id);
  else if (tg && tg.id === 'deck') humanFinish(d.id);
  else if (tg && tg.dataset.mi != null) { selSet = new Set([d.id]); humanAdd(+tg.dataset.mi); }
  else render();
}
addEventListener('pointerup', endDrag); addEventListener('pointercancel', () => endDrag(null));
addEventListener('resize', () => G && render());
addEventListener('keydown', (e) => { if (anyOpen() || !G) return; if (e.key === 'Escape' && selSet.size) { selSet.clear(); render(); } });

function boot() {
  const s = store.get('game', null);
  if (s && s.hand && s.rack && s.phase && s.phase !== 'over') { G = s; busy = false; render(); kick(); }
  else openSetup();
}
window.__okey = { state: () => G, busy: () => busy, sel: () => [...selSet], solve, complete, parseMeld, canAdd, humanDraw, humanTake, humanDiscard, humanFinish, humanMeld, humanOpen, humanFind, humanAdd, tapTile, humanShow, humanPutBack, info };


// ---------- Ortak bağlantılar ----------
function applyLang() {
  const t = T();
  document.documentElement.lang = lang; document.title = t.title;
  $('homeLink').href = '../?lang=' + lang; $('homeLink').setAttribute('aria-label', t.homeLabel);
  $('gameName').textContent = t.game; $('menuLbl').textContent = t.newGame; $('rulesLbl').textContent = t.rules;
  $('menuBtn').setAttribute('aria-label', t.newGame); $('rulesBtn').setAttribute('aria-label', t.rules); $('soundBtn').setAttribute('aria-label', t.sound); $('fsBtn').setAttribute('aria-label', t.fs); $('langBtn').setAttribute('aria-label', t.langLabel);
  $('rights').textContent = t.rights; $('setupTitle').textContent = t.game; $('setupSub').textContent = t.setupSub;
  $('startBtn').textContent = t.start; $('backBtn').textContent = t.back;
  $('rulesTitle').textContent = t.rulesTitle; $('rulesSub').textContent = t.rulesSub; $('rulesOk').textContent = t.ok;
  $('rulesList').innerHTML = t.ruleList.map(([i, s]) => `<li><span>${i}</span><span>${s}</span></li>`).join('');
  $('againBtn').textContent = t.again; $('viewBtn').textContent = t.view; $('toMenuBtn').textContent = t.toMenu;
  $('langBtn').innerHTML = lang === 'tr' ? '<span style="color:#fff">TR</span>&nbsp;|&nbsp;EN' : 'TR&nbsp;|&nbsp;<span style="color:#fff">EN</span>';
  gameLang();
}
function applySound() { $('soundIco').textContent = soundOn ? '🔊' : '🔇'; $('soundBtn').setAttribute('aria-pressed', soundOn); }
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('rulesOv').hidden) $('rulesOv').hidden = true;
  else if (!$('setupOv').hidden && G) closeAll();
  else if (!$('winOv').hidden) closeAll();
});
$('startBtn').addEventListener('click', () => { Sfx.unlock(); startFromSetup(); });
$('backBtn').addEventListener('click', closeAll);
$('menuBtn').addEventListener('click', openSetup);
$('rulesBtn').addEventListener('click', () => { $('rulesOv').hidden = false; $('rulesTitle').focus(); sayac('kurallar', 'kurallar açıldı'); });
$('rulesOk').addEventListener('click', () => { $('rulesOv').hidden = true; });
$('rulesOv').addEventListener('click', (e) => { if (e.target.id === 'rulesOv') $('rulesOv').hidden = true; });
$('againBtn').addEventListener('click', () => { Sfx.unlock(); again(); });
$('viewBtn').addEventListener('click', closeAll);
$('toMenuBtn').addEventListener('click', openSetup);
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; applySound(); store.set('sound', soundOn ? 1 : 0); if (soundOn) Sfx.unlock(); });
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;
$('fsBtn').addEventListener('click', () => {
  const d = document, el = d.documentElement;
  const r = d.fullscreenElement || d.webkitFullscreenElement ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (r && r.catch) r.catch(() => {});
});
$('langBtn').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  try { localStorage.setItem('lang', lang); history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
  applyLang();
});
applySound(); applyLang(); boot();
</script>
