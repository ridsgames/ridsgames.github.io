<meta name="description" content="Klasik Yılan Merdiven: zarı at, merdivenlerle tırman, yılanlardan kaç, 100. kareye ilk sen ulaş. 2-4 oyuncu, aynı cihazda ya da bilgisayara karşı.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --turn: #22d3ee;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 42%, rgba(6, 9, 15, .05) 0%, rgba(6, 9, 15, .62) 100%), url("../kizma-birader/masa.webp") center / cover, #1a0f08;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); position: relative; z-index: 25; } /* pencerelerin (20) üstünde: logo ve düğmeler her ekranda dokunulabilir */
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }
/* Tam ekranda logo gizlenir, düğmeler sağda kalır */
:root:fullscreen .logo { display: none; } :root:fullscreen .tools { margin-left: auto; }
:root:-webkit-full-screen .logo { display: none; } :root:-webkit-full-screen .tools { margin-left: auto; }

/* Oyun alanı */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px 10px 8px; }
#boardWrap { flex: none; width: 100%; display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: manipulation; }

/* Sıra paneli + zar: keçeli ahşap tepsi */
.dock {
  flex: none; width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  border-style: solid; border-width: 20px 17px 24px; border-image: url("../kizma-birader/tepsi.webp") 60 50 72 50 fill / 20px 17px 24px stretch;
  padding: 0 4px 0 8px; background: none;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .5)) drop-shadow(0 0 7px color-mix(in srgb, var(--turn) 60%, transparent));
  transition: filter .3s;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ava { flex: none; display: inline-block; border-radius: 50%; background: url("../kizma-birader/karakterler.webp") 0 0 / 400% 100%; }
.chip { width: 46px; height: 46px; box-shadow: 0 3px 8px rgba(0, 0, 0, .45); }
.who .t { min-width: 0; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); }
#turnName { font-size: 17px; font-weight: 800; line-height: 1.2; color: #fff; }
#turnMsg { font-size: 14px; color: #d8f3dc; line-height: 1.3; margin-top: 2px; min-height: 1.3em; }

.dice { width: 72px; height: 72px; padding: 0; border: 0; background: none; perspective: 420px; position: relative; flex: none; }
.dice:disabled { cursor: default; }
.dice .halo { position: absolute; inset: -3px; border-radius: 20px; border: 2px solid var(--turn); opacity: 0; transition: opacity .2s; }
.dice.ready .halo { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.07); opacity: .35; } }
.cube { position: absolute; left: 10px; top: 10px; width: 52px; height: 52px; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.2, .75, .25, 1); }
.face {
  position: absolute; inset: 0; border-radius: 11px; background: linear-gradient(145deg, #ffffff, #e9edf2);
  box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .08), inset -3px -4px 8px rgba(0, 0, 0, .12);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; backface-visibility: hidden;
}
.face i { width: 10px; height: 10px; border-radius: 50%; place-self: center; background: radial-gradient(circle at 35% 35%, #4b5563, #0f172a 70%); }
.f1 { transform: rotateY(0deg) translateZ(26px); }
.f6 { transform: rotateY(180deg) translateZ(26px); }
.f3 { transform: rotateY(90deg) translateZ(26px); }
.f4 { transform: rotateY(-90deg) translateZ(26px); }
.f2 { transform: rotateX(90deg) translateZ(26px); }
.f5 { transform: rotateX(-90deg) translateZ(26px); }
.f1 i { grid-area: 2 / 2; background: radial-gradient(circle at 35% 35%, #ff6b6b, #c92a2a 70%); width: 13px; height: 13px; }
.dice .shadow { position: absolute; left: 14px; right: 14px; bottom: 2px; height: 10px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); }
.dice.shake .cube { animation: hop .75s ease-out; }
.dice.shake .shadow { animation: shrink .75s ease-out; }
@keyframes hop {
  0% { translate: 0 0; scale: 1; } 30% { translate: 0 -16px; scale: 1; } 58% { translate: 0 0; scale: 1; }
  66% { translate: 0 2px; scale: 1.1 .86; } 78% { translate: 0 -5px; scale: .96 1.05; } 90% { translate: 0 0; scale: 1.03 .97; } 100% { translate: 0 0; scale: 1; }
}
@keyframes shrink { 0%, 100% { scale: 1; opacity: 1; } 30% { scale: .55; opacity: .45; } 58% { scale: 1.1; opacity: 1; } }
.dice.six .face { animation: glow 1.1s ease-out; }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(255, 214, 10, .9), inset 0 0 0 1.5px rgba(0, 0, 0, .08); } 100% { box-shadow: 0 0 0 16px rgba(255, 214, 10, 0), inset 0 0 0 1.5px rgba(0, 0, 0, .08); } }
.chip.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { scale: .4; } 100% { scale: 1; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seat { display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(148, 163, 184, .12); }
.seat .dot { width: 30px; height: 30px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 0 8px; border-top: 1px solid rgba(148, 163, 184, .12); font-size: 14px; font-weight: 600; color: #cbd5e1; }
.row .seg { width: 170px; }
.btns { display: grid; gap: 10px; margin-top: 12px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 22px 26px 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .n { color: var(--dim); font-weight: 800; }
.rank li .d { width: 26px; height: 26px; }
.rank li .s { color: var(--dim); font-weight: 600; font-size: 13px; }
#lbSlot:not(:empty) { margin: 10px 0 2px; }
.rank li.first { background: rgba(6, 182, 212, .16); border: 1px solid rgba(34, 211, 238, .5); }
.toast {
  position: fixed; left: 50%; top: 64px; z-index: 15; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) and (min-height: 760px) {
  main { gap: 14px; padding-top: 16px; }
  .dice { width: 80px; height: 80px; }
  .cube { left: 12px; top: 12px; width: 56px; height: 56px; }
  .face { padding: 8px; }
  .f1 { transform: rotateY(0deg) translateZ(28px); } .f6 { transform: rotateY(180deg) translateZ(28px); }
  .f3 { transform: rotateY(90deg) translateZ(28px); } .f4 { transform: rotateY(-90deg) translateZ(28px); }
  .f2 { transform: rotateX(90deg) translateZ(28px); } .f5 { transform: rotateX(-90deg) translateZ(28px); }
}
@media (prefers-reduced-motion: reduce) { .dice.ready .halo { animation: none; } .cube { transition-duration: .05s; } .dice.shake .cube, .dice.shake .shadow, .chip.pop { animation: none; } }
</style>
<!-- Ziyaret sayacı (GoatCounter): çerez kullanmaz; ?lang= gibi ekler aynı sayfa sayılır -->
<script>window.goatcounter = { path: (p) => p.split('?')[0] || '/' };</script>
<script data-goatcounter="https://ridsgames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<!-- Etkin süre, yeni ziyaret ve hata kaydı (ortak) -->
<script src="../assets/olcum.js" data-page="yilan-merdiven" data-name="Yılan Merdiven"></script>
<!-- Ortak sıralama tablosu (Firebase) -->
<script src="../assets/siralama.js"></script>

<body>
<header class="top">

      <img src="../assets/logo.webp" alt="Ridsgames" width="112" height="52">
      <span class="gname" id="gameName">Yılan Merdiven</span>

    <div class="tools">
      <button id="menuBtn" class="pill" type="button" aria-label="Yeni oyun"><span class="ico">☰</span><span class="lbl" id="menuLbl">Yeni oyun</span></button>
      <button id="soundBtn" class="pill" type="button" aria-label="Ses"><span class="ico" id="soundIco">🔊</span></button>

</header>

<main>
  <div id="boardWrap"><canvas id="board" role="img" aria-label="Yılan Merdiven tahtası"></canvas></div>
  <div class="dock" id="dock">
    <div class="who">
      <span class="chip ava" aria-hidden="true"></span>
      <div class="t"><div id="turnName"></div><div id="turnMsg" aria-live="polite"></div></div>
    </div>
    <button id="dice" class="dice" type="button" aria-label="Zar at">

        <span class="face f4"><i style="grid-area:1/1"></i><i style="grid-area:1/3"></i><i style="grid-area:3/1"></i><i style="grid-area:3/3"></i></span>
        <span class="face f5"><i style="grid-area:1/1"></i><i style="grid-area:1/3"></i><i style="grid-area:2/2"></i><i style="grid-area:3/1"></i><i style="grid-area:3/3"></i></span>
        <span class="face f6"><i style="grid-area:1/1"></i><i style="grid-area:2/1"></i><i style="grid-area:3/1"></i><i style="grid-area:1/3"></i><i style="grid-area:2/3"></i><i style="grid-area:3/3"></i></span>
      </span>

  </div>
</main>

<footer>© 2026 Ridsgames. <span id="rights">Tüm hakları saklıdır.</span></footer>
<div class="toast" id="toast" role="status"></div>
<canvas id="confetti" hidden></canvas>

<!-- Kurulum -->
<div class="ov" id="setupOv">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Yılan Merdiven</h2>
    <p class="sub" id="setupSub">Kaç kişi oynuyor? Her renk için seç.</p>
    <div class="row"><span id="countLbl">Oyuncu sayısı</span><div class="seg" id="countSeg"><button type="button" data-n="2">2</button><button type="button" data-n="3">3</button><button type="button" data-n="4">4</button></div></div>
    <div id="seats"></div>
    <div class="btns">
      <button class="big" id="startBtn" type="button">Başla</button>
      <button class="big alt" id="resumeBtn" type="button" hidden>Kaldığın yerden devam et</button>
    </div>
  </div>
</div>

<!-- Kurallar -->
<div class="ov" id="rulesOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">

  </div>
</div>

<!-- Oyun sonu -->
<div class="ov" id="winOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="trophy">🏆</div>
    <h2 id="winTitle"></h2>
    <p class="sub" id="winSub"></p>
    <ol class="rank" id="rankList"></ol>
    <div id="lbSlot"></div>
    <div class="btns">
      <button class="big" id="againBtn" type="button">Tekrar oyna</button>
      <button class="big alt" id="toMenuBtn" type="button">Oyuncuları değiştir</button>
    </div>
  </div>
</div>
