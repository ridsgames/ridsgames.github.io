<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kızma Birader | Ridsgames</title>
<meta name="description" content="Klasik Kızma Birader: zarı at, piyonlarını evine götür, rakibini başa gönder. 2-4 oyuncu, aynı cihazda ya da bilgisayara karşı.">
<meta name="theme-color" content="#0a0e17">
<link rel="icon" href="../assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --panel: rgba(15, 23, 42, 0.86);
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --cyan-deep: #0891b2;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --turn: #22d3ee;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(circle at 50% 12%, #162238 0%, #090d16 68%, #06090f 100%);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk: diğer oyunlarla aynı */
.top { flex: none; border-bottom: 1px solid rgba(30, 41, 59, .8); background: rgba(2, 6, 23, .85); backdrop-filter: blur(10px); z-index: 5; }
.top .in { max-width: 72rem; margin: 0 auto; height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 32px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12px; color: rgba(34, 211, 238, .9); padding: 2px 8px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.tools { display: flex; align-items: center; gap: 6px; }
.pill {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .4);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .35); font-size: 14px; font-weight: 600; color: #e2e8f0; transition: border-color .15s, transform .1s;
}
.pill:hover { border-color: var(--cyan); color: #fff; }
.pill:active { transform: translateY(1px); }
.pill .ico { font-size: 16px; line-height: 1; }
.pill.lang { font-size: 12px; font-weight: 800; color: #67e8f9; letter-spacing: .02em; }
@media (max-width: 520px) { .gname, .pill .lbl { display: none; } .pill { padding: 0 8px; } .top .in { height: 46px; } .logo img { height: 28px; } }

/* Oyun alanı */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px 10px 8px; }
#boardWrap { flex: none; width: 100%; display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: manipulation; border-radius: 18px; }

/* Sıra paneli + zar */
.dock {
  flex: none; width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  padding: 10px 12px 10px 16px; border-radius: 18px; background: var(--panel);
  border: 1.5px solid var(--turn); box-shadow: 0 0 22px color-mix(in srgb, var(--turn) 28%, transparent), inset 0 1px 0 rgba(255, 255, 255, .06);
  transition: border-color .25s, box-shadow .25s;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.chip { flex: none; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8 0 18%, transparent 19%), var(--turn); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25), 0 2px 6px rgba(0, 0, 0, .4); }
.who .t { min-width: 0; }
#turnName { font-size: 17px; font-weight: 800; line-height: 1.2; }
#turnMsg { font-size: 14px; color: #cbd5e1; line-height: 1.3; margin-top: 2px; min-height: 1.3em; }

.dice { width: 72px; height: 72px; padding: 0; border: 0; background: none; perspective: 420px; position: relative; flex: none; }
.dice:disabled { cursor: default; }
.dice .halo { position: absolute; inset: -6px; border-radius: 20px; border: 2px solid var(--turn); opacity: 0; transition: opacity .2s; }
.dice.ready .halo { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.07); opacity: .35; } }
.cube { position: absolute; left: 10px; top: 10px; width: 52px; height: 52px; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.2, .75, .25, 1); }
.face {
  position: absolute; inset: 0; border-radius: 11px; background: linear-gradient(145deg, #ffffff, #e9edf2);
  box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .08), inset -3px -4px 8px rgba(0, 0, 0, .12);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; backface-visibility: hidden;
}
.face i { width: 10px; height: 10px; border-radius: 50%; place-self: center; background: radial-gradient(circle at 35% 35%, #4b5563, #0f172a 70%); }
.f1 { transform: rotateY(0deg) translateZ(26px); }
.f6 { transform: rotateY(180deg) translateZ(26px); }
.f3 { transform: rotateY(90deg) translateZ(26px); }
.f4 { transform: rotateY(-90deg) translateZ(26px); }
.f2 { transform: rotateX(90deg) translateZ(26px); }
.f5 { transform: rotateX(-90deg) translateZ(26px); }
.f1 i { grid-area: 2 / 2; background: radial-gradient(circle at 35% 35%, #ff6b6b, #c92a2a 70%); width: 13px; height: 13px; }
.dice .shadow { position: absolute; left: 14px; right: 14px; bottom: 2px; height: 10px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); }
.dice.shake .cube { animation: hop .75s ease-out; }
.dice.shake .shadow { animation: shrink .75s ease-out; }
@keyframes hop {
  0% { translate: 0 0; scale: 1; } 30% { translate: 0 -16px; scale: 1; } 58% { translate: 0 0; scale: 1; }
  66% { translate: 0 2px; scale: 1.1 .86; } 78% { translate: 0 -5px; scale: .96 1.05; } 90% { translate: 0 0; scale: 1.03 .97; } 100% { translate: 0 0; scale: 1; }
}
@keyframes shrink { 0%, 100% { scale: 1; opacity: 1; } 30% { scale: .55; opacity: .45; } 58% { scale: 1.1; opacity: 1; } }
.dice.six .face { animation: glow 1.1s ease-out; }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(255, 214, 10, .9), inset 0 0 0 1.5px rgba(0, 0, 0, .08); } 100% { box-shadow: 0 0 0 16px rgba(255, 214, 10, 0), inset 0 0 0 1.5px rgba(0, 0, 0, .08); } }
.chip.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { scale: .4; } 100% { scale: 1; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

footer { flex: none; text-align: center; font-size: 11px; color: #64748b; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid #0f172a; background: rgba(2, 6, 23, .6); }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seat { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(148, 163, 184, .12); }
.seat .dot { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 34px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); font-size: 14px; font-weight: 600; color: #cbd5e1; }
.row .seg { width: 170px; }
.note { min-height: 20px; margin: 8px 0 0; font-size: 13px; color: #fca5a5; text-align: center; }
.btns { display: grid; gap: 10px; margin-top: 12px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big:disabled { filter: grayscale(.7) brightness(.7); cursor: not-allowed; }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 22px 20px 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .n { color: var(--dim); font-weight: 800; }
.rank li .d { width: 18px; height: 18px; border-radius: 50%; }
.rank li .s { color: var(--dim); font-weight: 600; font-size: 13px; }
.rank li.first { background: rgba(6, 182, 212, .16); border: 1px solid rgba(34, 211, 238, .5); }
.toast {
  position: fixed; left: 50%; top: 64px; z-index: 15; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; white-space: nowrap;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) and (min-height: 760px) {
  main { gap: 14px; padding-top: 16px; }
  .dice { width: 80px; height: 80px; }
  .cube { left: 12px; top: 12px; width: 56px; height: 56px; }
  .face { padding: 8px; }
  .f1 { transform: rotateY(0deg) translateZ(28px); } .f6 { transform: rotateY(180deg) translateZ(28px); }
  .f3 { transform: rotateY(90deg) translateZ(28px); } .f4 { transform: rotateY(-90deg) translateZ(28px); }
  .f2 { transform: rotateX(90deg) translateZ(28px); } .f5 { transform: rotateX(-90deg) translateZ(28px); }
}
@media (prefers-reduced-motion: reduce) { .dice.ready .halo { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a id="homeLink" class="logo" href="../" aria-label="Ridsgames ana sayfa">
      <img src="../assets/logo.webp" alt="Ridsgames" width="112" height="52">
      <span class="gname" id="gameName">Kızma Birader</span>
    </a>
    <div class="tools">
      <button id="menuBtn" class="pill" type="button"><span class="ico">☰</span><span class="lbl" id="menuLbl">Yeni oyun</span></button>
      <button id="soundBtn" class="pill" type="button" aria-label="Ses"><span class="ico" id="soundIco">🔊</span></button>
      <button id="rulesBtn" class="pill" type="button" aria-label="Kurallar"><span class="ico">?</span><span class="lbl" id="rulesLbl">Kurallar</span></button>
      <button id="langBtn" class="pill lang" type="button">TR | EN</button>

</header>

<main>
  <div id="boardWrap"><canvas id="board" aria-label="Kızma Birader tahtası"></canvas></div>
  <div class="dock" id="dock">
    <div class="who">
      <span class="chip" aria-hidden="true"></span>

        <span class="face f4"><i style="grid-area:1/1"></i><i style="grid-area:1/3"></i><i style="grid-area:3/1"></i><i style="grid-area:3/3"></i></span>
        <span class="face f5"><i style="grid-area:1/1"></i><i style="grid-area:1/3"></i><i style="grid-area:2/2"></i><i style="grid-area:3/1"></i><i style="grid-area:3/3"></i></span>
        <span class="face f6"><i style="grid-area:1/1"></i><i style="grid-area:2/1"></i><i style="grid-area:3/1"></i><i style="grid-area:1/3"></i><i style="grid-area:2/3"></i><i style="grid-area:3/3"></i></span>
      </span>
    </button>
  </div>
</main>

<footer>© 2026 Ridsgames. <span id="rights">Tüm hakları saklıdır.</span></footer>
<div class="toast" id="toast"></div>
<canvas id="confetti" hidden></canvas>

<!-- Kurulum -->
<div class="ov" id="setupOv">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Kızma Birader</h2>
    <p class="sub" id="setupSub">Kimler oynuyor? Her renk için seç.</p>
    <div id="seats"></div>
    <div class="row"><span id="lvlLbl">Bilgisayar</span><div class="seg two" id="lvlSeg"><button type="button" data-lvl="easy">Kolay</button><button type="button" data-lvl="hard">Zor</button></div></div>
    <p class="note" id="setupNote"></p>
    <div class="btns">
      <button class="big" id="startBtn" type="button">Başla</button>
      <button class="big alt" id="resumeBtn" type="button" hidden>Kaldığın yerden devam et</button>
    </div>
  </div>
</div>

<!-- Kurallar -->
<div class="ov" id="rulesOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <h2 id="rulesTitle">Nasıl oynanır?</h2>
    <p class="sub" id="rulesSub">Dört piyonunu da ilk evine götüren kazanır.</p>
    <ul class="rules" id="rulesList"></ul>
    <div class="btns"><button class="big" id="rulesOk" type="button">Tamam</button></div>
  </div>
</div>

<!-- Oyun sonu -->
<div class="ov" id="winOv" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="trophy">🏆</div>
    <h2 id="winTitle"></h2>
    <p class="sub" id="winSub"></p>
    <ol class="rank" id="rankList"></ol>
    <div class="btns">
      <button class="big" id="againBtn" type="button">Tekrar oyna</button>
      <button class="big alt" id="toMenuBtn" type="button">Oyuncuları değiştir</button>
    </div>
  </div>
</div>

<script>
// ---------- Dil ----------
const STR = {
  tr: {
    title: 'Kızma Birader | Ridsgames', home: 'Ridsgames ana sayfa', game: 'Kızma Birader', newGame: 'Yeni oyun', rules: 'Kurallar', sound: 'Ses', rights: 'Tüm hakları saklıdır.',
    colors: ['Kırmızı', 'Mavi', 'Yeşil', 'Sarı'], human: 'İnsan', cpu: 'Bilgisayar', none: 'Yok', you: 'Sen', easy: 'Kolay', hard: 'Zor',
    setupSub: 'Kimler oynuyor? Her renk için seç.', start: 'Başla', resume: 'Kaldığın yerden devam et', needTwo: 'En az iki oyuncu gerekli.',

    noMove: 'Oynayacak hamle yok', tryN: (n) => `6 gelmedi, bir daha dene (${n}/3)`, six: '6 geldi, bir daha at!', yourTurn: 'Sıra sende',
    turnOf: (n) => `${n} oynuyor`, captured: (b) => `Kızma birader! ${b} piyon başa döndü`, home: 'Eve girdi!',
    wins: (n) => `${n} kazandı!`, youWin: 'Kazandın!', winSub: 'Dört piyon da evde.', again: 'Tekrar oyna', toMenu: 'Oyuncuları değiştir',

try { savedLang = localStorage.getItem('lang'); } catch (e) {}
let lang = /^tr/i.test(new URLSearchParams(location.search).get('lang') || savedLang || navigator.language || 'tr') ? 'tr' : 'en';

const $ = (id) => document.getElementById(id);

  { base: '#1c7ed6', light: '#a5d8ff', dark: '#0b3d73', pad: '#dbeafe' },
  { base: '#2f9e44', light: '#b2f2bb', dark: '#145a24', pad: '#d3f9d8' },
  { base: '#f5b301', light: '#ffe066', dark: '#8a5a00', pad: '#fff3bf' }

  rr(c, 0.28, 0.28, 11.44, 11.44, 0.5); c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(80,45,15,.35)'; c.lineWidth = 0.05; c.stroke();
  // bahçeler
  for (let p = 0; p < 4; p++) {
    const [ax, ay] = YARD_C[p], on = G && G.seats[p] !== 'none';
    const x = ax, y = ay;
    c.save();
    if (G && G.turn === p && on) { c.shadowColor = COL[p].base; c.shadowBlur = 0.6 * PX; }
    rr(c, x - 1.62, y - 1.62, 3.24, 3.24, 0.55); c.fillStyle = on ? COL[p].pad : '#ece7dc'; c.fill();
    c.restore();
    rr(c, x - 1.62, y - 1.62, 3.24, 3.24, 0.55); c.strokeStyle = on ? COL[p].base : '#c9c2b2'; c.lineWidth = G && G.turn === p ? 0.12 : 0.06; c.stroke();
    for (let i = 0; i < 4; i++) { const [hx, hy] = yardSlot(p, i); hole(c, hx, hy, 0.4, on ? COL[p].light : '#ddd6c6', on ? shade(COL[p].base, -0.1) : '#bdb5a3'); }
    if (G && on) { // oyuncu adı, tahtanın dış kenarına yakın şeritte
      // yazı piksel ölçeğinde: çok küçük yazı tipi boyutu bazı tarayıcılarda yuvarlanır
      const ty = p === 1 || p === 2 ? y - 1.3 : y + 1.32;
      c.save(); c.setTransform(DPR, 0, 0, DPR, 0, 0);
      c.fillStyle = shade(COL[p].base, -0.35); c.font = `700 ${0.4 * U}px Inter, system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(shortName(p) + (G.seats[p] === 'cpu' ? ' 🤖' : ''), x * U, ty * U);
      c.restore();
    }
  }
  // yol çizgileri
  c.strokeStyle = 'rgba(110,70,30,.45)'; c.lineWidth = 0.09; c.lineJoin = 'round';
  c.beginPath(); TRACK.forEach((pt, k) => { const [x, y] = cellPt(pt); k ? c.lineTo(x, y) : c.moveTo(x, y); }); c.closePath(); c.stroke();
  // orta: dört renkli yıldız
  const [mx, my] = cellPt([5, 5]);
  const tri = [[0, 1], [-1, 0], [0, -1], [1, 0]];
  tri.forEach(([dx, dy], p) => {
    c.beginPath(); c.moveTo(mx, my); c.lineTo(mx + dx * 0.55 - dy * 0.55, my + dy * 0.55 + dx * 0.55); c.lineTo(mx + dx * 0.55 + dy * 0.55, my + dy * 0.55 - dx * 0.55); c.closePath();
    c.fillStyle = COL[p].base; c.fill();
  });
  circ(c, mx, my, 0.16); c.fillStyle = '#fffaf0'; c.fill();
  // tur kareleri
  TRACK.forEach((pt, k) => {
    const [x, y] = cellPt(pt), sp = START.indexOf(k);
    if (sp >= 0) { hole(c, x, y, 0.44, COL[sp].light, COL[sp].base); arrow(c, x, y, k); }
    else hole(c, x, y, 0.42, '#ffffff', '#8b6a45');
  });
  // ev sıraları
  for (let p = 0; p < 4; p++) HOME[p].forEach((pt, k) => { const [x, y] = cellPt(pt); hole(c, x, y, 0.41, COL[p].light, COL[p].base); });
}
function arrow(c, x, y, k) { // çıkış karesinde gidiş yönü
  const [nx, ny] = cellPt(TRACK[(k + 1) % 40]), a = Math.atan2(ny - y, nx - x);
  c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.moveTo(0.2, 0); c.lineTo(-0.12, -0.17); c.lineTo(-0.12, 0.17); c.closePath();
  c.fillStyle = 'rgba(255,255,255,.95)'; c.fill(); c.restore();
}
function pawn(c, x, y, s, col, lift = 0, alpha = 1, rot = 0, squash = 0) {
  c.save(); c.globalAlpha = alpha;
  const sh = 1 + lift * 0.18;
  c.fillStyle = `rgba(0,0,0,${Math.max(0.06, 0.32 - lift * 0.12)})`; c.beginPath(); c.ellipse(x + 0.04 + lift * 0.1, y + s * 0.3 + lift * 0.05, s * 0.36 * sh, s * 0.14 * sh, 0, 0, Math.PI * 2); c.fill();
  // uçarken döner; inişte basılıp esner (gövde tabanından)
  c.translate(x, y - lift * 0.32); c.rotate(rot);
  if (squash) { c.translate(0, s * 0.26); c.scale(1 + squash * 0.18, 1 - squash * 0.22); c.translate(0, -s * 0.26); }
  x = 0; y = 0; s *= 1 + lift * 0.12;
  // gövde
  let g = c.createLinearGradient(x - s * 0.34, 0, x + s * 0.34, 0);
  g.addColorStop(0, shade(col.base, 0.22)); g.addColorStop(0.45, col.base); g.addColorStop(1, shade(col.base, -0.38));
  c.beginPath(); c.ellipse(x, y + s * 0.26, s * 0.34, s * 0.12, 0, 0, Math.PI * 2); c.fillStyle = shade(col.base, -0.3); c.fill();
  c.beginPath(); c.moveTo(x - s * 0.33, y + s * 0.24); c.bezierCurveTo(x - s * 0.3, y + s * 0.02, x - s * 0.1, y - s * 0.05, x - s * 0.1, y - s * 0.16);
  c.lineTo(x + s * 0.1, y - s * 0.16); c.bezierCurveTo(x + s * 0.1, y - s * 0.05, x + s * 0.3, y + s * 0.02, x + s * 0.33, y + s * 0.24);
  c.ellipse(x, y + s * 0.24, s * 0.33, s * 0.1, 0, 0, Math.PI); c.closePath(); c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = s * 0.03; c.stroke();
  // baş
  g = c.createRadialGradient(x - s * 0.07, y - s * 0.3, s * 0.02, x, y - s * 0.22, s * 0.2);
  g.addColorStop(0, shade(col.base, 0.55)); g.addColorStop(0.5, col.base); g.addColorStop(1, shade(col.base, -0.35));
  circ(c, x, y - s * 0.24, s * 0.18); c.fillStyle = g; c.fill(); c.stroke();
  circ(c, x - s * 0.06, y - s * 0.3, s * 0.05); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill();
  c.restore();
}
function animPos(a, now) {
  // kare zamanı canlandırmanın başladığı andan biraz önce olabilir: sıfırın altına düşmesin
  const t = Math.max(0, Math.min(1, (now - a.t0) / a.dur)), n = a.pts.length - 1;
  if (a.fly) { const e = t * t * (3 - 2 * t); const [x0, y0] = a.pts[0], [x1, y1] = a.pts[1]; return [x0 + (x1 - x0) * e, y0 + (y1 - y0) * e, Math.sin(Math.PI * t) * 2.2, t >= 1, e * Math.PI * 3]; }
  const f = t * n, k = Math.max(0, Math.min(n - 1, Math.floor(f))), u = f - k;
  const [x0, y0] = a.pts[k], [x1, y1] = a.pts[k + 1];
  if (a.last !== k) { a.last = k; if (k > 0) Sfx.step(); }
  return [x0 + (x1 - x0) * u, y0 + (y1 - y0) * u, Math.sin(Math.PI * u), t >= 1, 0];
}
function render() { dirty = true; updateDock(); }
let dirty = true;
function frame(now) {
  requestAnimationFrame(frame);
  if (!G) { if (dirty) { dirty = false; paintBoard(); cx.setTransform(1, 0, 0, 1, 0, 0); cx.drawImage(layer, 0, 0); } return; }
  dirty = false;
  paintBoard();
  // rakip vurulunca tahta kısa bir an sarsılır
  const sk = Math.max(0, 1 - (now - shake) / 320), sx = sk ? Math.sin(now / 18) * sk * 0.09 : 0, sy = sk ? Math.cos(now / 23) * sk * 0.07 : 0;
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); cx.drawImage(layer, sx * U * DPR, sy * U * DPR);
  cx.setTransform(DPR * U, 0, 0, DPR * U, sx * U * DPR, sy * U * DPR);
  // sırası gelenin bölmesi nabız gibi parlar
  if (phase !== 'over') {
    const [ax, ay] = YARD_C[G.turn], gl = 0.5 + 0.5 * Math.sin(now / 260);
    cx.save(); cx.shadowColor = COL[G.turn].base; cx.shadowBlur = (0.3 + gl * 0.6) * PX;
    rr(cx, ax - 1.62, ay - 1.62, 3.24, 3.24, 0.55); cx.strokeStyle = COL[G.turn].base; cx.globalAlpha = 0.35 + gl * 0.5; cx.lineWidth = 0.1; cx.stroke();
    cx.restore();
  }
  drawFx(now, false);
  const moving = new Map();
  for (let k = anims.length - 1; k >= 0; k--) {
    const a = anims[k], r = animPos(a, now);
    if (r[3]) anims.splice(k, 1); else moving.set(a.p * 4 + a.i, r);
  }
  // hareket edebilen piyonlar: nabız gibi atan halka ve hedef gölgesi
  const pulse = 0.5 + 0.5 * Math.sin(now / 180);
  const movable = new Set(phase === 'move' && G.seats[G.turn] === 'human' ? moves.map((m) => m.i) : []);
  if (movable.size) for (const m of moves) {
    const [x, y] = piecePt(G.turn, m.i, m.to);
    circ(cx, x, y, 0.36); cx.setLineDash([0.12, 0.1]); cx.strokeStyle = COL[G.turn].base; cx.lineWidth = 0.07; cx.stroke(); cx.setLineDash([]);
  }
  const list = [];
  for (const p of active()) for (let i = 0; i < 4; i++) {
    const r = moving.get(p * 4 + i), land = landT.get(p * 4 + i);
    const [x, y] = r ? [r[0], r[1]] : piecePt(p, i);
    let lift = r ? r[2] : 0, squash = 0;
    if (!r && land) { const u = (now - land) / 260; if (u < 1) squash = Math.sin(u * Math.PI) * (1 - u); else landT.delete(p * 4 + i); }
    if (phase === 'over' && p === G.order[0]) lift = Math.abs(Math.sin(now / 210 + i * 0.8)) * 0.7; // kazananın piyonları sevinçten zıplar
    list.push({ p, i, x, y, lift, rot: r ? r[4] : 0, squash });
  }
  list.sort((a, b) => a.lift - b.lift || a.y - b.y);
  for (const o of list) {
    if (movable.has(o.i) && o.p === G.turn) {
      circ(cx, o.x, o.y, 0.42 + pulse * 0.08); cx.strokeStyle = `rgba(255,255,255,${0.55 + pulse * 0.45})`; cx.lineWidth = 0.09; cx.stroke();
      circ(cx, o.x, o.y, 0.42 + pulse * 0.08); cx.strokeStyle = COL[o.p].base; cx.lineWidth = 0.04; cx.stroke();
    }
    pawn(cx, o.x, o.y, 0.95, COL[o.p], o.lift, 1, o.rot, o.squash);

}
requestAnimationFrame(frame);

// ---------- Arayüz ----------
function msg(s) { $('turnMsg').textContent = s; }
function updateDock() {
  if (!G) return;
  const t = T(), p = G.turn, human = G.seats[p] === 'human';
  document.documentElement.style.setProperty('--turn', COL[p].base);
  if (lastTurn !== p) { lastTurn = p; const ch = document.querySelector('.chip'); ch.classList.remove('pop'); void ch.offsetWidth; ch.classList.add('pop'); }
  $('turnName').textContent = human && humans() === 1 ? t.yourTurn : t.turnOf(shortName(p));
  const ready = phase === 'roll' && human;
  $('dice').classList.toggle('ready', ready); $('dice').disabled = !ready;
  if (phase === 'roll') msg(human ? (tries ? t.tryN(tries + 1) : sixes ? t.six : t.rollTap) : t.rollCpu);
}
let toastT = null;
function toast(s, color) {
  const el = $('toast'); el.textContent = s; el.style.borderColor = color || 'var(--cyan)'; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1700);
}
function closeAll() { for (const id of ['setupOv', 'rulesOv', 'winOv']) $(id).hidden = true; }
function renderSetup() {
  const t = T();
  $('seats').innerHTML = [0, 1, 2, 3].map((p) => `<div class="seat"><span class="dot" style="background:${COL[p].base}" title="${t.colors[p]}"></span>
    <div class="seg" role="group" aria-label="${t.colors[p]}">${['human', 'cpu', 'none'].map((k) => `<button type="button" data-p="${p}" data-k="${k}" aria-pressed="${setup.seats[p] === k}">${t[k]}</button>`).join('')}</div></div>`).join('');
  document.querySelectorAll('#lvlSeg button').forEach((b) => { b.setAttribute('aria-pressed', b.dataset.lvl === setup.level); b.textContent = t[b.dataset.lvl]; });
  const n = setup.seats.filter((s) => s !== 'none').length;
  $('startBtn').disabled = n < 2; $('setupNote').textContent = n < 2 ? t.needTwo : '';
  $('resumeBtn').hidden = !loadSaved();
}
function openSetup() { clearTimeout(timer); renderSetup(); closeAll(); $('setupOv').hidden = false; }
function applyLang() {
  const t = T();
  document.documentElement.lang = lang; document.title = t.title;
  $('homeLink').href = '../?lang=' + lang; $('homeLink').setAttribute('aria-label', t.home);
  $('gameName').textContent = t.game; $('menuLbl').textContent = t.newGame; $('rulesLbl').textContent = t.rules;
  $('rulesBtn').setAttribute('aria-label', t.rules); $('soundBtn').setAttribute('aria-label', t.sound);
  $('rights').textContent = t.rights; $('setupTitle').textContent = t.game; $('setupSub').textContent = t.setupSub;
  $('lvlLbl').textContent = t.cpu; $('startBtn').textContent = t.start; $('resumeBtn').textContent = t.resume;
  $('rulesTitle').textContent = t.rulesTitle; $('rulesSub').textContent = t.rulesSub; $('rulesOk').textContent = t.ok;
  $('rulesList').innerHTML = t.ruleList.map(([i, s]) => `<li><span>${i}</span><span>${s}</span></li>`).join('');
  $('againBtn').textContent = t.again; $('toMenuBtn').textContent = t.toMenu;
  $('dice').setAttribute('aria-label', t.rollAria); cv.setAttribute('aria-label', t.board);
  $('langBtn').innerHTML = lang === 'tr' ? '<span style="color:#fff">TR</span>&nbsp;|&nbsp;EN' : 'TR&nbsp;|&nbsp;<span style="color:#fff">EN</span>';
  renderSetup(); layerKey = ''; render();
  if (G && phase === 'move' && G.seats[G.turn] === 'human') msg(t.pick);
}
function applySound() { $('soundIco').textContent = soundOn ? '🔊' : '🔇'; }

// Dokunma: hareket edebilen piyona ya da hedef karesine
cv.addEventListener('pointerdown', (e) => {
  Sfx.unlock();
  if (phase !== 'move' || G.seats[G.turn] !== 'human') return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / U, y = (e.clientY - r.top) / U;
  let best = null, bd = 0.75;
  for (const m of moves) for (const pt of [piecePt(G.turn, m.i), piecePt(G.turn, m.i, m.to)]) {
    const d = Math.hypot(pt[0] - x, pt[1] - y); if (d < bd) { bd = d; best = m; }
  }
  if (!best && moves.some((m) => m.from === -1)) { // bahçenin herhangi bir yerine dokunmak piyon çıkarır
    const [ax, ay] = YARD_C[G.turn]; if (Math.abs(x - ax) < 1.7 && Math.abs(y - ay) < 1.7) best = moves.find((m) => m.from === -1);
  }
  if (best) doMove(best);
});
$('dice').addEventListener('click', () => { Sfx.unlock(); if (G && G.seats[G.turn] === 'human') rollDice(); });
addEventListener('keydown', (e) => {
  if (!G || !$('setupOv').hidden || !$('rulesOv').hidden) return;
  if ((e.key === ' ' || e.key === 'Enter') && phase === 'roll' && G.seats[G.turn] === 'human') { e.preventDefault(); rollDice(); }
  if (phase === 'move' && G.seats[G.turn] === 'human' && /^[1-4]$/.test(e.key)) { const m = moves.find((q) => q.i === +e.key - 1); if (m) doMove(m); }
});
$('seats').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-p]'); if (!b) return;
  setup.seats[+b.dataset.p] = b.dataset.k; renderSetup();
});
$('lvlSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-lvl]'); if (b) { setup.level = b.dataset.lvl; renderSetup(); } });
$('startBtn').addEventListener('click', () => {
  Sfx.unlock(); try { localStorage.setItem('rids_kizma_setup', JSON.stringify(setup)); } catch (e) {}
  newGame(setup.seats, setup.level);
});
$('resumeBtn').addEventListener('click', () => {
  Sfx.unlock(); const s = loadSaved(); if (!s) return;

$('menuBtn').addEventListener('click', openSetup);
$('rulesBtn').addEventListener('click', () => { $('rulesOv').hidden = false; });

addEventListener('resize', () => { layout(); render(); });
