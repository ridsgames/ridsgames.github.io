html, body { margin: 0; height: 100%; }

  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);

.fab.set { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); }
.fab.score { top: max(6px, env(safe-area-inset-top)); right: calc(max(6px, env(safe-area-inset-right)) + 46px); }
.fab.fs { bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); width: 36px; height: 36px; opacity: .8; }
.fab.fs .fsOut, .isFs .fab.fs .fsIn { display: none; } .isFs .fab.fs .fsOut { display: inline; }
.fab.fs .fsRot { display: none; } .fab.fs.rot .fsIn, .fab.fs.rot .fsOut { display: none !important; } .fab.fs.rot .fsRot { display: inline; } .fab.fs.rot { opacity: .92; }

  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);

  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}

main { flex: 1; min-height: 0; width: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.panel { border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }

/* Sağ üstteki ayarlar düğmesinin altına denk gelen üst satırlar yer açar */

/* ---------- Ortak 3B zar ---------- */
.rdice { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--ds, 46px) * .28); position: relative; padding: 0; border: 0; background: none; perspective: 420px; }
.rdice .die { position: relative; width: var(--ds, 46px); height: var(--ds, 46px); flex: none; transition: opacity .25s, filter .25s; }
.rdice .die.used { opacity: .32; filter: grayscale(1); }
.rdice .cube { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2, .75, .25, 1); }
.rdice .face { position: absolute; inset: 0; border-radius: 20%; background: linear-gradient(145deg, #fffdf6, #ebe3cf); box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .08), inset -3px -4px 8px rgba(0, 0, 0, .12);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 15%; backface-visibility: hidden; }
.rdice .face i { width: 72%; aspect-ratio: 1; border-radius: 50%; place-self: center; background: radial-gradient(circle at 35% 35%, #4b5563, #0f172a 70%); }
.rdice .f1 { transform: rotateY(0deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f6 { transform: rotateY(180deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f3 { transform: rotateY(90deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f4 { transform: rotateY(-90deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f2 { transform: rotateX(90deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f5 { transform: rotateX(-90deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f1 i { background: radial-gradient(circle at 35% 35%, #ff6b6b, #c92a2a 70%); width: 90%; }
.rdice .shd { position: absolute; left: 12%; right: 12%; bottom: -14%; height: 18%; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); }
.rdice .die.hop .cube { animation: rdHop .8s ease-out; }
.rdice .die.hop .shd { animation: rdShrink .8s ease-out; }
@keyframes rdHop { 0% { translate: 0 0; scale: 1; } 30% { translate: 0 -38%; } 58% { translate: 0 0; scale: 1; } 66% { translate: 0 4%; scale: 1.1 .86; } 78% { translate: 0 -10%; scale: .96 1.05; } 90% { translate: 0 0; scale: 1.03 .97; } 100% { translate: 0 0; scale: 1; } }
@keyframes rdShrink { 0%, 100% { scale: 1; opacity: 1; } 30% { scale: .55; opacity: .45; } 58% { scale: 1.1; opacity: 1; } }
.rdice .halo { position: absolute; inset: -6px -8px; border-radius: 16px; border: 2px solid #34d399; opacity: 0; pointer-events: none; transition: opacity .2s; }
.rdice.ready { cursor: pointer; }
.rdice.ready .halo { opacity: 1; animation: rdPulse 1.1s ease-in-out infinite; }
@keyframes rdPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.05); opacity: .35; } }
.rdice .cnt { position: absolute; right: -6px; top: -8px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: #fbbf24; color: #1c1917; font: 800 12.5px/22px Inter, system-ui, sans-serif; text-align: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
@media (prefers-reduced-motion: reduce) { .rdice .cube { transition-duration: .05s; } .rdice .die.hop .cube, .rdice .die.hop .shd, .rdice.ready .halo { animation: none; } }

/* ---------- Oyuna özel ---------- */

/* Oyuncu bilgisi tahtanın üst ve alt şeridinde (skor + toplama yeri); ayrı bilgi paneli yok. */

/* Yatay: tahta ekranı doldurur. Sağda yalnızca ince bir düğme şeridi kalır (ayarlar, geri al, tam ekran).
   Bilgi mesajları kısa bildirim olarak çıkar. */
@media (orientation: landscape) {
  main { display: flex; flex-direction: row; align-items: stretch; justify-content: center; max-width: none; gap: 0; padding-top: 6px; padding-right: calc(52px + env(safe-area-inset-right)); padding-left: calc(52px + env(safe-area-inset-left)); }

}
/* Masa örtüsü: kart oyunlarındaki yeşil çuha, ekranın tamamını kaplar. Kenarlar kararmaz, ortada hafif lamba ışığı. */
body {
  background-color: #15773a;
  background-image:
    radial-gradient(ellipse 80% 70% at 50% 42%, rgba(134, 239, 172, .22), rgba(134, 239, 172, 0) 70%),

// Oyna'ya basınca tam ekran; dokunmatikte düğme ekranı çevirir. Yön kilidi yoksa (iPhone, iPad) oyun döndürülmüş çerçevede açılır.
const LAND = true, COARSE = matchMedia('(pointer: coarse)').matches, IN_FRAME = !!window.__inFrame;
const fsCan = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const isPortrait = () => matchMedia('(orientation: portrait)').matches;
$('fsBtn').classList.toggle('rot', COARSE);
if (!COARSE && !fsCan) $('fsBtn').hidden = true;
function goFs() {
  if (!fsCan || fsOn()) return Promise.resolve(fsOn());
  try {
    const el = document.documentElement, r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);

}

}

  Sfx.unlock();
  if (!COARSE) {
    const d = document; let r;
    try { r = fsOn() ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen).call(d.documentElement); } catch (e) {}
    if (r && r.catch) r.catch(() => {}); return;

}, true);

  lang = lang === 'tr' ? 'en' : 'tr';

  applyLang();
});
applySound(); applyLang(); boot();
</script>

<script id="fitSetupJs">
(() => {
  const ov = document.getElementById('setupOv'); const c = ov && ov.querySelector(':scope > .card, :scope > .card2'); if (!c) return;
  const over = () => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1;
  let busy = false, q = 0;
  const fit = () => {
    if (ov.hidden || busy) return; busy = true;
    c.classList.remove('fz1', 'fz2', 'fz3', 'fzc', 'fzn'); c.style.removeProperty('--fcols');
    if (over()) {
      const land = innerWidth > innerHeight && innerWidth >= 560;
      const cols = (n) => () => { c.classList.add('fzc'); c.style.setProperty('--fcols', n); };
      const nw = () => c.classList.add('fzn'), steps = [() => c.classList.add('fz1')];
      if (land) steps.push(cols(2), cols(3), () => c.classList.add('fz2'), nw);
      else steps.push(() => c.classList.add('fz2'));
      if (land && innerWidth >= 760) steps.push(cols(4));
      if (!land && innerWidth >= 340) steps.push(cols(2), nw);
      steps.push(() => c.classList.add('fz3'));
      if (land && innerWidth >= 640 && innerWidth < 760) steps.push(cols(4));
      for (const s of steps) { s(); if (!over()) break; }
    }
    busy = false;
  };
  const later = () => { cancelAnimationFrame(q); q = requestAnimationFrame(fit); };
  new MutationObserver(later).observe(ov, { attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true, characterData: true });
  addEventListener('resize', later); addEventListener('orientationchange', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
  later();
})();
</script>

<script id="rgRepJs">
(() => {
  const MAIL = 'destek@ridsgames.com', H = document.documentElement, errs = window.__rgErr || [];
  const T = {

  const info = () => { const l = t(), so = screen.orientation && screen.orientation.type;
    return [`${l.game}: ${gname()}`, `${l.page}: ${location.pathname}`, `${l.lang}: ${H.lang || '-'}`,

    ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'contextmenu'].forEach((k) => ov.addEventListener(k, (e) => e.stopPropagation(), { passive: true }));
    q('.go').onclick = () => { const l = t(); let b = body(); if (b.length > 1400) b = b.slice(0, 1400) + '…';

      const fb = () => { const a = document.createElement('textarea'); a.value = b; a.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; ov.appendChild(a); a.select(); let r = false; try { r = document.execCommand('copy'); } catch (_) {} a.remove(); ok.textContent = r ? l.copied : l.nocopy; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b).then(() => { ok.textContent = l.copied; }, fb); else fb(); };
  };
