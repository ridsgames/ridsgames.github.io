<style>
:root {
  --bg: #0a0e17;
  --line: rgba(34, 211, 238, 0.35);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --glow: rgba(251, 191, 36, 0.45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;
  font-family: "Inter", system-ui, -apple-system, sans-serif; color: var(--text);
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--glow) 28%, transparent) 0%, transparent 62%), radial-gradient(ellipse at 50% 100%, #111a2c 0%, var(--bg) 70%), var(--bg);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Üst çubuk yok: sağ üstte ayarlar (ve varsa skor), sağ altta tam ekran. Oyun alanı ekranın tamamı. */
.top { display: contents; }
.fab { position: fixed; z-index: 26; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  background: rgba(2, 6, 23, .62); border: 1px solid rgba(148, 163, 184, .32); color: #e2e8f0; box-shadow: 0 3px 10px rgba(0, 0, 0, .4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background .15s, transform .1s; }
.fab:hover { background: rgba(15, 23, 42, .9); color: #fff; } .fab:active { transform: scale(.94); }
.fab.set { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); }
.fab.score { top: max(6px, env(safe-area-inset-top)); right: calc(max(6px, env(safe-area-inset-right)) + 46px); }
.fab.fs { bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); width: 36px; height: 36px; opacity: .8; }
.fab.fs .fsOut, .isFs .fab.fs .fsIn { display: none; } .isFs .fab.fs .fsOut { display: inline; }
.sheet { max-width: 340px; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
.sheet .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
.sheet .logo img { display: block; height: 40px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12.5px; color: rgba(34, 211, 238, .9); padding: 2px 10px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.mlist { display: grid; gap: 8px; }
.mi { height: 48px; border-radius: 13px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 16px; font-weight: 700; color: #e2e8f0; text-align: left;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .3); }
.mi:hover { border-color: var(--cyan); color: #fff; }
.mi .ico { width: 22px; text-align: center; font-size: 18px; }
.mi.lang { justify-content: center; font-size: 15px; font-weight: 800; color: #67e8f9; letter-spacing: .04em; }
.sheet .btns { margin-top: 0; }
.scoreBody { display: grid; gap: 8px; margin: 6px 0 2px; }
.scoreBody table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 15px; }
.scoreBody th { font-size: 12px; font-weight: 700; color: var(--dim); text-align: right; padding: 0 10px; }
.scoreBody th:first-child, .scoreBody td:first-child { text-align: left; }
.scoreBody td { padding: 10px; background: rgba(2, 6, 23, .55); text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: #e2e8f0; }
.scoreBody td:first-child { border-radius: 10px 0 0 10px; color: #fff; } .scoreBody td:last-child { border-radius: 0 10px 10px 0; color: #fde68a; font-weight: 800; }
.scoreBody tr.me td { background: rgba(8, 145, 178, .22); }
.scoreBody .sn { font-size: 13px; color: var(--dim); text-align: center; margin: 0; }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 27; display: flex; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {
  width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }

.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }

.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg.tall button { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }

.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.custom { display: grid; gap: 6px; margin-top: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px 44px; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
.mrow button { height: 44px; border-radius: 12px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 24px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.mrow button:disabled { opacity: .35; cursor: default; }
.mrow output { text-align: center; font-size: 24px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }

.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.score { text-align: center; font-size: 44px; font-weight: 800; line-height: 1; margin: 2px 0 14px; color: #fde68a; font-variant-numeric: tabular-nums; }
.score.lost { color: #fca5a5; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .b { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); z-index: 28; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
main { flex: 1; min-height: 0; width: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.panel { border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
/* Yatay telefon: pencereler iki sütun */
@media (orientation: landscape) and (max-height: 500px) {
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  #setupOv .card { max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; align-content: start; padding: 14px 18px 0; }
  #setupOv h2, #setupOv .sub, #setupOv .btns, #setupOv .wide { grid-column: 1 / -1; }
  #setupOv h2 { font-size: 22px; }
  #setupOv .sub { margin-bottom: 4px; }
  #setupOv .sec { margin-top: 8px; padding-top: 8px; }
  #setupOv .btns { position: sticky; bottom: 0; z-index: 1; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 8px -18px 0; padding: 10px 18px 14px; background: linear-gradient(180deg, rgba(11, 18, 32, 0), #0b1220 30%); }
  #winOv .card { max-width: 560px; padding: 14px 18px 16px; }
  #winOv .trophy { font-size: 38px; } #winOv .score { font-size: 34px; margin-bottom: 8px; } #winOv .sub { margin-bottom: 8px; }
  #winOv .rank { grid-template-columns: 1fr 1fr; }
  #winOv .btns { grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 10px; }
}

/* Telefon ve dokunmatik: kenar boşlukları dar */
@media (max-width: 700px), (pointer: coarse) and (max-height: 1100px) {
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
}

/* Sağ üstteki ayarlar düğmesinin altına denk gelen üst satırlar yer açar */
main > :is(.hud, .opps, .bar, .info, .pls):first-child, .scr > .head:first-child, main > .side:first-child > .ballbar:first-child { margin-right: 46px; }


/* ---------- Ortak 3B zar ---------- */
.rdice { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--ds, 46px) * .28); position: relative; padding: 0; border: 0; background: none; perspective: 420px; }
.rdice .die { position: relative; width: var(--ds, 46px); height: var(--ds, 46px); flex: none; transition: opacity .25s, filter .25s; }
.rdice .die.used { opacity: .32; filter: grayscale(1); }
.rdice .cube { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2, .75, .25, 1); }
.rdice .face { position: absolute; inset: 0; border-radius: 20%; background: linear-gradient(145deg, #fffdf6, #ebe3cf); box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .08), inset -3px -4px 8px rgba(0, 0, 0, .12);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 15%; backface-visibility: hidden; }
.rdice .face i { width: 72%; aspect-ratio: 1; border-radius: 50%; place-self: center; background: radial-gradient(circle at 35% 35%, #4b5563, #0f172a 70%); }
.rdice .f1 { transform: rotateY(0deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f6 { transform: rotateY(180deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f3 { transform: rotateY(90deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f4 { transform: rotateY(-90deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f2 { transform: rotateX(90deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f5 { transform: rotateX(-90deg) translateZ(calc(var(--ds, 46px) / 2)); }
.rdice .f1 i { background: radial-gradient(circle at 35% 35%, #ff6b6b, #c92a2a 70%); width: 90%; }
.rdice .shd { position: absolute; left: 12%; right: 12%; bottom: -14%; height: 18%; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); }
.rdice .die.hop .cube { animation: rdHop .8s ease-out; }
.rdice .die.hop .shd { animation: rdShrink .8s ease-out; }
@keyframes rdHop { 0% { translate: 0 0; scale: 1; } 30% { translate: 0 -38%; } 58% { translate: 0 0; scale: 1; } 66% { translate: 0 4%; scale: 1.1 .86; } 78% { translate: 0 -10%; scale: .96 1.05; } 90% { translate: 0 0; scale: 1.03 .97; } 100% { translate: 0 0; scale: 1; } }
@keyframes rdShrink { 0%, 100% { scale: 1; opacity: 1; } 30% { scale: .55; opacity: .45; } 58% { scale: 1.1; opacity: 1; } }
.rdice .halo { position: absolute; inset: -6px -8px; border-radius: 16px; border: 2px solid #34d399; opacity: 0; pointer-events: none; transition: opacity .2s; }
.rdice.ready { cursor: pointer; }
.rdice.ready .halo { opacity: 1; animation: rdPulse 1.1s ease-in-out infinite; }
@keyframes rdPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.05); opacity: .35; } }
.rdice .cnt { position: absolute; right: -6px; top: -8px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: #fbbf24; color: #1c1917; font: 800 12.5px/22px Inter, system-ui, sans-serif; text-align: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
@media (prefers-reduced-motion: reduce) { .rdice .cube { transition-duration: .05s; } .rdice .die.hop .cube, .rdice .die.hop .shd, .rdice.ready .halo { animation: none; } }

/* ---------- Oyuna özel ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; align-content: center; gap: 10px; align-items: stretch; }
.hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }

   Sağda yalnızca ince bir düğme şeridi kalır (ayarlar, geri al, tam ekran). Bilgi mesajları kısa bildirim olarak çıkar. */
@media (orientation: landscape) {

  #board { height: 100%; width: auto; max-width: 100%; }
  main > #hud.hud { position: absolute; z-index: 1; margin: 0; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; backdrop-filter: none; pointer-events: none; display: block; }

  .bar2 { display: contents; }
  .acts { position: fixed; z-index: 26; right: max(6px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); min-height: 0; flex-direction: column; }

}

  main { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .hud .pl .ck { width: 18px; height: 18px; } .pl .nm { font-size: 12px; } .pl .pp { font-size: 10.5px; } .pl .sc { font-size: 17px; }
}

<script>
// ---------- Ortak: dil, ses, pencereler, sayaç ----------
const COMMON = {
  tr: { homeLabel: 'Ridsgames ana sayfa', settings: 'Ayarlar', scoreT: 'Skor tablosu', soundOn: 'Ses açık', soundOff: 'Ses kapalı', newGame: 'Yeni oyun', rules: 'Kurallar', sound: 'Ses', fs: 'Tam ekran', langLabel: 'Dil değiştir', rights: 'Tüm hakları saklıdır.',
    start: 'Başla', back: 'Oyuna dön', again: 'Tekrar oyna', view: 'Tahtaya bak', toMenu: 'Ayarları değiştir', rulesTitle: 'Nasıl oynanır?', ok: 'Tamam', sec: 'sn',
    lv: { kolay: 'Kolay', orta: 'Orta', zor: 'Zor' } },
  en: { homeLabel: 'Ridsgames home', settings: 'Settings', scoreT: 'Scoreboard', soundOn: 'Sound on', soundOff: 'Sound off', newGame: 'New game', rules: 'Rules', sound: 'Sound', fs: 'Full screen', langLabel: 'Change language', rights: 'All rights reserved.',

    lv: { kolay: 'Easy', orta: 'Medium', zor: 'Hard' } }
};
let savedLang = null;
try { savedLang = localStorage.getItem('lang'); } catch (e) {}
let lang = /^tr/i.test(new URLSearchParams(location.search).get('lang') || savedLang || navigator.language || 'tr') ? 'tr' : 'en';
const $ = (id) => document.getElementById(id);
const KEY = 'rids_tavla_';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(KEY + k); } catch (e) {} }
};
const sayac = (olay, ad) => { try { window.goatcounter.count({ path: 'tavla/' + olay, title: 'Tavla: ' + ad, event: true }); } catch (e) {} };
let soundOn = store.get('sound', 1) !== 0, bitenVar = false;
const Sfx = (() => {
  let ac = null;
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  return {
    unlock: ctx, tone,
    click() { tone(900, 700, 0.05, 0.05, 'triangle'); },
    tap() { tone(540, 880, 0.07, 0.07); },
    good() { tone(660, 990, 0.12, 0.08, 'triangle'); },
    bad() { tone(220, 110, 0.22, 0.09, 'sawtooth'); },
    win() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, f, 0.4, 0.1, 'triangle', i * 0.065)); },
    lose() { [392, 329.6, 261.6].forEach((f, i) => tone(f, f * 0.98, 0.3, 0.09, 'triangle', i * 0.12)); }
  };
})();
const buzz = (p) => { try { if (soundOn && navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
let toastT = null;
function toast(s, color) {
  const el = $('toast'); el.textContent = s; el.style.borderColor = color || 'var(--cyan)'; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1700);
}
const OVS = ['setOv', 'scoreOv', 'setupOv', 'rulesOv', 'winOv'];
function closeAll() { for (const id of OVS) $(id).hidden = true; }
const anyOpen = () => OVS.some((id) => !$(id).hidden);
const segPress = (id, attr, val) => document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute('aria-pressed', b.dataset[attr] === String(val)));
function showEnd(o) { // o: { ico, title, sub, score, lost, stats: [[ad, değer]] }
  closeAll();
  $('winIco').textContent = o.ico; $('winTitle').textContent = o.title; $('winSub').textContent = o.sub || '';
  $('winScore').textContent = o.score || ''; $('winScore').hidden = !o.score; $('winScore').classList.toggle('lost', !!o.lost);
  $('statList').innerHTML = (o.stats || []).map(([a, b]) => `<li><span>${a}</span><span class="b">${b}</span></li>`).join('');
  $('winOv').hidden = false; $('againBtn').focus({ preventScroll: true });
}


// ---------- Ortak 3B zar ----------
// makeDice(el, n): el içine n zar çizer. set(vals, roll) değerleri gösterir, roll ise yuvarlar ve ses çıkarır.
const DICE_ROT = { 1: [0, 0], 6: [0, 180], 3: [0, -90], 4: [0, 90], 2: [-90, 0], 5: [90, 0] };
const DICE_PIPS = { 1: ['2/2'], 2: ['1/3', '3/1'], 3: ['1/3', '2/2', '3/1'], 4: ['1/1', '1/3', '3/1', '3/3'], 5: ['1/1', '1/3', '2/2', '3/1', '3/3'], 6: ['1/1', '2/1', '3/1', '1/3', '2/3', '3/3'] };
function diceKnock() { // keçe üstünde yuvarlanan zar sesi
  const c = soundOn && Sfx.unlock(); if (!c) return;
  [0, 0.08, 0.17, 0.27, 0.4, 0.55, 0.66].forEach((dl, k) => {
    const t = c.currentTime + dl, len = 0.05, buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 700; f.Q.value = 1.6; g.gain.value = 0.34 - k * 0.04;
    s.buffer = buf; s.connect(f).connect(g).connect(c.destination); s.start(t);
  });
  buzz(12);
}
function makeDice(el, n = 2) {
  el.classList.add('rdice');
  const face = (v) => `<span class="face f${v}">${DICE_PIPS[v].map((a) => `<i style="grid-area:${a}"></i>`).join('')}</span>`;
  el.innerHTML = '<span class="halo"></span>' + Array.from({ length: n }, () => `<span class="die"><span class="shd"></span><span class="cube">${[1, 2, 3, 4, 5, 6].map(face).join('')}</span></span>`).join('') + '<span class="cnt" hidden></span>';
  const dies = [...el.querySelectorAll('.die')], rot = dies.map(() => [0, 0]), cur = dies.map(() => 0);
  const turn = (i, v, spin) => {
    const [tx, ty] = DICE_ROT[v], r = rot[i];
    if (spin) { r[0] = r[0] - (r[0] % 360) + 720 + (i ? -360 : 0) + tx; r[1] = r[1] - (r[1] % 360) + 720 + (i ? 360 : 0) + ty; }
    else { r[0] = r[0] - (r[0] % 360) + tx; r[1] = r[1] - (r[1] % 360) + ty; }
    const cb = dies[i].querySelector('.cube');
    if (!spin) { cb.style.transition = 'none'; cb.style.transform = `rotateX(${r[0]}deg) rotateY(${r[1]}deg)`; void cb.offsetWidth; cb.style.transition = ''; }
    else cb.style.transform = `rotateX(${r[0]}deg) rotateY(${r[1]}deg)`;
    if (spin) { dies[i].classList.remove('hop'); void dies[i].offsetWidth; dies[i].classList.add('hop'); }
    cur[i] = v;
  };
  return {
    el,
    set(vals, roll) { vals.forEach((v, i) => { if (dies[i] && (roll || cur[i] !== v)) turn(i, v, !!roll); }); if (roll) diceKnock(); },
    used(flags) { dies.forEach((d, i) => d.classList.toggle('used', !!flags[i])); },
    ready(on) { el.classList.toggle('ready', !!on); },
    count(n) { const c = el.querySelector('.cnt'); c.hidden = !n; c.textContent = n ? '×' + n : ''; }
  };
}

  };
