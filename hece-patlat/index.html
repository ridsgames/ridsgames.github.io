<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120d1e" />
    <title>Hece Patlat</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-z43c3RKe.js?v=2"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BSneLIUD.css">
    <style>
      .home { position: relative; }
      #siteHome { position: absolute; top: 0; left: 0; z-index: 2; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: #ffffff0a; box-shadow: inset 0 0 0 1px var(--hair); color: var(--champ); text-decoration: none; -webkit-tap-highlight-color: transparent; }
      #siteHome svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #siteHome:active { transform: scale(.94); }
    </style>
    <!-- Ziyaret sayacı (GoatCounter): çerez kullanmaz -->
    <script>window.goatcounter = { path: (p) => p.split('?')[0] || '/' };</script>
    <script data-goatcounter="https://ridsgames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <script src="../assets/olcum.js" data-page="hece-patlat" data-name="Hece Patlat"></script>
    <script>window.rgSay = function (olay, ad) { try { window.goatcounter.count({ path: "hece-patlat/" + olay, title: "Hece Patlat: " + ad, event: true }); } catch (e) {} };</script>
    <style>
      .home-top{gap:10px}.rg-lb{margin:2px 0 4px}
      /* sıralama penceresi: oyunun mor kart, altın ve serif başlık görünümü */
      body .lb-ort{background:#08050fc7;font-family:var(--font-ui);color:var(--ink)}
      body .lb-kutu{border:0;border-radius:24px;padding:22px 18px 18px;gap:12px;background:linear-gradient(180deg,var(--card-a) 0%,var(--card-b) 55%,var(--card-end) 100%);box-shadow:inset 0 0 0 1px var(--hair),inset 0 1px #ffffff0d,0 24px 70px #0000008c}
      body .lb-ust h2{font:700 26px/1.15 var(--font-display);color:var(--ink);letter-spacing:.01em}
      body .lb-x{width:40px;height:40px;border-radius:12px;background:#ffffff0a;box-shadow:inset 0 0 0 1px var(--hair);color:var(--champ)}
      body .lb-pano{height:44px;border-radius:12px;border:0;background:#ffffff08;box-shadow:inset 0 0 0 1px var(--hair-2);color:var(--champ);font:500 15px var(--font-ui)}
      body .lb-pano option{background:var(--card-b);color:var(--ink)}
      body .lb-sekme{border:0;border-radius:14px;background:#ffffff06;box-shadow:inset 0 0 0 1px var(--hair)}
      body .lb-sekme button{height:38px;border-radius:10px;color:var(--muted);font:500 14px var(--font-ui);letter-spacing:.03em}
      body .lb-sekme button[aria-selected=true]{background:var(--gild);color:var(--gold-ink);font-weight:700}
      body .lb-liste{gap:6px}
      body .lb-satir{min-height:44px;border-radius:12px;border:0;background:#ffffff08;box-shadow:inset 0 0 0 1px var(--hair);font-size:15px}
      body .lb-satir .lb-no{color:var(--muted);font-family:var(--font-display)}
      body .lb-satir .lb-ad{color:var(--ink);font-weight:500}
      body .lb-satir .lb-ad small{color:var(--gold)}
      body .lb-satir .lb-puan{color:var(--gold);font:700 17px var(--font-display)}
      body .lb-satir.lb-ben{background:#f2c95f1a;box-shadow:inset 0 0 0 1px var(--hair-2),inset 0 0 0 2px #f2c95f55}
      body .lb-durum,body .lb-not,body .lb-ara{color:var(--muted)}
      body .lb-alt{border-top:1px solid var(--hair);color:var(--muted)}
      body .lb-alt b{color:var(--ink)}
      body .lb-alt a{color:var(--muted)}
      body .lb-bag{color:var(--gold)}
      body .lb-yuva{font-family:var(--font-ui);color:var(--muted)}
      body .lb-yuva b{color:var(--ink)}
      body .lb-yuva .lb-kucuk{color:var(--muted)}
      body .lb-form input{height:44px;border-radius:12px;border:0;background:#ffffff08;box-shadow:inset 0 0 0 1px var(--hair-2);color:var(--ink);font:500 15px var(--font-ui)}
      body .lb-form input:focus{box-shadow:inset 0 0 0 1px var(--gold)}
      body .lb-dugme{height:44px;border-radius:12px;background:var(--gild);color:var(--gold-ink);font:700 15px var(--font-ui);box-shadow:inset 0 1px #ffffff8c,0 6px 16px #d9ae5530}
      body .lb-dugme.lb-ikinci{background:#ffffff0a;color:var(--champ);box-shadow:inset 0 0 0 1px var(--hair-2)}
    </style>
    <script src="../assets/siralama.js"></script>
    <script>
      // Sıralama: en yüksek puan; Blok ve Kelime, Türkçe ve İngilizce ayrı panolar
      (function () {
        if (!window.RidsSiralama) return;
        const dil = () => ((document.documentElement.lang || 'tr').slice(0, 2) === 'tr' ? 'tr' : 'en');
        const lb = RidsSiralama({
          panolar: [
            { id: 'hece-blok-tr', tr: 'Blok · Türkçe', en: 'Block · Turkish' },
            { id: 'hece-kelime-tr', tr: 'Kelime · Türkçe', en: 'Word · Turkish' },
            { id: 'hece-blok-en', tr: 'Blok · İngilizce', en: 'Block · English' },
            { id: 'hece-kelime-en', tr: 'Kelime · İngilizce', en: 'Word · English' }
          ],
          dil, renk: '#f5b301',
          bicim: (k, d) => (k.p || 0).toLocaleString(d === 'tr' ? 'tr-TR' : 'en-US') + (d === 'tr' ? ' puan' : ' pts'),
          olay: (ad) => { if (window.rgSay) rgSay('siralama/' + ad, 'sıralama: ' + ad); }
        });
        const pano = (mod, l) => 'hece-' + mod + '-' + (l === 'en' ? 'en' : 'tr');
        window.rgOver = function (kart, mod, l, puan) {
          if (!(puan > 0)) return;
          const yuva = document.createElement('div'); yuva.className = 'rg-lb';
          const big = kart.querySelector('.stats') || kart.querySelector('.big');
          if (big) big.after(yuva); else kart.append(yuva);
          lb.bitti(yuva, pano(mod, l), { s: -Math.min(puan, 99999999), d: 0, p: Math.min(puan, 99999999) });
        };
        window.rgLbBtn = function (mod, l) {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'btn icon-btn'; b.id = 'home-lb';
          b.setAttribute('aria-label', dil() === 'tr' ? 'Sıralama' : 'Leaderboard');
          b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9.5 18h5"/></svg>';
          b.addEventListener('click', () => lb.ac(pano(mod, l)));
          return b;
        };
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Sitede: oyunun ana ekranına RIDS Games ana sayfasına dönüş düğmesi; telefonda ilk dokunuşta tam ekran ve dikey kilit
      (function () {
        const tr = () => (document.documentElement.lang || 'tr').slice(0, 2) === 'tr';
        const put = () => {
          const h = document.querySelector('.layer:not([hidden]) > .home'); if (!h || h.querySelector('#siteHome')) return;
          const a = document.createElement('a'); a.id = 'siteHome'; a.href = '../?lang=' + (tr() ? 'tr' : 'en');
          a.setAttribute('aria-label', tr() ? 'RIDS Games ana sayfa' : 'RIDS Games home');
          a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>';
          h.prepend(a);
        };
        new MutationObserver(put).observe(document.body, { childList: true, subtree: true });
        if (!matchMedia('(pointer: coarse)').matches) return;
        const H = document.documentElement, rf = H.requestFullscreen || H.webkitRequestFullscreen; if (!rf) return;
        addEventListener('pointerup', function first(e) {
          if (e.target.closest && e.target.closest('a')) return;
          removeEventListener('pointerup', first, true);
          try {
            const r = rf.call(H), lock = () => { try { const o = screen.orientation; if (o && o.lock) o.lock('portrait').catch(() => {}); } catch (er) {} };
            if (r && r.then) r.then(lock, () => {}); else setTimeout(lock, 300);
          } catch (er) {}
        }, true);
      })();
    </script>
  </body>
</html>
