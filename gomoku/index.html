<style>

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; overflow: hidden;

}
button { font: inherit; color: inherit; cursor: pointer; }

/* Üst çubuk yok: sağ üstte ayarlar (ve varsa skor), sağ altta tam ekran. Oyun alanı ekranın tamamı. */
.top { display: contents; }
.fab { position: fixed; z-index: 26; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  background: rgba(2, 6, 23, .62); border: 1px solid rgba(148, 163, 184, .32); color: #e2e8f0; box-shadow: 0 3px 10px rgba(0, 0, 0, .4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background .15s, transform .1s; }
.fab:hover { background: rgba(15, 23, 42, .9); color: #fff; } .fab:active { transform: scale(.94); }
.fab.set { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); }
.fab.score { top: max(6px, env(safe-area-inset-top)); right: calc(max(6px, env(safe-area-inset-right)) + 46px); }
.fab.fs { bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); width: 36px; height: 36px; opacity: .8; }

.sheet { max-width: 340px; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
.sheet .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
.sheet .logo img { display: block; height: 40px; width: auto; mix-blend-mode: lighten; }
.gname { font-size: 12.5px; color: rgba(34, 211, 238, .9); padding: 2px 10px; border-radius: 999px; background: rgba(8, 51, 68, .8); border: 1px solid rgba(6, 182, 212, .3); }
.mlist { display: grid; gap: 8px; }
.mi { height: 48px; border-radius: 13px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 16px; font-weight: 700; color: #e2e8f0; text-align: left;
  background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border: 1px solid rgba(34, 211, 238, .3); }
.mi:hover { border-color: var(--cyan); color: #fff; }
.mi .ico { width: 22px; text-align: center; font-size: 18px; }
.mi.lang { justify-content: center; font-size: 15px; font-weight: 800; color: #67e8f9; letter-spacing: .04em; }
.sheet .btns { margin-top: 0; }
.scoreBody { display: grid; gap: 8px; margin: 6px 0 2px; }
.scoreBody table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 15px; }
.scoreBody th { font-size: 12px; font-weight: 700; color: var(--dim); text-align: right; padding: 0 10px; }

.scoreBody td:first-child { border-radius: 10px 0 0 10px; color: #fff; } .scoreBody td:last-child { border-radius: 0 10px 10px 0; color: #fde68a; font-weight: 800; }

/* Pencereler */
.ov { position: fixed; inset: 0; z-index: 27; display: flex; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); background: rgba(2, 6, 23, .78); backdrop-filter: blur(6px); }
.card {

  background: linear-gradient(180deg, #111a2c, #0b1220); border: 1px solid rgba(34, 211, 238, .45); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 30px rgba(6, 182, 212, .15);
}
.card h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: -.01em; }
.card .sub { margin: 0 0 16px; font-size: 14px; color: var(--dim); text-align: center; line-height: 1.45; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(2, 6, 23, .7); border: 1px solid rgba(148, 163, 184, .2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: #cbd5e1; padding: 0 4px; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; box-shadow: 0 2px 8px rgba(6, 182, 212, .35); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg.tall button { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.seg.tall small { font-size: 11px; font-weight: 600; opacity: .75; white-space: nowrap; }
.seg.tall .em { font-size: 19px; }
.sec { padding: 12px 0 4px; border-top: 1px solid rgba(148, 163, 184, .12); margin-top: 12px; }
.sec .lbl { font-size: 13.5px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.4; min-height: 1.4em; }
.custom { display: grid; gap: 6px; margin-top: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 64px 44px; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
.mrow button { height: 44px; border-radius: 12px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(2, 6, 23, .7); font-size: 24px; font-weight: 600; line-height: 1; touch-action: manipulation; }
.mrow button:disabled { opacity: .35; cursor: default; }
.mrow output { text-align: center; font-size: 24px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.big {
  height: 50px; border-radius: 14px; border: 1px solid #67e8f9; background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff;
  font-size: 17px; font-weight: 800; box-shadow: 0 4px 15px rgba(6, 182, 212, .35); transition: filter .15s, transform .1s;
}
.big:hover { filter: brightness(1.1); }
.big:active { transform: translateY(1px); }
.big.alt { background: linear-gradient(180deg, rgba(15, 23, 42, .9), rgba(10, 15, 29, .95)); border-color: rgba(34, 211, 238, .4); color: #e2e8f0; box-shadow: none; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14.5px; line-height: 1.5; color: #cbd5e1; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rules b { color: #fff; }
.trophy { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 6px; }
.score { text-align: center; font-size: 44px; font-weight: 800; line-height: 1; margin: 2px 0 14px; color: #fde68a; font-variant-numeric: tabular-nums; }
.score.lost { color: #fca5a5; }
.rank { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(2, 6, 23, .55); font-size: 14.5px; font-weight: 600; }
.rank li .b { font-weight: 800; font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); z-index: 28; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; max-width: calc(100vw - 24px);
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; color: #fff; text-align: center;
  background: rgba(15, 23, 42, .92); border: 1.5px solid var(--cyan); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
main { flex: 1; min-height: 0; width: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.panel { border-radius: 16px; background: rgba(2, 6, 23, .66); border: 1px solid rgba(148, 163, 184, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); }
/* Yatay telefon: pencereler iki sütun */
@media (orientation: landscape) and (max-height: 500px) {
  main { padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  #setupOv .card { max-width: 680px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; align-content: start; padding: 14px 18px 0; }
  #setupOv h2, #setupOv .sub, #setupOv .btns, #setupOv .wide { grid-column: 1 / -1; }

  #setupOv .sec { margin-top: 8px; padding-top: 8px; }

  #winOv .card { max-width: 560px; padding: 14px 18px 16px; }

}

/* Telefon ve dokunmatik: kenar boşlukları dar */
@media (max-width: 700px), (pointer: coarse) and (max-height: 1100px) {

}

/* Sağ üstteki ayarlar düğmesinin altına denk gelen üst satırlar yer açar */
main > :is(.hud, .opps, .bar, .info, .pls):first-child, .scr > .head:first-child, main > .side:first-child > .ballbar:first-child { margin-right: 46px; }


/* ---------- Oyuna özel ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; align-content: center; gap: 10px; align-items: stretch; max-width: 600px; }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pl { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 14px; background: rgba(2, 6, 23, .6); border: 1.5px solid rgba(148, 163, 184, .18); min-width: 0; transition: border-color .2s, background .2s; }
.pl.on { border-color: #fbbf24; background: rgba(251, 191, 36, .1); box-shadow: 0 0 0 3px rgba(251, 191, 36, .15); }
.pl .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.dk.b, .d.b { background: radial-gradient(circle at 35% 30%, #4b5563, #0b0f19 70%); box-shadow: inset 0 -2px 3px rgba(255, 255, 255, .08), 0 2px 4px rgba(0, 0, 0, .55); }
.dk.w, .d.w { background: radial-gradient(circle at 35% 30%, #ffffff, #d1d5db 75%); box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .18), 0 2px 4px rgba(0, 0, 0, .45); }
.bw { display: flex; align-items: center; justify-content: center; min-height: 0; }
/* Tahta: 15×15 çizgi, taşlar kesişim noktalarına konur */
.board { --s: 320px; --ln: rgba(69, 39, 12, .8); width: var(--s); height: var(--s); display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); padding: calc(var(--s) / 60); border-radius: 12px; touch-action: manipulation;
  background: linear-gradient(135deg, #e9bd73, #d29a55 55%, #c4873f); border: 2px solid #78350f; box-shadow: inset 0 0 0 2px rgba(146, 64, 14, .35), 0 12px 30px rgba(0, 0, 0, .5); }
.q { position: relative; display: grid; place-items: center; cursor: pointer; min-width: 0; min-height: 0; }
.q::before, .q::after { content: ''; position: absolute; background: var(--ln); pointer-events: none; }
.q::before { left: 0; right: 0; top: calc(50% - .5px); height: 1px; }
.q::after { top: 0; bottom: 0; left: calc(50% - .5px); width: 1px; }
.q:nth-child(15n+1)::before { left: 50%; } .q:nth-child(15n)::before { right: 50%; }
.q:nth-child(-n+15)::after { top: 50%; } .q:nth-last-child(-n+15)::after { bottom: 50%; }
.q.st { background: radial-gradient(circle, var(--ln) 0 calc(var(--s) / 150), transparent calc(var(--s) / 150 + .6px)); }
@media (hover: hover) { .board.hv .q:empty:hover { background: radial-gradient(circle, var(--gh) 0 40%, transparent 43%); } }
.d { position: relative; z-index: 1; width: 92%; height: 92%; border-radius: 50%; }
.d.new { animation: drop .22s ease-out; }
.d.last::after { content: ''; position: absolute; inset: 33%; border-radius: 50%; background: #ef4444; }
.d.win { animation: glow .9s ease-in-out infinite alternate; }
.d.pv { opacity: .6; box-shadow: 0 0 0 2px #22d3ee; }
.hn { position: relative; z-index: 1; width: 70%; height: 70%; border-radius: 50%; box-shadow: 0 0 0 3px #22d3ee; animation: hp 1s ease-in-out infinite; }
@keyframes hp { 50% { transform: scale(1.2); } }
@keyframes drop { 0% { transform: scale(1.4); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
@keyframes glow { from { box-shadow: 0 0 0 2px #fbbf24, 0 0 12px #fbbf24; } to { box-shadow: 0 0 0 2px #fbbf24, 0 0 2px #fbbf24; } }
.side { display: flex; flex-direction: column; gap: 8px; }
.status { text-align: center; font-weight: 700; font-size: 15px; color: #e2e8f0; min-height: 1.4em; }

.acts button[aria-pressed="true"] { border-color: #22d3ee; } .acts button[aria-pressed="true"] small { color: #67e8f9; }
.acts button:disabled { opacity: .4; }
@media (orientation: landscape) {
  main { max-width: 1020px; grid-template-columns: minmax(0, 1fr) clamp(200px, 30vw, 300px); grid-template-rows: auto minmax(0, 1fr); align-content: stretch; column-gap: 16px; }

}
@media (orientation: landscape) and (max-height: 500px) {
  main { gap: 6px; column-gap: 10px; } .pl { padding: 5px 10px; }
  .acts { gap: 5px; } .acts button { height: 36px; } .status { font-size: 13px; }
}

  const T = {
    tr: { b: 'Sorun bildir', h: 'Sorun bildir', p: 'Ne oldu? Kısaca yazın. Gönder deyince e-posta uygulamanız hazır bir mesajla açılır, siz göndermeden hiçbir şey bize ulaşmaz.', ph: 'Örnek: Kartı oynadığımda oyun takıldı.', inf: 'Mesaja eklenecek bilgiler', send: 'E-posta ile gönder', copy: 'Kopyala', close: 'Kapat', copied: 'Kopyalandı. ' + MAIL + ' adresine gönderebilirsiniz.', nocopy: 'Kopyalanamadı. Metni seçip kopyalayın ve ' + MAIL + ' adresine gönderin.', subj: 'Sorun bildirimi', game: 'Oyun', page: 'Sayfa', lang: 'Dil', scr: 'Ekran', br: 'Tarayıcı', time: 'Zaman', err: 'Son hatalar', none: 'yok', desc: 'Açıklama' },
    en: { b: 'Report a problem', h: 'Report a problem', p: 'What happened? Write a few words. Send opens your email app with a ready message; nothing reaches us unless you send it.', ph: 'Example: the game froze when I played a card.', inf: 'Details added to the message', send: 'Send by email', copy: 'Copy', close: 'Close', copied: 'Copied. You can send it to ' + MAIL + '.', nocopy: 'Could not copy. Select the text, copy it and send it to ' + MAIL + '.', subj: 'Problem report', game: 'Game', page: 'Page', lang: 'Language', scr: 'Screen', br: 'Browser', time: 'Time', err: 'Recent errors', none: 'none', desc: 'Description' }
  };
  const t = () => T[(H.lang || 'tr').startsWith('en') ? 'en' : 'tr'];
  const gname = () => { const g = document.getElementById('gameName') || document.querySelector('#homeLink .gname'); return ((g && g.textContent) || document.title || '').replace(/\s*[|·–-]\s*Ridsgames.*$/i, '').trim(); };
  const info = () => { const l = t(), so = screen.orientation && screen.orientation.type;
    return [`${l.game}: ${gname()}`, `${l.page}: ${location.pathname}`, `${l.lang}: ${H.lang || '-'}`,
      `${l.scr}: ${innerWidth}x${innerHeight} @${Math.round((devicePixelRatio || 1) * 100) / 100}x${so ? ' ' + so : ''}${matchMedia('(pointer: coarse)').matches ? ' touch' : ''}`,
      `${l.br}: ${navigator.userAgent}`, `${l.time}: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
      `${l.err}: ${errs.length ? '' : l.none}`, ...errs.slice(-3).reverse().map((e) => `- ${e.t} ${e.m} @ ${e.src}`)].join('\n'); };
  let ov = null;
  const body = () => { const l = t(), d = ov.querySelector('textarea').value.trim(); return `${l.desc}:\n${d || '-'}\n\n---\n${info()}`; };
  const build = () => {
    ov = document.createElement('div'); ov.id = 'rgRep'; ov.hidden = true;
    ov.innerHTML = '<div class="rc" role="dialog" aria-modal="true" aria-labelledby="rgRepH"><h2 id="rgRepH"></h2><p class="pp"></p><textarea maxlength="1200"></textarea><details><summary></summary><pre></pre></details><div class="ok" role="status"></div><div class="rb"><button type="button" class="go"></button><button type="button" class="cp"></button><button type="button" class="cl"></button></div></div>';
    document.body.appendChild(ov);
    const q = (s) => ov.querySelector(s), close = () => { ov.hidden = true; };
    q('.cl').onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ['keydown', 'keyup', 'keypress'].forEach((k) => ov.addEventListener(k, (e) => { e.stopPropagation(); if (k === 'keydown' && e.key === 'Escape') close(); }));
    ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'contextmenu'].forEach((k) => ov.addEventListener(k, (e) => e.stopPropagation(), { passive: true }));
    q('.go').onclick = () => { const l = t(); let b = body(); if (b.length > 1400) b = b.slice(0, 1400) + '…';
      location.href = `mailto:${MAIL}?subject=${encodeURIComponent(`${l.subj}: ${gname()}`)}&body=${encodeURIComponent(b)}`; };
    q('.cp').onclick = () => { const l = t(), b = `${l.subj}: ${gname()}\n\n${body()}`, ok = q('.ok');
      const fb = () => { const a = document.createElement('textarea'); a.value = b; a.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; ov.appendChild(a); a.select(); let r = false; try { r = document.execCommand('copy'); } catch (_) {} a.remove(); ok.textContent = r ? l.copied : l.nocopy; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b).then(() => { ok.textContent = l.copied; }, fb); else fb(); };
  };
  const open = () => { if (!ov) build(); const l = t(), q = (s) => ov.querySelector(s);
    q('h2').textContent = l.h; q('.pp').textContent = l.p; q('textarea').placeholder = l.ph; q('summary').textContent = l.inf; q('pre').textContent = info();
    q('.go').textContent = l.send; q('.cp').textContent = l.copy; q('.cl').textContent = l.close; q('.ok').textContent = '';
    ov.hidden = false; setTimeout(() => q('textarea').focus({ preventScroll: true }), 30); };
  // Menüye satır ekle: Kurallar düğmesinin görünüşünü kopyalar
  const ICO = '✉';
  let btn = null;
  const label = () => { if (!btn) return; const l = t(); btn.setAttribute('aria-label', l.b); btn.title = l.b; const s = btn.querySelector('.rgRepL'); if (s) s.textContent = l.b; };
  const mount = () => {
    const rules = document.getElementById('rulesBtn'), lang = document.getElementById('langBtn');
    btn = document.createElement('button'); btn.type = 'button'; btn.id = 'rgRepBtn';
    if (rules && lang && rules.parentNode === lang.parentNode) {
      btn.className = rules.className; const sp = [...rules.children].filter((x) => x.tagName === 'SPAN');
      const a = document.createElement('span'); a.textContent = ICO; if (sp[0]) a.className = sp[0].className; btn.appendChild(a);
      if (sp[1]) { const b = document.createElement('span'); b.className = (sp[1].className + ' rgRepL').trim(); btn.appendChild(b); }
      lang.parentNode.insertBefore(btn, lang);
    } else {
      const host = document.getElementById('btn-reset-from-settings'), menu = document.getElementById('menu');
      const s = document.createElement('span'); s.className = 'rgRepL'; btn.append(ICO + ' ', s);
      if (host) { btn.className = host.className; host.parentNode.insertBefore(btn, host); }
      else if (menu) { btn.style.cssText = 'background:none;border:0;box-shadow:none;color:inherit;opacity:.75;font-size:13px;text-decoration:underline;margin-top:10px;min-height:0;padding:4px'; menu.appendChild(btn); }
      else { btn = null; return; }
    }
    btn.addEventListener('click', () => setTimeout(open, 0));
    label(); new MutationObserver(label).observe(H, { attributes: true, attributeFilter: ['lang'] });
  };
  window.rgReport = () => open();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
</body>
