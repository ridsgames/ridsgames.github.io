name: En çok oynananlar
on:
  schedule:
    - cron: '0 21 * * *' # her gün 00:00 (Türkiye, UTC+3)
  workflow_dispatch:
permissions:
  contents: write
concurrency: populer
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sırayı hesapla
        run: node .github/populer.mjs
        env:
          GC_KEY: ${{ secrets.GOATCOUNTER_KEY }}
      - name: Değiştiyse yayınla
        run: |
          git add assets/populer.json
          if git diff --cached --quiet; then echo "Sıra değişmedi."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Güncelleme"
          git push # site kurulumu bu güncellemeyle kendiliğinden başlar
